  /xplugin.php?action=gen_mac:
    get:
      operationId: XPlugin_genMac
      tags:
        - XPlugin
      summary: Generate a random MAC address for the plugin
      description: |
        src/Public/Controllers/Api/XPluginApiController.php:52-60. No authentication. Requires a non-empty
        `pversion`; when it equals exactly `0.0.1` the body is a JSON-encoded **string** (with quotes) of 6
        random bytes as uppercase colon-separated hex. Any other `pversion` → HTTP 200 with an empty body.
        Quirk: no Content-Type header is set (PHP default `text/html`). Without `pversion` the request falls
        through to the token flow and gets `E2_NO_TOKEN` (404). Not counted toward flood (deny=false).
        Gate: `disable_enigma2` → `E2_DISABLED` 404 page (:44-47). There is no maintenance-mode check on xplugin.
        Aliases `/xplugin`, `/api/xplugin`. GET and POST both work.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - gen_mac
        - name: pversion
          in: query
          required: true
          description: Plugin version; only `0.0.1` produces a MAC.
          schema:
            type: string
            example: 0.0.1
      responses:
        '200':
          description: JSON string MAC (pversion 0.0.1) or empty body.
          content:
            text/html:
              schema:
                type: string
              examples:
                mac:
                  value: '"3A:F1:0B:9C:22:7D"'
                other_version:
                  value: ''
        '403':
          $ref: '#/components/responses/E2_FloodBlocked403'
        '404':
          $ref: '#/components/responses/E2_Error404'
  /xplugin.php?action=auth:
    get:
      operationId: XPlugin_auth
      tags:
        - XPlugin
      summary: Authenticate an Enigma2 device by MAC and obtain a watchdog token
      description: |
        src/Public/Controllers/Api/XPluginApiController.php:64-66, handleAuth :97-140.
        Looks up the Enigma2 device by uppercased `mac` (`UserRepository::getE2Info`,
        src/Domain/User/UserRepository.php:652). Unknown MAC → `checkBruteforce(null, MAC)` (counts distinct
        failed MACs per IP against `bruteforce_mac_attempts`) then `INVALID_CREDENTIALS` 404 page.
        If the device has `lock_device=1` and a stored `modem_mac` that differs from `mmac` → brute-force count
        and `E2_DEVICE_LOCK_FAILED` 404 page.

        **Side effects:** updates the `enigma2_devices` row: `original_mac`=cmac, `dns`=dn (or `-`),
        `key_auth`=User-Agent, `lversion`=base64-decoded lversion, `watchdog_timeout`=random 60-70,
        `modem_mac`, `local_ip`, `public_ip`=REMOTE_ADDR, `enigma_version`, `cpu`, `version`=pversion,
        `token`, `last_updated`=now. The token is then only valid from the same public IP **and** the same
        User-Agent (see the poll endpoint). Text parameters are stored HTML-entity-encoded.

        Response `Content-Type: application/json`; `watchdog_seconds` is an integer, `username`/`password`
        are the paired line's credentials. Aliases `/xplugin`, `/api/xplugin`. GET/POST.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - auth
        - name: mac
          in: query
          required: true
          description: Device MAC registered as an Enigma2 device (case-insensitive).
          schema:
            type: string
            example: 00:1D:EC:0A:3F:21
        - name: mmac
          in: query
          required: false
          description: Modem MAC; must match the stored one when the device is locked.
          schema:
            type: string
        - name: ip
          in: query
          required: false
          description: Box local IP (stored as local_ip).
          schema:
            type: string
        - name: version
          in: query
          required: false
          description: Enigma2 image version (stored as enigma_version).
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: CPU / box type (stored as cpu).
          schema:
            type: string
        - name: pversion
          in: query
          required: false
          description: Plugin version (stored as version).
          schema:
            type: string
        - name: lversion
          in: query
          required: false
          description: Base64-encoded Linux/kernel version string (stored decoded).
          schema:
            type: string
        - name: dn
          in: query
          required: false
          description: DNS/portal name the box uses (stored as dns; `-` when empty).
          schema:
            type: string
        - name: cmac
          in: query
          required: false
          description: Original/chip MAC (stored uppercased as original_mac).
          schema:
            type: string
      responses:
        '200':
          description: Device authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XPlugin_AuthResponse'
              example:
                details:
                  token: 9F2C4A7E1B3D5F60718293A4B5C6D7E8
                  username: john
                  password: s3cret
                  watchdog_seconds: 64
        '403':
          $ref: '#/components/responses/E2_FloodBlocked403'
        '404':
          $ref: '#/components/responses/E2_Error404'
  /xplugin.php:
    get:
      operationId: XPlugin_pollCommands
      tags:
        - XPlugin
      summary: Watchdog heartbeat; fetch the next queued remote command
      description: |
        src/Public/Controllers/Api/XPluginApiController.php:68-94, checkCommands :142-183.
        Requires `token` (else `E2_NO_TOKEN` 404). The token must match an `enigma2_devices` row **and** the
        request's REMOTE_ADDR and trimmed User-Agent as saved at auth time (else `E2_TOKEN_DOESNT_MATCH`
        404). If more than `watchdog_timeout + 20` seconds passed since the last heartbeat →
        `E2_WATCHDOG_TIMEOUT` 404 (the box must re-auth). Failed token lookups count toward the IP flood limit.

        With `page` empty/absent: sets `last_updated`=now and `rc`, pops the oldest row of `enigma2_actions` for
        the device (it is deleted) and returns it as `data`. Quirk: with no command `data` is an empty JSON
        **array** `[]`, otherwise an object with exactly one key (types as emitted):
        `message` {title, message}; `ssh` (string); `screen` ("1", string); `reboot_gui` (1, int);
        `reboot` (1, int); `update` (string); `block_ssh`/`block_telnet`/`block_ftp`/`block_all`/`block_plugin`
        (int from the action's `type`). An unknown action key is deleted and yields `[]`.
        Any other non-empty `page` value except `file` → HTTP 200 empty body.
        Aliases `/xplugin`, `/api/xplugin`. GET/POST.
      parameters:
        - $ref: '#/components/parameters/XPlugin_Token'
        - name: rc
          in: query
          required: false
          description: Remote-control state reported by the box (stored in `enigma2_devices.rc`).
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Leave empty for the command poll (`file` = screenshot upload, documented separately).
          schema:
            type: string
      responses:
        '200':
          description: Poll result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XPlugin_CommandPoll'
              examples:
                no_command:
                  value:
                    valid: true
                    data: []
                message:
                  value:
                    valid: true
                    data:
                      message:
                        title: Notice
                        message: Your subscription renews tomorrow.
                screenshot_request:
                  value:
                    valid: true
                    data:
                      screen: '1'
                reboot:
                  value:
                    valid: true
                    data:
                      reboot: 1
                block_ssh:
                  value:
                    valid: true
                    data:
                      block_ssh: 1
        '403':
          $ref: '#/components/responses/E2_FloodBlocked403'
        '404':
          $ref: '#/components/responses/E2_Error404'
  /xplugin.php?page=file:
    post:
      operationId: XPlugin_uploadScreenshot
      tags:
        - XPlugin
      summary: Upload a screenshot (answer to a `screen` command)
      description: |
        src/Public/Controllers/Api/XPluginApiController.php:90-94, handleFileUpload :185-198.
        Same token / IP / User-Agent / watchdog checks as the poll endpoint (errors identical). Multipart upload
        of field `f` with `t=screen`; when the file is a JPEG (getimagesize) it is stored as
        `E2_IMAGES_PATH/<device_id>_screen_<time>_<uniqid>.jpg`. Non-JPEG, other `t`, or upload errors are
        silently ignored. Always HTTP 200 with an empty body. `token`, `page` and `t` may be in the query or the
        multipart body. Aliases `/xplugin`, `/api/xplugin`.
      parameters:
        - $ref: '#/components/parameters/XPlugin_Token'
        - name: page
          in: query
          required: true
          schema:
            type: string
            enum:
              - file
        - name: t
          in: query
          required: true
          description: Upload type; only `screen` is handled.
          schema:
            type: string
            enum:
              - screen
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - f
              properties:
                f:
                  type: string
                  format: binary
                  description: JPEG screenshot.
      responses:
        '200':
          description: Empty body (whether or not the file was stored).
        '403':
          $ref: '#/components/responses/E2_FloodBlocked403'
        '404':
          $ref: '#/components/responses/E2_Error404'
