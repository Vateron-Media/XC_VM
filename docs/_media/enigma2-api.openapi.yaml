        If `series_id` is missing or not among the line's `series_ids` (strict integer comparison) the response
        is **HTTP 200 with an empty body** and no Content-Type set by the controller (:323-326).
        `playlist_name` is `TV Series [ <series title> ]`. One channel per season: title base64 `Season N`,
        empty `<description/>`, `category_id` = season number, playlist_url
        `...&type=get_series_streams&series_id=<id>&season=<N>`.
        Aliases `/enigma2`, `/api/enigma2`. Auth, gates and errors as for `E2_getMainMenu`.
