  /enigma2.php?type=get_series_streams:
    get:
      operationId: E2_getSeriesStreams
      tags:
        - Enigma2
      summary: Episodes of a season
      description: |
        Episodes of one season (src/Public/Controllers/Api/Enigma2ApiController.php:351-387).
        Empty 200 body when `season` is missing/0 or the series is not in the line's `series_ids`.
        `playlist_name` is `TV Series [ <title> Season <N> ]`. Episodes ordered by `episode_num`.
        Each channel, in this element order: title base64 `Episode NN` (a sequential 1-based counter, **not**
        the stored episode number), `desc_image` CDATA (series cover), `description` = base64('') i.e. an
        empty element, `category_id` = the `cat_id` request value or an empty element when not given,
        `stream_url` CDATA `<base>play/<token>`.
        The token is `Encryption::mintToken('movie/<user>/<pass>/<stream_id>/<container>', live_streaming_pass,
        OPENSSL_EXTRA, secure_stream_tokens)` (src/Core/Util/Encryption.php:123): a base64url AES-GCM sealed
        token, or the legacy AES-CBC format when `secure_stream_tokens` is off.
        Aliases `/enigma2`, `/api/enigma2`. Auth, gates and errors as for `E2_getMainMenu`.
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Password'
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - get_series_streams
        - $ref: '#/components/parameters/E2_SeriesId'
        - name: season
          in: query
          required: true
          description: Season number (integer-cast; 0/empty yields an empty body).
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/E2_CatId'
      responses:
        '200':
          description: Episode list XML, or an empty body.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/E2_Items'
              examples:
                episodes:
                  value: |
                    <?xml version="1.0"?>
                    <items><playlist_name>TV Series [ Breaking Bad Season 1 ]</playlist_name><category><category_id>1</category_id><category_title>TV Series [ Breaking Bad Season 1 ]</category_title></category><channel><title>RXBpc29kZSAwMQ==</title><desc_image><![CDATA[https://image.tmdb.org/t/p/w600_and_h900_bestv2/ggFHVNu6YYI5L9pCfOacjizRGt.jpg]]></desc_image><description></description><category_id/><stream_url><![CDATA[http://tv.example.com/play/9vQm3X1pL0aZt7c2Kx8bJwR4sN6yHf5dE0uVgTqYi1oMnBkC]]></stream_url></channel><channel><title>RXBpc29kZSAwMg==</title><desc_image><![CDATA[https://image.tmdb.org/t/p/w600_and_h900_bestv2/ggFHVNu6YYI5L9pCfOacjizRGt.jpg]]></desc_image><description></description><category_id/><stream_url><![CDATA[http://tv.example.com/play/Lr2Wq8nE4tYb6uJ0cX3vM9kZ1sP7aD5fG2hQwRtYuIoBnVxC]]></stream_url></channel></items>
                empty:
                  summary: Missing season or series not available to the line
                  value: ''
        '403':
          $ref: '#/components/responses/E2_FloodBlocked403'
        '404':
          $ref: '#/components/responses/E2_Error404'
        '503':
          $ref: '#/components/responses/E2_Maintenance503'
  /enigma2.php?type=get_live_streams:
    get:
      operationId: E2_getLiveStreams
      tags:
        - Enigma2
      summary: Live channels (with now/next EPG)
      description: |
        Live channels of the line (src/Public/Controllers/Api/Enigma2ApiController.php:389-459), in the line's
        channel order (StreamSorter). `cat_id` 0/absent = all channels, each listed **once** under its first
        category; with `cat_id` a channel appears only if that id is in its `category_id` JSON list.

        Up to two upcoming EPG entries (end >= now) are read from the EPG cache file `EPG_PATH/stream_<id>`.
        Per channel, in this element order:
        - `title`: base64 of `<stream_display_name> <shortEPG>` where shortEPG is
          `[HH:MM - HH:MM] + <minutes left, 1 decimal> min   <title>` (three spaces) for the current entry. With no
          EPG the title is the name followed by a single trailing space.
        - `description`: base64 of `[HH:MM] <title>\n( <description>)\n` per EPG entry (empty when none). Times
          use the PHP default timezone.
        - `desc_image`: CDATA, stream icon (validated URL).
        - `category_id`: category id.
        - `stream_url`: CDATA `<base>play/<token>`, token = mintToken('live/<user>/<pass>/<stream_id>', ...).
        Aliases `/enigma2`, `/api/enigma2`. Auth, gates and errors as for `E2_getMainMenu`.
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Password'
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - get_live_streams
        - $ref: '#/components/parameters/E2_CatId'
      responses:
        '200':
          description: Live channel list XML.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/E2_Items'
              examples:
                live_streams:
                  $ref: '#/components/examples/E2_LiveStreams'
        '403':
          $ref: '#/components/responses/E2_FloodBlocked403'
        '404':
          $ref: '#/components/responses/E2_Error404'
        '503':
          $ref: '#/components/responses/E2_Maintenance503'
  /enigma2.php?type=get_vod_streams:
    get:
