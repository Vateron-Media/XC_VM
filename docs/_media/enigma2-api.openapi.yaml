      description: |
        Movies of the line (src/Public/Controllers/Api/Enigma2ApiController.php:461-511). Category filtering as
        for `get_live_streams`. Per channel, in this element order: `title` base64(stream_display_name);
        `desc_image` CDATA from `movie_properties.movie_image`; `description` base64 of one
        `UPPERCASED_KEY: value\n` line per `movie_properties` entry except `movie_image` (keys as stored, e.g.
        NAME, O_NAME, COVER_BIG, PLOT, CAST, DIRECTOR, GENRE, RELEASEDATE, RATING, DURATION...); `category_id`;
        `stream_url` CDATA `<base>play/<token>`, token = mintToken('movie/<user>/<pass>/<id>/<container>', ...).
        Aliases `/enigma2`, `/api/enigma2`. Auth, gates and errors as for `E2_getMainMenu`.
      parameters:
