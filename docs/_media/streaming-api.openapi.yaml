      description: |
        Rewritten to `/stream/auth?username&password&stream&extension&duration&start&type=timeshift`
        (src/bin/nginx/conf/nginx.conf:111).

        Auth checks match live, but with no `output_formats` check.
        Redirect chain (src/Public/stream/auth.php:706-776):
        - Server choice: the stream's `tv_archive_server_id`, which is used only if
          `tv_archive_duration > 0` (src/Streaming/Delivery/StreamRedirector.php:46-49). If there
          is none, the "not on air" video is shown, or STREAM_OFFLINE.
        - `start` must match
          `/^(\d{1,10}|\d{8}-\d{1,2}|\d{4}-\d{1,2}-\d{1,2}:\d{1,2}-\d{1,2}(?:[:-]\d{1,2})?)$/D`
