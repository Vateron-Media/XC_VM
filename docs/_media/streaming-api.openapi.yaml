          $ref: '#/components/responses/Stream_LiveRedirect'
        '403':
          $ref: '#/components/responses/Stream_FloodBlocked'
        '404':
          $ref: '#/components/responses/Stream_NotFound'
  /play/{token}/{extension}:
    get:
      operationId: Stream_PlayTokenSlashExt
      tags:
        - Streaming
      summary: Encrypted play-token link (slash extension)
      description: |
        Rewritten to `/stream/auth?token&extension` (src/bin/nginx/conf/nginx.conf:96). The Player
        API's `api_redirect` emits `play/{token}/{api_container}` for movies and series
        (src/Public/Controllers/Api/PlayerApiController.php:862-880). Otherwise this is the same
        as `Stream_PlayTokenWithExt` (src/Public/stream/auth.php:49-115).
      parameters:
        - $ref: '#/components/parameters/Stream_PathPlayToken'
        - $ref: '#/components/parameters/Stream_PathExtension'
      responses:
        '200':
          $ref: '#/components/responses/Stream_GatewayPlaylist'
        '302':
          $ref: '#/components/responses/Stream_VodRedirect'
        '403':
          $ref: '#/components/responses/Stream_FloodBlocked'
        '404':
          $ref: '#/components/responses/Stream_NotFound'
  /play/{token}:
    get:
      operationId: Stream_PlayToken
      tags:
        - Streaming
      summary: Encrypted play-token link (default ts)
      description: |
        Rewritten to `/stream/auth?token&extension=ts` (src/bin/nginx/conf/nginx.conf:97). The
        extension embedded in the token wins over ts (src/Public/stream/auth.php:93-95).
        Player API thumbnail URLs use this form, with a `thumb/u/p/id` token, giving the thumb flow
        (auth.php:778-811). Otherwise this is the same as `Stream_PlayTokenWithExt`.
      parameters:
        - $ref: '#/components/parameters/Stream_PathPlayToken'
      responses:
        '302':
          $ref: '#/components/responses/Stream_LiveRedirect'
        '403':
          $ref: '#/components/responses/Stream_FloodBlocked'
        '404':
          $ref: '#/components/responses/Stream_NotFound'
  /auth/{token}:
    get:
      operationId: Stream_LivePlayback
      tags:
        - Streaming
      summary: Internal live playback endpoint (redirect target)
      description: |
        Rewritten to `/stream/live?token` (src/bin/nginx/conf/nginx.conf:108). Handler
        src/Public/stream/live.php. This is the 302 target minted by auth.php, not a URL users
        build. The CDN form `/auth/{stream_id}.{m3u8|ts}?token=T` also lands here: nginx appends
        `?token=T`, and PHP keeps the last `token`.

        Headers are set by src/Streaming/Auth/StreamAuthMiddleware.php:30-54:
        - `Access-Control-Allow-Origin: *`
        - an optional `Server`
        - `X-XSS-Protection: 0`
        - `X-Content-Type-Options: nosniff`
        - `Alt-Svc` (h3)
        - an optional `Set-Cookie` from `send_unique_header`

        Token handling (live.php:56-90, StreamAuthMiddleware.php:87-111):
        - LB_TOKEN_INVALID when the token does not decrypt
        - TOKEN_EXPIRED when `expires` is past, checked against MAIN's clock
        - `uuid` must be 32 hex characters
        - An off-air token (`off_air` or `video_path`) streams the clip as `video/mp2t` via
          readfile (:82-86).
        - A missing token gives NO_TOKEN_SPECIFIED.

        Other errors:
        - A proxied channel with a non-ts extension gives USER_DISALLOW_EXT (:96-98).
        - An on-demand start that times out gives WAIT_TIME_EXPIRED (:148-291).
        - With `disallow_2nd_ip_con`, a second IP gets the "already connected" video
          (:299-310).

        `m3u8` (live.php:351-415):
        - Connection creation must happen within `create_expiration` (default 5 s) of the token,
          else TOKEN_EXPIRED.
        - IP_MISMATCH when `restrict_same_ip` is on.
        - LINE_CREATE_FAIL when the connection cannot be recorded.
        - Over-limit lines kick their oldest connection.
        - Success is 200 `application/x-mpegurl` with Content-Length and no-store. It holds the
          on-disk or daemon playlist, with every segment rewritten to `/hls/{token}`, or
          `/hls/{segment}?token=` with `allow_cdn_access`. With `encrypt_hls`, an
          `#EXT-X-KEY:METHOD=AES-128,URI="/key/{token}",IV=0x...` line is added
          (src/Streaming/Delivery/HLSGenerator.php:31-77,90-139).

        `ts` (live.php:417-774):
        - Success is 200 `video/mp2t`, an endless body with no Content-Length and no Range
          support.
        - The response is served via the fanout daemon (`X-Accel-Redirect: /xc_fanout/{id}`,
          :495-497) or a PHP segment chase-read.
        - A previous php-fpm worker serving the same connection is killed.
        `X-Accel-Buffering: no` is sent when `use_buffer=0` (:100-101).
      parameters:
        - $ref: '#/components/parameters/Stream_PathInternalToken'
        - name: token
          in: query
          required: false
          description: CDN form only (`allow_cdn_access`). The real token, overriding the path value.
          schema:
            type: string
      responses:
        '200':
          description: Live HLS media playlist or endless MPEG-TS.
          content:
            application/x-mpegurl:
              schema:
                type: string
              examples:
                plain:
                  $ref: '#/components/examples/Stream_LiveMediaPlaylist'
                encrypted:
                  $ref: '#/components/examples/Stream_LiveMediaPlaylistEncrypted'
                cdn:
                  $ref: '#/components/examples/Stream_LiveMediaPlaylistCdn'
            video/mp2t:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Stream_NotFound'
  /vauth/{token}:
    get:
      operationId: Stream_VodPlayback
      tags:
        - Streaming
      summary: Internal VOD/series file delivery (redirect target)
      description: |
        Rewritten to `/stream/vod?token` (src/bin/nginx/conf/nginx.conf:109). Handler
        src/Public/stream/vod.php. The CDN form is `/vauth/{id}.{ext}?token=T`.

        Errors:
        - NO_TOKEN_SPECIFIED (:75)
        - VOD_DOESNT_EXIST when `VOD_PATH/{id}.{ext}` is missing (:78-82). The requested extension
          must be the real file's extension.
        - TOKEN_EXPIRED when the connection is created more than 60 s (`create_expiration`) after
          the token (:149)
        - IP_MISMATCH when `restrict_same_ip` is on (:166)
        - LINE_CREATE_FAIL (:186)
        - TOKEN_ERROR when the token has no channel_info (:403)

        Content-Type is chosen by the movie's `target_container`, not by the URL (:212-214):
        - mp4 and m4v: video/mp4
        - mkv: video/x-matroska
        - avi: video/x-msvideo
        - 3gp: video/3gpp
        - flv: video/x-flv
        - wmv: video/x-ms-wmv
        - mov: video/quicktime
        - ts: video/mp2t
        - mpg and mpeg: video/mpeg
        - anything else: application/octet-stream

        Range (src/Streaming/Delivery/HttpRange.php:24-82, used at vod.php:231-234):
        - `Accept-Ranges: bytes` is always sent.
        - A single `bytes=a-b`, `a-` or `-n` (suffix) range gives 206 with
          `Content-Range: bytes a-b/size` and Content-Length.
        - A multi-range, malformed or unsatisfiable range gives 416 with
          `Content-Range: bytes */size` and no body.
        - A non-`bytes` unit is ignored, giving 200 with the full body.
        - On the fanout-daemon path (`/xc_fanout_file`), the original Range from the token's
          `http_range` is honoured (:218-227).

        Other behaviour:
        - With `vod_limit_perc` > 0 and a non-restreamer line, the body is throttled to the
          bitrate once that percentage of the response has been sent.
        - With `direct_proxy`, the source is relayed via curl.
      parameters:
        - $ref: '#/components/parameters/Stream_PathInternalToken'
        - $ref: '#/components/parameters/Stream_HeaderRange'
      responses:
        '200':
          description: Whole file.
          headers:
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Content-Length:
              schema:
                type: integer
                example: 1468006400
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/x-matroska:
              schema:
                type: string
                format: binary
            video/mp2t:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Single byte range.
          headers:
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Content-Range:
              schema:
                type: string
                example: bytes 0-1048575/1468006400
            Content-Length:
              schema:
                type: integer
                example: 1048576
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Stream_NotFound'
        '416':
          $ref: '#/components/responses/Stream_RangeNotSatisfiable'
  /tsauth/{token}:
    get:
      operationId: Stream_TimeshiftPlayback
      tags:
        - Streaming
      summary: Internal catch-up delivery (redirect target)
      description: |
        Rewritten to `/stream/timeshift?token` (src/bin/nginx/conf/nginx.conf:106). Handler
        src/Public/stream/timeshift.php. The CDN form is
        `/tsauth/{id}_{start}_{duration}.{ext}?token=T`.

        `start` is re-validated (:76-80, `\d+` unix or the two date forms) and converted with
        mktime in the server timezone. Archive files are named
        `ARCHIVE_PATH/{id}/{gmdate('Y-m-d:H-i')}.ts`, one per minute (:82-101).
        `duration` is in minutes. The scan stops at the current minute (:113-125).

        Errors:
        - NO_TOKEN_SPECIFIED
        - NO_TIMESTAMP
        - ARCHIVE_DOESNT_EXIST when the first minute file or every minute file is missing
          (:103-133)
        - TOKEN_EXPIRED, IP_MISMATCH and LINE_CREATE_FAIL
        - TOKEN_ERROR when there is no user_info (:422)

        `m3u8` (:197-216): a 200 `application/x-mpegurl` VOD playlist with one 60 s entry per
        recorded minute. Each entry is `/hls/{token}`, an ARCHIVE segment token. The first entry
        starts at the minute file's `.offset` byte offset.

        `ts` (:286-370): a 200 `video/mp2t` concatenation of the minute files, with Range support
        through HttpRange (:315). It is 416 on a bad range and throttled like VOD, or served via
        the fanout daemon.
      parameters:
        - $ref: '#/components/parameters/Stream_PathInternalToken'
        - $ref: '#/components/parameters/Stream_HeaderRange'
      responses:
        '200':
          description: Archive playlist or concatenated archive TS.
          content:
            application/x-mpegurl:
              schema:
                type: string
              examples:
                archive:
                  $ref: '#/components/examples/Stream_TimeshiftPlaylist'
            video/mp2t:
              schema:
                type: string
                format: binary
        '206':
          description: Single byte range of the concatenated archive (ts only).
          headers:
            Content-Range:
              schema:
                type: string
                example: bytes 0-524287/94371840
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Stream_NotFound'
        '416':
          $ref: '#/components/responses/Stream_RangeNotSatisfiable'
  /thauth/{token}:
    get:
      operationId: Stream_ThumbPlayback
      tags:
        - Streaming
      summary: Internal thumbnail delivery (redirect target)
      description: |
        Rewritten to `/stream/thumb?token` (src/bin/nginx/conf/nginx.conf:107). Handler
        src/Public/stream/thumb.php.
        - The token must carry `expires` that has not passed, else TOKEN_EXPIRED (:53). The
          lifetime is 5 s from auth.php.
        - The handler serves `STREAMS_PATH/{id}_.jpg` if it is less than 60 s old, with
          `Content-type: image/jpg` (sic: not image/jpeg) and `Age: {seconds}` (:58-62).
        - Otherwise THUMBNAIL_DOESNT_EXIST (:67).
      parameters:
        - $ref: '#/components/parameters/Stream_PathInternalToken'
      responses:
        '200':
          description: Latest frame grab.
          headers:
            Age:
              schema:
                type: integer
                example: 12
          content:
            image/jpg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Stream_NotFound'
  /subauth/{token}:
    get:
      operationId: Stream_SubtitlePlayback
      tags:
        - Streaming
      summary: Internal subtitle delivery (redirect target)
      description: |
        Rewritten to `/stream/subtitle?token` (src/bin/nginx/conf/nginx.conf:110). Handler
        src/Public/stream/subtitle.php. TOKEN_EXPIRED applies when the 5 s token has expired
        (:54).

        The handler reads `VOD_PATH/{stream_id}_{sub_id}.srt`. When the token has `webvtt=1`, the
        file is converted to WebVTT. The response is sent as a download (:63-74):
        - `Content-Description: File Transfer`
        - `Content-type: application/octet-stream`
        - `Content-Disposition: attachment; filename="{id}_{sid}.srt|vtt"`
        - Content-Length

        Quirk: a missing subtitle reports THUMBNAIL_DOESNT_EXIST (:79), as a 404.
      parameters:
        - $ref: '#/components/parameters/Stream_PathInternalToken'
      responses:
        '200':
          description: SRT or WebVTT text served as a download.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="123_0.vtt"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              example: |
                WEBVTT

                00:00:01.000 --> 00:00:04.000
                Hello.
        '404':
          $ref: '#/components/responses/Stream_NotFound'
  /hls/{token}:
    get:
      operationId: Stream_HlsSegment
      tags:
        - Streaming
      summary: HLS segment (live or archive)
      description: |
        Rewritten to `/stream/segment?token` (src/bin/nginx/conf/nginx.conf:105). Handler
        src/Public/stream/segment.php. The CDN form is `/hls/{segment_name}?token=T`.

        Every failure is a plain generate404 with no error code, including:
        - no `live_streaming_pass`
        - NodeLease refusal (:38,44)
        - a bad token
        - a missing connection (CONS) file
        - an IP mismatch under `restrict_same_ip`
        - an archive connection with `hls_end` set

        LIVE token payload: `user/pass/ip/stream/segment/uuid/server/codec/ondemand`, or
        `HMAC#id/identifier/...`.
        - Daemon segments `{id}_d{n}.ts` are sent with
          `X-Accel-Redirect: /xc_fanout_hls/...` (:137-141).
        - Other segments use `/xc_hls/{file}`, or `{file}.enc` when `encrypt_hls` is on
          (:258-262), or are encrypted on the fly with AES-128-CBC (:219).

        ARCHIVE token (9 fields): `TS/u/p/ip/duration/start/{id}_{YYYY-MM-DD:HH-MM}.ts_{offset}/uuid/server`.

        A token minted by another server gets a 302 to `{that server}/hls/{token}` (:299-307).

        Content-Type is `video/mp2t`, or `video/iso.segment` for m4s and mp4 (:190-195). The
        response also sends `Access-Control-Allow-Origin: *` and nosniff. Range is not parsed in
        PHP. The X-Accel internal locations pass it to nginx or the daemon
        (nginx.conf:184-245).
      parameters:
        - $ref: '#/components/parameters/Stream_PathInternalToken'
      responses:
        '200':
          description: One media segment.
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
            video/iso.segment:
              schema:
                type: string
                format: binary
        '302':
          description: Token belongs to another server. The client is sent there.
          headers:
            Location:
              schema:
                type: string
                example: http://lb2.example.com:8080/hls/Qm9vN2...
        '404':
          $ref: '#/components/responses/Stream_NotFound'
  /key/{token}:
    get:
      operationId: Stream_HlsKey
      tags:
        - Streaming
      summary: AES-128 key for encrypted HLS
      description: |
        Rewritten to `/stream/key?token` (src/bin/nginx/conf/nginx.conf:98). Handler
        src/Public/stream/key.php.
        - The token decrypts to `{ip}/{stream_id}`.
        - When `restrict_same_ip` is on, the client IP must match (`ip_subnet_match` allows a
          subnet match).
        - Success returns the 16 raw bytes of `STREAMS_PATH/{id}_.key` as
          `application/octet-stream` with nosniff (:37-48).
        - Anything else, including NodeLease refusal or no secret, is a generate404 (:28-34,52).
      parameters:
        - $ref: '#/components/parameters/Stream_PathInternalToken'
      responses:
        '200':
          description: 16-byte AES-128 key.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Stream_NotFound'
  /probe/{data}:
    get:
      operationId: Stream_Probe
      tags:
        - Streaming
      summary: Restreamer probe of a running stream's codecs
      description: |
        Rewritten to `/stream/probe?data` (src/bin/nginx/conf/nginx.conf:125). The legacy
        `/probe.php` gets a 302 to `/stream/probe?$args` (:172-174). Handler
        src/Public/stream/probe.php.

        `data` is the base64 encoding of a stream URL path. These forms are parsed (:23-140):
        - `/auth/{token}`
        - `/play/{token}[/ext]`
        - `/live/{token}/{id}[.ext]`
        - `/live/{u}/{p}/{id}[.ext]`
        - `/{u}/{p}/{id}[.ext]`

        The line must:
        - exist
        - not be expired or disabled
        - be `is_restreamer`
        - have the stream in its bouquet
        The stream must also be running on this server.

        Success echoes JSON `{codecs, container, bitrate}` from the stream's probe info (:193).
        No Content-Type is set, so PHP's default `text/html` is sent. Every failure is a bare
        404 (:156-200).
      parameters:
        - name: data
          in: path
          required: true
          description: base64 of a stream path, e.g. base64("/live/user/pass/123.ts").
          schema:
            type: string
            example: L2xpdmUvdXNlci9wYXNzLzEyMy50cw==
      responses:
        '200':
          description: Probe info (sent with Content-Type text/html).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Stream_ProbeResult'
              examples:
                default:
                  $ref: '#/components/examples/Stream_ProbeResult'
        '404':
          $ref: '#/components/responses/Stream_NotFound'
  /streaming/live.php:
    get:
      operationId: Stream_LegacyLivePhp
      tags:
        - Streaming
      summary: Legacy XC live.php (302 to /stream/auth?type=live)
      description: |
        nginx returns `302 /stream/auth?type=live&$args` (src/bin/nginx/conf/nginx.conf:147-149).
        The classic form is
        `/streaming/live.php?username=U&password=P&stream=ID&extension=ts`. Because `$args` is
        appended after `type=live`, a client `type=` overrides it. Then `Stream_StreamAuth`
        applies. `absolute_redirect off` makes the Location relative (nginx.conf:83).
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Password'
        - $ref: '#/components/parameters/Stream_QueryStream'
        - $ref: '#/components/parameters/Stream_QueryExtension'
      responses:
        '302':
          description: Redirect to the stream gateway.
          headers:
            Location:
              schema:
                type: string
                example: /stream/auth?type=live&username=user&password=pass&stream=123&extension=ts
  /streaming/vod.php:
    get:
      operationId: Stream_LegacyVodPhp
      tags:
        - Streaming
      summary: Legacy XC vod.php (302 to /stream/auth?type=movie)
      description: |
        nginx returns `302 /stream/auth?type=movie&$args`
        (src/bin/nginx/conf/nginx.conf:159-161). The stream is `{id}.{ext}`, or pass `extension`
        separately. Then `Stream_StreamAuth` applies.
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Password'
        - $ref: '#/components/parameters/Stream_QueryStream'
        - $ref: '#/components/parameters/Stream_QueryExtension'
      responses:
        '302':
          description: Redirect to the stream gateway.
          headers:
            Location:
              schema:
                type: string
                example: /stream/auth?type=movie&username=user&password=pass&stream=456.mp4
  /streaming/timeshift.php:
    get:
      operationId: Stream_LegacyTimeshiftPhp
      tags:
        - Streaming
      summary: Legacy XC timeshift.php (302 to /stream/auth?type=timeshift)
      description: |
        nginx returns `302 /stream/auth?type=timeshift&$args`
        (src/bin/nginx/conf/nginx.conf:155-157). Pass `start` and `duration` (in minutes) as for
        `Stream_TimeshiftByCredentials` (src/Public/stream/auth.php:706-776).
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Password'
        - $ref: '#/components/parameters/Stream_QueryStream'
        - $ref: '#/components/parameters/Stream_QueryExtension'
        - $ref: '#/components/parameters/Stream_QueryStart'
        - $ref: '#/components/parameters/Stream_QueryDuration'
      responses:
        '302':
          description: Redirect to the stream gateway.
          headers:
            Location:
              schema:
                type: string
                example: /stream/auth?type=timeshift&username=user&password=pass&stream=123&start=2026-10-17:20-00&duration=60&extension=ts
  /streaming/rtmp.php:
    get:
      operationId: Stream_LegacyRtmpPhp
      tags:
        - Streaming
      summary: Legacy RTMP callback (302 to /stream/rtmp)
      description: |
        nginx returns `302 /stream/rtmp?$args` (src/bin/nginx/conf/nginx.conf:151-153). This exists
        for old nginx-rtmp configs. nginx-rtmp does not follow a 3xx notify reply: for on_play it
        treats the Location as a stream-name redirect. This alias is therefore of little use to
        nginx-rtmp, and current configs call `/stream/rtmp` directly
        (src/bin/nginx_rtmp/conf/live.conf:1).
      responses:
        '302':
          description: Redirect to the RTMP callback.
          headers:
            Location:
              schema:
                type: string
                example: /stream/rtmp?call=play&addr=203.0.113.9&clientid=17&app=live&name=123
  /stream/auth:
    get:
      operationId: Stream_StreamAuth
      tags:
        - Streaming
      summary: Stream gateway, direct query form (all public URL forms rewrite here)
      description: |
        This is the direct form of the gateway (src/bin/nginx/conf/nginx.conf:253-270). The
        front controller is src/Public/stream/index.php:22-52, and the handler is
        src/Public/stream/auth.php. `/stream/auth.php` gets a 302 here (nginx.conf:168-170).
        POST is accepted, and its fields override GET.

        Credential precedence: `token`, then `hmac`, then `username`/`password` (:254-312).
        - A non-hex `token` is decrypted as a play token (:49-115).
        - HMAC auth works only for live, movie and series; any other type gives
          INVALID_TYPE_TOKEN (:266-269).
        - The HMAC signature covers `expiry`, `stream`, `extension`, `ip` and `identifier`, and is
          checked by AuthService::validateHMAC. An `expiry` in the past gives TOKEN_EXPIRED.
        - An HMAC session has max_connections=`max`.
        - Array-valued credentials give INVALID_CREDENTIALS.

        With `type` = `movie`, `series` or `subtitle` and no `extension`, `stream` may be
        `{id}.{ext}` or `{id}/segment_{n}.(ts|m4s)` (:134-144). Without any extension,
        live and timeshift default to ts and movie and series to mp4, but NOTHING is output:
        a blank HTTP 200 (:834-848, a quirk).
        The type-specific flows, redirects and errors are documented on the public path forms.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - live
              - movie
              - series
              - timeshift
              - thumb
              - subtitle
            default: live
        - $ref: '#/components/parameters/Stream_QueryStream'
        - $ref: '#/components/parameters/Stream_QueryExtension'
        - name: username
          in: query
          required: false
          schema:
            type: string
        - name: password
          in: query
          required: false
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: Line access token (hex) or an encrypted play token (non-hex; may end in `.{ext}`).
          schema:
            type: string
        - name: hmac
          in: query
          required: false
          description: HMAC signature (live, movie or series only).
          schema:
            type: string
        - name: identifier
          in: query
          required: false
          description: HMAC identifier string.
          schema:
            type: string
        - name: ip
          in: query
          required: false
          description: IP bound into the HMAC signature.
          schema:
            type: string
        - name: max
          in: query
          required: false
          description: Max connections for the HMAC session (intval).
          schema:
            type: integer
            default: 0
        - name: expiry
          in: query
          required: false
          description: Unix expiry for the HMAC link. Empty means no expiry.
          schema:
            type: string
        - $ref: '#/components/parameters/Stream_QueryStart'
        - $ref: '#/components/parameters/Stream_QueryDuration'
        - name: sid
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - $ref: '#/components/parameters/Stream_QueryWebvtt'
        - $ref: '#/components/parameters/Stream_QueryUtc'
        - $ref: '#/components/parameters/Stream_QueryPrebuffer'
      responses:
        '200':
          $ref: '#/components/responses/Stream_GatewayPlaylist'
        '302':
          $ref: '#/components/responses/Stream_LiveRedirect'
        '403':
          $ref: '#/components/responses/Stream_FloodBlocked'
        '404':
          $ref: '#/components/responses/Stream_NotFound'
    post:
      operationId: Stream_StreamAuthPost
      tags:
        - Streaming
      summary: Stream gateway via POST (same as GET; POST/JSON fields override GET)
      description: |
        This is the same handler as `Stream_StreamAuth`. `$rRequest` merges GET, then POST, then a
        JSON body (src/Infrastructure/Bootstrap/StreamingRequestBootstrap.php:107-113).
        Exception: play-token decoding and `utc` read `$_GET` only
        (src/Public/stream/auth.php:49,117).
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                token:
                  type: string
                hmac:
                  type: string
                start:
                  type: string
                duration:
                  type: string
                sid:
                  type: string
                webvtt:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Stream_GatewayPlaylist'
        '302':
          $ref: '#/components/responses/Stream_LiveRedirect'
        '404':
          $ref: '#/components/responses/Stream_NotFound'
  /stream/{handler}:
    get:
      operationId: Stream_DirectHandler
      tags:
        - Streaming
      summary: Direct handler form of the internal token endpoints
      description: |
        `/stream/(live|vod|timeshift|thumb|subtitle|segment|key|probe)` are reachable directly
        with `?token=` or `?data=` (src/bin/nginx/conf/nginx.conf:253-270). They are identical to
        the following public forms:
        - live: `/auth/{token}`
        - vod: `/vauth/{token}`
        - timeshift: `/tsauth/{token}`
        - thumb: `/thauth/{token}`
        - subtitle: `/subauth/{token}`
        - segment: `/hls/{token}`
        - key: `/key/{token}`
        - probe: `/probe/{data}`
        `/stream/{handler}.php` gets a 302 here (nginx.conf:168-170).
        An unknown handler (only reachable via `?handler=`) gets a hard-coded nginx 404 page
        (src/Public/stream/index.php:42-46).
      parameters:
        - name: handler
          in: path
          required: true
          schema:
            type: string
            enum:
              - live
              - vod
              - timeshift
              - thumb
              - subtitle
              - segment
              - key
              - probe
        - name: token
          in: query
          required: false
          schema:
            type: string
        - name: data
          in: query
          required: false
          description: probe only.
          schema:
            type: string
      responses:
        '200':
          description: As the corresponding public token endpoint.
          content:
            application/x-mpegurl:
              schema:
                type: string
            video/mp2t:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '302':
          description: segment only (token minted by another server).
        '404':
          $ref: '#/components/responses/Stream_NotFound'
  /stream/{handler}.php:
    get:
      operationId: Stream_DirectHandlerPhpAlias
      tags:
        - Streaming
      summary: Legacy .php alias of the stream handlers (302)
      description: |
        `^/stream/(auth|key|segment|live|vod|timeshift|thumb|subtitle|rtmp)\.php$` gets
        `302 /stream/$1?$args` (src/bin/nginx/conf/nginx.conf:168-170). PHP is never executed
        under these names.
      parameters:
        - name: handler
          in: path
          required: true
          schema:
            type: string
            enum:
              - auth
              - key
              - segment
              - live
              - vod
              - timeshift
              - thumb
              - subtitle
              - rtmp
      responses:
        '302':
          description: Redirect to the extensionless handler.
          headers:
            Location:
              schema:
                type: string
                example: /stream/auth?username=user&password=pass&stream=123&extension=ts
  /stream/rtmp:
    get:
      operationId: Stream_RtmpCallback
      tags:
        - Streaming
      summary: nginx-rtmp on_play/on_publish/on_play_done callback
      description: |
        This is not called by players. nginx-rtmp (port 8880, `application live`) calls it via
        `notify_method get` for on_play, on_publish and on_play_done
        (src/bin/nginx_rtmp/conf/nginx.conf:15-25, live.conf:1). Handler
        src/Public/stream/rtmp.php. The player URL is
        `rtmp://{host}:8880/live/{stream_id}?username=U&password=P`, or `?token=T`. nginx-rtmp
        forwards the query args plus `call`, `addr`, `clientid`, `app`, `name` and `tcurl`.

        Rules:
        - The notify args (`addr`, `clientid`, `call`, `name`) must each have exactly one value,
          else 404 (rtmp.php:30-35; StreamAuth::notifyArguments, src/Streaming/Auth/StreamAuth.php:194).
        - A publish from addr 127.0.0.1 is always allowed with 200 (:37,193-194).
        - Every other call requires REMOTE_ADDR 127.0.0.1, else generate404 (:46-49).

        `call=play`:
        - Allowed without line auth when `password` equals `live_streaming_pass`, or when the IP
          is an allowed RTMP pull IP (optionally with a password).
        - Otherwise `tcurl` and `app` must be present. Line creds (`token`, or
          `username`/`password`) are checked by RtmpViewerAuth on MAIN, or by RtmpOffline/agent on
          an LB.
        - Failure gives 404 and counts toward brute-force blocking only for AUTH_FAILED.
        - A stream not on this server gives 404 for viewers and 200 for relays.
        - A dead stream that is not on-demand gives 404. An on-demand stream starts its monitor
          and sleeps 5 s.
        - Success records the connection and enforces max connections (kicking the oldest),
          then returns 200. An admission refusal or LINE_CREATE_FAIL gives 404 (:61-171).

        `call=play_done`: closeRTMP, then 200 (:174-179).

        `call=publish`: 200 when `password` is `live_streaming_pass`, or when the IP is an allowed
        push IP. Otherwise 404 (:181-191).

        Bodies are empty, and nginx-rtmp only reads the status: 2xx allows, anything else denies.
      parameters:
        - name: call
          in: query
          required: true
          schema:
            type: string
            enum:
              - play
              - publish
              - play_done
        - name: addr
          in: query
          required: true
          description: Client IP as seen by nginx-rtmp.
          schema:
            type: string
        - name: clientid
          in: query
          required: true
          schema:
            type: string
        - name: name
          in: query
          required: true
          description: RTMP stream name = stream_id.
          schema:
            type: string
            example: '123'
        - name: app
          in: query
          required: false
          schema:
            type: string
            example: live
        - name: tcurl
          in: query
          required: false
          schema:
            type: string
            example: rtmp://lb1.example.com:8880/live
        - name: username
          in: query
          required: false
          schema:
            type: string
        - name: password
          in: query
          required: false
          description: Line password, or `live_streaming_pass` for relays and publishers.
          schema:
            type: string
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Stream_EmptyOk'
        '404':
          description: Denied (empty body), or the nginx 404 page when the caller is not localhost.
          content:
            text/html:
              schema:
                type: string
