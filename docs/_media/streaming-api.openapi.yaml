          - a unix timestamp
          - `YYYYMMDD-H` (hour only, minute 0)
          - `YYYY-MM-DD:HH-MM`, with optional `:SS` or `-SS`, which is ignored
        - `duration` is in MINUTES: `min(intval(duration), 21600)`, a 15-day cap (auth.php:735).
          One archive file exists per minute.
        - `m3u8`: HLS_DISABLED, else 302 to `{server}/tsauth/{token}`. With `allow_cdn_access` it
          is 302 to `{server}/tsauth/{id}_{start}_{duration}.m3u8?token=` (:738-753).
