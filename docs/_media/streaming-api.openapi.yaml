openapi: 3.1.0
info:
  title: XC_VM Streaming API
  version: 2.7.2
  summary: Streaming of the Xtream Codes compatible HTTP surface, as implemented by XC_VM.
  description: |
    A source-level reference for the **Xtream Codes (XC) API**: the de facto standard HTTP interface
    between IPTV panels and player apps. The reference implementation is
    [XC_VM](https://github.com/Vateron-Media/XC_VM) 2.7.2, an open-source continuation of Xtream UI / XC.
    Each operation cites the XC_VM source file and line it was traced from (`src/...:line`).

    ## Where to start

    The three endpoints almost every client uses:

    | Endpoint | Purpose |
    |---|---|
    | `GET /player_api.php` | JSON sign-in and catalogue browsing (`action=get_live_streams`, `get_vod_info`, `get_short_epg`, ...) |
    | `GET /get.php` | Downloadable playlist (`type=m3u_plus&output=ts`) |
    | `GET /xmltv.php` | XMLTV guide for the line's channels |

    Playback then uses plain media URLs (see the **Streaming** tag):

    ```
    {server}/live/{username}/{password}/{stream_id}.{ts|m3u8}
    {server}/movie/{username}/{password}/{stream_id}.{container_extension}
    {server}/series/{username}/{password}/{episode_id}.{container_extension}
    {server}/timeshift/{username}/{password}/{duration_min}/{YYYY-MM-DD:HH-MM}/{stream_id}.ts
    ```

    `{server}` is `server_info.server_protocol` + `://` + `server_info.url` + `:` + `server_info.port`
    (or `https_port`) from the sign-in answer.

    ## Authentication models

    The panel has several independent auth schemes. Each endpoint states which one it uses.

    | Who | How |
    |---|---|
    | Line (subscriber) | `username` + `password` query parameters, or `token` (32-char line access token). Also in path form: `/player_api/{u}/{p}`, `/live/{u}/{p}/...` |
    | Activation code | The code typed as `username` (or `token`) is activated on first use and becomes a line |
    | MAG / Stalker box | MAC address cookie + bearer token from `handshake` (`/c/portal.php`, `/stalker_portal/...`) |
    | Enigma2 box | MAC/device registration (`enigma2.php`) |
    | Admin / reseller REST | `api_key` query parameter (named `xct_` token or legacy per-user key) on `/{access_code}/?action=...`; the access code's IP whitelist is enforced by nginx |
    | Load-balancer nodes | Shared cluster secret (`/cluster/v1`); signed `node.rpc` (legacy `api.php` on nodes older than 2.7.0) |

    ## Error model

    - `player_api.php` / `panel_api.php` **never** use HTTP status for auth failure. They answer **200** with
      `{"user_info":{"auth":0,"status":"...","message":"..."}}`. Always check `user_info.auth`.
    - `get.php`, `xmltv.php` and the media endpoints answer a bare **nginx-style 404 page** for nearly every
      error (bad credentials, expired, banned, wrong type…), so apps cannot tell errors apart. With the panel
      setting `debug_show_errors` on, the page names the error code instead.
    - Download limits answer **429**; a blocked IP answers **403** before any controller runs;
      maintenance mode answers **503** with optional `Retry-After` on streaming endpoints (player_api reports
      maintenance as `status: "Maintenance"`).
    - nginx answers `200` with an empty body for any HTTP method other than GET or POST on client routes.
  contact:
    name: XC_VM project
    url: https://github.com/Vateron-Media/XC_VM
  license:
    name: AGPL-3.0 (XC_VM source); this document describes its public interface
    identifier: AGPL-3.0-only
servers:
  - url: '{protocol}://{host}:{port}'
    description: Any XC compatible panel or load-balancer node
    variables:
      protocol:
        default: http
        enum:
          - http
          - https
      host:
        default: tv.example.com
      port:
        default: '80'
        description: HTTP broadcast port (often 80, 8080, 8000, 25461); HTTPS often 443 or 25463.
externalDocs:
  description: XC_VM source
  url: https://github.com/Vateron-Media/XC_VM
components:
  parameters:
    Username:
      name: username
      in: query
      required: true
      description: Line username. Optional when `token` is sent instead.
      schema:
        type: string
        example: demo
    Password:
      name: password
      in: query
      required: true
      description: Line password. Optional when `token` is sent instead.
      schema:
        type: string
        format: password
        example: s3cret
    Stream_PathUsername:
      name: username
      in: path
      required: true
      description: Line username. A `?username=` query arg overrides it (nginx appends args; PHP keeps the last).
      schema:
        type: string
        example: user
    Stream_PathPassword:
      name: password
      in: path
      required: true
      description: Line password. A `?password=` query arg overrides it.
      schema:
        type: string
        example: pass
    Stream_PathStreamId:
      name: stream_id
      in: path
      required: true
      description: Numeric stream id (the nginx regex requires `\d+`; it is intval'd).
      schema:
        type: integer
        example: 123
    Stream_PathExtension:
      name: extension
      in: path
      required: true
      description: |
        Container. It is lowercased and non-alphanumerics are stripped (src/Public/stream/auth.php:133).
        - Live: `ts` or `m3u8`. Others are passed through as `api_container` and must be in the
          line's `output_formats`.
        - Timeshift: `m3u8` gives a playlist; anything else gives TS.
      schema:
        type: string
        example: m3u8
    Stream_PathVodFile:
      name: stream
      in: path
      required: true
      description: |
        `{stream_id}.{ext}`. For movies, ext must equal the movie's `target_container` (or be
        srt, m3u8 or ts), and VOD_PATH/{id}.{ext} must exist.
      schema:
        type: string
        example: 456.mp4
    Stream_PathLineToken:
      name: token
      in: path
      required: true
      description: |
        A line `access_token` (hex), or a non-hex encrypted play token, which then overrides
        type, credentials and stream. A trailing `.{ext}` on a play token is split off.
      schema:
        type: string
        example: 9f86d081884c7d659a2feaa0c55ad015
    Stream_PathPlayToken:
      name: token
      in: path
      required: true
      description: |
        A base64url AES-256-GCM token sealed with `live_streaming_pass` (src/Public/stream/auth.php:49-115).
        A legacy AES-256-CBC token is accepted when `secure_stream_tokens` is off. The plaintext is
        `type/username/password/stream[/ext[/expiry|magtoken]]`.
      schema:
        type: string
        example: q2V9Rk1hY3x0ZXN0X3Rva2VuX2V4YW1wbGU
    Stream_PathInternalToken:
      name: token
      in: path
      required: true
      description: |
        Server-minted, short-lived token (ViewerKey::mint/mintOwn). It is only obtained from a
        302 Location or a generated playlist. In the CDN form it is a filename such as
        `123.m3u8`, and the real token is passed as `?token=`.
      schema:
        type: string
        example: Zk1TbWJ4c2VhbGVkX3Rva2VuX2V4YW1wbGU
    Stream_PathDuration:
      name: duration
      in: path
      required: true
      description: Length in MINUTES (intval, capped at 21600) (src/Public/stream/auth.php:735).
      schema:
        type: integer
        example: 60
    Stream_PathStart:
      name: start
      in: path
      required: true
      description: |
        A unix timestamp (up to 10 digits), `YYYYMMDD-H`, or `YYYY-MM-DD:HH-MM` with optional
        `:SS` or `-SS`. Date forms are in server-local time (mktime). Anything else gives
        NO_TIMESTAMP (src/Public/stream/auth.php:729).
      schema:
        type: string
        example: 2026-10-17:20-00
    Stream_QueryStream:
      name: stream
      in: query
      required: true
      description: Stream id; `{id}.{ext}` for movie, series and subtitle.
      schema:
        type: string
        example: '123'
    Stream_QueryExtension:
      name: extension
      in: query
      required: false
      schema:
        type: string
        example: ts
    Stream_QueryStart:
      name: start
      in: query
      required: false
      description: Timeshift start (formats as in the path `start`).
      schema:
        type: string
        example: '1792267200'
    Stream_QueryDuration:
      name: duration
      in: query
      required: false
      description: Timeshift length in minutes (capped at 21600).
      schema:
        type: integer
        example: 120
    Stream_QueryUtc:
      name: utc
      in: query
      required: false
      description: |
        When present, the request becomes `type=timeshift`, `start=utc` and `duration=360`
        minutes, whatever the path says (src/Public/stream/auth.php:117-123). Read from $_GET only.
      schema:
        type: string
        example: '1792267200'
    Stream_QueryPrebuffer:
      name: prebuffer
      in: query
      required: false
      description: Presence enables prebuffering of the live TS start (src/Public/stream/auth.php:224).
      schema:
        type: string
    Stream_QueryWebvtt:
      name: webvtt
      in: query
      required: false
      description: 1 converts SRT to WebVTT (src/Public/stream/auth.php:823).
      schema:
        type: integer
        enum:
          - 0
          - 1
        default: 0
    Stream_HeaderDetect:
      name: X-XC_VM-DETECT
      in: header
      required: false
      description: Any value flags the request as a restream probe for restream detection (src/Public/stream/auth.php:226-229).
      schema:
        type: string
    Stream_HeaderPrebuffer:
      name: X-XC_VM-PREBUFFER
      in: header
      required: false
      description: Same as `?prebuffer` (src/Public/stream/auth.php:230-232).
      schema:
        type: string
    Stream_HeaderRange:
      name: Range
      in: header
      required: false
      description: A single `bytes=` range only. Suffix ranges are allowed. Multi-range gives 416 (src/Streaming/Delivery/HttpRange.php:24-60).
      schema:
        type: string
        example: bytes=0-1048575
  responses:
    Stream_NotFound:
      description: |
        Every error. This includes auth failures, disabled formats, bad tokens and missing
        files. generateError and generate404 both end with HTTP 404
        (src/Core/Error/ErrorResponder.php:203-237). With `debug_show_errors` on, the body is the
        "XC_VM - Debug Mode" page naming the code (e.g. INVALID_CREDENTIALS), still with status 404.
      content:
        text/html:
          schema:
            type: string
          examples:
            production:
              $ref: '#/components/examples/Stream_NotFoundPage'
    Stream_FloodBlocked:
      description: Client IP is flood/brute-force blocked. Empty body (src/Infrastructure/Bootstrap/StreamingRequestBootstrap.php:42-44).
    Stream_EmptyOk:
      description: HTTP 200 with an empty body.
    Stream_RangeNotSatisfiable:
      description: Multi-range, malformed or out-of-bounds Range. No body (src/Streaming/Delivery/HttpRange.php:24-82).
      headers:
        Accept-Ranges:
          schema:
            type: string
            example: bytes
        Content-Range:
          schema:
            type: string
            example: bytes */1468006400
    Stream_GatewayPlaylist:
      description: |
        Inline playlist from the gateway: an adaptive master (live m3u8 adaptive links) or the
        off-air/expired clip playlist (m3u8). It is also a blank 200 when no extension is resolved.
      headers:
        Cache-Control:
          schema:
            type: string
            example: no-store, no-cache, must-revalidate
        Access-Control-Allow-Origin:
          schema:
            type: string
            example: '*'
      content:
        application/x-mpegurl:
          schema:
            type: string
          examples:
            adaptive:
              $ref: '#/components/examples/Stream_AdaptiveMaster'
            offAir:
              $ref: '#/components/examples/Stream_OffAirPlaylist'
    Stream_LiveRedirect:
      description: |
        Redirect to the streaming server's internal endpoint (or proxy). The default form is
        `{server}/auth/{token}`; with allow_cdn_access it is `{server}/auth/{id}.{m3u8|ts}?token=`.
        A direct source goes to its source URL.
      headers:
        Location:
          schema:
            type: string
          examples:
            default:
              value: http://lb1.example.com:8080/auth/Zk1TbWJ4c2VhbGVkX3Rva2VuX2V4YW1wbGU
            cdn:
              value: http://lb1.example.com:8080/auth/123.m3u8?token=Zk1TbWJ4c2VhbGVkX3Rva2VuX2V4YW1wbGU
            directSource:
              value: http://origin.example.net/live/channel1.m3u8
        Cache-Control:
          schema:
            type: string
            example: no-store, no-cache, must-revalidate
    Stream_VodRedirect:
      description: Redirect to `{server}/vauth/{token}`, or `{server}/vauth/{id}.{ext}?token=` with allow_cdn_access.
      headers:
        Location:
          schema:
            type: string
          examples:
            default:
              value: http://lb1.example.com:8080/vauth/Vm9kVG9rZW5TZWFsZWRFeGFtcGxl
            cdn:
              value: http://lb1.example.com:8080/vauth/456.mp4?token=Vm9kVG9rZW5TZWFsZWRFeGFtcGxl
    Stream_TimeshiftRedirect:
      description: Redirect to `{archive_server}/tsauth/{token}`, or `/tsauth/{id}_{start}_{duration}.{m3u8|ts}?token=` with allow_cdn_access.
      headers:
        Location:
          schema:
            type: string
          examples:
            default:
              value: http://lb1.example.com:8080/tsauth/VHNUb2tlblNlYWxlZEV4YW1wbGU
            cdn:
              value: http://lb1.example.com:8080/tsauth/123_2026-10-17:20-00_60.m3u8?token=VHNUb2tlblNlYWxlZEV4YW1wbGU
    Stream_ThumbRedirect:
      description: Redirect to `{vframes_server}/thauth/{token}` (token valid for 5 s).
      headers:
        Location:
          schema:
            type: string
            example: http://lb1.example.com:8080/thauth/VGh1bWJUb2tlbkV4YW1wbGU
    Stream_SubtitleRedirect:
      description: Redirect to `{server}/subauth/{token}` (token valid for 5 s).
      headers:
        Location:
          schema:
            type: string
            example: http://lb1.example.com:8080/subauth/U3ViVG9rZW5FeGFtcGxl
  examples:
    Stream_NotFoundPage:
      summary: Production error body (every generateError/generate404)
      value: "<html>\r\n<head><title>404 Not Found</title></head>\r\n<body>\r\n<center><h1>404 Not Found</h1></center>\r\n<hr><center>nginx</center>\r\n</body>\r\n</html>\r\n<!-- a padding to disable MSIE and Chrome friendly error page -->\r\n<!-- a padding to disable MSIE and Chrome friendly error page -->\r\n<!-- a padding to disable MSIE and Chrome friendly error page -->\r\n<!-- a padding to disable MSIE and Chrome friendly error page -->\r\n<!-- a padding to disable MSIE and Chrome friendly error page -->\r\n<!-- a padding to disable MSIE and Chrome friendly error page -->"
    Stream_AdaptiveMaster:
      summary: Adaptive-link master playlist from auth.php (src/Public/stream/auth.php:556-611)
      value: |
        #EXTM3U
        #EXT-X-STREAM-INF:BANDWIDTH=6000000,RESOLUTION=1920x1080
        http://lb1.example.com:8080/auth/Zk1TbWJ4c2VhbGVkX3Rva2VuXzEwODA
        #EXT-X-STREAM-INF:BANDWIDTH=2500000,RESOLUTION=1280x720
        http://lb1.example.com:8080/auth/Zk1TbWJ4c2VhbGVkX3Rva2VuXzcyMA
    Stream_OffAirPlaylist:
      summary: Off-air/expired clip playlist (src/Streaming/Delivery/OffAirHandler.php:119-194)
      value: |
        #EXTM3U
        #EXT-X-VERSION:3
        #EXT-X-MEDIA-SEQUENCE:179226720
        #EXT-X-ALLOW-CACHE:NO
        #EXT-X-TARGETDURATION:10
        #EXT-X-PLAYLIST-TYPE:EVENT
        #EXTINF:10.0,
        http://lb1.example.com:8080/auth/T2ZmQWlyVG9rZW5FeHBpcmVzSW4xMHM
        #EXTINF:10.0,
        http://lb1.example.com:8080/auth/T2ZmQWlyVG9rZW5FeHBpcmVzSW4xMHM
        #EXTINF:10.0,
        http://lb1.example.com:8080/auth/T2ZmQWlyVG9rZW5FeHBpcmVzSW4xMHM
    Stream_LiveMediaPlaylist:
      summary: Live media playlist from /auth/{token} (segment URLs rewritten to /hls/{token})
      value: |
        #EXTM3U
        #EXT-X-VERSION:3
        #EXT-X-TARGETDURATION:10
        #EXT-X-MEDIA-SEQUENCE:179226718
        #EXTINF:10.000000,
        /hls/U2VnVG9rZW4tMTc5MjI2NzE4LXVzZXItcGFzcw
        #EXTINF:10.000000,
        /hls/U2VnVG9rZW4tMTc5MjI2NzE5LXVzZXItcGFzcw
        #EXTINF:10.000000,
        /hls/U2VnVG9rZW4tMTc5MjI2NzIwLXVzZXItcGFzcw
    Stream_LiveMediaPlaylistEncrypted:
      summary: With encrypt_hls (src/Streaming/Delivery/HLSGenerator.php:31-77)
      value: |
        #EXTM3U
        #EXT-X-KEY:METHOD=AES-128,URI="/key/S2V5VG9rZW4tMjAzLjAuMTEzLjktMTIz",IV=0x3f1c2a9b8d7e6f50a1b2c3d4e5f60718
        #EXT-X-VERSION:3
        #EXT-X-TARGETDURATION:10
        #EXT-X-MEDIA-SEQUENCE:179226718
        #EXTINF:10.000000,
        /hls/U2VnVG9rZW4tMTc5MjI2NzE4LXVzZXItcGFzcw
    Stream_LiveMediaPlaylistCdn:
      summary: With allow_cdn_access (segment name in path, token in query)
      value: |
        #EXTM3U
        #EXT-X-VERSION:3
        #EXT-X-TARGETDURATION:10
        #EXT-X-MEDIA-SEQUENCE:179226718
        #EXTINF:10.000000,
        /hls/123_d179226718.ts?token=U2VnVG9rZW4tMTc5MjI2NzE4LXVzZXItcGFzcw
    Stream_TimeshiftPlaylist:
      summary: Catch-up playlist (src/Public/stream/timeshift.php:197-216). One 60 s entry per archived minute; no trailing newline.
      value: |-
        #EXTM3U
        #EXT-X-VERSION:3
        #EXT-X-TARGETDURATION:60
        #EXT-X-MEDIA-SEQUENCE:0
        #EXT-X-PLAYLIST-TYPE:VOD
        #EXTINF:60.0,
        /hls/VFMvdXNlci9wYXNzL2FyY2hpdmUtbWludXRlLTA
        #EXTINF:60.0,
        /hls/VFMvdXNlci9wYXNzL2FyY2hpdmUtbWludXRlLTE
        #EXT-X-ENDLIST
    Stream_ProbeResult:
      summary: /probe/{data} body
      value:
        codecs:
          video:
            codec_name: h264
            width: 1920
            height: 1080
          audio:
            codec_name: aac
            channels: 2
        container: mpegts
        bitrate: 4521
  schemas:
    Stream_ProbeResult:
      type: object
      properties:
        codecs:
          type:
            - object
            - 'null'
          description: The stream's probed codec info, passed through as stored.
        container:
          type:
            - string
            - 'null'
        bitrate:
          type:
            - integer
            - string
            - 'null'
          description: Stored bitrate, passed through as stored. It may be numeric or a numeric string.
tags:
  - name: Streaming
    description: |
      XC media/streaming URL surface (live, VOD, series, catch-up, thumbnails, subtitles, HLS
      segments and keys, RTMP callbacks). Routing lives in src/bin/nginx/conf/nginx.conf:95-127
      (rewrites) and :147-174 (legacy 302s). Every rewrite target is `/stream/<handler>`, served by
      the single front controller src/Public/stream/index.php:22-52, which picks a handler from the
      `XC_STREAM` fastcgi param (nginx.conf:253-270) or `?handler=`.

      General behaviour that applies to EVERY path below:
      - Any method other than GET/POST gets HTTP 200 with an empty body from nginx before routing
        (nginx.conf:85-87). HEAD probes therefore never reflect stream state.
      - The `/stream/*` hot path is rate limited (`limit_req zone=one burst=8`, nginx.conf:254;
        zone is 20 r/s). Excess requests get nginx's limit_req status.
      - nginx appends the client's original query string to each rewrite target. PHP keeps the
        LAST duplicate key, so a query arg overrides the value taken from the path. For example,
        `/live/a/b/1.ts?username=c` authenticates as `c`. The CDN `?token=` forms rely on this.
      - `$rRequest` is GET merged with POST (POST wins), plus a JSON body if one is sent
        (src/Infrastructure/Bootstrap/StreamingRequestBootstrap.php:107-113).
      - A flood-blocked IP gets HTTP 403 with an empty body
        (StreamingRequestBootstrap.php:42-44). A missing settings cache gets 404 (:93-95).
        A failed `verify_host` check gives INVALID_HOST (:65-77).
      - Errors: generateError(CODE) always ends with HTTP 404
        (src/Core/Error/ErrorResponder.php:203-237). In production the body is a fake nginx
        "404 Not Found" HTML page plus six MSIE padding comments (ErrorResponder.php:119-121).
        With `debug_show_errors` on, the body is a styled "XC_VM - Debug Mode" page naming the
        code, still with status 404. Error codes are listed at ErrorResponder.php:33-101.
        The error code is never exposed in production. Players see only 404.
      - Two-stage flow: the public URL is authenticated by auth.php, usually on MAIN or on the LB
        the client hit. auth.php then answers 302 to the chosen streaming server's internal token
        URL: `/auth/`, `/vauth/`, `/tsauth/`, `/thauth/` or `/subauth/`, followed by a token.
        The token is an AES-256-GCM sealed JSON blob, base64url, minted by ViewerKey::mint.
        When `secure_stream_tokens` is off, legacy AES-256-CBC tokens are also accepted.
        When the line goes through a proxy server, the Location is `{proxy_url}/{routeSegment}/...`
        (src/Streaming/Delivery/StreamRedirector.php:187-228).
      - RTMP is not HTTP. nginx-rtmp listens on 8880 with `application live`
        (src/bin/nginx_rtmp/conf/port.conf:1, nginx.conf:21-25). Clients play
        `rtmp://{host}:8880/live/{stream_id}?username=U&password=P` (or `?token=T`). The
        `rtmp_server` advertised to clients is `rtmp://{url}:{rtmp_port}/live/`
        (src/Domain/Server/ServerRepository.php:149). on_play, on_publish and on_play_done call
        `GET http://127.0.0.1:80/stream/rtmp` (src/bin/nginx_rtmp/conf/live.conf:1). See
        `/stream/rtmp`.
paths:
  /live/{username}/{password}/{stream_id}.{extension}:
    get:
      operationId: Stream_LiveByCredentials
      tags:
        - Streaming
      summary: Live channel by username/password (explicit container)
      description: |
        Rewritten to `/stream/auth?username&password&stream&extension&type=live`
        (src/bin/nginx/conf/nginx.conf:121). Handled by src/Public/stream/auth.php.

        Auth checks run in this order, and each failure gives HTTP 404:
        - CACHE_INCOMPLETE (auth.php:34)
        - STREAM_OFFLINE when NodeLease refuses (:42)
        - INVALID_STREAM_ID for an unknown or uncached stream (:146-149). With cache on, this fires
          BEFORE credential checks.
        - Pre-auth STREAM_OFFLINE when no server can serve the stream (:196-216)
        - Credentials (:254-312) in this precedence: `token` (line access token), then `hmac`,
          then `username`/`password`.
        - PROXY_ACCESS_DENIED (:332)
        - Expired, banned or disabled lines get the expired/banned off-air video (see below), else
          EXPIRED, BANNED or DISABLED (:346-386).
        - Non-subtitle checks (:388-446): BLOCKED_USER_AGENT, EMPTY_USER_AGENT, NOT_IN_ALLOWED_IPS,
          FORCED_COUNTRY_INVALID, NOT_IN_ALLOWED_COUNTRY, NOT_IN_ALLOWED_UAS, ISP_BLOCKED,
          ASN_BLOCKED, and DEVICE_NOT_ALLOWED (an `is_mag` line not playing from a MAG).
        - Detection checks (:448-481): HOSTING_DETECT, PROXY_DETECT, and RESTREAM_DETECT, which
          can also disable the line.
        - USER_DISALLOW_EXT when `extension` is not in the line's `output_formats` (:483-488)
        - NOT_IN_BOUQUET (:497-500)
        - INVALID_CREDENTIALS, which counts toward brute-force blocking (:512-516)
        A line expiring within 7 days may be shown the "expiring" video once per 24 h (:502-510).
        MAG lines are forced to http when `mag_disable_ssl` is set; Enigma lines always are
        (:518-526).

        Redirect chain for live (auth.php:528-660):
        - StreamRedirector::redirectStream picks a server by force_server_id, then geoip, then ISP,
          then capacity (StreamRedirector.php:24-165).
        - A `direct_source` stream with `direct_proxy=0` is 302'd straight to its first source URL
          (StreamRedirector.php:51,69-77).
        - No server gives NO_SERVERS_AVAILABLE. A missing channel gives the "not on air" video.
        - `m3u8`:
          - HLS_DISABLED when `disable_hls` is set (unless the line is a restreamer and
            `disable_hls_allow_restream` is on) or when the stream is a `direct_proxy`.
          - An adaptive link returns an inline master playlist with 200 (:556-611).
          - Otherwise the response is 302 to `{server}/auth/{token}`. With `allow_cdn_access`
            it is 302 to `{server}/auth/{stream_id}.m3u8?token={token}` (:617-627).
        - `ts` and any other extension: TS_DISABLED, else 302 to `{server}/auth/{token}`. With
          `allow_cdn_access` it is 302 to `{server}/auth/{stream_id}.ts?token={token}` (:632-652).
          live.php then treats a non-ts/m3u8 extension as `api_container` (live.php:92-94).

        Off-air videos (src/Streaming/Delivery/OffAirHandler.php:119-194):
        - For `m3u8`, the response is a 200 inline EVENT playlist of 3 x 10 s entries, each
          pointing at `{server}/auth/{token}`. The token expires in 10 s.
        - Otherwise the response is 302 to `{server}/auth/{token}`, which serves the clip as
          video/mp2t (live.php:82-86).
        - Restreamers, or installs with no clip configured, get the error code instead
          (EXPIRED, BANNED or STREAM_OFFLINE).

        Response headers: `Cache-Control: no-store, no-cache, must-revalidate` (auth.php:31) and
        `Access-Control-Allow-Origin: *` (:221).
        Quirks:
        - `?utc={start}` turns the request into a timeshift with `start=utc` and duration=360
          minutes (:117-123).
        - Over max_connections, the OLDEST connections are kicked; the new one is not refused
          (src/Streaming/Auth/StreamAuth.php:111-134).
