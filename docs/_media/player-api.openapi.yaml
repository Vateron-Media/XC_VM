  /xmltv.php:
    get:
      operationId: Core_getXmltv
      tags:
        - EPG
      summary: Download the XMLTV guide
      description: |
        Serves the pre-built XMLTV file for the line's bouquet set. The EPG cron writes one file per distinct
        bouquet combination, `EPG_PATH/epg_<sha256(sorted bouquet ids joined by "_")>.xml`, and falls back to
        `epg_all.xml`; with `gzip=1` the `.xml.gz` sibling is sent. The file is streamed in 1 MB chunks.
        Aliases: `/xmltv`, `/epg.php`, `/epg`, `/api/epg`, `/epg/{username}/{password}` and
        `/epg/{username}/{password}/gz` (sets `gzip=1`). The `x-tvg-url` in M3U playlists points to the `/epg/` form.

        **Format:** `<tv generator-info-name="{server_name}">` with one `<channel id="{epg_channel_id}">`
        (`display-name`, optional `icon`) per stream that has EPG, then `<programme start stop channel>` with
        `title` and `desc`. Times are `YmdHis ±hhmm`. Only current/future programmes are written unless at least
        one channel in the set has catch-up archive, in which case past programmes are kept too. No `lang`
        attribute, categories, or episode numbers are emitted.

        **Errors** (panel error page, 404 in production): `LEGACY_EPG_DISABLED`, `INVALID_CREDENTIALS`, the
        `BaseApiController::validateUser` codes (as for `get.php`), `EPG_DISABLED`, `EPG_FILE_MISSING`.
        `429` with an empty body when the download limit is reached.

        Sources: `src/Public/Controllers/Api/EpgApiController.php:27`, `src/Cli/CronJobs/EpgCronJob.php:254`
        (`buildXmltv`), `:376` (programme rows).
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Password'
        - $ref: '#/components/parameters/Core_Token'
        - name: gzip
          in: query
          required: false
          description: '`1` sends the gzip-compressed file (`epg.xml.gz`, `application/octet-stream`).'
          schema:
            type: integer
            enum:
              - 0
              - 1
            default: 0
      responses:
        '200':
          description: XMLTV document.
          headers:
            Content-disposition:
              schema:
                type: string
              example: attachment; filename="epg.xml"
          content:
            application/xml:
              schema:
                type: string
              example: "<?xml version=\"1.0\" encoding=\"utf-8\" ?><!DOCTYPE tv SYSTEM \"xmltv.dtd\">\n<tv generator-info-name=\"XC_VM\">\n\t<channel id=\"BBCOne.uk\">\t\t<display-name>UK: BBC One HD</display-name>\t\t<icon src=\"http://example.com/logos/bbc1.png\" />\t</channel>\t<programme start=\"20261017180000 +0100\" stop=\"20261017183000 +0100\" channel=\"BBCOne.uk\">\t\t<title>BBC News</title>\t\t<desc>The latest national and international news.</desc>\t</programme>\n</tv>\n"
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: With `gzip=1`; the gzip-compressed XMLTV document (`epg.xml.gz`).
        '403':
          $ref: '#/components/responses/Core_IpBlocked'
        '404':
          $ref: '#/components/responses/Core_PanelErrorPage'
        '429':
          description: Download limit reached (`max_simultaneous_downloads`). Empty body.
