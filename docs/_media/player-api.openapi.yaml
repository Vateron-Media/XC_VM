  /player_api.php?action=get_short_epg:
    get:
      operationId: Core_getShortEpg
      tags:
        - Player API
      summary: Now/next programmes for a channel
      description: |
        The programme on now plus the next ones, up to `limit` (default 4) per stream. Past programmes are skipped.
        `title` and `description` are **base64-encoded** UTF-8.
        `start`/`end`/`stop` are `Y-m-d H:i:s` strings in the server time zone (`server_info.timezone`; UTC when
        `force_epg_timezone` is on); `start_timestamp`/`stop_timestamp`/`end_timestamp` are Unix times
        (string or integer depending on how the EPG cache stored them).

        **Multi mode (XC_VM extra):** a comma-separated `stream_id` (`1043,1044`) or the `multi` flag keys
        `epg_listings` by stream id, and the limit then applies per stream.

        Data comes from a per-stream cache (`EPG_PATH/stream_<id>`) that the EPG cron writes. A stream with no
        EPG answers `{"epg_listings":[]}`.
        Numeric alias: `action=205`.
        Source: `src/Public/Controllers/Api/PlayerApiController.php:727`; cache writer `src/Cli/CronJobs/EpgCronJob.php:229`.
      parameters:
        - $ref: '#/components/parameters/Core_ActionGetShortEpg'
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Password'
        - $ref: '#/components/parameters/Core_Token'
        - $ref: '#/components/parameters/Core_EpgStreamId'
        - name: limit
          in: query
          required: false
          description: Maximum programmes per stream.
          schema:
            type: integer
            default: 4
        - $ref: '#/components/parameters/Core_EpgMulti'
      responses:
        '200':
          description: EPG listings, or an auth error object.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - epg_listings
                    properties:
                      epg_listings:
                        oneOf:
                          - type: array
                            items:
                              $ref: '#/components/schemas/Core_ShortEpgRow'
                          - type: object
                            description: Multi mode, keyed by stream id.
                            additionalProperties:
                              type: array
                              items:
                                $ref: '#/components/schemas/Core_ShortEpgRow'
                  - $ref: '#/components/schemas/Core_AuthError'
              examples:
                single:
                  value:
                    epg_listings:
                      - id: '8812231'
                        epg_id: '3'
                        title: QkJDIE5ld3M=
                        lang: en
                        start: '2026-10-17 18:00:00'
                        end: '2026-10-17 18:30:00'
                        description: VGhlIGxhdGVzdCBuYXRpb25hbCBhbmQgaW50ZXJuYXRpb25hbCBuZXdzLg==
                        channel_id: BBCOne.uk
                        start_timestamp: '1792260000'
                        stop_timestamp: '1792261800'
                        end_timestamp: '1792261800'
                        stop: '2026-10-17 18:30:00'
                multi:
                  value:
                    epg_listings:
                      '1043':
                        - id: '8812231'
                          epg_id: '3'
                          title: QkJDIE5ld3M=
                          lang: en
                          start: '2026-10-17 18:00:00'
                          end: '2026-10-17 18:30:00'
                          description: ''
                          channel_id: BBCOne.uk
                          start_timestamp: '1792260000'
                          stop_timestamp: '1792261800'
                          end_timestamp: '1792261800'
                          stop: '2026-10-17 18:30:00'
                empty:
                  value:
                    epg_listings: []
  /player_api.php?action=get_simple_data_table:
    get:
      operationId: Core_getSimpleDataTable
      tags:
        - Player API
      summary: Full EPG for a channel (with archive flags)
      description: |
        Every cached programme for the stream (past and future), with `now_playing` and `has_archive` flags.
        Used by apps to draw the catch-up (timeshift) guide. `has_archive` is `1` when the stream records
        archive (`tv_archive_duration` days) and the programme ended inside that window.

        Same base64 and date conventions as `get_short_epg`, but there is no `stop` or `end_timestamp` field.
        Multi mode works as in `get_short_epg`.

        **Catch-up URL** for a programme with `has_archive: 1`:
        `{server}/timeshift/{username}/{password}/{duration_minutes}/{Y-m-d:H-i}/{stream_id}.ts`.
        Numeric alias: `action=207`.
        Source: `src/Public/Controllers/Api/PlayerApiController.php:659`.
      parameters:
        - $ref: '#/components/parameters/Core_ActionGetSimpleDataTable'
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Password'
        - $ref: '#/components/parameters/Core_Token'
        - $ref: '#/components/parameters/Core_EpgStreamId'
        - $ref: '#/components/parameters/Core_EpgMulti'
      responses:
        '200':
          description: EPG listings, or an auth error object.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - epg_listings
                    properties:
                      epg_listings:
                        oneOf:
                          - type: array
                            items:
                              $ref: '#/components/schemas/Core_DataTableEpgRow'
                          - type: object
                            additionalProperties:
                              type: array
                              items:
                                $ref: '#/components/schemas/Core_DataTableEpgRow'
                  - $ref: '#/components/schemas/Core_AuthError'
              example:
                epg_listings:
                  - id: '8812230'
                    epg_id: '3'
                    title: RWFzdEVuZGVycw==
                    lang: en
                    start: '2026-10-16 19:30:00'
                    end: '2026-10-16 20:00:00'
                    description: ''
                    channel_id: BBCOne.uk
                    start_timestamp: '1792179000'
                    stop_timestamp: '1792180800'
                    now_playing: 0
                    has_archive: 1
                  - id: '8812231'
                    epg_id: '3'
                    title: QkJDIE5ld3M=
                    lang: en
                    start: '2026-10-17 18:00:00'
                    end: '2026-10-17 18:30:00'
                    description: ''
                    channel_id: BBCOne.uk
                    start_timestamp: '1792260000'
                    stop_timestamp: '1792261800'
                    now_playing: 1
                    has_archive: 0
  /player_api.php?action=get_epg:
    get:
      operationId: Core_getEpg
      tags:
        - Player API
      summary: Raw EPG rows for a channel (XC_VM extension)
      description: |
        Not part of the classic XC API. Returns the cached EPG rows of the stream as a bare JSON array (or an
        object keyed by stream id in multi mode). `title`/`description` are base64; `start`/`end` are integer Unix
        times (no formatted dates). `from_now=1` drops programmes that have already ended.
        Answers `[]` when no `stream_id` is given or the line has expired.
        No numeric alias.
        Source: `src/Public/Controllers/Api/PlayerApiController.php:364`.
      parameters:
        - $ref: '#/components/parameters/Core_ActionGetEpg'
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Password'
        - $ref: '#/components/parameters/Core_Token'
        - $ref: '#/components/parameters/Core_EpgStreamId'
        - $ref: '#/components/parameters/Core_EpgMulti'
        - name: from_now
          in: query
          required: false
          description: Any positive value skips programmes whose end time is in the past.
          schema:
            type: integer
            enum:
              - 0
              - 1
      responses:
        '200':
          description: EPG rows, or an auth error object.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Core_RawEpgRow'
                  - type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/Core_RawEpgRow'
                  - $ref: '#/components/schemas/Core_AuthError'
              example:
                - id: '8812231'
                  epg_id: '3'
                  channel_id: BBCOne.uk
                  start: 1792260000
                  end: 1792261800
                  lang: en
                  title: QkJDIE5ld3M=
                  description: ''
  /panel_api.php:
    get:
      operationId: Core_panelApi
      tags:
        - Panel API (legacy)
      summary: Legacy all-in-one sign-in
      description: |
        Sign-in payload (as `player_api.php` with no action) plus `categories` (`series`, `movie`, `live`) and
        `available_channels`: every live channel, radio, created channel and movie of the line, keyed by stream id.
        A stream in several categories appears once, under its first category. Series are not listed
        (only their categories are). Can be very large on big lines.

        With an `action`, behaves exactly like `player_api.php` with the same action.

        Answers `{"user_info":{"auth":0,"status":"Disabled","message":"Legacy panel_api access has been disabled."}}`
        unless the `legacy_panel_api` setting is on. Aliases: `/panel_api`.

        Type quirks inside `available_channels`: `stream_id` and `added` are strings (unlike player_api);
        `live` is `"1"`/`"0"`; `series_no` is always `null`; `type_name` is `Live Streams`, `Movies`,
        `Created Live Channels` or `Radio`. When empty, `available_channels` is `[]` (JSON array) not `{}`.
        Source: `src/Public/Controllers/Api/PlayerApiController.php:107`, `:332` (`getLegacyLists`).
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Password'
        - $ref: '#/components/parameters/Core_Token'
