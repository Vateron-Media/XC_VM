      operationId: Cluster_queueUpdate
      tags:
        - Cluster API
      summary: Report job pids / delete finished jobs (active, CONTENT flow)
      description: |
        `queue()` (src/Domain/Cluster/ClusterApi.php:940-976). `pids` and `delete` together hold at most 400 entries. Denials: 409 FLOW_OFF, 400, 503 DB.
      parameters:
        - $ref: '#/components/parameters/Cluster_Proto'
        - $ref: '#/components/parameters/Cluster_Agent'
        - $ref: '#/components/parameters/Cluster_Node'
        - $ref: '#/components/parameters/Cluster_Epoch'
        - $ref: '#/components/parameters/Cluster_Ts'
        - $ref: '#/components/parameters/Cluster_Nonce'
        - $ref: '#/components/parameters/Cluster_Sig'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            x-xcvm-plaintext:
              type: object
              properties:
                pids:
                  type: object
                  additionalProperties:
                    type: integer
                  description: queue id to pid
                delete:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Boxed.
          headers:
            X-XCVM-Ts:
              schema:
                type: string
              description: Reply timestamp (ms).
            X-XCVM-Nonce:
              schema:
                type: string
              description: 32 hex.
            X-XCVM-Sig:
              schema:
                type: string
              description: Hex HMAC-SHA256 under K_mac_down.
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              x-xcvm-plaintext:
                example:
                  applied: 2
                  main_time_ms: 1760700000123
        '400':
          $ref: '#/components/responses/Cluster_Denied'
        '409':
          $ref: '#/components/responses/Cluster_Denied'
        '503':
          $ref: '#/components/responses/Cluster_Denied'
  /cluster/v1/conn_snapshot:
    post:
      operationId: Cluster_connSnapshot
      tags:
        - Cluster API
      summary: Chunked full connection snapshot (active, CONNECTIONS flow)
      description: |
        src/Domain/Cluster/ClusterApi.php:979-1004 uses `ConnectionSnapshot::receive` (src/Domain/Cluster/ConnectionSnapshot.php:49).
        Semaphore- and ingest-limited. A middle chunk gets `{done:false}`; the last chunk gets the totals.
        Denials: 409 SNAP_GAP `{expected_seq}`, 409 FLOW_OFF `{flow:"connections"}`, 400, 503 DB.
      parameters:
        - $ref: '#/components/parameters/Cluster_Proto'
        - $ref: '#/components/parameters/Cluster_Agent'
        - $ref: '#/components/parameters/Cluster_Node'
        - $ref: '#/components/parameters/Cluster_Epoch'
        - $ref: '#/components/parameters/Cluster_Ts'
        - $ref: '#/components/parameters/Cluster_Nonce'
        - $ref: '#/components/parameters/Cluster_Sig'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            x-xcvm-plaintext:
              type: object
              required:
                - snap_id
                - seq
                - last
                - records
              properties:
                snap_id:
                  type: string
                  pattern: ^[0-9a-f]{16,32}$
                seq:
                  type: integer
                  minimum: 0
                  maximum: 49
                last:
                  type: boolean
                records:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
      responses:
        '200':
          description: Boxed.
          headers:
            X-XCVM-Ts:
              schema:
                type: string
              description: Reply timestamp (ms).
            X-XCVM-Nonce:
              schema:
                type: string
              description: 32 hex.
            X-XCVM-Sig:
              schema:
                type: string
              description: Hex HMAC-SHA256 under K_mac_down.
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              x-xcvm-plaintext:
                example:
                  done: true
                  applied: 812
                  removed: 4
                  dropped: 0
                  main_time_ms: 1760700000123
        '400':
          $ref: '#/components/responses/Cluster_Denied'
        '409':
          $ref: '#/components/responses/Cluster_Denied'
        '503':
          $ref: '#/components/responses/Cluster_Denied'
  /cluster/v1/conn_admit:
    post:
      operationId: Cluster_connAdmit
      tags:
        - Cluster API
      summary: Ask MAIN to admit a viewer connection (active, CONNECTIONS flow)
      description: |
        src/Domain/Cluster/ClusterApi.php:1007-1029 uses `ConnectionAdmission::forNode` (src/Domain/Cluster/ConnectionAdmission.php:483).
        Supply exactly one identity: `line_id`, or `hmac_id` + `identifier`.
        A refusal is a 200 with `admit:false, exp:0, reason`. Denials: 400, 409 FLOW_OFF, 503 DB.
      parameters:
        - $ref: '#/components/parameters/Cluster_Proto'
        - $ref: '#/components/parameters/Cluster_Agent'
        - $ref: '#/components/parameters/Cluster_Node'
        - $ref: '#/components/parameters/Cluster_Epoch'
        - $ref: '#/components/parameters/Cluster_Ts'
        - $ref: '#/components/parameters/Cluster_Nonce'
        - $ref: '#/components/parameters/Cluster_Sig'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            x-xcvm-plaintext:
              type: object
              required:
                - uuid
                - stream_id
                - ip
                - ua
              properties:
                uuid:
                  type: string
                stream_id:
                  type: integer
                  minimum: 0
                ip:
                  type: string
                  maxLength: 64
                ua:
                  type: string
                  maxLength: 512
                mint:
                  description: Optional mint hint.
                line_id:
                  type: integer
                  minimum: 1
                hmac_id:
                  type: integer
                  minimum: 1
                identifier:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Boxed.
          headers:
            X-XCVM-Ts:
              schema:
                type: string
              description: Reply timestamp (ms).
            X-XCVM-Nonce:
              schema:
                type: string
              description: 32 hex.
            X-XCVM-Sig:
              schema:
                type: string
              description: Hex HMAC-SHA256 under K_mac_down.
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              x-xcvm-plaintext:
                examples:
                  admitted:
                    admit: true
                    exp: 1760703600
                    main_time_ms: 1760700000123
                  refused:
                    admit: false
                    exp: 0
                    reason: EXPIRED
                    main_time_ms: 1760700000123
                reasons:
                  - UNKNOWN_LINE
                  - EXPIRED
                  - BANNED
                  - DISABLED
                  - UNKNOWN_HMAC
        '400':
          $ref: '#/components/responses/Cluster_Denied'
        '409':
          $ref: '#/components/responses/Cluster_Denied'
        '503':
          $ref: '#/components/responses/Cluster_Denied'
  /cluster/v1/rtmp_auth:
    post:
      operationId: Cluster_rtmpAuth
      tags:
        - Cluster API
      summary: Authenticate an RTMP viewer/publisher against MAIN (active)
      description: |
        src/Domain/Cluster/ClusterApi.php:1032-1124. Supply `token`, or `username` + `password` (each at most 512 chars).
        After more than 300 failed checks per minute per node (RTMP_FAIL_BUDGET), the reply is `{ok:false, reason:"REFUSED"}`.
        Denials: 400, 503 DB.
      parameters:
        - $ref: '#/components/parameters/Cluster_Proto'
        - $ref: '#/components/parameters/Cluster_Agent'
        - $ref: '#/components/parameters/Cluster_Node'
        - $ref: '#/components/parameters/Cluster_Epoch'
        - $ref: '#/components/parameters/Cluster_Ts'
        - $ref: '#/components/parameters/Cluster_Nonce'
        - $ref: '#/components/parameters/Cluster_Sig'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            x-xcvm-plaintext:
              type: object
              required:
                - stream_id
                - ip
              properties:
                stream_id:
                  type: integer
                  minimum: 1
                ip:
                  type: string
                restream:
                  type: boolean
                uuid:
                  type: string
                token:
                  type: string
                  maxLength: 512
                username:
                  type: string
                  maxLength: 512
                password:
                  type: string
                  maxLength: 512
      responses:
        '200':
          description: Boxed.
          headers:
            X-XCVM-Ts:
              schema:
                type: string
              description: Reply timestamp (ms).
            X-XCVM-Nonce:
              schema:
                type: string
              description: 32 hex.
            X-XCVM-Sig:
              schema:
                type: string
              description: Hex HMAC-SHA256 under K_mac_down.
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              x-xcvm-plaintext:
                examples:
                  ok:
                    ok: true
                    user:
                      id: 5
                      max_connections: 1
                      pair_id: null
                      con_isp_name: ''
                      is_restreamer: 0
                      exp_date: 1767225600
                    country_code: GB
                    main_time_ms: 1760700000123
                  failed:
                    ok: false
                    reason: AUTH_FAILED
                    main_time_ms: 1760700000123
        '400':
          $ref: '#/components/responses/Cluster_Denied'
        '503':
          $ref: '#/components/responses/Cluster_Denied'
  /cluster/v1/config:
    post:
      operationId: Cluster_config
      tags:
        - Cluster API
      summary: Pull replicated config sections (active)
      description: |
        `config()` / `configPart()` (src/Domain/Cluster/ClusterApi.php:1127-1218) use `ReplicaBuilder`. Semaphore plus bulk ingest.

        Sections: settings, servers, node, crontab, cluster, secrets (modes 1/2 only), bouquets, categories.
        For each section the reply carries one of:
        - `{unchanged:true}`
        - `{etag, sealed}`, sealed to the node
        - `{too_large:true, etag, parts}`, to be fetched with `{part:{section, etag, n}}`

        Limits: the reply is at most 8323072 bytes, and a section at most 4194304. A `part` reply is
        `{part:{section, etag, n, parts, data}}`, or `{part:{section, etag, gone:true}}`.
        Denials: 400, 503 DB, refusals.
      parameters:
        - $ref: '#/components/parameters/Cluster_Proto'
        - $ref: '#/components/parameters/Cluster_Agent'
        - $ref: '#/components/parameters/Cluster_Node'
        - $ref: '#/components/parameters/Cluster_Epoch'
        - $ref: '#/components/parameters/Cluster_Ts'
        - $ref: '#/components/parameters/Cluster_Nonce'
        - $ref: '#/components/parameters/Cluster_Sig'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            x-xcvm-plaintext:
              type: object
              properties:
                blocklist_since:
                  type: integer
                  minimum: 0
                have:
                  type: object
                  additionalProperties:
                    type: string
                  description: section to last etag ("" or 64 hex)
                parts:
                  type: boolean
                blocklist_parts:
                  type: boolean
                part:
                  type: object
                  description: '{section, etag (64 hex), n}'
      responses:
        '200':
          description: Boxed.
          headers:
            X-XCVM-Ts:
              schema:
                type: string
              description: Reply timestamp (ms).
            X-XCVM-Nonce:
              schema:
                type: string
              description: 32 hex.
            X-XCVM-Sig:
              schema:
                type: string
              description: Hex HMAC-SHA256 under K_mac_down.
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              x-xcvm-plaintext:
                example:
                  blocklist:
                    seq: 991
                    more: false
                    unchanged: true
                  settings:
                    etag: 3f9a...64hex
                    sealed: base64...
                  servers:
                    unchanged: true
                  main_time_ms: 1760700000123
        '400':
          $ref: '#/components/responses/Cluster_Denied'
        '401':
          $ref: '#/components/responses/Cluster_Denied'
        '403':
          $ref: '#/components/responses/Cluster_Denied'
        '503':
          $ref: '#/components/responses/Cluster_Denied'
