      description: |
        `events()` (src/Domain/Cluster/ClusterApi.php:876-905) runs `EventIngest::ingest` (src/Domain/Cluster/EventIngest.php:143). Ingest pool.
        A batch holds at most 5000 events. `first_useq` is ignored for p2, where `useq` is returned as 0. A repeated batch returns `applied:0, dropped:0`.

        Denials:
        - 409 USEQ_GAP `{expected_useq}`.
        - P0 going backwards quarantines the node and gives 409 NOT_ACTIVE.
        - 503 DB, including when the previous batch is still locked.
        - 503 RATE_LIMITED `{lane}` when ingest permits are exhausted.
