openapi: 3.1.0
info:
  title: XC_VM Cluster API
  version: 2.7.2
  summary: Cluster API of the Xtream Codes compatible HTTP surface, as implemented by XC_VM.
  description: |
    A source-level reference for the **Xtream Codes (XC) API**: the de facto standard HTTP interface
    between IPTV panels and player apps. The reference implementation is
    [XC_VM](https://github.com/Vateron-Media/XC_VM) 2.7.2, an open-source continuation of Xtream UI / XC.
    Each operation cites the XC_VM source file and line it was traced from (`src/...:line`).

    ## Authentication models

    The panel has several independent auth schemes. Each endpoint states which one it uses.

    | Who | How |
    |---|---|
    | Line (subscriber) | `username` + `password` query parameters, or `token` (32-char line access token). Also in path form: `/player_api/{u}/{p}`, `/live/{u}/{p}/...` |
    | Activation code | The code typed as `username` (or `token`) is activated on first use and becomes a line |
    | MAG / Stalker box | MAC address cookie + bearer token from `handshake` (`/c/portal.php`, `/stalker_portal/...`) |
    | Enigma2 box | MAC/device registration (`enigma2.php`) |
    | Admin / reseller REST | `api_key` query parameter (named `xct_` token or legacy per-user key) on `/{access_code}/?action=...`; the access code's IP whitelist is enforced by nginx |
    | Load-balancer nodes | Shared cluster secret (`/cluster/v1`); signed `node.rpc` (legacy `api.php` on nodes older than 2.7.0) |
  contact:
    name: XC_VM project
    url: https://github.com/Vateron-Media/XC_VM
  license:
    name: AGPL-3.0 (XC_VM source); this document describes its public interface
    identifier: AGPL-3.0-only
servers:
  - url: '{protocol}://{host}:{port}'
    description: Any XC compatible panel or load-balancer node
    variables:
      protocol:
        default: http
        enum:
          - http
          - https
      host:
        default: tv.example.com
      port:
        default: '80'
        description: HTTP broadcast port (often 80, 8080, 8000, 25461); HTTPS often 443 or 25463.
externalDocs:
  description: XC_VM source
  url: https://github.com/Vateron-Media/XC_VM
components:
  parameters:
    Cluster_Proto:
      name: X-XCVM-Proto
      in: header
      required: true
      schema:
        type: string
        pattern: ^\d{1,4}$
        example: '1'
      description: Protocol version. Outside 1..1 gives 426 PROTO `{min,max}`.
    Cluster_Agent:
      name: X-XCVM-Agent
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
      description: Agent identifier (printable).
    Cluster_Node:
      name: X-XCVM-Node
      in: header
      required: true
      schema:
        type: string
      description: Lowercase node uuid, or `sid:<n>` for enrol-code ops.
    Cluster_Epoch:
      name: X-XCVM-Epoch
      in: header
      required: true
      schema:
        type: string
        pattern: ^\d{1,18}$
      description: Token epoch (0 for rekey / enrol-code).
    Cluster_Ts:
      name: X-XCVM-Ts
      in: header
      required: true
      schema:
        type: string
        pattern: ^\d{13,16}$
      description: Unix ms, within ±90000 ms of MAIN; else 401 CLOCK_SKEW.
    Cluster_Nonce:
      name: X-XCVM-Nonce
      in: header
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{32}$
      description: Single-use; a reuse gives 401 REPLAY.
    Cluster_Sig:
      name: X-XCVM-Sig
      in: header
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
      description: HMAC-SHA256 MAC of the request; a mismatch gives 401 BAD_MAC.
    Cluster_NodeSig:
      name: X-XCVM-Node-Sig
      in: header
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{128}$
      description: Node Ed25519 signature; a mismatch gives 401 BAD_NODE_SIG.
  responses:
    Cluster_Denied:
      description: |
        Panel-signed denial (DenialFactory::deny; tag `den`). Statuses and reasons:
        - 400 BAD_REQUEST
        - 401 CLOCK_SKEW | UNKNOWN_NODE | TOKEN_EXPIRED{detail} | BAD_MAC | BAD_NODE_SIG | REPLAY{retry_after_ms?} | CHALLENGE | CODE_INVALID
        - 403 NODE_REVOKED{revoked_gen} | HTTPS_REQUIRED | LICENCE_INVALID{commands_sealed?} | GRANT_INVALID
        - 404 UNKNOWN_OP
        - 405 BAD_REQUEST
        - 409 NOT_ACTIVE{state} | ENROL_EXPIRED | ENROL_CONFLICT | USEQ_GAP{expected_useq} | SNAP_GAP{expected_seq} | FLOW_OFF{flow,feature?} | ARTEFACT_CHANGED
        - 416 BAD_RANGE{size,max_chunk}
        - 426 PROTO{min,max}
        - 429 RATE_LIMITED{retry_after_ms} (rekey)
        - 503 DISABLED | STARTING{retry_after_ms:5000} | DB | CLOCK | RATE_LIMITED{retry_after_ms,op,lane?}

        Unsigned exceptions: 503 `{"v":1,"reason":"ERROR"}`, and 503 STARTING when the extension is missing.
        nginx's 429 (zone `cluster`) and 413 carry no signature.
      headers:
        X-XCVM-Panel-Sig:
          schema:
            type: string
          description: base64url Ed25519 over the body (tag den).
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Cluster_Denial'
          examples:
            notActive:
              value:
                v: 1
                typ: xcvm-denial
                reason: NOT_ACTIVE
                node: 3f1c2a4e-8b7d-4c1a-9e2f-0a1b2c3d4e5f
                req_nonce: a3f1c9e07b2d4e5f8a9b0c1d2e3f4a5b
                main_time_ms: 1760700000123
                state: quarantined
            starting:
              value:
                v: 1
                typ: xcvm-denial
                reason: STARTING
                node: null
                req_nonce: null
                main_time_ms: 1760700000123
                retry_after_ms: 5000
            error:
              value:
                v: 1
                reason: ERROR
  schemas:
    Cluster_Denial:
      type: object
      required:
        - v
        - reason
      properties:
        v:
          type: integer
          const: 1
        typ:
          type: string
          const: xcvm-denial
        reason:
          type: string
        node:
          type:
            - string
            - 'null'
        req_nonce:
          type:
            - string
            - 'null'
          description: The request's nonce (hex) when bound.
        main_time_ms:
          type: integer
        retry_after_ms:
          type: integer
        state:
          type: string
        min:
          type: integer
        max:
          type: integer
        detail:
          type: string
        revoked_gen:
          type: integer
        expected_useq:
          type: integer
        expected_seq:
          type: integer
        flow:
          type: string
        feature:
          type: string
        op:
          type: string
        lane:
          type: string
          enum:
            - p0
            - bulk
        commands_sealed:
          type: string
        size:
          type: integer
        max_chunk:
          type: integer
    Cluster_Policy:
      type: object
      description: ClusterPolicy::current (src/Domain/Cluster/ClusterPolicy.php:22-95).
      properties:
        policy_ver:
          type: integer
        transport:
          type: string
          enum:
            - auto
            - http
            - https_preferred
            - https_required
        heartbeat_sec:
          type: integer
        main_urls:
          type: array
          items:
            type: string
    Cluster_Health:
      type: object
      properties:
        v:
          type: integer
          const: 1
        typ:
          type: string
          const: xcvm-health
        main_time_ms:
          type: integer
        proto:
          type: object
          properties:
            min:
              type: integer
            max:
              type: integer
        api:
          type: integer
        panel_sign_pub:
          type: string
          description: base64 Ed25519 public key.
        panel_box_pub:
          type: string
          description: base64 X25519 public key.
        panel_fp:
          type: string
          description: hex fingerprint.
      example:
        v: 1
        typ: xcvm-health
        main_time_ms: 1760700000123
        proto:
          min: 1
          max: 1
        api: 1
        panel_sign_pub: q2Vd3fT0rW0mA1xY9b7cJk8L0pQ5sR2tU4vW6xY8zA0=
        panel_box_pub: Z3h4aTJ0b2tlbl9leGFtcGxlX2JveF9wdWJrZXkwMDA=
        panel_fp: 5f2b9c0e7a1d4e3f
    Cluster_Challenge:
      type: object
      properties:
        v:
          type: integer
          const: 1
        typ:
          type: string
          const: xcvm-challenge
        cn:
          type: string
        challenge:
          type: string
          description: base64 32 bytes; single use, 180 s.
        main_time_ms:
          type: integer
        licence_ok:
          type: boolean
        policy:
          $ref: '#/components/schemas/Cluster_Policy'
      example:
        v: 1
        typ: xcvm-challenge
        cn: 3f1c2a4e-8b7d-4c1a-9e2f-0a1b2c3d4e5f
        challenge: mJ6o2d0yq1n8Zr5bJm8tP3w0aQ9eT6uY2hK4sV7xW1c=
        main_time_ms: 1760700000123
        licence_ok: true
        policy:
          policy_ver: 1
          transport: auto
          heartbeat_sec: 2
          main_urls:
            - http://10.0.0.1:80/cluster/v1/
    Cluster_Lease:
      type: object
      properties:
        payload:
          type: string
        sig:
          type: string
        exp:
          type: integer
    Cluster_TokenIssued:
      type: object
      description: TokenService issue (src/Domain/Cluster/ClusterApi.php:475; lease from src/Domain/Cluster/LeaseService.php:81).
      properties:
        token_sealed:
          type: string
          description: base64 token sealed to eph_pub.
        epoch:
          type: integer
        nbf:
          type: integer
        exp:
          type: integer
        refresh_at:
          type: integer
        main_time_ms:
          type: integer
        lease:
          $ref: '#/components/schemas/Cluster_Lease'
      example:
        token_sealed: base64...
        epoch: 43
        nbf: 1760700000
        exp: 1760703600
        refresh_at: 1760702700
        main_time_ms: 1760700000123
    Cluster_EnrolStatus:
      type: object
      properties:
        v:
          type: integer
          const: 1
        typ:
          type: string
          const: xcvm-enrol-status
        state:
          type: string
          description: pending_approval, rejected, ...
        main_time_ms:
          type: integer
tags:
  - name: Cluster API
    description: |
      MAIN-only node-to-MAIN control plane at `/cluster/v1/<op>` (docs/adr/0004-cluster-api.md,
      docs/en/development/cluster-api.md). nginx: src/bin/nginx/conf/cluster_locations.conf.
      - Rate limit: `limit_req zone=cluster burst=400`, so excess requests get 429.
      - `client_max_body_size 8m`.
      - Ingest ops (events, config, streams, conn_snapshot, recording_complete, queue_*, artefact) go to the
        `cluster_ingest` FPM pool; the rest go to `cluster_ctl`.

      **Request authentication** (src/Domain/Cluster/ClusterApi.php `preflight` :251, `handle` :110-215):
      - Headers `X-XCVM-Proto`, `X-XCVM-Agent`, `X-XCVM-Node`, `X-XCVM-Epoch`, `X-XCVM-Ts`, `X-XCVM-Nonce`, `X-XCVM-Sig`.
        Ops flagged "node sig" also take `X-XCVM-Node-Sig`.
      - The canonical context is `xcvm-req-v1` over proto, agent, method, path, sorted query, content-type,
        content-encoding, node, epoch, ts and nonce (src/Core/Cluster/Crypto/Canonical.php).
      - `X-XCVM-Sig` = hex HMAC-SHA256 under the session's K_mac_up over `xcvm-mac-v1` ‖ lp(ctx) ‖ sha256(body).
      - Ts must be within ±90000 ms of MAIN's clock (Canonical::WINDOW_MS). Each nonce is accepted once.
      - Session bodies are an AES-256-GCM "XCVM-BOX-v1" under K_enc_up, carrying JSON.
        A body that fails to open or decode gives 400 BAD_REQUEST (ClusterApi.php:357-362).
      - Bodies are at most 8 MiB, or 64 KiB for unsessioned ops (ClusterApi.php:45-48). PROTO_MIN = PROTO_MAX = 1.

      **Replies**
      - Success is `ClusterReply::boxed` (src/Domain/Cluster/ClusterReply.php:20): `application/octet-stream`
        Box under K_enc_down, headers `X-XCVM-Ts`, `X-XCVM-Nonce`, `X-XCVM-Sig` (MAC under K_mac_down over the response
        context) and `Cache-Control: no-store`. The plaintext JSON always carries `main_time_ms` (ClusterApi.php:1380).
        It is shown below as `x-xcvm-plaintext`.
      - Denials are `DenialFactory::deny` (src/Domain/Cluster/DenialFactory.php:28): cleartext JSON
        `{"v":1,"typ":"xcvm-denial","reason",...}` signed in `X-XCVM-Panel-Sig` (base64url Ed25519, tag `den`).
      - nginx's own 429/413/502/504/404 bodies carry no MAC.

      **Gates** (src/Public/cluster/index.php):
      - 503 `STARTING` unsigned when the crypto extension is missing (:46-52).
      - `ClusterPool::gate` gives 503 `STARTING` `{retry_after_ms:5000}` until the pools are ready (:74-78;
        src/Domain/Cluster/ClusterPool.php:253-259). `health` is exempt and needs no DB (:79-84).
      - 503 `DB` when the database is down (:105-107). An uncaught failure gives unsigned 503 `{"v":1,"reason":"ERROR"}` (:116).
      - `cluster_api_enabled=0` gives 503 `DISABLED`. HTTPS policy gives 403 `HTTPS_REQUIRED` (ClusterApi.php:125-132).
      - Busy semaphores give **503** `RATE_LIMITED` `{retry_after_ms, op[, lane]}` (src/Domain/Cluster/ClusterSemaphore.php:126-244).

      `rpc_result`, `stream_bundle` and `vod_analysis` match the nginx ingest regex but are not ops.
      They answer 404 `UNKNOWN_OP` (ClusterApi.php:115). `vod.analysis` is a P0 event type sent via `events`.
paths:
  /cluster/v1/health:
    get:
      operationId: Cluster_health
      tags:
        - Cluster API
      summary: Panel public keys and clock (unauthenticated)
      description: |
        `health()` (src/Domain/Cluster/ClusterApi.php:389-401). It needs no DB and skips the DISABLED, HTTPS and STARTING gates
        (src/Public/cluster/index.php:79-84). The cleartext JSON is signed in `X-XCVM-Panel-Sig` with tag `hlt`.
      responses:
        '200':
          description: Health document.
          headers:
            X-XCVM-Panel-Sig:
              schema:
                type: string
              description: base64url Ed25519 over the body (tag hlt).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster_Health'
        '503':
          $ref: '#/components/responses/Cluster_Denied'
  /cluster/v1/challenge:
    get:
      operationId: Cluster_challenge
      tags:
        - Cluster API
      summary: Single-use challenge for token_rekey (unauthenticated)
      description: |
        `challenge()` (src/Domain/Cluster/ClusterApi.php:404-421). It issues 32 random bytes stored as `chal:<cn>` for 180 s,
        consumed by `token_rekey`. It is served over plain HTTP even under `https_required` (:127).
        An invalid `cn` gives 400 BAD_REQUEST. Signed with tag `hlt`.
      parameters:
        - name: cn
          in: query
          required: true
          schema:
            type: string
          description: Node uuid (Canonical::validNode).
      responses:
        '200':
          description: Challenge.
          headers:
            X-XCVM-Panel-Sig:
              schema:
                type: string
              description: base64url Ed25519 (tag hlt).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster_Challenge'
        '400':
          $ref: '#/components/responses/Cluster_Denied'
        '503':
          $ref: '#/components/responses/Cluster_Denied'
  /cluster/v1/enrol_complete:
    post:
      operationId: Cluster_enrolComplete
      tags:
        - Cluster API
      summary: Finish enrolment (node sig; state enrolling)
      description: |
        `enrolComplete()` (src/Domain/Cluster/ClusterApi.php:424-450). Requires epoch 1, before `enrol_deadline`, else 409 ENROL_EXPIRED.
        It sets the node `active`. If the conditional update loses, the reply is 403 NODE_REVOKED, 401 UNKNOWN_NODE or 409 NOT_ACTIVE.
      parameters:
        - $ref: '#/components/parameters/Cluster_Proto'
        - $ref: '#/components/parameters/Cluster_Agent'
        - $ref: '#/components/parameters/Cluster_Node'
        - $ref: '#/components/parameters/Cluster_Epoch'
        - $ref: '#/components/parameters/Cluster_Ts'
        - $ref: '#/components/parameters/Cluster_Nonce'
        - $ref: '#/components/parameters/Cluster_Sig'
        - $ref: '#/components/parameters/Cluster_NodeSig'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            x-xcvm-plaintext:
              type: object
              properties:
                instance_id:
                  type: string
                  maxLength: 64
                boot_id:
                  type: string
                  maxLength: 64
                agent_version:
                  type: string
                  maxLength: 32
      responses:
        '200':
          description: Boxed.
          headers:
            X-XCVM-Ts:
              schema:
                type: string
              description: Reply timestamp (ms).
            X-XCVM-Nonce:
              schema:
                type: string
              description: 32 hex.
            X-XCVM-Sig:
              schema:
                type: string
              description: Hex HMAC-SHA256 under K_mac_down.
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              x-xcvm-plaintext:
                example:
                  state: active
                  mode: 1
                  flows: 255
                  gen: 1
                  main_time_ms: 1760700000123
                  policy:
                    policy_ver: 1
                    transport: auto
                    heartbeat_sec: 2
                    main_urls:
                      - http://10.0.0.1:80/cluster/v1/
        '400':
          $ref: '#/components/responses/Cluster_Denied'
        '401':
          $ref: '#/components/responses/Cluster_Denied'
        '403':
          $ref: '#/components/responses/Cluster_Denied'
        '409':
          $ref: '#/components/responses/Cluster_Denied'
        '503':
          $ref: '#/components/responses/Cluster_Denied'
  /cluster/v1/token_refresh:
    post:
      operationId: Cluster_tokenRefresh
      tags:
        - Cluster API
      summary: Refresh the session token (node sig; active/quarantined)
      description: |
        `tokenRefresh()` (src/Domain/Cluster/ClusterApi.php:454-497) runs `TokenService::refresh` with a fresh X25519 ephemeral key.
        Refusals (`refusal()` :1270-1280):
        - REVOKED gives 403.
        - LICENCE gives 403 LICENCE_INVALID, optionally with `commands_sealed`.
        - CLOCK gives 503.
        - Anything else gives 401 TOKEN_EXPIRED `{detail}`.
      parameters:
        - $ref: '#/components/parameters/Cluster_Proto'
        - $ref: '#/components/parameters/Cluster_Agent'
        - $ref: '#/components/parameters/Cluster_Node'
        - $ref: '#/components/parameters/Cluster_Epoch'
        - $ref: '#/components/parameters/Cluster_Ts'
        - $ref: '#/components/parameters/Cluster_Nonce'
        - $ref: '#/components/parameters/Cluster_Sig'
        - $ref: '#/components/parameters/Cluster_NodeSig'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            x-xcvm-plaintext:
              type: object
              required:
                - eph_pub
              properties:
                eph_pub:
                  type: string
                  description: base64 32-byte X25519 public key.
      responses:
        '200':
          description: Boxed `issued()` (:475).
          headers:
            X-XCVM-Ts:
              schema:
                type: string
              description: Reply timestamp (ms).
            X-XCVM-Nonce:
              schema:
                type: string
              description: 32 hex.
            X-XCVM-Sig:
              schema:
                type: string
              description: Hex HMAC-SHA256 under K_mac_down.
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              x-xcvm-plaintext:
                $ref: '#/components/schemas/Cluster_TokenIssued'
        '400':
          $ref: '#/components/responses/Cluster_Denied'
        '401':
          $ref: '#/components/responses/Cluster_Denied'
        '403':
          $ref: '#/components/responses/Cluster_Denied'
        '503':
          $ref: '#/components/responses/Cluster_Denied'
  /cluster/v1/token_rekey:
    post:
      operationId: Cluster_tokenRekey
      tags:
        - Cluster API
      summary: Re-establish a session without a token (node sig; active)
      description: |
        `tokenRekey()` / `rekeyAuthenticated()` (src/Domain/Cluster/ClusterApi.php:500-560).
        Request auth:
        - No `X-XCVM-Sig`. `X-XCVM-Epoch: 0`. Non-empty body of at most 65536 bytes.
        - `X-XCVM-Node-Sig` is checked against the stored `node_sign_pub` over ctx ‖ sha256(body).

        The body is a SEAL to the panel box key (purpose `rekey`, bound to the request context) holding JSON.
        Its `challenge` comes from `GET challenge?cn=`.

        Denials:
        - 429 RATE_LIMITED `{retry_after_ms}`: once per 60 s per node.
        - 401 CHALLENGE: challenge unknown or already used.
        - 409 NOT_ACTIVE `{state:"quarantined"}`: `instance_id` mismatch, which also quarantines the node.
        - Refusals as for token_refresh.

        Success is **cleartext JSON** signed with Panel-Sig tag `pre` (:556-558), not boxed.
      parameters:
        - $ref: '#/components/parameters/Cluster_Proto'
        - $ref: '#/components/parameters/Cluster_Agent'
        - $ref: '#/components/parameters/Cluster_Node'
        - $ref: '#/components/parameters/Cluster_Epoch'
        - $ref: '#/components/parameters/Cluster_Ts'
        - $ref: '#/components/parameters/Cluster_Nonce'
        - $ref: '#/components/parameters/Cluster_NodeSig'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            x-xcvm-plaintext:
              type: object
              required:
                - challenge
                - eph_pub
              properties:
                challenge:
                  type: string
                  description: base64 32 bytes.
                eph_pub:
                  type: string
                  description: base64 32 bytes.
                instance_id:
                  type: string
                boot_id:
                  type: string
                agent_version:
                  type: string
      responses:
        '200':
          description: Panel-signed rekey document.
          headers:
            X-XCVM-Panel-Sig:
              schema:
                type: string
              description: base64url Ed25519 (tag pre).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Cluster_TokenIssued'
                  - type: object
                    properties:
                      v:
                        type: integer
                        const: 1
                      typ:
                        type: string
                        const: xcvm-rekey
                      node:
                        type: string
                      req_nonce:
                        type: string
        '400':
          $ref: '#/components/responses/Cluster_Denied'
        '401':
          $ref: '#/components/responses/Cluster_Denied'
        '403':
          $ref: '#/components/responses/Cluster_Denied'
        '409':
          $ref: '#/components/responses/Cluster_Denied'
        '429':
          $ref: '#/components/responses/Cluster_Denied'
        '503':
          $ref: '#/components/responses/Cluster_Denied'
  /cluster/v1/enrol_code:
    post:
      operationId: Cluster_enrolCode
      tags:
        - Cluster API
      summary: Submit an enrolment by one-time code (node sig)
      description: |
        `enrolByCode()` (src/Domain/Cluster/ClusterApi.php:577-648).

        Request auth:
        - Headers `X-XCVM-Node: sid:<n>`, `X-XCVM-Epoch: 0`.
        - `X-XCVM-Sig` is a MAC under K_req = HKDF(code secret, salt u32 sid, `xcvm/enrol-code/v1/req`) (src/Domain/Cluster/EnrolCodeService.php:15-16).
        - The body (at most 64 KiB) is SEALed, purpose `enrol_code`.
        - `X-XCVM-Node-Sig` is verified with the body's `sign_pub`.

        Denials:
        - 401 CODE_INVALID: no code. 401 BAD_MAC.
        - From `submit` (EnrolCodeService.php:148-165): 409 ENROL_CONFLICT, 409 CODE_INVALID, 400.

        Success: `ClusterReply::maced` cleartext JSON under K_res.
      parameters:
        - $ref: '#/components/parameters/Cluster_Proto'
        - $ref: '#/components/parameters/Cluster_Agent'
        - $ref: '#/components/parameters/Cluster_Node'
        - $ref: '#/components/parameters/Cluster_Epoch'
        - $ref: '#/components/parameters/Cluster_Ts'
        - $ref: '#/components/parameters/Cluster_Nonce'
        - $ref: '#/components/parameters/Cluster_Sig'
        - $ref: '#/components/parameters/Cluster_NodeSig'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            x-xcvm-plaintext:
              type: object
              required:
                - node_uuid
                - sign_pub
                - box_pub
                - eph_pub
              properties:
                node_uuid:
                  type: string
                sign_pub:
                  type: string
                  description: base64 Ed25519 32 bytes.
                box_pub:
                  type: string
                  description: base64 X25519 32 bytes.
                eph_pub:
                  type: string
                instance_id:
                  type: string
      responses:
        '200':
          description: MAC'd cleartext status.
          headers:
            X-XCVM-Ts:
              schema:
                type: string
              description: Reply timestamp (ms).
            X-XCVM-Nonce:
              schema:
                type: string
              description: 32 hex.
            X-XCVM-Sig:
              schema:
                type: string
              description: Hex HMAC-SHA256 under K_mac_down.
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster_EnrolStatus'
              example:
                v: 1
                typ: xcvm-enrol-status
                state: pending_approval
                main_time_ms: 1760700000123
        '400':
          $ref: '#/components/responses/Cluster_Denied'
        '401':
          $ref: '#/components/responses/Cluster_Denied'
        '409':
          $ref: '#/components/responses/Cluster_Denied'
  /cluster/v1/enrol_code_status:
    post:
      operationId: Cluster_enrolCodeStatus
      tags:
        - Cluster API
      summary: Poll an enrol-code request
      description: |
        `enrolByCode()` status branch (src/Domain/Cluster/ClusterApi.php:595-610). Headers are as for enrol_code, without Node-Sig.
        The body is plain JSON (MAC'd, not sealed) `{node_uuid}`, and must match the pending request, else 400.

        Replies:
        - Approved: `maced(K_res)` with `typ: xcvm-enrol-approved` plus the stored panel signature in `X-XCVM-Panel-Sig`
          (src/Domain/Cluster/EnrolCodeService.php:221-227).
        - Otherwise: `xcvm-enrol-status` with the stored state (`pending_approval`, `rejected`, ...).
      parameters:
        - $ref: '#/components/parameters/Cluster_Proto'
        - $ref: '#/components/parameters/Cluster_Agent'
        - $ref: '#/components/parameters/Cluster_Node'
        - $ref: '#/components/parameters/Cluster_Epoch'
        - $ref: '#/components/parameters/Cluster_Ts'
        - $ref: '#/components/parameters/Cluster_Nonce'
        - $ref: '#/components/parameters/Cluster_Sig'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - node_uuid
              properties:
                node_uuid:
                  type: string
      responses:
        '200':
          description: Status or approval.
          headers:
            X-XCVM-Ts:
              schema:
                type: string
              description: Reply timestamp (ms).
            X-XCVM-Nonce:
              schema:
                type: string
              description: 32 hex.
            X-XCVM-Sig:
              schema:
                type: string
              description: Hex HMAC-SHA256 under K_mac_down.
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Cluster_EnrolStatus'
                  - type: object
                    properties:
                      v:
                        type: integer
                        const: 1
                      typ:
                        type: string
                        const: xcvm-enrol-approved
                      node_uuid:
                        type: string
                      server_id:
                        type: integer
                      gen:
                        type: integer
                      epoch:
                        type: integer
                        const: 1
                      token_sealed:
                        type: string
                      exp:
                        type: integer
                      refresh_at:
                        type: integer
                      cluster:
                        type: object
                        description: cluster.json contents.
                      lease:
                        $ref: '#/components/schemas/Cluster_Lease'
        '400':
          $ref: '#/components/responses/Cluster_Denied'
        '401':
          $ref: '#/components/responses/Cluster_Denied'
