openapi: 3.1.0
info:
  title: XC_VM Activation API
  version: 2.7.2
  summary: Active Codes, Activation Portal of the Xtream Codes compatible HTTP surface, as implemented by XC_VM.
  description: |
    A source-level reference for the **Xtream Codes (XC) API**: the de facto standard HTTP interface
    between IPTV panels and player apps. The reference implementation is
    [XC_VM](https://github.com/Vateron-Media/XC_VM) 2.7.2, an open-source continuation of Xtream UI / XC.
    Each operation cites the XC_VM source file and line it was traced from (`src/...:line`).

    ## Authentication models

    The panel has several independent auth schemes. Each endpoint states which one it uses.

    | Who | How |
    |---|---|
    | Line (subscriber) | `username` + `password` query parameters, or `token` (32-char line access token). Also in path form: `/player_api/{u}/{p}`, `/live/{u}/{p}/...` |
    | Activation code | The code typed as `username` (or `token`) is activated on first use and becomes a line |
    | MAG / Stalker box | MAC address cookie + bearer token from `handshake` (`/c/portal.php`, `/stalker_portal/...`) |
    | Enigma2 box | MAC/device registration (`enigma2.php`) |
    | Admin / reseller REST | `api_key` query parameter (named `xct_` token or legacy per-user key) on `/{access_code}/?action=...`; the access code's IP whitelist is enforced by nginx |
    | Load-balancer nodes | Shared cluster secret (`/cluster/v1`); signed `node.rpc` (legacy `api.php` on nodes older than 2.7.0) |

    ## Notation

    OpenAPI cannot express query-string multiplexing, so action-based endpoints are written as separate
    literal paths such as `/player_api.php?action=get_live_streams`. The request is still a single
    `GET /player_api.php` with `action` as an ordinary query parameter.

    The admin and reseller REST APIs share one URL shape, `/{access_code}/?action=...`. Each access code has a type
    (3 = Admin API, 4 = Reseller API) and nginx routes it to that API, so `/{access_code}/...` and `/{reseller_access_code}/...` are the
    same URL and differ only in which kind of code is used.
  contact:
    name: XC_VM project
    url: https://github.com/Vateron-Media/XC_VM
  license:
    name: AGPL-3.0 (XC_VM source); this document describes its public interface
    identifier: AGPL-3.0-only
servers:
  - url: '{protocol}://{host}:{port}'
    description: Any XC compatible panel or load-balancer node
    variables:
      protocol:
        default: http
        enum:
          - http
          - https
      host:
        default: tv.example.com
      port:
        default: '80'
        description: HTTP broadcast port (often 80, 8080, 8000, 25461); HTTPS often 443 or 25463.
externalDocs:
  description: XC_VM source
  url: https://github.com/Vateron-Media/XC_VM
components:
  parameters:
    ActiveCode_Code:
      name: code
      in: query
      required: true
      description: |
        Activation code (aliases `activation_code`, `pin`, `c`; may also be in the form or JSON body).
        Case-insensitive.
      schema:
        type: string
        example: K7M2Q9XRTP
    ActiveCode_ApiKey:
      name: api_key
      in: query
      required: false
      description: |
        Admin or reseller API key. May instead be sent in the form/JSON body, as `Authorization: Bearer <key>`,
        or as `X-Api-Key: <key>` (checked in that order). Required for every management action.
      schema:
        type: string
    ActiveCode_Id:
      name: id
      in: query
      required: true
      description: Activation code row id.
      schema:
        type: integer
    ActiveCode_Start:
      name: start
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    ActiveCode_Limit:
      name: limit
      in: query
      required: false
      description: Clamped to 1-500.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    ActiveCode_ShowColumns:
      name: show_columns
      in: query
      required: false
      description: CSV of row keys to keep.
      schema:
        type: string
    ActiveCode_HideColumns:
      name: hide_columns
      in: query
      required: false
      description: CSV of row keys to drop (ignored when show_columns is set).
      schema:
        type: string
  responses:
    E2_FloodBlocked403:
      description: |
        The client IP is blocked (a `block_<ip>` file exists in FLOOD_TMP_PATH): FloodProtectionStage
        answers 403 with an empty body before any controller runs
        (src/Infrastructure/Bootstrap/WebApiBootstrap.php:50-66). IPs are blocked by
        `BruteforceGuard::checkFlood` (`flood_limit` requests in `flood_seconds`) or `checkBruteforce`
        (too many distinct failed usernames/passwords, MACs or codes within `bruteforce_frequency`)
        (src/Core/Auth/BruteforceGuard.php:149, :277). Allowed IPs and `flood_ips_exclude` are never blocked.
    ActiveCode_InvalidKey401:
      description: API key matched neither an admin nor a reseller (src/Public/Controllers/Api/ActiveCodeApiController.php:97-103).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActiveCode_ApiFailure'
          example:
            status: STATUS_FAILURE
            error: Invalid or expired API key.
    ActiveCode_ResellerMaintenance503:
      description: Reseller key during maintenance mode (src/Public/Controllers/Api/ActiveCodeApiController.php:348-353). Admin keys are not affected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActiveCode_ApiFailure'
          example:
            status: STATUS_FAILURE
            error: The service is under maintenance. Please try again later.
