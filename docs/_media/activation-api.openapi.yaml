  /portal:
    get:
      operationId: Portal_page
      tags:
        - Activation Portal
      summary: Activation portal page (optionally activating `?code=`)
      description: |
        src/Public/Controllers/Player/PortalController.php:17-88, routed by nginx `location ^~ /portal`
        (src/bin/nginx/conf/nginx.conf:423-444, XC_SCOPE=portal, limit_req burst=15) through
        `WebApiBootstrap::init('portal')` (src/Public/index.php:221-226). Any `/portal/...` subpath behaves the
        same, except `/portal/assets/` which serves static files. No authentication.

        Without `code`: renders the HTML page (src/Public/Views/portal/index.php) — a form with `code` and
        `mac` fields whose JavaScript POSTs to the same URL (see the POST operation). `?code=` pre-fills it.
        `action=activate` without a code renders the page with the "Please enter an activation code." error.

        **With `code` the GET activates the code** (same side effects as ActiveCode_activate: claims stock,
        starts the subscription, binds MAC/device) and renders the result page; with
        `X-Requested-With: XMLHttpRequest` it returns the JSON described in the POST operation instead.
        Failed codes are counted by `checkBruteforce(null, null, CODE)` → IP block (403) after
        `bruteforce_username_attempts` distinct failures. No flood counter runs (no shutdown hook).

        Device identity: `mac` param, else headers `X-MAC-Address`, `X-STB-MAC`, `MAC`; `device_id` param,
        else `X-Device-ID`, `Device-ID`. Client IP is taken from `CF-Connecting-IP`, then the first
        `X-Forwarded-For` entry, then REMOTE_ADDR (client-supplied, stored as the device IP only).
      parameters:
        - name: code
          in: query
          required: false
          description: Activation code; when present it is activated immediately.
          schema:
            type: string
        - name: mac
          in: query
          required: false
          schema:
            type: string
        - name: device_id
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum:
              - activate
        - name: X-Requested-With
          in: header
          required: false
          description: '`XMLHttpRequest` switches the response to JSON (only when a code is given or action=activate).'
          schema:
            type: string
            enum:
              - XMLHttpRequest
      responses:
        '200':
          description: HTML portal page (or JSON for AJAX, see POST).
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Portal_ActivationSuccess'
                  - $ref: '#/components/schemas/Portal_ActivationError'
        '403':
          $ref: '#/components/responses/E2_FloodBlocked403'
        '404':
          description: Host verification failure (`INVALID_HOST`), nginx-style 404 page (see E2_Error404).
    post:
      operationId: Portal_activate
      tags:
        - Activation Portal
      summary: Activate a code from the portal form (AJAX JSON or HTML)
      description: |
        src/Public/Controllers/Player/PortalController.php:58-84. The bundled page sends
        `application/x-www-form-urlencoded` `action=activate&code=...&mac=...` with
        `X-Requested-With: XMLHttpRequest` to the current path. Parameters may be in the query or the body
        (POST overrides GET). Activation as `ActiveCodeService::activateCode`
        (src/Domain/Line/ActiveCodeService.php:381-624); the raw `line` and `code_details` rows are removed
        from the result (:68).

        AJAX JSON (`Content-Type: application/json; charset=utf-8`, not pretty-printed, slashes escaped as
        `\/`): on success the service result (`status: SUCCESS`, `exp_date` int, `max_connections` int,
        `credentials.port` int, `playlists.m3u_hls` with `output=hls`); on failure `{status: <ERROR_CODE>,
        message}` where status is INVALID_CODE / DISABLED / LINE_NOT_FOUND / DEVICE_MISMATCH, or EXPIRED with
        extra `exp_date` (raw DB value, string or int) and `code`. Empty code →
        `{"status":"ERROR","message":"Please enter an activation code."}`. All are HTTP 200.
        Without the AJAX header the HTML page is rendered with the result. Brute-force counting as for GET.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                    - activate
                code:
                  type: string
                mac:
                  type: string
                device_id:
                  type: string
            example:
              action: activate
              code: K7M2Q9XRTP
              mac: 00:1A:79:4B:C2:9E
      parameters:
        - name: X-Requested-With
          in: header
          required: false
          schema:
            type: string
            enum:
              - XMLHttpRequest
        - name: X-MAC-Address
          in: header
          required: false
          description: MAC fallback when no `mac` parameter (also `X-STB-MAC`, `MAC`).
          schema:
            type: string
        - name: X-Device-ID
          in: header
          required: false
          description: Device id fallback when no `device_id` parameter (also `Device-ID`).
          schema:
            type: string
      responses:
        '200':
          description: JSON (AJAX) or HTML page.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Portal_ActivationSuccess'
                  - $ref: '#/components/schemas/Portal_ActivationError'
              examples:
                success:
                  $ref: '#/components/examples/Portal_Success'
                invalid:
                  value:
                    status: INVALID_CODE
                    message: Invalid or unknown activation code.
                expired:
                  value:
                    status: EXPIRED
                    message: Subscription has expired.
                    exp_date: '1790965325'
                    code: K7M2Q9XRTP
                empty_code:
                  value:
                    status: ERROR
                    message: Please enter an activation code.
            text/html:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/E2_FloodBlocked403'
