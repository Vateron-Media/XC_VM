        - Active Codes
      summary: Bulk action on several activation codes
      description: |
        Management mode; alias `mass`. `sub_action` (or `action_type`) selects the operation, `ids` is an
        array or a CSV string; all other fields are passed as extras (src/Public/Controllers/Api/ActiveCodeApiController.php:314-319,
        :411-416; `ActiveCodeService::massAction` src/Domain/Line/ActiveCodeService.php:727).
        Sub-actions (the `mass_` prefixed forms are accepted too): `enable`, `disable`, `reset_device`,
        `delete` (`refund_credits`/`refund`: resellers are refunded only for unused stock codes),
        admin only: `extend` (`days`, default 30), `change_package` (`package_id`).
        Messages: `N codes successfully enabled.`, `N codes suspended.`,
        `Extended expiration of selected active codes by N days.`, `Hardware/Device lock reset on selected codes.`,
        `Updated package on selected codes.`, `N code(s) deleted successfully. Refunded X credits for unused stock.`
        Errors: `No active code IDs provided.`, `No accessible codes found for mass action.`, `Unknown action.`,
        `Only an administrator can extend activation codes or change their package.`
        Reseller responses add `remaining_credits`.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
