            port:
              type: integer
            host:
              type: string
            username:
              type: string
            password:
              type: string
        playlists:
          type: object
          properties:
            m3u_hls:
              type: string
            m3u_ts:
              type: string
        device:
          type: object
          properties:
            mac:
              type: string
            device_id:
              type: string
    Portal_ActivationError:
      type: object
      properties:
        status:
          type: string
          enum:
            - ERROR
            - INVALID_CODE
            - DISABLED
            - LINE_NOT_FOUND
            - EXPIRED
            - DEVICE_MISMATCH
        message:
          type: string
        exp_date:
          type:
            - string
            - integer
          description: EXPIRED only.
        code:
          type: string
          description: EXPIRED only.
tags:
  - name: Active Codes
    description: |
      Activation-code ("voucher"/PIN) API. Without an API key it is the subscriber/device activation endpoint;
      with an admin or reseller API key it is a management API for codes and batches.
      Served by src/Public/Controllers/Api/ActiveCodeApiController.php (domain logic in
      src/Domain/Line/ActiveCodeService.php). Reachable as /active_code, /active_code.php, /api/active_code and
      /api/v1/active-code/auth (src/bin/nginx/conf/nginx.conf:141-145, 374-409).
      NOTE: docs/ACTIVE_CODES_AND_CATEGORY_TEMPLATES_GUIDE.md:144-180 describes `POST /api?action=active_code`
      returning `{result, status:"active", username, password, exp_date, server_url, portal_url}` and a portal at
      `/activate`; neither matches the code. The shapes documented here are the ones the code emits.
  - name: Activation Portal
    description: |
      Public subscriber self-activation web page at /portal (src/Public/Controllers/Player/PortalController.php,
      view src/Public/Views/portal/index.php). Answers HTML, or JSON to AJAX requests.
      Not to be confused with /portal.php, the Ministra/Stalker legacy redirect (nginx.conf:520-526).
paths:
  /active_code.php:
    post:
      operationId: ActiveCode_activate
      tags:
        - Active Codes
      summary: Activate / authenticate a device with an activation code
      description: |
        Client mode ("Mode B") of src/Public/Controllers/Api/ActiveCodeApiController.php:109-241, used when no
        API key is supplied (api_key param, `Authorization: Bearer`, or `X-Api-Key`; see management ops).
        Aliases: `/active_code`, `/api/active_code`, `/api/v1/active-code/auth` (nginx.conf:141-145, 374-409).
        GET works the same as POST. `action` defaults to `auth`; any value other than `check` activates.

        **Input** (:48-54): `array_merge($_GET, $_POST, <JSON body>)`, so JSON body overrides form overrides
        query. Code from `code` | `activation_code` | `pin` | `c`; MAC from `mac` | `mac_address`; device id from
        `device_id` | `device`. Codes are uppercased/trimmed by the service.

        **Headers on every response** (:32-35): `Content-Type: application/json; charset=utf-8`,
        `Access-Control-Allow-Origin: *`, `Access-Control-Allow-Methods: GET, POST, PUT, DELETE, OPTIONS`,
        `Access-Control-Allow-Headers: Content-Type, Authorization, X-Requested-With, X-Api-Key`.
        Bodies are pretty-printed with unescaped slashes.

        **Activation** (`ActiveCodeService::activateCode`, src/Domain/Line/ActiveCodeService.php:381-624):
        the first use atomically claims a stock code (status 1 → 2, `activated_at`), sets the line's expiry to
        now + package duration (trial or official) and enables the line (`is_new_activation: true`). Later uses
        re-authenticate: EXPIRED once the line's expiry passed; DEVICE_MISMATCH when the code is bound to a
        different MAC (case-insensitive) or real device_id (synthetic `DEV-` fingerprints never lock).
        The first MAC/device_id seen is bound to the code.

        **Failures** return HTTP **200** with `status: "ERROR"` and `error_code` one of INVALID_CODE,
        DISABLED, LINE_NOT_FOUND, EXPIRED, DEVICE_MISMATCH; each failure counts the code as a distinct failed
        attempt for the IP (`checkBruteforce(null, null, code)`, against `bruteforce_username_attempts`
        within `bruteforce_frequency`) and toward the flood limit, after which the IP is blocked (403).
        Missing code → HTTP 400.

        **Success quirks:** `exp_date`, `is_trial`, `created_at`, `max_connections`, `port`, `https_port`,
        `rtmp_port` are strings; `timestamp_now` is an int; `is_new_activation` boolean. `playlists.m3u_hls`
        uses `output=m3u8` here (the portal/service use `output=hls`). The server URL is
        `<server_protocol>://<domain>[:<http_broadcast_port> unless 80/443]`, replaced by the code's `dns_base`
        verbatim when set (no scheme added here, unlike the service). `user_info.message` is the
        `message_of_day` setting.
      parameters:
        - name: action
          in: query
          required: false
          description: Anything except `check` (default `auth`) activates.
          schema:
            type: string
            default: auth
        - $ref: '#/components/parameters/ActiveCode_Code'
        - name: activation_code
          in: query
          required: false
          description: Alias of `code`.
          schema:
            type: string
        - name: pin
          in: query
          required: false
          description: Alias of `code`.
          schema:
            type: string
        - name: c
          in: query
          required: false
          description: Alias of `code`.
          schema:
            type: string
        - name: mac
          in: query
          required: false
          description: Device MAC to bind/verify (alias `mac_address`).
          schema:
            type: string
            example: 00:1A:79:4B:C2:9E
        - name: device_id
          in: query
          required: false
          description: Device id/UUID to bind/verify (alias `device`).
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveCode_ClientRequest'
            example:
              code: K7M2Q9XRTP
              mac: 00:1A:79:4B:C2:9E
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActiveCode_ClientRequest'
      responses:
        '200':
          description: Activation succeeded, or failed with an `ERROR` body (still HTTP 200).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ActiveCode_ClientSuccess'
                  - $ref: '#/components/schemas/ActiveCode_ClientError'
              examples:
                success:
                  $ref: '#/components/examples/ActiveCode_ClientSuccess'
                invalid_code:
                  value:
                    status: ERROR
                    error_code: INVALID_CODE
                    user_info:
                      auth: 0
                    message: Invalid or unknown activation code.
                disabled:
                  value:
                    status: ERROR
                    error_code: DISABLED
                    user_info:
                      auth: 0
                    message: This activation code has been suspended or revoked.
                line_not_found:
                  value:
                    status: ERROR
                    error_code: LINE_NOT_FOUND
                    user_info:
                      auth: 0
                    message: Underlying subscription line not found.
                expired:
                  value:
                    status: ERROR
                    error_code: EXPIRED
                    user_info:
                      auth: 0
                    message: Subscription has expired.
                device_mismatch:
                  value:
                    status: ERROR
                    error_code: DEVICE_MISMATCH
                    user_info:
                      auth: 0
                    message: Code is locked to another hardware device.
        '400':
          description: No code and no API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveCode_ClientError'
              example:
                status: ERROR
                user_info:
                  auth: 0
                message: Missing activation code or API key. Please provide "code" or "api_key".
        '403':
          $ref: '#/components/responses/E2_FloodBlocked403'
        '404':
          description: |
            Host verification failure (`INVALID_HOST`) at boot renders the nginx-style 404 page
            (see `E2_Error404`).
    options:
      operationId: ActiveCode_preflight
      tags:
        - Active Codes
      summary: CORS preflight
      description: |
        src/Public/Controllers/Api/ActiveCodeApiController.php:37-40. Any OPTIONS request returns 200 with an
        empty body and the CORS headers (`Access-Control-Allow-Origin: *`, methods
        `GET, POST, PUT, DELETE, OPTIONS`, headers `Content-Type, Authorization, X-Requested-With, X-Api-Key`).
        Aliases as for `ActiveCode_activate`.
      responses:
        '200':
          description: Empty body with CORS headers.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '*'
            Access-Control-Allow-Methods:
              schema:
                type: string
                example: GET, POST, PUT, DELETE, OPTIONS
            Access-Control-Allow-Headers:
              schema:
                type: string
                example: Content-Type, Authorization, X-Requested-With, X-Api-Key
  /active_code.php?action=check:
    get:
      operationId: ActiveCode_check
      tags:
        - Active Codes
      summary: Check an activation code without activating it
      description: |
        src/Public/Controllers/Api/ActiveCodeApiController.php:141-147 → `ActiveCodeService::checkCode`
        (src/Domain/Line/ActiveCodeService.php:1501-1560). Read-only. Always HTTP 200; inspect `valid`.
        Code aliases (`code`/`activation_code`/`pin`/`c`), input merging, CORS headers and the 400 for a missing
        code are as for `ActiveCode_activate`. Quirk: failed checks are NOT counted by the brute-force guard,
        but every check counts toward the per-IP flood limit (`deny` stays true).
        `code_status`: 0 disabled, 1 ready/stock, 2 active, 3 expired. `is_trial` boolean,
        `max_connections` int, `exp_date` int or null, `activated_at` a `Y-m-d H:i:s` string or null.
        Aliases `/active_code`, `/api/active_code`, `/api/v1/active-code/auth`; POST/JSON also accepted.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - check
        - $ref: '#/components/parameters/ActiveCode_Code'
      responses:
        '200':
          description: Check result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveCode_CheckResult'
              examples:
                ready:
                  value:
                    status: SUCCESS
                    valid: true
                    code: K7M2Q9XRTP
                    code_status: 1
                    status_label: Ready (Stock)
                    package_name: 1 Month Premium
                    is_trial: false
                    max_connections: 1
                    is_activated: false
                    activated_at: null
                    exp_date: null
                    exp_date_formatted: null
                    is_device_locked: false
                active:
                  value:
                    status: SUCCESS
                    valid: true
                    code: K7M2Q9XRTP
                    code_status: 2
                    status_label: Active
                    package_name: 1 Month Premium
                    is_trial: false
                    max_connections: 1
                    is_activated: true
                    activated_at: '2026-10-01 18:22:05'
                    exp_date: 1793557325
                    exp_date_formatted: '2026-10-31 18:22:05'
                    is_device_locked: true
                invalid:
                  value:
                    status: INVALID_CODE
                    valid: false
                    message: Invalid or unknown activation code.
                disabled:
                  value:
                    status: DISABLED
                    valid: false
                    code_status: 0
                    message: This activation code is suspended or revoked.
                expired:
                  value:
                    status: EXPIRED
                    valid: false
                    code_status: 3
                    exp_date: 1790965325
                    exp_date_formatted: '2026-10-01 18:22:05'
                    message: This activation code has expired.
        '400':
          description: No code supplied (same body as ActiveCode_activate 400).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveCode_ClientError'
        '403':
          $ref: '#/components/responses/E2_FloodBlocked403'
  /active_code.php?action=get_active_codes:
    get:
      operationId: ActiveCode_listCodes
      tags:
        - Active Codes
      summary: List activation codes (admin/reseller API key)
      description: |
        Management mode ("Mode A", src/Public/Controllers/Api/ActiveCodeApiController.php:77-104).
        **Auth:** an API key via `api_key` (query/form/JSON), else `Authorization: Bearer <key>`, else
        `X-Api-Key` (:57-65). The key is tried as an admin key (`AdminAPIWrapper::createSession`), then as a
        reseller key (`ResellerAPIWrapper::createSession`); keys are `api_tokens` tokens (may be IP-restricted
        and scoped) or legacy `users.api_key` while `api_legacy_keys` is on
        (src/Core/Auth/ApiTokens.php:75). Unknown key → 401 and the request counts toward the flood limit.
        Admin permission: `AdminApiController::permitted('get_active_codes')`, else `STATUS_NO_PERMISSIONS`.
        Reseller: token scope via `ApiTokens::allows()`; panel maintenance → 503 (resellers only).
        Reseller results are limited to codes created by the reseller and its sub-resellers.

        Short aliases for `action`: `list`, `get_codes` (:246-251). Handler: admin :262-266 →
        src/Public/Controllers/Api/AdminAPIWrapper.php:1954; reseller :359-363; service
        `ActiveCodeService::listCodes` (src/Domain/Line/ActiveCodeService.php:1193).
        `show_columns`/`hide_columns` (CSV) filter row keys. Rows are typed ints/floats as shown; `mac`,
        `device_id`, `exp_date`, `activated_at` may be null; `batch_name` is `None` when empty.
        Aliases for the path: `/active_code`, `/api/active_code`, `/api/v1/active-code/auth`. GET or POST.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - get_active_codes
        - $ref: '#/components/parameters/ActiveCode_ApiKey'
        - $ref: '#/components/parameters/ActiveCode_Start'
        - $ref: '#/components/parameters/ActiveCode_Limit'
        - $ref: '#/components/parameters/ActiveCode_ShowColumns'
        - $ref: '#/components/parameters/ActiveCode_HideColumns'
        - name: batch_name
          in: query
          required: false
          description: Filter by batch (alias `batch`).
          schema:
            type: string
        - name: package_id
          in: query
          required: false
          description: Filter by package (alias `package`).
          schema:
            type: integer
        - name: status
          in: query
          required: false
          description: Filter by status (0/disabled/suspended, 1/stock/ready, 2/active, 3/expired).
          schema:
            type: string
            enum:
              - '0'
              - '1'
              - '2'
              - '3'
              - disabled
              - suspended
              - stock
              - ready
              - active
              - expired
        - name: search
          in: query
          required: false
          description: Free-text search over code / batch / line username.
          schema:
            type: string
        - name: created_by
          in: query
          required: false
          description: Admin only. Filter by creator user id (alias `reseller_id`).
          schema:
            type: integer
      responses:
        '200':
          description: Code list, or a STATUS_NO_PERMISSIONS / STATUS_FAILURE body.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - STATUS_SUCCESS
                      total:
                        type: integer
                      count:
                        type: integer
                      start:
                        type: integer
                      limit:
                        type: integer
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ActiveCode_ListRow'
                  - $ref: '#/components/schemas/ActiveCode_ApiFailure'
              examples:
                list:
                  $ref: '#/components/examples/ActiveCode_List'
                no_permissions:
                  value:
                    status: STATUS_NO_PERMISSIONS
        '401':
          $ref: '#/components/responses/ActiveCode_InvalidKey401'
        '403':
          $ref: '#/components/responses/E2_FloodBlocked403'
        '503':
          $ref: '#/components/responses/ActiveCode_ResellerMaintenance503'
  /active_code.php?action=get_active_code:
    get:
      operationId: ActiveCode_getCode
      tags:
        - Active Codes
      summary: Get one activation code's details
      description: |
        Management mode; auth, permission and errors as for `ActiveCode_listCodes`. Short aliases `get`,
        `details`. The code is referenced by `id` (numeric → integer id) or `code` / non-numeric `id` (code
        text) (`ActiveCodeService::reference`, src/Domain/Line/ActiveCodeService.php:1363). Details from
        `getCodeDetails` (:1379). Admin: src/Public/Controllers/Api/ActiveCodeApiController.php:268-273,
        AdminAPIWrapper.php:1970 (`Active code not found.`); reseller: :365-370, ResellerAPIWrapper
        (`Active code not found or access denied.`).
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - get_active_code
        - $ref: '#/components/parameters/ActiveCode_ApiKey'
        - $ref: '#/components/parameters/ActiveCode_Id'
        - name: code
          in: query
          required: false
          description: Activation code text (used when `id` is absent).
          schema:
            type: string
      responses:
        '200':
          description: Details, or failure.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - STATUS_SUCCESS
                      data:
                        $ref: '#/components/schemas/ActiveCode_Details'
                  - $ref: '#/components/schemas/ActiveCode_ApiFailure'
              examples:
                found:
                  $ref: '#/components/examples/ActiveCode_Details'
                not_found:
                  value:
                    status: STATUS_FAILURE
                    error: Active code not found.
        '401':
          $ref: '#/components/responses/ActiveCode_InvalidKey401'
        '403':
          $ref: '#/components/responses/E2_FloodBlocked403'
        '503':
          $ref: '#/components/responses/ActiveCode_ResellerMaintenance503'
  /active_code.php?action=generate_active_codes:
    post:
      operationId: ActiveCode_generateCodes
      tags:
        - Active Codes
      summary: Generate a batch of activation codes
      description: |
        Management mode; auth and errors as for `ActiveCode_listCodes`. Action aliases:
        `create_active_code`, `generate`, `create` (src/Public/Controllers/Api/ActiveCodeApiController.php:275-280,
        reseller :372-377). Service `ActiveCodeService::generateCodes` (src/Domain/Line/ActiveCodeService.php:69-373).
        Creates `num_codes` (1-500) codes plus one disabled subscription line each (`enabled=0`, no expiry,
        username `ac_` + 9 random chars, 10-hex-char password); the line is enabled with its expiry on first
        activation. Default batch name `BATCH-YYYYMMDD-XXXXX` (:57). Code charset: digits, or
        `23456789ABCDEFGHJKLMNPQRSTUVWXYZ` for alphanumeric (:36).
        **Reseller:** the package must be offered to the reseller's group
        (`The selected package is not allowed for your account group.`), credits are deducted
        (`INSUFFICIENT_CREDITS`: `Insufficient balance. Required: X credits, Available: Y credits.`),
        `created_by` is forced to the reseller (or one of its sub-resellers), and the success body adds
        `total_cost` and `remaining_credits` (floats). Admin-only fields are ignored for resellers.
        Records an admin/reseller audit entry.
        Other errors: `Invalid package selected.`, `You cannot generate this many trial codes at this time.`,
        username validation messages, `Failed to generate codes: ...`.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - generate_active_codes
        - $ref: '#/components/parameters/ActiveCode_ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveCode_GenerateRequest'
            example:
              num_codes: 2
              package_id: 3
              code_length: 10
              code_format: alphanumeric
              batch_name: OCT-PROMO
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActiveCode_GenerateRequest'
      responses:
        '200':
          description: Generated codes, or failure.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - STATUS_SUCCESS
                      message:
                        type: string
                      batch_name:
                        type: string
                      qty:
                        type: integer
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ActiveCode_GeneratedCode'
                      total_cost:
                        type: number
                        description: Reseller only.
                      remaining_credits:
                        type: number
                        description: Reseller only.
                  - $ref: '#/components/schemas/ActiveCode_ApiFailure'
              examples:
                admin_success:
                  value:
                    status: STATUS_SUCCESS
                    message: Successfully generated 2 active codes.
                    batch_name: OCT-PROMO
                    qty: 2
                    data:
                      - code: K7M2Q9XRTP
                        line_id: 1532
                        username: ac_x7k2m9q4z
                        password: 8f3a1c9e2b
                        batch_name: OCT-PROMO
                      - code: 4HN8WZ2CDY
                        line_id: 1533
                        username: ac_p2r8t6w1n
                        password: c41e9b07d3
                        batch_name: OCT-PROMO
                insufficient_credits:
                  value:
                    status: STATUS_FAILURE
                    error: 'Insufficient balance. Required: 20 credits, Available: 5 credits.'
                bad_package:
                  value:
                    status: STATUS_FAILURE
                    error: Invalid package selected.
        '401':
          $ref: '#/components/responses/ActiveCode_InvalidKey401'
        '403':
          $ref: '#/components/responses/E2_FloodBlocked403'
        '503':
          $ref: '#/components/responses/ActiveCode_ResellerMaintenance503'
  /active_code.php?action=edit_active_code:
    post:
      operationId: ActiveCode_editCode
      tags:
        - Active Codes
      summary: Edit an activation code
      description: |
        Management mode; auth as for `ActiveCode_listCodes`. Aliases `edit`, `update`. `id` is integer-cast and
        removed from the data; remaining fields go to `ActiveCodeService::updateCode`
        (src/Domain/Line/ActiveCodeService.php:884). Fields: `activation_code`, `status` (0/1/2), `mac`,
        `device_id` (`None` or empty clears), `password` (line password), `batch_name`; admin only:
        `package_id`, `max_connections`, `exp_date` (unix time or date string). Reseller: package must be
        allowed for its group (`Package not permitted for your reseller group.`).
        Success: `{status: STATUS_SUCCESS, message: "Active code updated successfully.", data: <details>}`.
        Errors: `Invalid code ID.`, `Activation code not found or access denied.`, code-taken/slash errors.
        Handler :282-288 (admin), :379-385 (reseller).
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - edit_active_code
        - $ref: '#/components/parameters/ActiveCode_ApiKey'
        - $ref: '#/components/parameters/ActiveCode_Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveCode_EditRequest'
            example:
              id: 87
              mac: None
              batch_name: OCT-PROMO-B
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActiveCode_EditRequest'
      responses:
        '200':
          description: Updated, or failure.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - STATUS_SUCCESS
                      message:
                        type: string
                      data:
                        $ref: '#/components/schemas/ActiveCode_Details'
                  - $ref: '#/components/schemas/ActiveCode_ApiFailure'
              examples:
                not_found:
                  value:
                    status: STATUS_FAILURE
                    error: Activation code not found or access denied.
        '401':
          $ref: '#/components/responses/ActiveCode_InvalidKey401'
        '403':
          $ref: '#/components/responses/E2_FloodBlocked403'
        '503':
          $ref: '#/components/responses/ActiveCode_ResellerMaintenance503'
  /active_code.php?action=delete_active_code:
    post:
      operationId: ActiveCode_deleteCode
      tags:
        - Active Codes
      summary: Delete an activation code
      description: |
        Management mode; alias `delete`. `id` integer. Deletes the code (and its unused line). Admin: no refund,
        `{status: STATUS_SUCCESS, message}`. Reseller: refunds unused stock and adds `remaining_credits`
        (float). Handler src/Public/Controllers/Api/ActiveCodeApiController.php:290-294 / :387-391.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - delete_active_code
        - $ref: '#/components/parameters/ActiveCode_ApiKey'
        - $ref: '#/components/parameters/ActiveCode_Id'
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveCode_ApiMessage'
              example:
                status: STATUS_SUCCESS
                message: 1 code(s) deleted successfully.
        '401':
          $ref: '#/components/responses/ActiveCode_InvalidKey401'
        '403':
          $ref: '#/components/responses/E2_FloodBlocked403'
        '503':
