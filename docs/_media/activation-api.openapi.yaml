  schemas:
    ActiveCode_ClientRequest:
      type: object
      properties:
        action:
          type: string
          description: '`check` or anything else (activate).'
        code:
          type: string
        activation_code:
          type: string
        pin:
          type: string
        c:
          type: string
        mac:
          type: string
        mac_address:
          type: string
        device_id:
          type: string
        device:
          type: string
        api_key:
          type: string
          description: Switches to management mode.
    ActiveCode_ClientError:
      type: object
      properties:
        status:
          type: string
          enum:
            - ERROR
        error_code:
          type: string
          enum:
            - INVALID_CODE
            - DISABLED
            - LINE_NOT_FOUND
            - EXPIRED
            - DEVICE_MISMATCH
          description: Absent on the 400 missing-code response.
        user_info:
          type: object
          properties:
            auth:
              type: integer
              enum:
                - 0
        message:
          type: string
    ActiveCode_ClientSuccess:
