openapi: 3.1.0
info:
  title: XC_VM Reseller API
  version: 2.7.2
  summary: Reseller API of the Xtream Codes compatible HTTP surface, as implemented by XC_VM.
  description: |
    A source-level reference for the **Xtream Codes (XC) API**: the de facto standard HTTP interface
    between IPTV panels and player apps. The reference implementation is
    [XC_VM](https://github.com/Vateron-Media/XC_VM) 2.7.2, an open-source continuation of Xtream UI / XC.
    Each operation cites the XC_VM source file and line it was traced from (`src/...:line`).

    ## Authentication models

    The panel has several independent auth schemes. Each endpoint states which one it uses.

    | Who | How |
    |---|---|
    | Line (subscriber) | `username` + `password` query parameters, or `token` (32-char line access token). Also in path form: `/player_api/{u}/{p}`, `/live/{u}/{p}/...` |
    | Activation code | The code typed as `username` (or `token`) is activated on first use and becomes a line |
    | MAG / Stalker box | MAC address cookie + bearer token from `handshake` (`/c/portal.php`, `/stalker_portal/...`) |
    | Enigma2 box | MAC/device registration (`enigma2.php`) |
    | Admin / reseller REST | `api_key` query parameter (named `xct_` token or legacy per-user key) on `/{access_code}/?action=...`; the access code's IP whitelist is enforced by nginx |
    | Load-balancer nodes | Shared cluster secret (`/cluster/v1`); signed `node.rpc` (legacy `api.php` on nodes older than 2.7.0) |

    ## Notation

    OpenAPI cannot express query-string multiplexing, so action-based endpoints are written as separate
    literal paths such as `/player_api.php?action=get_live_streams`. The request is still a single
    `GET /player_api.php` with `action` as an ordinary query parameter.

    The admin and reseller REST APIs share one URL shape, `/{access_code}/?action=...`. Each access code has a type
    (3 = Admin API, 4 = Reseller API) and nginx routes it to that API, so `/{access_code}/...` and `/{reseller_access_code}/...` are the
    same URL and differ only in which kind of code is used.
  contact:
    name: XC_VM project
    url: https://github.com/Vateron-Media/XC_VM
  license:
    name: AGPL-3.0 (XC_VM source); this document describes its public interface
    identifier: AGPL-3.0-only
servers:
  - url: '{protocol}://{host}:{port}'
    description: Any XC compatible panel or load-balancer node
    variables:
      protocol:
        default: http
        enum:
          - http
          - https
      host:
        default: tv.example.com
      port:
        default: '80'
        description: HTTP broadcast port (often 80, 8080, 8000, 25461); HTTPS often 443 or 25463.
externalDocs:
  description: XC_VM source
  url: https://github.com/Vateron-Media/XC_VM
security:
  - Reseller_ApiKey: []
components:
  securitySchemes:
    Reseller_ApiKey:
      type: apiKey
      in: query
      name: api_key
      description: A named API token (`xct_...`, stored as a SHA-256 hash in `api_tokens`) or, while the `api_legacy_keys` setting is not '0', the user's legacy `users.api_key`. The key's user must have `status=1` and be in a group with `is_reseller=1`. Tokens may also carry an IP allow-list and an expiry (src/Core/Auth/ApiTokens.php:47-93). Missing or rejected keys give `{"status":"STATUS_FAILURE","error":"Invalid API key."}`.
  parameters:
    Reseller_AccessCode:
      name: reseller_access_code
      in: path
      required: true
      schema:
        type: string
        example: resapi
      description: An access code of type 4 (Reseller API) (Access Codes page). nginx routes `/<code>/...` to src/Public/index.php with XC_SCOPE=includes/api/reseller (src/Core/Auth/AuthRepository.php:119-120, src/bin/nginx/conf/codes/template). Anything after the code in the path is ignored; only the parameters matter. The code's whitelist, when set, becomes nginx `allow`/`deny all` rules.
    Reseller_Start:
      name: start
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Row offset (intval).
    Reseller_Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
      description: Page size (intval; 0 or absent = 50). Passed to the table handler as `length`. The reseller table handler caps it at 1000.
    Reseller_ShowColumns:
      name: show_columns
      in: query
      schema:
        type: string
        example: id,username,exp_date
      description: Comma-separated whitelist of row keys to keep (applied to `data`). Takes precedence over hide_columns.
    Reseller_HideColumns:
      name: hide_columns
      in: query
      schema:
        type: string
        example: password
      description: Comma-separated row keys to drop (ignored when show_columns is set).
    Reseller_SearchValue:
      name: search[value]
      in: query
      schema:
        type: string
      description: DataTables global search; LIKE %value% across the columns listed in the operation.
    Reseller_OrderColumn:
      name: order[0][column]
      in: query
      schema:
        type: integer
        default: 0
      description: DataTables sort column index (see the per-operation index map; an index mapped to none, including the default 0 on most tables, means no ORDER BY).
    Reseller_OrderDir:
      name: order[0][dir]
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
      description: Sort direction; anything but `desc` is ascending.
    Reseller_Id:
      name: id
      in: query
      required: true
      schema:
        type: integer
        example: 12
      description: Record id.
  responses:
    Reseller_Maintenance:
      description: 'Maintenance mode is on: the reseller API answers HTTP 503 before checking the key (src/Public/Controllers/Api/ResellerRestApiController.php:32-37).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Reseller_Error'
          example:
            status: STATUS_FAILURE
            error: The panel is under maintenance. Please try again later.
  examples:
    Reseller_InvalidKey:
      summary: Missing or rejected api_key
      value:
        status: STATUS_FAILURE
        error: Invalid API key.
    Reseller_NoPermissions:
      summary: Token scope refused, or the service returned no result
      value:
        status: STATUS_NO_PERMISSIONS
    Reseller_Failure:
      summary: Record not found / operation failed
      value:
        status: STATUS_FAILURE
  schemas:
    Reseller_Status:
      type: string
      description: Status name. Numeric service codes (src/Core/Config/ConstantsInitializer.php:200-252) are converted to their constant names by parseError(); an empty service result becomes STATUS_NO_PERMISSIONS.
      enum:
        - STATUS_FAILURE
        - STATUS_SUCCESS
        - STATUS_SUCCESS_MULTI
        - STATUS_CODE_LENGTH
        - STATUS_NO_SOURCES
        - STATUS_DISABLED
        - STATUS_NOT_ADMIN
        - STATUS_INVALID_EMAIL
        - STATUS_INVALID_PASSWORD
        - STATUS_INVALID_IP
        - STATUS_INVALID_PLAYLIST
        - STATUS_INVALID_NAME
        - STATUS_INVALID_CAPTCHA
        - STATUS_INVALID_CODE
        - STATUS_INVALID_DATE
        - STATUS_INVALID_FILE
        - STATUS_INVALID_GROUP
        - STATUS_INVALID_DATA
        - STATUS_INVALID_DIR
        - STATUS_INVALID_MAC
        - STATUS_EXISTS_CODE
        - STATUS_EXISTS_NAME
        - STATUS_EXISTS_USERNAME
        - STATUS_EXISTS_MAC
        - STATUS_EXISTS_SOURCE
        - STATUS_EXISTS_IP
        - STATUS_EXISTS_DIR
        - STATUS_SUCCESS_REPLACE
        - STATUS_FLUSH
        - STATUS_TOO_MANY_RESULTS
        - STATUS_SPACE_ISSUE
        - STATUS_INVALID_USER
        - STATUS_CERTBOT
        - STATUS_CERTBOT_INVALID
        - STATUS_INVALID_INPUT
        - STATUS_NOT_RESELLER
        - STATUS_NO_TRIALS
        - STATUS_INSUFFICIENT_CREDITS
        - STATUS_INVALID_PACKAGE
        - STATUS_INVALID_TYPE
        - STATUS_INVALID_USERNAME
        - STATUS_INVALID_SUBRESELLER
        - STATUS_NO_DESCRIPTION
        - STATUS_NO_KEY
        - STATUS_EXISTS_HMAC
        - STATUS_CERTBOT_RUNNING
        - STATUS_RESERVED_CODE
        - STATUS_NO_TITLE
        - STATUS_NO_SOURCE
        - STATUS_PORT_IN_USE
        - STATUS_2FA_REQUIRED
        - STATUS_2FA_INVALID
        - STATUS_2FA_LOCKED
        - STATUS_NO_PERMISSIONS
    Reseller_Envelope:
      type: object
      required:
        - status
      description: Standard reply envelope. Always HTTP 200 (except the reseller maintenance 503).
      properties:
        status:
          $ref: '#/components/schemas/Reseller_Status'
        data:
          description: Payload; shape depends on the action. On create/edit, the full stored record. On a validation error, often the (filtered) input echoed back.
        error:
          type: string
          description: Human-readable error (only some errors carry one).
      additionalProperties: true
    Reseller_Error:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/Reseller_Status'
        error:
          type: string
    Reseller_TableResponse:
      type: object
      description: API-mode reseller table reply. Currently always `{"status":"STATUS_SUCCESS","data":[]}` (see operation descriptions).
      properties:
        status:
          type: string
          enum:
            - STATUS_SUCCESS
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        recordsTotal:
          oneOf:
            - type: integer
            - type: string
              pattern: ^[0-9]+$
          description: Total rows after filters (numeric string for raw-row handlers, integer for typed log handlers).
        recordsFiltered:
          oneOf:
            - type: integer
            - type: string
    Reseller_ActiveCodeRow:
      type: object
      description: Row of ActiveCodeService::listCodes() (src/Domain/Line/ActiveCodeService.php:1314-1341). Typed values.
      properties:
        id:
          type: integer
        activation_code:
          type: string
        batch_name:
          type: string
          description: '''None'' when empty'
        status:
          type: integer
          enum:
            - 0
            - 1
            - 2
          description: 0 disabled, 1 stock (not redeemed), 2 redeemed
        status_key:
          type: string
          enum:
            - disabled
            - stock
            - expired
            - active
        status_label:
          type: string
          enum:
            - Disabled
            - Ready (Stock)
            - Expired
            - Active
        package_id:
          type: integer
        package_name:
          type: string
        subscriber_id:
          type:
            - integer
            - 'null'
        line_username:
          type:
            - string
            - 'null'
        line_password:
          type:
            - string
            - 'null'
        exp_date:
          type:
            - integer
            - 'null'
        exp_date_formatted:
          type:
            - string
            - 'null'
        remaining_days:
          type: integer
        mac:
          type:
            - string
            - 'null'
        device_id:
          type:
            - string
            - 'null'
        max_connections:
          type: integer
        is_trial:
          type: integer
        is_adult:
          type: integer
        purchase_cost:
          type: number
        created_by:
          type: integer
        creator_username:
          type: string
        created_at:
          type: integer
        created_at_formatted:
          type: string
        activated_at:
          type:
            - integer
            - 'null'
        activated_at_formatted:
          type:
            - string
            - 'null'
    Reseller_ActiveCodeGenerate:
      type: object
      required:
        - package_id
      description: Inputs of ActiveCodeService::generateCodes() (src/Domain/Line/ActiveCodeService.php:69-371). Each code creates a disabled line with no expiry until the code is redeemed.
      properties:
        package_id:
          type: integer
          description: Package id (required; error 'Invalid package selected.'). Must be an is_line package that lists your group; official unless is_trial.
        num_codes:
          type: integer
          minimum: 1
          maximum: 500
          default: 1
          description: Number of codes (not `qty`).
        code_length:
          type: integer
          minimum: 6
          maximum: 24
          default: 10
        code_format:
          type: string
          enum:
            - alphanumeric
            - numeric
          default: alphanumeric
          description: Alphanumeric alphabet is 23456789ABCDEFGHJKLMNPQRSTUVWXYZ.
        is_trial:
          type: boolean
          description: Trial codes (cost = package trial_credits).
        batch_name:
          type: string
          description: Default `BATCH-YYYYMMDD-XXXXX`.
        bouquets_selected[]:
          type: array
          items:
            type: integer
          description: 'Default: the package''s bouquets. Intersected with the package bouquets, and only honoured with allow_change_bouquets.'
        dns_base:
          type: string
          description: Must be one of your comma-separated `reseller_dns` values, otherwise ignored.
        is_adult:
          type: boolean
        category_template_id:
          type: integer
        streaming_username:
          type: string
          description: Only when num_codes=1 (alias `username`); min 3 chars, [A-Za-z0-9._-]. Default `ac_` + 9 hex.
        streaming_password:
          type: string
          description: Only when num_codes=1 (alias `password`); no `/`. Default 10 hex chars.
    Reseller_ActiveCodeEdit:
      type: object
      additionalProperties: true
      description: Active code edit (ActiveCodeService::updateCode, src/Domain/Line/ActiveCodeService.php:884). package_id must be a package of your group; max_connections and exp_date are ignored for resellers.
      properties:
        activation_code:
          type: string
          description: New code string (must be unique).
        package_id:
          type: integer
        status:
          type: integer
          description: 0 disabled, 1 stock, 2 redeemed.
          enum:
            - 0
            - 1
            - 2
        mac:
          type: string
        device_id:
          type: string
        password:
          type: string
          description: Streaming password of the backing line.
        batch_name:
          type: string
    Reseller_LineInput:
      type: object
      additionalProperties: false
      description: 'Line fields for reseller create_line/edit_line (ResellerAPI::processLine, src/Domain/User/ResellerAPI.php:1035). Only the whitelisted keys below are read (ResellerAPI::processData, src/Domain/User/ResellerAPI.php:52); restriction fields (allowed_ips, allowed_ua, bypass_ua, is_isplock, isp_clear) are dropped unless your group has allow_restrictions. Credits: creating or extending charges the package price (trial_credits, or official_credits / your override) and fails with STATUS_INSUFFICIENT_CREDITS (37); trials need remaining trial allowance (STATUS_NO_TRIALS, 36).'
      properties:
        package:
          type: integer
          description: 'Package id (create: required, else STATUS_INVALID_PACKAGE 38). Must be an is_line/is_mag/is_e2 package that lists your group and is official (or trial when `trial` is sent). On edit, sending a package extends/renews (official_duration added to a non-expired compatible line).'
        trial:
          type:
            - integer
            - string
          description: Checkbox. Use the trial price/duration.
        bouquets_selected:
          type: string
          description: JSON string, e.g. `[1,2,3]`. Only honoured with allow_change_bouquets; intersected with the package bouquets.
          example: '[1,2,3]'
        bouquet_order:
          type: string
          description: Custom order (JSON).
        member_id:
          type: integer
          description: 'Owner: you or one of your sub-resellers (else STATUS_INVALID_SUBRESELLER 41).'
        pair_id:
          type: integer
        telegram:
          type: string
        reseller_notes:
          type: string
          description: Set to NULL on edit when omitted.
        allowed_ips[]:
          type: array
          items:
            type: string
        is_isplock:
          type:
            - integer
            - string
          description: Checkbox.
        isp_clear:
          type: string
        category_template_id:
          type: integer
        username:
          type: string
          description: Only honoured with allow_change_username (else random); min length per group; no `/` (STATUS_INVALID_USERNAME 40); duplicate STATUS_EXISTS_USERNAME (22).
        password:
          type: string
          description: Only with allow_change_password; min length per group; no `/` (STATUS_INVALID_PASSWORD 8). Stored plain.
        contact:
          type: string
          description: Set to NULL on edit when omitted.
        allowed_ua[]:
          type: array
          items:
            type: string
        bypass_ua:
          type:
            - integer
            - string
          description: Checkbox.
    Reseller_MagInput:
      type: object
      additionalProperties: false
      description: 'MAG device (ResellerAPI::processMAG, src/Domain/User/ResellerAPI.php:219). Only the whitelisted keys below are read (ResellerAPI::processData, src/Domain/User/ResellerAPI.php:52); restriction fields (allowed_ips, allowed_ua, bypass_ua, is_isplock, isp_clear) are dropped unless your group has allow_restrictions. Credits: creating or extending charges the package price (trial_credits, or official_credits / your override) and fails with STATUS_INSUFFICIENT_CREDITS (37); trials need remaining trial allowance (STATUS_NO_TRIALS, 36).'
      properties:
        package:
          type: integer
          description: 'Package id (create: required, else STATUS_INVALID_PACKAGE 38). Must be an is_line/is_mag/is_e2 package that lists your group and is official (or trial when `trial` is sent). On edit, sending a package extends/renews (official_duration added to a non-expired compatible line).'
        trial:
          type:
            - integer
            - string
          description: Checkbox. Use the trial price/duration.
        bouquets_selected:
          type: string
          description: JSON string, e.g. `[1,2,3]`. Only honoured with allow_change_bouquets; intersected with the package bouquets.
          example: '[1,2,3]'
        bouquet_order:
          type: string
          description: Custom order (JSON).
        member_id:
          type: integer
          description: 'Owner: you or one of your sub-resellers (else STATUS_INVALID_SUBRESELLER 41).'
        pair_id:
          type: integer
        telegram:
          type: string
        reseller_notes:
          type: string
          description: Set to NULL on edit when omitted.
        allowed_ips[]:
          type: array
          items:
            type: string
        is_isplock:
          type:
            - integer
            - string
          description: Checkbox.
        isp_clear:
          type: string
        category_template_id:
          type: integer
        mac:
          type: string
          description: '**Required.** Empty = STATUS_INVALID_INPUT (34); invalid = STATUS_INVALID_MAC (19); used by another device = STATUS_EXISTS_MAC (23).'
          example: 00:1A:79:12:34:56
        parent_password:
          type: string
        sn:
          type: string
        stb_type:
          type: string
        image_version:
          type: string
        hw_version:
          type: string
        device_id:
          type: string
        device_id2:
          type: string
        ver:
          type: string
    Reseller_EnigmaInput:
      type: object
      additionalProperties: false
      description: 'Enigma2 device (ResellerAPI::processEnigma, src/Domain/User/ResellerAPI.php:522). Only the whitelisted keys below are read (ResellerAPI::processData, src/Domain/User/ResellerAPI.php:52); restriction fields (allowed_ips, allowed_ua, bypass_ua, is_isplock, isp_clear) are dropped unless your group has allow_restrictions. Credits: creating or extending charges the package price (trial_credits, or official_credits / your override) and fails with STATUS_INSUFFICIENT_CREDITS (37); trials need remaining trial allowance (STATUS_NO_TRIALS, 36).'
      properties:
        package:
          type: integer
          description: 'Package id (create: required, else STATUS_INVALID_PACKAGE 38). Must be an is_line/is_mag/is_e2 package that lists your group and is official (or trial when `trial` is sent). On edit, sending a package extends/renews (official_duration added to a non-expired compatible line).'
        trial:
          type:
            - integer
            - string
          description: Checkbox. Use the trial price/duration.
        bouquets_selected:
          type: string
          description: JSON string, e.g. `[1,2,3]`. Only honoured with allow_change_bouquets; intersected with the package bouquets.
          example: '[1,2,3]'
        bouquet_order:
          type: string
          description: Custom order (JSON).
        member_id:
          type: integer
          description: 'Owner: you or one of your sub-resellers (else STATUS_INVALID_SUBRESELLER 41).'
        pair_id:
          type: integer
        telegram:
          type: string
        reseller_notes:
          type: string
          description: Set to NULL on edit when omitted.
        allowed_ips[]:
          type: array
          items:
            type: string
        is_isplock:
          type:
            - integer
            - string
          description: Checkbox.
        isp_clear:
          type: string
        category_template_id:
          type: integer
        mac:
          type: string
          description: '**Required.** Empty = STATUS_INVALID_INPUT (34); invalid = STATUS_INVALID_MAC (19); used by another device = STATUS_EXISTS_MAC (23).'
          example: 00:1A:79:12:34:56
        modem_mac:
          type: string
        local_ip:
          type: string
        enigma_version:
          type: string
        cpu:
          type: string
        lversion:
          type: string
        token:
          type: string
    Reseller_UserInput:
      type: object
      additionalProperties: false
      description: Sub-reseller (ResellerAPI::processUser, src/Domain/User/ResellerAPI.php:810). Requires create_sub_resellers. Creating costs the group's create_sub_resellers_price (STATUS_INSUFFICIENT_CREDITS 37).
      properties:
        username:
          type: string
          description: Duplicate = STATUS_EXISTS_USERNAME (22).
        password:
          type: string
          description: Hashed on save.
        email:
          type: string
        reseller_dns:
          type: string
        notes:
          type: string
        owner_id:
          type: integer
          description: You or one of your sub-resellers (else STATUS_INVALID_SUBRESELLER 41).
        member_group_id:
          type: integer
          description: Must be one of your group's `subresellers` and not reserved (else STATUS_INVALID_GROUP 16).
    Admin_LineRow:
      type: object
      description: '`lines` row (UserRepository::getLineById). `exp_date` is a unix timestamp string or null (never expires); `bouquet`, `allowed_outputs`, `allowed_ips`, `allowed_ua` are JSON strings. Raw DB row cleaned by get_row(): non-zero values arrive as strings (numbers included), falsy values (0, "", null) keep their type, `<`/`>` become `&lt;`/`&gt;`, text is trimmed. JSON columns are JSON-encoded strings.'
      additionalProperties: true
      properties:
        id:
          type:
            - string
            - integer
            - 'null'
        member_id:
          type:
            - string
            - integer
            - 'null'
        username:
          type:
