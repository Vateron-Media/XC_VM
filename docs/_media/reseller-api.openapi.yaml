                        batch_name: BATCH-20261017-A1B2C
                        package_name: 1 Month
                        status: Ready
                        max_connections: 1
                        portal_url: http://tv.example.com/portal
                        credentials:
                          username: ac_1f9e2d3c4
                          password: 8c1d2e3f4a
                        created_at: 1760700000
                        created_at_formatted: '2026-10-17 11:20:00'
                txt:
                  summary: format=txt
                  value:
                    status: STATUS_SUCCESS
                    format: txt
                    content: |-
                      ========================================================================
                                         ACTIVATION CODES VOUCHER BATCH                      
