        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - check_active_code
          description: Action name. May also be sent in a form-encoded POST body (POST overrides GET).
        - name: code
          in: query
          required: true
          schema:
            type: string
            example: K7M3Q9TZ2H
          description: Code (trimmed, upper-cased).
      responses:
        '200':
          description: JSON reply. Errors are also returned with HTTP 200; check `status`.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - status
                    properties:
                      status:
                        $ref: '#/components/schemas/Reseller_Status'
                      data:
                        type: object
                        additionalProperties: true
                  - $ref: '#/components/schemas/Reseller_Error'
              examples:
                success:
                  summary: Success
                  value:
                    status: STATUS_SUCCESS
                    data:
                      status: SUCCESS
                      valid: true
                      code: K7M3Q9TZ2H
                      code_status: 1
                      status_label: Ready (Stock)
                      package_name: 1 Month
                      is_trial: false
                      max_connections: 1
                      is_activated: false
                      activated_at: null
                      exp_date: null
                      exp_date_formatted: null
                      is_device_locked: false
                invalid:
                  summary: Unknown code
                  value:
                    status: STATUS_SUCCESS
                    data:
                      status: INVALID_CODE
                      valid: false
                      message: Invalid or unknown activation code.
                expired:
                  summary: Expired
                  value:
                    status: STATUS_SUCCESS
                    data:
                      status: EXPIRED
                      valid: false
                      code_status: 3
                      exp_date: 1757000000
                      exp_date_formatted: '2025-09-04 15:33:20'
                      message: This activation code has expired.
                invalid_key:
                  $ref: '#/components/examples/Reseller_InvalidKey'
                no_permissions:
                  $ref: '#/components/examples/Reseller_NoPermissions'
        '503':
          $ref: '#/components/responses/Reseller_Maintenance'
  /{reseller_access_code}/?action=get_lines:
    get:
      operationId: Reseller_get_lines
      tags:
        - Reseller API
      summary: List own and sub-reseller lines
      description: |-
        Intended to return the `lines` table scoped to rows owned by you or any of your sub-resellers (src/Public/Controllers/Reseller/ResellerTableController.php :158).

        **Known bug (source as reviewed):** in API mode ResellerTableController::index() reloads the user row from the DB (src/Public/Controllers/Reseller/ResellerTableController.php:69), which drops the `reports` key that ResellerAPIWrapper::createSession() added; the check at src/Public/Controllers/Reseller/ResellerTableController.php:96-99 then always fires, so **every reseller table action currently answers `{"status":"STATUS_SUCCESS","data":[]}`**. The parameters and row fields below describe the intended behaviour.

        Gate: group permission `create_line`; when missing the handler exits with an empty body.

        Paging: `limit` is passed as `length`; values <=0 or >1000 become 1000.

        Search (`search[value]`): lines.username, password, owner username, FROM_UNIXTIME(exp_date), max_connections, reseller_notes.

        **order[0][column]** index map: 0=(none), 1=`id`, 2=`username`, 3=`password`, 4=`owner`, 5=`status`, 6=`online`, 7=`is_trial`, 8=`is_restreamer`, 9=`active_connections`, 10=`max_connections`, 11=`exp_date`, 12=`last connection`.

        Row fields (raw DB values, numbers as strings; filtered by show_columns/hide_columns): id, member_id, last_activity, last_activity_array, username, password, exp_date, admin_enabled, is_restreamer, enabled, admin_notes, reseller_notes, max_connections, is_trial, contact, is_isplock, active_connections, owner_name, stream_display_name, stream_id, last_active.

        **Token scope:** re-checked as `get_lines`; a `lines`-scope token can read get_lines/get_mags/get_enigmas only.

        **Source:** `src/Public/Controllers/Api/ResellerRestApiController.php:68`, `src/Public/Controllers/Api/ResellerAPIWrapper.php:68`, `src/Public/Controllers/Reseller/ResellerTableController.php:57-106`, `src/Public/Controllers/Reseller/ResellerTableController.php:158`
      parameters:
        - $ref: '#/components/parameters/Reseller_AccessCode'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - get_lines
          description: Action name. May also be sent in a form-encoded POST body (POST overrides GET).
        - $ref: '#/components/parameters/Reseller_Start'
        - $ref: '#/components/parameters/Reseller_Limit'
        - $ref: '#/components/parameters/Reseller_ShowColumns'
        - $ref: '#/components/parameters/Reseller_HideColumns'
        - $ref: '#/components/parameters/Reseller_SearchValue'
        - $ref: '#/components/parameters/Reseller_OrderColumn'
        - $ref: '#/components/parameters/Reseller_OrderDir'
        - name: reseller
          in: query
          required: false
          schema:
            type: integer
          description: Only rows owned by this registered user id (`member_id` / `owner_id`).
        - name: filter
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 1
              - 2
              - 3
              - 4
              - 5
          description: 1 active, 2 disabled, 3 banned, 4 expired, 5 trial.
      responses:
        '200':
          description: JSON reply. Errors are also returned with HTTP 200; check `status`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Reseller_TableResponse'
                  - $ref: '#/components/schemas/Reseller_Error'
                  - type: string
                    const: ''
                    description: Empty body (handler permission failure).
              examples:
                success:
                  summary: Success
                  value:
                    status: STATUS_SUCCESS
                    data: []
                intended:
                  summary: Intended shape if the reports bug is fixed
                  value:
                    status: STATUS_SUCCESS
                    data:
                      - id: '12'
                        username: john01
                    recordsTotal: '1'
                    recordsFiltered: '1'
                table_permission_denied:
                  summary: 'Gate failed: empty body'
                  value: ''
                invalid_key:
                  $ref: '#/components/examples/Reseller_InvalidKey'
                no_permissions:
                  $ref: '#/components/examples/Reseller_NoPermissions'
        '503':
          $ref: '#/components/responses/Reseller_Maintenance'
