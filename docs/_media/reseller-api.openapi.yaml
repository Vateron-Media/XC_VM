tags:
  - name: Reseller API
    description: |-
      **Routing.** Create an access code of type 4 (Reseller API) on the Access Codes page. nginx (src/bin/nginx/conf/codes/template) routes every request under `/<code>/` to src/Public/index.php with XC_SCOPE=includes/api/reseller; index.php resolves the code (src/Public/index.php:117-135, src/Core/Auth/AuthRepository.php:115-135) and runs the controller. The rest of the path is ignored. Parameters may be sent as query string or form-encoded POST (merged; POST wins; src/Core/Init/LegacyInitializer.php:57-58). Every operation in this tag is `/{code}/?action=<name>`; the HTTP method shown is a suggestion, both work.

      **Authentication.** `api_key` is either a named API token (`xct_` + 40 hex, created per user in the panel; stored as a SHA-256 hash in `api_tokens` with scope full/read/lines, optional allow_sql, IP allow-list and expiry; last_used is updated) or, while setting `api_legacy_keys` is not '0', the user's legacy `users.api_key` (32 hex). The key's user must have status=1 and belong to a group with is_reseller=1 (src/Core/Auth/ApiTokens.php:47-93). Token scopes: `full` = everything the group may do; `read` = every get_* action plus user_info, packages, the log tables, check_active_code and export_active_code_batch; `lines` = user_info, packages, get_packages, get_package, get_bouquets, get_bouquet, any *active_code* action, and any action named `<verb>_line(s)|mag(s)|enigma(s)`. A scope refusal is `{"status":"STATUS_NO_PERMISSIONS"}`. Legacy keys are not scope-limited. The access code's own whitelist (if set) is enforced by nginx (allow/deny), before PHP (src/Core/Auth/AuthRepository.php:157-166).

      **Envelope.** Every reply is JSON with HTTP 200 (exceptions: a PHP TypeError gives HTTP 500 with an empty body; noted per operation; and maintenance mode, which answers HTTP 503 `{"status":"STATUS_FAILURE","error":"<maintenance message>"}` before the key is checked). `status` is a constant name; services return numeric codes that parseError() maps to names: 0 STATUS_FAILURE, 1 STATUS_SUCCESS, 2 STATUS_SUCCESS_MULTI, 3 STATUS_CODE_LENGTH, 4 STATUS_NO_SOURCES, 5 STATUS_DISABLED, 6 STATUS_NOT_ADMIN, 7 STATUS_INVALID_EMAIL, 8 STATUS_INVALID_PASSWORD, 9 STATUS_INVALID_IP, 10 STATUS_INVALID_PLAYLIST, 11 STATUS_INVALID_NAME, 12 STATUS_INVALID_CAPTCHA, 13 STATUS_INVALID_CODE, 14 STATUS_INVALID_DATE, 15 STATUS_INVALID_FILE, 16 STATUS_INVALID_GROUP, 17 STATUS_INVALID_DATA, 18 STATUS_INVALID_DIR, 19 STATUS_INVALID_MAC, 20 STATUS_EXISTS_CODE, 21 STATUS_EXISTS_NAME, 22 STATUS_EXISTS_USERNAME, 23 STATUS_EXISTS_MAC, 24 STATUS_EXISTS_SOURCE, 25 STATUS_EXISTS_IP, 26 STATUS_EXISTS_DIR, 27 STATUS_SUCCESS_REPLACE, 28 STATUS_FLUSH, 29 STATUS_TOO_MANY_RESULTS, 30 STATUS_SPACE_ISSUE, 31 STATUS_INVALID_USER, 32 STATUS_CERTBOT, 33 STATUS_CERTBOT_INVALID, 34 STATUS_INVALID_INPUT, 35 STATUS_NOT_RESELLER, 36 STATUS_NO_TRIALS, 37 STATUS_INSUFFICIENT_CREDITS, 38 STATUS_INVALID_PACKAGE, 39 STATUS_INVALID_TYPE, 40 STATUS_INVALID_USERNAME, 41 STATUS_INVALID_SUBRESELLER, 42 STATUS_NO_DESCRIPTION, 43 STATUS_NO_KEY, 44 STATUS_EXISTS_HMAC, 45 STATUS_CERTBOT_RUNNING, 46 STATUS_RESERVED_CODE, 47 STATUS_NO_TITLE, 48 STATUS_NO_SOURCE, 49 STATUS_PORT_IN_USE, 50 STATUS_2FA_REQUIRED, 51 STATUS_2FA_INVALID, 52 STATUS_2FA_LOCKED. A service returning nothing (false/empty) becomes STATUS_NO_PERMISSIONS. Missing/rejected key: `{"status":"STATUS_FAILURE","error":"Invalid API key."}`; unknown action: `{"status":"STATUS_FAILURE","error":"Invalid action."}`.

      **Paging and columns.** `start` (intval, default 0) and `limit` (intval, 0/absent = 50) apply to table and active-code lists. `show_columns` / `hide_columns` (comma-separated) filter the keys of `data` (single records) or of every row (lists). Table actions accept DataTables parameters (`search[value]`, `order[0][column]`, `order[0][dir]`) and answer `{status, data, recordsTotal, recordsFiltered}` without `draw`.

      **Values.** Records are raw DB rows: non-zero numbers arrive as strings, zeros/empty/null keep their PHP type; JSON columns are JSON-encoded strings; timestamps are unix seconds.

      **Reseller specifics** (src/Public/Controllers/Api/ResellerRestApiController.php). There is no per-action permission map: only the token scope is checked up front; group permissions (create_line, create_mag, create_enigma, create_sub_resellers, delete_users, allow_restrictions, allow_change_*) and ownership (you plus your sub-resellers, the `reports` list) are enforced inside each action. Creating and renewing charges credits. **Known bug:** every table action (get_lines, get_mags, get_enigmas, get_users, activity_logs, live_connections, user_logs) currently returns `{"status":"STATUS_SUCCESS","data":[]}`.
paths:
  /{reseller_access_code}/?action=packages:
    get:
      operationId: Reseller_packages
      tags:
        - Reseller API
      summary: Packages you can sell
      description: |-
        Packages of your member group that are official or trial, with `official_credits` replaced by your per-package override when set (credits as numbers). **Quirk:** show_columns/hide_columns are applied to the list, so they match list indices, not column names.

        **Token scope:** token scopes `full`, `read`, `lines` (src/Core/Auth/ApiTokens.php:106-128); legacy keys are not scope-limited.

        **Source:** `src/Public/Controllers/Api/ResellerRestApiController.php:62`, `src/Public/Controllers/Api/ResellerAPIWrapper.php:117`
      parameters:
        - $ref: '#/components/parameters/Reseller_AccessCode'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - packages
          description: Action name. May also be sent in a form-encoded POST body (POST overrides GET).
        - $ref: '#/components/parameters/Reseller_ShowColumns'
        - $ref: '#/components/parameters/Reseller_HideColumns'
      responses:
        '200':
          description: JSON reply. Errors are also returned with HTTP 200; check `status`.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - status
                    properties:
                      status:
                        $ref: '#/components/schemas/Reseller_Status'
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Admin_PackageRow'
                  - $ref: '#/components/schemas/Reseller_Error'
              examples:
                success:
                  summary: Success
                  value:
                    status: STATUS_SUCCESS
                    data:
                      - id: '3'
                        package_name: 1 Month
                        is_addon: 0
                        is_trial: '1'
                        is_official: '1'
                        trial_credits: 0
                        official_credits: 10
                        trial_duration: '24'
                        trial_duration_in: hours
                        official_duration: '1'
                        official_duration_in: months
                        groups: '[2]'
                        bouquets: '[1,2,5]'
                        addon_packages: '[]'
                        is_line: '1'
                        is_mag: '1'
                        is_e2: '1'
                        is_restreamer: 0
                        is_isplock: 0
                        output_formats: '[1,2]'
                        max_connections: '1'
                        force_server_id: 0
                        forced_country: ''
                        lock_device: 0
                        check_compatible: '1'
                invalid_key:
                  $ref: '#/components/examples/Reseller_InvalidKey'
                no_permissions:
                  $ref: '#/components/examples/Reseller_NoPermissions'
        '503':
          $ref: '#/components/responses/Reseller_Maintenance'
  /{reseller_access_code}/?action=user_info:
    get:
      operationId: Reseller_user_info
      tags:
        - Reseller API
      summary: Who am I
      description: |-
        Your `users` row (no `password`), with `reports` (your id plus every sub-reseller id), and your resolved reseller permissions (group flags such as create_line, create_mag, create_enigma, create_sub_resellers, delete_users, allow_restrictions, all_reports...). show_columns/hide_columns filter `data` only.

        **Token scope:** token scopes `full`, `read`, `lines` (src/Core/Auth/ApiTokens.php:106-128); legacy keys are not scope-limited.

        **Source:** `src/Public/Controllers/Api/ResellerRestApiController.php:65`, `src/Public/Controllers/Api/ResellerAPIWrapper.php:111`, `src/Public/Controllers/Api/ResellerAPIWrapper.php:89`
      parameters:
        - $ref: '#/components/parameters/Reseller_AccessCode'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - user_info
          description: Action name. May also be sent in a form-encoded POST body (POST overrides GET).
        - $ref: '#/components/parameters/Reseller_ShowColumns'
        - $ref: '#/components/parameters/Reseller_HideColumns'
      responses:
        '200':
          description: JSON reply. Errors are also returned with HTTP 200; check `status`.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - status
                    properties:
                      status:
                        $ref: '#/components/schemas/Reseller_Status'
                      data:
                        $ref: '#/components/schemas/Admin_UserRow'
                      permissions:
                        type: object
                        additionalProperties: true
                  - $ref: '#/components/schemas/Reseller_Error'
              examples:
                success:
                  summary: Success
                  value:
                    status: STATUS_SUCCESS
                    data:
                      id: '5'
                      username: reseller1
                      email: r1@example.com
                      ip: 203.0.113.10
                      date_registered: '1750000000'
                      last_login: '1760690000'
                      member_group_id: '2'
                      credits: 150
                      notes: ''
                      status: '1'
                      reseller_dns: tv.example.com
                      owner_id: '1'
                      override_packages: '[]'
                      hue: ''
                      theme: 0
                      timezone: ''
                      lang: en
                      allowed_bouquets: null
                      ui_prefs: null
                      api_key: 9f2c4e6a8b0d1f3e5a7c9b1d3f5e7a90
                      reports:
                        - 5
                        - 9
                        - 12
                    permissions:
                      group_id: '2'
                      create_line: true
                      create_mag: true
                      create_enigma: true
                      create_sub_resellers: '1'
                      delete_users: '1'
                      allow_restrictions: '1'
                      all_reports:
                        - 9
                        - 12
                invalid_key:
                  $ref: '#/components/examples/Reseller_InvalidKey'
                no_permissions:
                  $ref: '#/components/examples/Reseller_NoPermissions'
        '503':
          $ref: '#/components/responses/Reseller_Maintenance'
  /{reseller_access_code}/?action=get_line:
    get:
      operationId: Reseller_get_line
      tags:
        - Reseller API
      summary: Get a line
      description: |-
        Only lines owned by you or your sub-resellers (Authorization::check('line')); others give STATUS_FAILURE.. show_columns/hide_columns filter `data`.

        **Token scope:** token scopes `full`, `read`, `lines` (src/Core/Auth/ApiTokens.php:106-128); legacy keys are not scope-limited.

        **Source:** `src/Public/Controllers/Api/ResellerRestApiController.php:89`, `src/Public/Controllers/Api/ResellerAPIWrapper.php:140`
      parameters:
