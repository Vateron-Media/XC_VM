  /{reseller_access_code}/?action=create_line:
    post:
      operationId: Reseller_create_line
      tags:
        - Reseller API
      summary: Create a line
      description: |-
        Creates a line owned by `member_id` (default you), charging the package price. Needs group permission `create_line`. On success `data` is the stored record. Logged in users_logs.

        **Token scope:** token scopes `full`, `lines` (src/Core/Auth/ApiTokens.php:106-128); legacy keys are not scope-limited.

        **Source:** `src/Public/Controllers/Api/ResellerRestApiController.php:92`, `src/Public/Controllers/Api/ResellerAPIWrapper.php:147`, `src/Domain/User/ResellerAPI.php:1035`
      parameters:
        - $ref: '#/components/parameters/Reseller_AccessCode'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - create_line
          description: Action name. May also be sent in a form-encoded POST body (POST overrides GET).
      requestBody:
        required: true
        description: Form-encoded; the same fields are also accepted in the query string. PHP array syntax (`name[]=a&name[]=b`) is used for list fields unless a field says it is a JSON string.
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: '#/components/schemas/Reseller_LineInput'
                - type: object
                  required:
                    - package
      responses:
        '200':
          description: JSON reply. Errors are also returned with HTTP 200; check `status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reseller_Envelope'
              examples:
                success:
                  summary: Success
                  value:
                    status: STATUS_SUCCESS
                    data:
                      id: '12'
                      member_id: '1'
                      username: john01
                      password: Xk29dLp0
                      last_ip: 198.51.100.23
                      exp_date: '1798761600'
                      admin_enabled: '1'
                      enabled: '1'
