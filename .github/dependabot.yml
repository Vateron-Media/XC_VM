version: 2
updates:
  # GitHub Actions pinned in .github/workflows/*.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Composer dependencies. The manifest and lockfile are committed at src/
  # (composer.json + composer.lock). NOTE: vendor/ is committed and
  # PRODUCTION-ONLY — after merging a bump you must re-commit a production
  # vendor with `composer install --no-dev` (and `composer dump-autoload`);
  # never run `composer install` on a deploy path. See CLAUDE.md.
  # Grouped so each run opens a single PR instead of one per package.
  - package-ecosystem: "composer"
    directory: "/src"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "composer"
    groups:
      composer:
        patterns:
          - "*"

  # Playwright e2e suite (tests/e2e). Browsers are installed at run time by
  # `npx playwright install`, so a bump of @playwright/test also moves the
  # browser build. Grouped so the Playwright packages open a single PR.
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "test"
    labels:
      - "dependencies"
      - "e2e"
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright*"
