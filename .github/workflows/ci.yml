name: CI - Quality gates

# Quality gate: runs on pushes to main and on every pull request.
# Tests run via the committed PHAR (tests/phpunit.phar). Class loading uses
# the committed Composer PSR-4 autoloader (src/vendor/) first, with the legacy
# src/autoload.php scanner as an end-of-queue fallback. The deploy path ships
# vendor/ as-is and never runs `composer install`.

# `push` is scoped to main so a commit on a PR branch does NOT run the workflow
# twice (once for push, once for pull_request); PR branches are covered by the
# pull_request trigger. The concurrency group cancels superseded in-flight runs
# on rapid re-pushes / new commits to the same ref.
#
# The `changes` job routes files to the gates they can affect. The workflow
# itself always runs: branch protection requires these named checks, and a
# workflow skipped by `paths-ignore` never reports them. Jobs skipped by `if:`
# count as passed. Unknown paths and diff failures run every gate (fail-safe).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      phpstan: ${{ steps.diff.outputs.phpstan }}
      style: ${{ steps.diff.outputs.style }}
      gates: ${{ steps.diff.outputs.gates }}
      composer: ${{ steps.diff.outputs.composer }}
      phpunit: ${{ steps.diff.outputs.phpunit }}
      agent: ${{ steps.diff.outputs.agent }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check path classifier
        run: bash tools/ci/classify-ci-paths-test.sh

      # A PR is checked out as its merge commit, so HEAD^1 is the base it merges
      # into; a push to main diffs against the commit main was at before it.
      - name: List changed files
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          base=HEAD^1
          if [ "$EVENT" = push ]; then
            base=$BEFORE
            git fetch -q --depth=1 origin "$BEFORE" || base=
          fi
          if [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD) && [ -n "$files" ]; then
            printf '%s\n' "$files" | bash tools/ci/classify-ci-paths.sh | tee -a "$GITHUB_OUTPUT"
          else
            printf '%s\n' phpstan=true style=true gates=true composer=true phpunit=true agent=true | tee -a "$GITHUB_OUTPUT"
          fi

  phpstan:
    name: PHPStan (static analysis)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.phpstan != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Matches phpVersion (80300) the analysis targets.
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # The committed src/vendor/ is production-only; PHPStan is a require-dev
      # tool, so install it here (from the committed lock — reproducible).
      - name: Install dev dependencies
        run: composer install --no-interaction --working-dir=src

      # Analyses against the committed baseline — fails only on NEW issues.
      - name: Run PHPStan
        run: make phpstan

  code-style:
    name: Code Style (phpcs + Slevomat)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.style != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # phpcs + Slevomat are require-dev tools; the committed src/vendor/ is
      # production-only, so install them here (from the committed lock). The
      # phpcodesniffer-composer-installer plugin is allow-listed in composer.json.
      - name: Install dev dependencies
        run: composer install --no-interaction --working-dir=src

      # Narrow ruleset: import / namespace hygiene only (see build/phpcs.xml.dist).
      # phpcs exits non-zero on any violation.
      - name: Run phpcs
        run: make cs

  psr4-gates:
    name: PSR-4 Regression Gates
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.gates != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Full history not needed, but git ls-files requires the working tree.
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # check-procedural-use: procedural/view files must import every migrated
      #   class they use (top-of-file `use`; PHP imports are positional).
      # verify-lb-archive: the LoadBalancer archive must exclude privileged code
      #   (security blocker 1 — silent rm misses after the PascalCase rename).
      - name: Run PSR-4 gates
        run: make gates

  composer-audit:
    name: Composer Security Audit
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.composer != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # Audits the committed install set (src/vendor/composer/installed.json)
      # against the Packagist advisory database. Does NOT run `composer install`
      # (vendor/ is committed and shipped) and does NOT use --locked
      # (composer.lock is gitignored, never committed). A no-op while every
      # dependency is path-mapped/vendored without metadata, but gates real
      # installed packages the moment any are added.
      - name: Composer audit
        run: |
          count=$(php -r '$f="src/vendor/composer/installed.json";$d=is_file($f)?json_decode(file_get_contents($f),true):[];echo is_array($d["packages"]??null)?count($d["packages"]):0;')
          if [ "$count" -eq 0 ]; then
            echo "No installed Composer packages — nothing to audit."
          else
            composer audit --no-interaction --working-dir=src
          fi

  test:
    name: PHPUnit
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.phpunit != 'false' }}
    runs-on: ubuntu-latest
    # The tests run on the database engine production runs (tests/Support/TestDb.php).
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: xcvm-test
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      XCVM_TEST_DB_DSN: mysql:host=127.0.0.1;port=3306
      XCVM_TEST_DB_USER: root
      XCVM_TEST_DB_PASS: xcvm-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          extensions: pdo_mysql, redis, igbinary

      # The connection store, the cluster bus and their tests start a redis-server
      # of their own; without one they are skipped.
      - name: Install redis-server
        run: sudo apt-get update -q && sudo apt-get install -y -q redis-server

      # One run of the suite. On pushes to main it also writes the coverage
      # artifact: pcov adds ~7%, where a second full run doubled the job.
      - name: Run unit tests
        env:
          COVERAGE_ARGS: ${{ github.event_name == 'push' && '--coverage-text --coverage-clover coverage.xml' || '' }}
        run: php tests/phpunit.phar -c tests/phpunit.xml.dist $COVERAGE_ARGS

      - name: Upload coverage artifact
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  # The load-balancer agent against this panel's real PHP: every XC_VM_Fanout
  # test that takes XCVM_PANEL_DIR (enrolment, the replica and its blocklist,
  # commands, events, the data plane), on this branch's code and the agent's
  # master. They are opt-in on a developer's machine, so a change here that
  # broke them (TestDb's move to MariaDB) went unseen for weeks. XC_VM_Fanout's
  # CI runs the same against this repository's main.
  agent-interop:
    name: Agent interop (XC_VM_Fanout)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.agent != 'false' }}
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: xcvm-test
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      GOWORK: 'off'
      XCVM_PANEL_DIR: ${{ github.workspace }}
      XCVM_TEST_DB_DSN: mysql:host=127.0.0.1;port=3306
      XCVM_TEST_DB_USER: root
      XCVM_TEST_DB_PASS: xcvm-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout XC_VM_Fanout (master)
        uses: actions/checkout@v7
        with:
          repository: Vateron-Media/XC_VM_Fanout
          ref: master
          path: .fanout

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .fanout/go.mod

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, igbinary

      # The cluster-bus contract tests start a redis-server of their own.
      - name: Install redis-server
        run: sudo apt-get update -q && sudo apt-get install -y -q redis-server

      - name: Run the agent's panel tests
        working-directory: .fanout
        run: go test -count=1 ./internal/agent/runtime/
