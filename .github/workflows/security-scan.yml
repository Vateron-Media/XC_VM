name: Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.php'
      - 'src/**/*.sh'
      - '.github/workflows/security-scan.yml'
  pull_request:
    paths:
      - 'src/**/*.php'
      - 'src/**/*.sh'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 6 * * 4'

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Semgrep
        # Blocking on push to main / schedule; informative-only on pull requests
        # (PR findings still surface in the Security tab via the SARIF upload).
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          semgrep scan \
            --config "p/php" \
            --config "p/security-audit" \
            --config "p/command-injection" \
            --config "p/sql-injection" \
            --config "p/xss" \
            --sarif \
            --output semgrep-results.sarif \
            --error \
            --severity ERROR \
            src/

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
