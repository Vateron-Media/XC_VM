user xc_vm;
worker_processes  auto;
worker_rlimit_nofile 300000;

events {
    worker_connections  16000;
    use epoll;
    accept_mutex on;
    multi_accept on;
}

thread_pool pool_xc_vm threads=32 max_queue=0;

http {
    include mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    reset_timedout_connection on;
    include gzip.conf;
    fastcgi_read_timeout 200;
    access_log off;
    error_log /dev/null;
    keepalive_timeout 10;
    include balance.conf;
    send_timeout 20m;    
    sendfile_max_chunk 512k;
    lingering_close off;
    aio threads=pool_xc_vm;
    client_body_timeout 13s;
    client_header_timeout 13s;
    client_max_body_size 8m;
    proxy_buffer_size 16k;
    proxy_busy_buffers_size 24k;
    proxy_buffers 64 4k;
    proxy_max_temp_file_size 0;
    real_ip_header X-Forwarded-For;
    include realip_cdn.conf;
    include realip_cloudflare.conf;
    include realip_xc_vm.conf;
    include limit.conf;
    limit_req_zone $binary_remote_addr zone=one:30m rate=20r/s;
    server {
        include ports/*.conf;
        include codes/*.conf;
        include ssl.conf;
        include custom.conf;
        index index.php index.html index.htm;
        try_files $uri $uri.html $uri/ @extensionless-php;
        root /home/xc_vm/www/;
        server_tokens off;
        chunked_transfer_encoding off;
        resolver 1.1.1.1 1.0.0.1 valid=300s;
        resolver_timeout 5s;
        absolute_redirect off;

        if ($request_method !~ ^(GET|POST)$) {
            return 200;
        }

        location ^~ /.well-known/acme-challenge/ {
            root /home/xc_vm/certbot-webroot;
            try_files $uri =404;
        }

        rewrite_log on;
        rewrite ^/play/(.*)/(.*)$ /stream/auth?token=$1&extension=$2 break;
        rewrite ^/play/(.*)$ /stream/auth?token=$1 break;
        rewrite ^/key/(.*)$ /stream/key?token=$1 break;
        rewrite ^/movie/(.*)/(.*)/(.*)$ /stream/auth?username=$1&password=$2&stream=$3&type=movie break;
        rewrite ^/movie/(.*)/(.*)$ /stream/auth?token=$1&stream=$2&type=movie break;
        rewrite ^/series/(.*)/(.*)/(.*)$ /stream/auth?username=$1&password=$2&stream=$3&type=series break;
        rewrite ^/series/(.*)/(.*)$ /stream/auth?token=$1&stream=$2&type=series break;
        rewrite ^/subtitle/(.*)/(.*)/(.*)/(.*)$ /stream/auth?username=$1&password=$2&stream=$4&sid=$3&type=subtitle break;
        rewrite ^/subtitle/(.*)/(.*)/(.*)$ /stream/auth?username=$1&password=$2&stream=$3&type=subtitle break;
        rewrite ^/hls/(.*)$ /stream/segment?token=$1 break;
        rewrite ^/tsauth/(.*)$ /stream/timeshift?token=$1 break;
        rewrite ^/thauth/(.*)$ /stream/thumb?token=$1 break;
        rewrite ^/auth/(.*)$ /stream/live?token=$1 break;
        rewrite ^/vauth/(.*)$ /stream/vod?token=$1 break;
        rewrite ^/subauth/(.*)$ /stream/subtitle?token=$1 break;
        rewrite ^/timeshift/(.*)/(.*)/(.*)/(.*)/(.*)\.(.*)$ /stream/auth?username=$1&password=$2&stream=$5&extension=$6&duration=$3&start=$4&type=timeshift break;
        rewrite ^/timeshift/(.*)/(.*)/(.*)/(.*)\.(.*)$ /stream/auth?token=$1&stream=$4&extension=$5&duration=$2&start=$3&type=timeshift break;
        rewrite ^/thumb/(.*)/(.*)/(\d+)$ /stream/auth?username=$1&password=$2&stream=$3&type=thumb break;
        rewrite ^/thumb/(.*)/(\d+)$ /stream/auth?token=$1&stream=$2&type=thumb break;
        rewrite ^/playlist/(.*)/(.*)/(.*)$ /api/playlist?username=$1&password=$2&type=$3 last;
        rewrite ^/playlist/(.*)/(.*)$ /api/playlist?username=$1&password=$2 last;
        rewrite ^/player_api/(.*)/(.*)/(.*)$ /api/player_api?username=$1&password=$2&action=$3 last;
        rewrite ^/player_api/(.*)/(.*)$ /api/player_api?username=$1&password=$2 last;
        rewrite ^/epg/(.*)/(.*)/gz$ /api/epg?username=$1&password=$2&gzip=1 last;
        rewrite ^/epg/(.*)/(.*)$ /api/epg?username=$1&password=$2 last;
        rewrite ^/live/(.*)/(.*)/(\d+)\.(.*)$ /stream/auth?username=$1&password=$2&stream=$3&extension=$4&type=live break;
        rewrite ^/live/(.*)/(.*)/(\d+)$ /stream/auth?username=$1&password=$2&stream=$3&extension=ts&type=live break;
        rewrite ^/live/(.*)/(\d+)\.(.*)$ /stream/auth?token=$1&stream=$2&extension=$3&type=live break;
        rewrite ^/live/(.*)/(\d+)$ /stream/auth?token=$1&stream=$2&extension=ts&type=live break;
        rewrite ^/probe/(.*)$ /stream/probe?data=$1 break;
        rewrite ^/(.*)/(.*)/(\d+)\.(.*)$ /stream/auth?username=$1&password=$2&stream=$3&extension=$4&type=live break;
        rewrite ^/(.*)/(.*)/(\d+)$ /stream/auth?username=$1&password=$2&stream=$3&extension=ts&type=live break;

        location = /xmltv.php {
            rewrite ^ /api/epg last;
        }
        
        location = /get.php {
            rewrite ^ /api/playlist last;
        }
        
        location = /panel_api.php {
            rewrite ^ /api/player_api last;
        }
        
        location = /streaming/live.php {
            return 302 /stream/auth?type=live&$args;
        }
        
        location = /streaming/rtmp.php {
            return 302 /stream/rtmp?$args;
        }
        
        location = /streaming/timeshift.php {
            return 302 /stream/auth?type=timeshift&$args;
        }
        
        location = /streaming/vod.php {
            return 302 /stream/auth?type=movie&$args;
        }

        location = /server/load.php {
            return 302 /c/portal.php?$args;
        }

        # ─── Legacy Stream PHP Compatibility (no direct www execution) ──
        location ~ ^/stream/(auth|key|segment|live|vod|timeshift|thumb|subtitle|rtmp)\.php$ {
            return 302 /stream/$1?$args;
        }

        location = /probe.php {
            return 302 /stream/probe?$args;
        }

        # ─── Streaming Hot Path → Stream Gateway ─────────────────
        location ~ ^/stream/(auth|key|segment|live|vod|timeshift|thumb|subtitle|rtmp|probe)$ {
            limit_req zone=one burst=8;
            include limit_queue.conf;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/public/stream/index.php;
            fastcgi_param SCRIPT_NAME /public/stream/index.php;
            fastcgi_param XC_STREAM $1;
        }

        location ^~ /images/index.html {
            return 404;
        }
        
        location ^~ /images/admin/index.html {
            return 404;
        }
        
        location ^~ /images/enigma2/index.html {
            return 404;
        }

        location ^~ /images/ {
            # Stop executing
        }
        
        location ~ ^/status$ {
            allow 127.0.0.1;
            deny all;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 96 32k;
            fastcgi_buffer_size 32k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/public/stream/index.php;
            fastcgi_param SCRIPT_NAME /public/stream/index.php;
            fastcgi_param XC_STREAM status;
        }
        
        location /nginx_status {
            allow 127.0.0.1;
            deny all;
            stub_status on;
        }

        # ─── Legacy Admin Stream Endpoints (compat) ───────────────
        location ~ ^/admin/(api|index|live|proxy_api|thumb|timeshift|vod)$ {
            limit_req zone=one burst=8;
            include limit_queue.conf;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_busy_buffers_size 128k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/public/admin/index.php;
            fastcgi_param SCRIPT_NAME /public/admin/index.php;
            fastcgi_param XC_ADMIN $1;
        }

        location ~ ^/admin/(api|index|live|proxy_api|thumb|timeshift|vod)\.php$ {
            return 302 /admin/$1?$args;
        }

        location = /progress {
            limit_req zone=one burst=8;
            include limit_queue.conf;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_busy_buffers_size 128k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/public/progress/index.php;
            fastcgi_param SCRIPT_NAME /public/progress/index.php;
        }

        location = /progress.php {
            return 302 /progress?$args;
        }

        # ─── Streaming API → Front Controller ───────────────────────
        location ~ ^/api/(player_api|enigma2|xplugin|epg|playlist)$ {
            limit_req zone=one burst=8;
            include limit_queue.conf;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/public/index.php;
            fastcgi_param SCRIPT_NAME /public/index.php;
            fastcgi_param XC_SCOPE api;
            fastcgi_param XC_API $1;
        }

        # ─── Streaming API → Front Controller (legacy *.php) ──────
        location ~ ^/(player_api|enigma2|xplugin|epg|playlist)\.php$ {
            limit_req zone=one burst=8;
            include limit_queue.conf;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/public/index.php;
            fastcgi_param SCRIPT_NAME /public/index.php;
            fastcgi_param XC_SCOPE api;
            fastcgi_param XC_API $1;
        }

        # ─── Internal API → Front Controller (server-to-server) ────
        # Аутентификация: InternalApiController проверяет password + IP whitelist
        location = /api {
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/public/index.php;
            fastcgi_param SCRIPT_NAME /public/index.php;
            fastcgi_param XC_SCOPE api;
            fastcgi_param XC_API internal;
        }

        location = /api.php {
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/public/index.php;
            fastcgi_param SCRIPT_NAME /public/index.php;
            fastcgi_param XC_SCOPE api;
            fastcgi_param XC_API internal;
        }

        # ─── Ministra Legacy Portal (L-6 pending) ────────────────
        location = /c/portal.php {
            limit_req zone=one burst=8;
            include limit_queue.conf;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/ministra/portal.php;
            fastcgi_param SCRIPT_NAME /ministra/portal.php;
        }

        location = /portal.php {
            return 302 /c/portal.php?$args;
        }

        location ~ \.php$ {
            return 404;
        }
        
        location @extensionless-php {
            return 404;
        }
    }
}