user xc_vm;
worker_processes  auto;
worker_rlimit_nofile 300000;

events {
    worker_connections  16000;
    use epoll;
    multi_accept on;
}


http {
    include mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    reset_timedout_connection on;
    include gzip.conf;
    fastcgi_read_timeout 200;
    access_log off;
    error_log /dev/null;
    keepalive_timeout 10;
    include balance.conf;
    # The segment gateway in xc_fanout (gateway.conf, ADR 0005): its connections
    # kept open between requests. Unused while gateway.conf is off.
    upstream xc_gateway {
        server unix:/home/xc_vm/bin/xc_fanout/sockets/gw.sock;
        keepalive 32;
    }
    # The cluster API's own PHP-FPM pools (MAIN only; ClusterPool writes and
    # starts them). A panel pool stands in while one is down; until both
    # answer, the API replies 503 STARTING to every op but health. max_fails=0:
    # only a request that cannot reach its pool goes to the backup, and one
    # failed request never diverts the pool's traffic for fail_timeout.
    upstream cluster_ctl {
        server unix:/home/xc_vm/bin/php/sockets/cluster_ctl.sock max_fails=0;
        server unix:/home/xc_vm/bin/php/sockets/1.sock backup;
    }
    upstream cluster_ingest {
        server unix:/home/xc_vm/bin/php/sockets/cluster_ingest.sock max_fails=0;
        server unix:/home/xc_vm/bin/php/sockets/1.sock backup;
    }
    send_timeout 20m;
    sendfile_max_chunk 512k;
    lingering_close off;
    client_body_timeout 13s;
    client_header_timeout 13s;
    client_max_body_size 8m;
    proxy_buffer_size 16k;
    proxy_busy_buffers_size 24k;
    proxy_buffers 64 4k;
    proxy_max_temp_file_size 0;
    real_ip_header X-Forwarded-For;
    include realip_cdn.conf;
    include realip_cloudflare.conf;
    include realip_xc_vm.conf;
    include limit.conf;
    limit_req_zone $binary_remote_addr zone=one:30m rate=20r/s;
    # The access codes' sign-in and image resizer (codes/template).
    limit_req_zone $binary_remote_addr zone=panel:10m rate=20r/s;
    # The cluster API (MAIN only): 100 r/s per TCP peer, whatever X-Forwarded-For
    # says; cluster_locations.conf sets the burst and the 429.
    limit_req_zone $realip_remote_addr zone=cluster:10m rate=100r/s;
    # /xfile (ADR 0004, Phase 8): another server's agent reads a file in 4 MiB
    # chunks, one request each, so it gets its own zone keyed by the TCP peer
    # (the viewers' `one` would throttle a VOD pull); a refusal is a 429 the
    # agent retries after a short wait.
    limit_req_zone $realip_remote_addr zone=xfile:10m rate=50r/s;
    server {
        include ports/*.conf;
        include codes/*.conf;
        include ssl.conf;
        include custom.conf;
        include ministra_legacy.conf;
        index index.php index.html index.htm;
        try_files $uri $uri.html $uri/ @extensionless-php;
        root /home/xc_vm/Public/;
        server_tokens off;
        chunked_transfer_encoding off;
        resolver 1.1.1.1 1.0.0.1 valid=300s;
        resolver_timeout 5s;
        absolute_redirect off;

        if ($request_method !~ ^(GET|POST)$) {
            return 200;
        }

        location ^~ /.well-known/acme-challenge/ {
            root /home/xc_vm/certbot-webroot;
            try_files $uri =404;
        }

        rewrite_log on;
        rewrite ^/play/(?<token>[^/.]+)\.(?<extension>[^/.]+)$ /stream/auth?token=$token&extension=$extension break;
        rewrite ^/play/(?<token>[^/]+)/(?<extension>[^/]+)$ /stream/auth?token=$token&extension=$extension break;
        rewrite ^/play/(?<token>[^/]+)$ /stream/auth?token=$token&extension=ts break;
        rewrite ^/key/(?<token>[^/]*)$ /stream/key?token=$token break;
        rewrite ^/movie/(?<username>[^/]*)/(?<password>[^/]*)/(?<stream>[^/]*)$ /stream/auth?username=$username&password=$password&stream=$stream&type=movie break;
        rewrite ^/movie/(?<token>[^/]*)/(?<stream>[^/]*)$ /stream/auth?token=$token&stream=$stream&type=movie break;
        rewrite ^/series/(?<username>[^/]*)/(?<password>[^/]*)/(?<stream>[^/]*)$ /stream/auth?username=$username&password=$password&stream=$stream&type=series break;
        rewrite ^/series/(?<token>[^/]*)/(?<stream>[^/]*)$ /stream/auth?token=$token&stream=$stream&type=series break;
        rewrite ^/subtitle/(?<username>[^/]*)/(?<password>[^/]*)/(?<sid>[^/]*)/(?<stream>[^/]*)$ /stream/auth?username=$username&password=$password&stream=$stream&sid=$sid&type=subtitle break;
        rewrite ^/subtitle/(?<username>[^/]*)/(?<password>[^/]*)/(?<stream>[^/]*)$ /stream/auth?username=$username&password=$password&stream=$stream&type=subtitle break;
        rewrite ^/hls/(?<token>[^/]*)$ /stream/segment?token=$token break;
        rewrite ^/tsauth/(?<token>[^/]*)$ /stream/timeshift?token=$token break;
        rewrite ^/thauth/(?<token>[^/]*)$ /stream/thumb?token=$token break;
        rewrite ^/auth/(?<token>[^/]*)$ /stream/live?token=$token break;
        rewrite ^/vauth/(?<token>[^/]*)$ /stream/vod?token=$token break;
        rewrite ^/subauth/(?<token>[^/]*)$ /stream/subtitle?token=$token break;
        rewrite ^/timeshift/(?<username>[^/]*)/(?<password>[^/]*)/(?<duration>[^/]*)/(?<start>[^/]*)/(?<stream>[^/]*)\.(?<extension>[^/]*)$ /stream/auth?username=$username&password=$password&stream=$stream&extension=$extension&duration=$duration&start=$start&type=timeshift break;
        rewrite ^/timeshift/(?<token>[^/]*)/(?<duration>[^/]*)/(?<start>[^/]*)/(?<stream>[^/]*)\.(?<extension>[^/]*)$ /stream/auth?token=$token&stream=$stream&extension=$extension&duration=$duration&start=$start&type=timeshift break;
        rewrite ^/thumb/(?<username>[^/]*)/(?<password>[^/]*)/(?<stream>\d+)$ /stream/auth?username=$username&password=$password&stream=$stream&type=thumb break;
        rewrite ^/thumb/(?<token>[^/]*)/(?<stream>\d+)$ /stream/auth?token=$token&stream=$stream&type=thumb break;
        rewrite ^/playlist/(?<username>[^/]*)/(?<password>[^/]*)/(?<type>[^/]*)$ /api/playlist?username=$username&password=$password&type=$type break;
        rewrite ^/playlist/(?<username>[^/]*)/(?<password>[^/]*)$ /api/playlist?username=$username&password=$password break;
        rewrite ^/player_api/(?<username>[^/]*)/(?<password>[^/]*)/(?<action>[^/]*)$ /api/player_api?username=$username&password=$password&action=$action break;
        rewrite ^/player_api/(?<username>[^/]*)/(?<password>[^/]*)$ /api/player_api?username=$username&password=$password break;
        rewrite ^/epg/(?<username>[^/]*)/(?<password>[^/]*)/gz$ /api/epg?username=$username&password=$password&gzip=1 break;
        rewrite ^/epg/(?<username>[^/]*)/(?<password>[^/]*)$ /api/epg?username=$username&password=$password break;
        rewrite ^/live/(?<username>[^/]*)/(?<password>[^/]*)/(?<stream>\d+)\.(?<extension>[^/]*)$ /stream/auth?username=$username&password=$password&stream=$stream&extension=$extension&type=live break;
        rewrite ^/live/(?<username>[^/]*)/(?<password>[^/]*)/(?<stream>\d+)$ /stream/auth?username=$username&password=$password&stream=$stream&extension=ts&type=live break;
        rewrite ^/live/(?<token>[^/]*)/(?<stream>\d+)\.(?<extension>[^/]*)$ /stream/auth?token=$token&stream=$stream&extension=$extension&type=live break;
        rewrite ^/live/(?<token>[^/]*)/(?<stream>\d+)$ /stream/auth?token=$token&stream=$stream&extension=ts&type=live break;
        rewrite ^/probe/(?<data>[^/]*)$ /stream/probe?data=$data break;
        rewrite ^/(?<username>[^/]*)/(?<password>[^/]*)/(?<stream>\d+)\.(?<extension>[^/]*)$ /stream/auth?username=$username&password=$password&stream=$stream&extension=$extension&type=live break;
        rewrite ^/(?<username>[^/]*)/(?<password>[^/]*)/(?<stream>\d+)$ /stream/auth?username=$username&password=$password&stream=$stream&extension=ts&type=live break;

        location = /xmltv.php {
            rewrite ^ /api/epg last;
        }

        location = /get.php {
            rewrite ^ /api/playlist last;
        }

        location ~ ^/panel_api(?:\.php)?$ {
            rewrite ^ /api/player_api last;
        }

        location = /active_code.php {
            rewrite ^ /api/active_code last;
        }

        rewrite ^/api/v1/active-code/auth$ /api/active_code last;

        location = /streaming/live.php {
            return 302 /stream/auth?type=live&$args;
        }

        location = /streaming/rtmp.php {
            return 302 /stream/rtmp?$args;
        }

        location = /streaming/timeshift.php {
            return 302 /stream/auth?type=timeshift&$args;
        }

        location = /streaming/vod.php {
            return 302 /stream/auth?type=movie&$args;
        }

        location = /server/load.php {
            return 302 /c/portal.php?$args;
        }

        # ─── Legacy Stream PHP Compatibility (no direct www execution) ──
        location ~ ^/stream/(auth|key|segment|live|vod|timeshift|thumb|subtitle|rtmp)\.php$ {
            return 302 /stream/$1?$args;
        }

        location = /probe.php {
            return 302 /stream/probe?$args;
        }

        # ─── HLS X-Accel internal (P1) ───────────────────────────
        # segment.php authenticates, then hands the .ts/.enc to nginx via
        # `X-Accel-Redirect: /xc_hls/<file>`; nginx sendfile()s it from STREAMS_PATH.
        # `internal` = unreachable directly by clients, only via the internal redirect.
        # The CORS header the stream scripts send does not survive an X-Accel
        # hand-off (nginx keeps Content-Type and a few more), so each internal
        # location below adds it back: a player on another origin (the web
        # player, for a stream on a load balancer) cannot read the answer without it.
        location /xc_hls/ {
            internal;
            add_header Access-Control-Allow-Origin * always;
            alias /home/xc_vm/content/streams/;
        }

        # ─── Live fan-out X-Accel internal (P2, ADR 0002) ────────
        # live.php authenticates + registers the source with the xc_fanout
        # daemon, then hands the byte path to nginx via
        # `X-Accel-Redirect: /xc_fanout/<id>`. nginx proxies the viewer to the
        # daemon's client socket (in the app bin tree, next to the binary, like
        # the php-fpm sockets); PHP-FPM is freed immediately. `internal` =
        # reachable only via the internal redirect, never directly by clients.
        # NOTE: the target MUST stay two path segments (/xc_fanout/<id>) — the
        # server-level rewrites above run on internal redirects too, and the
        # 3-segment catch-all `^/(user)/(pass)/(stream)` would otherwise hijack a
        # `/xc_fanout/live/<id>` form into /stream/auth. Same reason P1's
        # /xc_hls/<file> target is two segments.
        location ^~ /xc_fanout/ {
            internal;
            add_header Access-Control-Allow-Origin * always;
            rewrite ^/xc_fanout/(.*)$ /live/$1 break;
            proxy_pass http://unix:/home/xc_vm/bin/xc_fanout/sockets/http.sock;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ─── Daemon in-RAM HLS segment X-Accel internal (P2/B, ADR 0003) ──
        # segment.php authenticates a daemon HLS segment token, then hands the
        # segment to nginx via `X-Accel-Redirect: /xc_fanout_hls/<id>_<seq>`,
        # which we map to the daemon's /hls/<id>/<seq>.ts. Target stays TWO path
        # segments (id_seq) for the same rewrite-hijack reason as /xc_fanout/.
        location ^~ /xc_fanout_hls/ {
            internal;
            add_header Access-Control-Allow-Origin * always;
            rewrite ^/xc_fanout_hls/(\d+)_(\d+)$ /hls/$1/$2.ts break;
            proxy_pass http://unix:/home/xc_vm/bin/xc_fanout/sockets/http.sock;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ─── Daemon file X-Accel internal (VOD and timeshift TS) ──────────
        # vod.php / timeshift.php authenticate the viewer, write a manifest
        # naming the file parts into the daemon's files dir and hand the byte
        # path over with `X-Accel-Redirect: /xc_fanout_file/<id>?c=<uuid>&m=<name>`
        # (FanoutClient::handOverFile). The daemon serves the parts with HTTP
        # ranges (the client's Range header goes through) and the panel's
        # throttle. Two path segments, for the same rewrite-hijack reason.
        location ^~ /xc_fanout_file/ {
            internal;
            add_header Access-Control-Allow-Origin * always;
            rewrite ^/xc_fanout_file/(\d+)$ /file/$1 break;
            proxy_pass http://unix:/home/xc_vm/bin/xc_fanout/sockets/http.sock;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # The segment gateway (gateway.conf, written by the root cron): empty
        # while it is off; in shadow, /stream/key and /stream/segment's own
        # location, which must come before the one below.
        include gateway.conf;

        # ─── Streaming Hot Path → Stream Gateway ─────────────────
        location ~ ^/stream/(auth|key|segment|live|vod|timeshift|thumb|subtitle|rtmp|probe)$ {
            limit_req zone=one burst=8;
            include limit_queue.conf;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/Public/stream/index.php;
            fastcgi_param SCRIPT_NAME /public/stream/index.php;
            fastcgi_param XC_STREAM $1;
            # The TCP peer before real_ip rewrites REMOTE_ADDR to the client:
            # auth checks it (not a client-set header) for proxy-only servers.
            fastcgi_param XC_PEER_ADDR $realip_remote_addr;
        }

        location ~* ^/images/(.*/)?index\.html$ {
            return 404;
        }

        location ^~ /images/ {
            alias /home/xc_vm/storage/images/;
            location ~* \.(php|php\d*|phtml|phar)$ {
                return 403;
            }
        }

        location ~ ^/status$ {
            allow 127.0.0.1;
            deny all;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 96 32k;
            fastcgi_buffer_size 32k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/Public/stream/index.php;
            fastcgi_param SCRIPT_NAME /public/stream/index.php;
            fastcgi_param XC_STREAM status;
        }

        location /nginx_status {
            allow 127.0.0.1;
            deny all;
            stub_status on;
        }

        # ─── Legacy Admin Stream Endpoints (compat) ───────────────
        location ~ ^/admin/(api|index|live|proxy_api|thumb|timeshift|vod)$ {
            limit_req zone=one burst=8;
            include limit_queue.conf;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_busy_buffers_size 128k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/Public/admin/index.php;
            fastcgi_param SCRIPT_NAME /public/admin/index.php;
            fastcgi_param XC_ADMIN $1;
        }

        location ~ ^/admin/(api|index|live|proxy_api|thumb|timeshift|vod)\.php$ {
            return 302 /admin/$1?$args;
        }

        # ─── /xfile: files read by another server's agent (ADR 0004, Phase 8) ─
        # A panel-signed file ticket and the reader's node-key proof in headers,
        # an owner-signed digest per chunk in the reply; never a password.
        location = /xfile {
            limit_req zone=xfile burst=100 nodelay;
            limit_req_status 429;
            include limit_queue.conf;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_busy_buffers_size 128k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/Public/admin/index.php;
            fastcgi_param SCRIPT_NAME /public/admin/index.php;
            fastcgi_param XC_ADMIN xfile;
        }

        location = /progress {
            limit_req zone=one burst=8;
            include limit_queue.conf;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_busy_buffers_size 128k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/Public/progress/index.php;
            fastcgi_param SCRIPT_NAME /public/progress/index.php;
        }

        location = /progress.php {
            return 302 /progress?$args;
        }

        # ─── Cluster API (MAIN only; lb_configs/nginx.conf has no such route) ──
        # The /cluster/v1/ location, rendered by ClusterNginxConfig: control ops on
        # the cluster_ctl pool, ingest ops on cluster_ingest, the transport limits.
        include cluster_locations.conf;

        # ─── Streaming API → Front Controller ───────────────────────
        location ~ ^/api/(player_api|enigma2|xplugin|epg|playlist|active_code)$ {
            limit_req zone=one burst=8;
            include limit_queue.conf;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/Public/index.php;
            fastcgi_param SCRIPT_NAME /public/index.php;
            fastcgi_param XC_SCOPE api;
            fastcgi_param XC_API $1;
        }

        # ─── Streaming API → Front Controller (.php optional) ───
        # Clients send both the XtreamCodes legacy /player_api.php?… and
        # the bare /player_api?… — the suffix is optional so neither 404s.
        location ~ ^/(player_api|enigma2|xplugin|epg|playlist|active_code)(?:\.php)?$ {
            limit_req zone=one burst=8;
            include limit_queue.conf;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/Public/index.php;
            fastcgi_param SCRIPT_NAME /public/index.php;
            fastcgi_param XC_SCOPE api;
            fastcgi_param XC_API $1;
        }

        # ─── Monitoring: /metrics (Prometheus, bearer token) and /healthz ───
        location ~ ^/(metrics|healthz)$ {
            limit_req zone=one burst=8;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/Public/index.php;
            fastcgi_param SCRIPT_NAME /public/index.php;
            fastcgi_param XC_SCOPE api;
            fastcgi_param XC_API $1;
        }

        # ─── Subscriber Activation Portal ───────────────────────────
        location ^~ /portal/assets/ {
            alias /home/xc_vm/Public/assets/portal/;
            etag on;
            add_header Cache-Control "no-cache";
        }

        location ^~ /portal {
            limit_req zone=one burst=15;
            include limit_queue.conf;
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/Public/index.php;
            fastcgi_param SCRIPT_NAME /public/index.php;
            fastcgi_param XC_SCOPE portal;
        }

        # ─── Internal API → Front Controller (server-to-server) ────
        # Аутентификация: InternalApiController проверяет password + IP whitelist
        #
        # MAIN's own /api keeps no toggle (ADR 0004, Phase 8): the per-node
        # $api_legacy switch is the load balancers' (lb_configs/nginx.conf).
        location = /api {
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/Public/index.php;
            fastcgi_param SCRIPT_NAME /public/index.php;
            fastcgi_param XC_SCOPE api;
            fastcgi_param XC_API internal;
        }

        location = /api.php {
            fastcgi_index index.php;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_buffering on;
            fastcgi_buffers 128 32k;
            fastcgi_buffer_size 32k;
            fastcgi_max_temp_file_size 0;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /home/xc_vm/Public/index.php;
            fastcgi_param SCRIPT_NAME /public/index.php;
            fastcgi_param XC_SCOPE api;
            fastcgi_param XC_API internal;
        }

        # ─── Ministra Legacy URL /c/ ─────────────────────────────
        location = /c {
            if ($ministra_legacy_redirect = 0) {
                return 404;
            }

            return 302 /c/;
        }

        location ^~ /c/ {
            if ($ministra_legacy_redirect = 0) {
                return 404;
            }

            alias /home/xc_vm/Ministra/;
            index index.html;
            try_files $uri $uri.html $uri/ /c/index.html =404;

            location ~ \.php$ {
                if ($ministra_legacy_redirect = 0) {
                    return 404;
                }

                limit_req zone=one burst=8;
                include limit_queue.conf;
                try_files $uri =404;
                fastcgi_index index.php;
                fastcgi_pass php;
                include fastcgi_params;
                fastcgi_buffering on;
                fastcgi_buffers 128 32k;
                fastcgi_buffer_size 32k;
                fastcgi_max_temp_file_size 0;
                fastcgi_keep_conn on;
                fastcgi_param SCRIPT_FILENAME $request_filename;
                fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            }
        }

        location = /portal.php {
            if ($ministra_legacy_redirect = 0) {
                return 404;
            }

            return 302 /c/portal.php?$args;
        }

        location ~ \.php$ {
            return 404;
        }

        location @extensionless-php {
            return 404;
        }
    }

    # The cluster API's own plain-HTTP port (cluster_api_port), and MAIN's old
    # cluster API ports, kept 7 days after a port change: servers for the API
    # alone, rendered by ClusterNginxConfig. A glob, so no file is no error.
    include cluster.d/*.conf;
}
