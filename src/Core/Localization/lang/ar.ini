you_should_always_read_live_tooltip = "يجب عليك دائمًا قراءة مجموعات البث المباشر كإطارات غير أصلية. ومع ذلك، إذا كنت تقوم بدفق ملفات فيديو ثابتة، فاضبط هذا على صحيح وإلا ستفشل عملية التشفير."
