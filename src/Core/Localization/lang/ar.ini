when_number_of_clients_as_tooltip = "عندما يكون عدد العملاء كنسبة مئوية من الحد الأقصى لعملاء الخادم أعلى من هذه النسبة، فسوف يظهر كتحذير في مربع حالة الخدمة."
when_the_request_limit_is_tooltip = "عند الوصول إلى حد الطلب، سيتم إسقاط الطلبات الزائدة بشكل افتراضي. يمكنك دفع هذه الطلبات إلى قائمة انتظار سيتم تلبيتها بالترتيب وليس بشكل متزامن. سيساعد هذا في تسهيل تدفق حركة المرور والتأكد من عدم انقطاع الخدمة بسبب تحديد السعر."
when_using_direct_source_hide_tooltip = "عند استخدام المصدر المباشر، قم بإخفاء عنوان URL الأصلي عن طريق وكيل الفيلم من خلال خوادمك. سيؤدي هذا إلى استهلاك النطاق الترددي ولكنه لن يتطلب حفظ الفيلم على خوادمك بشكل دائم. تأكد من ضبط الحاوية المستهدفة الصحيحة."
when_using_direct_source_hide_tooltip_title = "عند استخدام المصدر المباشر، قم بإخفاء عنوان URL الأصلي عن طريق وكيل البث المباشر من خلال خوادمك عبر UDP. يتم دعم MPEG-TS وHLS كتنسيق إدخال، ولكن يتم دعم MPEG-TS فقط كتنسيق إخراج للعملاء.<br/><br/>تجريبي! قد لا يعمل هذا مع جميع التدفقات."
when_you_request_a_stream_tooltip = "عندما تطلب دفقًا عند الطلب، اطلب من الموفر إرسال مخزن مؤقت مسبقًا حتى يبدأ الدفق بشكل أسرع. لن يعمل هذا إلا إذا كان مزود الخدمة الخاص بك يستخدم XC_VM. سيعني المخزن المؤقت المسبق أن المصدر الخاص بك قد يكون متأخرًا بمقدار 10 ثوانٍ أو نحو ذلك، ولكن سيتم تحميله بشكل أسرع بكثير.<br/><br/>يعني تشغيل - URL إلحاق ?prebuffer=1 بعنوان URL تلقائيًا، ويرسل On - Header طلب المخزن المؤقت المسبق كرأس بدلاً من ذلك. يتم قبول طلبات الرأس فقط عند الطلب من XC_VM v1.4.4+"
whether_to_use_guessit_or_tooltip = "سواء كنت تريد استخدام GuessIt أو PTN لتحليل أسماء الملفات لمجلد المراقبة وما إلى ذلك. GuessIt أفضل بكثير ولكنه يستخدم المزيد من الموارد."
whether_to_use_modern_or_tooltip = "ما إذا كنت تريد استخدام السمة الحديثة أو القديمة بشكل افتراضي للأجهزة المضافة حديثًا."
whether_to_use_progress_info_tooltip = "ما إذا كان سيتم استخدام معلومات التقدم بعد تأخير البدء لتحديد FPS الحقيقي أو التحقق من المقطع لإرجاع avg_frame_rate."
which_network_interface_to_use_for_statistics = "ما هي واجهة الشبكة التي يجب استخدامها للإحصائيات."
which_version_of_ffmpeg_to_tooltip = "أي إصدار من FFMPEG سيتم استخدامه للأفلام والقنوات التي تم إنشاؤها وعمليات البث العادية.<br/><br/>الإصدار 4.0 - الإصدار القديم من عام 2018، والذي تم شحنه مع XC_VM في الأصل.<br/>الإصداران 7.1 و8.0 - الإصدارات الحديثة مع دعم برنامج الترميز الكامل وDASH وNVENC."
write_a_custom_sysctlconf_to_tooltip = "اكتب sysctl.conf مخصصًا إلى الخادم. يمكنك كسر الخادم الخاص بك عن طريق إدخال قيم غير صحيحة هنا، وهذا للاستخدام المتقدم فقط. يتم توفير القالب الافتراضي للأغراض التصالحية والإعلامية."
xcvm_was_the_first_to_tooltip = "كان XC_VM أول من أضاف فئات متعددة، مما يعني أن معظم التطبيقات لا تدعمها. السلوك الافتراضي لواجهة برمجة التطبيقات (API) هو إظهار العنصر مرة واحدة عند طلب ALL، ومع ذلك تميل التطبيقات إلى طلب جميع التدفقات ثم تصفيتها إلى فئات بنفسها. سيؤدي هذا الخيار إلى تغيير السلوك الافتراضي لإظهار الدفق المكرر لكل فئة إضافية، وبالتالي يظهر الدفق بشكل صحيح في كل فئة. الجانب السلبي هو أنه عند البحث عن كل الفئات أو عرضها، سيظهر الدفق عدة مرات."
year = "سنة"
