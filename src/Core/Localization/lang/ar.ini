when_enabled_ffmpeg_pids_will_tooltip = "عند التمكين، سيتم فحص ffmpeg PID كل دقيقة بحثًا عن عمليات البث التي لا ينبغي أن تكون مباشرة ويتم إيقافها وفقًا لذلك. سيتم تشغيل هذا أيضًا عند بدء التدفق لضمان إزالة أي مثيلات قيد التشغيل بشكل كافٍ."
