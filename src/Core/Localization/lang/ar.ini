profile_tooltip_14 = "حدد عدد مؤشرات الترابط التي تريد استخدامها لعملية تحويل الشفرة. إدخال 0 كقيمة سيجعل FFmpeg يختار الإعدادات الأمثل."
profile_tooltip_15 = "باستخدام هذا الفلتر، يمكنك إزالة الأجزاء الحساسة من الفيديو الخاص بك. ستحدد فقط وحدات البكسل x & y حيث توجد منطقة حساسة والعرض والارتفاع اللذين سيتم إزالتهما. مثال للاستخدام: x=0:y=0:w=100:h=77:band=10"
profile_tooltip_16 = "أضف شعارك الخاص إلى الدفق. سيتم وضع الشعار في الجزء العلوي الأيسر. الرجاء التأكد من تحديد H.264 كبرنامج ترميز وإلا فلن يعمل هذا الخيار. لاحظ أن إضافة الشعار الخاص بك سوف يستهلك الكثير من طاقة وحدة المعالجة المركزية."
profile_tooltip_2 = "قم بتعيين ملف تعريف الفيديو، رئيسي، أو خط الأساس، أو عالي."
profile_tooltip_3 = "مع هذا يمكنك تغيير معدل البت للفيديو المستهدف. إنه مفيد جدًا إذا كنت تريد تشغيل الفيديو الخاص بك على اتصالات الإنترنت البطيئة."
profile_tooltip_4 = "تغيير معدل البت الصوتي."
profile_tooltip_5 = "-minrate وسيطة FFmpeg. حدد الحد الأدنى لتفاوت معدل البت هنا بالكيلوبت في الثانية. أدخل الرقم فقط."
profile_tooltip_6 = "-maxrate وسيطة FFmpeg. حدد الحد الأقصى المسموح به لمعدل البت هنا بالكيلوبت في الثانية. أدخل الرقم فقط."
profile_tooltip_7 = "-bufsize هو المخزن المؤقت للتحكم في المعدل. من المفترض بشكل أساسي أن يقوم جهاز الاستقبال/المشغل النهائي بتخزين هذا القدر من البيانات، لذا من المقبول أن يتقلب ضمن هذا القدر. حدد بالكيلو بايت في الثانية."
profile_tooltip_8 = "نطاق مقياس الكمي هو 0-51: حيث 0 هو بلا فقدان، 23 هو الافتراضي، و51 هو أسوأ ما يمكن. القيمة الأقل هي جودة أعلى والنطاق المعقول ذاتيًا هو 18-28. اعتبر أن الرقم 18 لا يمكن فقدانه بصريًا أو تقريبًا: يجب أن يبدو مشابهًا أو تقريبًا مثل المدخلات ولكنه ليس بلا فقدان من الناحية الفنية. النطاق أسي، لذا فإن زيادة قيمة CRF +6 هي تقريبًا نصف معدل البت بينما -6 هي ضعف معدل البت تقريبًا. الاستخدام العام هو اختيار أعلى قيمة CRF التي لا تزال توفر جودة مقبولة. إذا كان الناتج يبدو جيدًا، فجرب قيمة أعلى، وإذا كان يبدو سيئًا، فاختر قيمة أقل."
profile_tooltip_9 = "تغيير العرض والارتفاع للفيديو المستهدف. (مثال: 320: 240).  إذا أردنا الحفاظ على نسبة العرض إلى الارتفاع، فنحن بحاجة إلى تحديد مكون واحد فقط، إما العرض أو الارتفاع، وتعيين المكون الآخر على -1. (مثل 320:-1)"
