write_a_custom_sysctlconf_to_tooltip = "Напишите пользовательский sysctl.conf для сервера. Вы можете отключить свой сервер, введя здесь неверные значения, это только для расширенного использования. Шаблон по умолчанию предоставляется в восстановительных и информационных целях."
xcvm_was_the_first_to_tooltip = "XC_VM был первым, кто добавил несколько категорий, что означает, что большинство приложений это не поддерживают. По умолчанию API показывает элемент один раз, когда запрашиваются ВСЕ потоки, однако приложения, как правило, запрашивают все потоки, а затем сами фильтруют их по категориям. Эта опция изменит поведение по умолчанию, чтобы поток отображался дублированным для каждой дополнительной категории, поэтому поток будет корректно отображаться в каждой категории. Недостатком является то, что при поиске или отображении всей категории поток будет отображаться несколько раз."
