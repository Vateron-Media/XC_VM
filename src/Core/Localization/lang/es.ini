cluster_binding_ready = "Listo para hacer cumplir: cada nodo que contendría demuestra, y ninguno contó nada no probado hoy."
cluster_binding_not_ready = "Manténgase atento: una aplicación de nodos que se mantendría aún no se ha probado, o se ha contado algo que no se ha probado en la actualidad."
