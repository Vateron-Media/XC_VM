when_a_client_disconnects_from_tooltip = "Cuando un cliente se desconecta de una transmisión a pedido, verifique el total actual de conexiones para esa transmisión y apáguela si nadie la está viendo."
when_enabled_ffmpeg_pids_will_tooltip = "Cuando está habilitado, los PID de ffmpeg se escanearán cada minuto en busca de transmisiones que no deberían estar activas y se eliminarán en consecuencia. Esto también se ejecutará al iniciar una secuencia para garantizar que las instancias en ejecución se eliminen lo suficiente."
when_the_request_limit_is_tooltip = "Cuando se alcanza el límite de solicitudes, el exceso de solicitudes se descartará de forma predeterminada. Puede enviar estas solicitudes a una cola que se cumplirá en orden en lugar de simultáneamente. Esto ayudará a facilitar el flujo de tráfico y garantizará que el servicio no se vea interrumpido por la limitación de la velocidad."
when_using_direct_source_hide_tooltip = "Cuando utilice direct source, oculte la URL original enviando la película por proxy a través de sus servidores. Esto consumirá ancho de banda, pero no requerirá que la película se guarde en sus servidores de forma permanente. Asegúrese de configurar el contenedor de destino correcto."
when_using_direct_source_hide_tooltip_title = "Cuando utilice una fuente directa, oculte la URL original enviando la transmisión en vivo a través de sus servidores a través de UDP. MPEG-TS y HLS son compatibles como formato de entrada, sin embargo, solo MPEG-TS es compatible como formato de salida para los clientes.<br/> <br/> ¡Experimental! Es posible que esto no funcione para todas las transmisiones."
when_you_request_a_stream_tooltip = "Cuando solicite una transmisión a pedido, pídale al proveedor que envíe un búfer previo para que la transmisión comience más rápido. Esto solo funcionará si su proveedor está usando XC_VM. El búfer previo significará que su fuente podría estar unos 10 segundos atrasada, pero se cargará significativamente más rápido.<br/> <br/>En la URL significa agregar automáticamente ?prebuffer=1 a la URL, On - Header envía la solicitud de prebuffer como encabezado en su lugar. Las solicitudes de encabezado solo se aceptan cuando se solicitan desde XC_VM v1.4.4+"
whether_to_use_guessit_or_tooltip = "Si usar GuessIt o PTN para analizar los nombres de archivo de la carpeta de vigilancia, etc. Suponees mucho mejor pero usa más recursos."
whether_to_use_modern_or_tooltip = "Si usar el tema Moderno o heredado de forma predeterminada para los dispositivos recién agregados."
whether_to_use_progress_info_tooltip = "Ya sea para usar la información de progreso después del retraso de inicio para determinar los FPS reales o sondear el segmento para devolver avg_frame_rate."
which_network_interface_to_use_for_statistics = "Qué interfaz de red usar para las estadísticas."
which_version_of_ffmpeg_to_tooltip = "Qué versión de FFMPEG usar para películas, canales creados y transmisiones normales.<br/> <br/>v4 . 0-Versión heredada de 2018, incluida originalmente con XC_VM.<br/>v7. 1 y v8.0: Versiones modernas con soporte completo de códecs, DASH y NVENC."
write_a_custom_sysctlconf_to_tooltip = "Escriba un sysctl personalizado.conf al servidor. Puede romper su servidor ingresando valores incorrectos aquí, esto es solo para uso avanzado. La plantilla predeterminada se proporciona con fines restaurativos e informativos."
xcvm_was_the_first_to_tooltip = "XC_VM fue el primero en agregar varias categorías, lo que significa que la mayoría de las aplicaciones no lo admiten. El comportamiento predeterminado de la API es mostrar el elemento una vez cuando se solicita TODO, sin embargo, las aplicaciones tienden a solicitar todas las transmisiones y luego las filtran en categorías por sí mismas. Esta opción cambiará el comportamiento predeterminado para mostrar el flujo duplicado para cada categoría adicional, por lo tanto, el flujo se muestra correctamente en cada categoría. La desventaja es que al buscar o mostrar Todas las categorías, la transmisión se mostrará varias veces."
year = "Año"
