cluster_not_enrolled = "Ese servidor no tiene ningún nodo inscrito."
cluster_not_a_load_balancer = "Ese servidor no es un balanceador."
cluster_bad_main_url = "URL de MAIN no válida: indique esquema, host y puerto, p. ej. http://10.0.0.1:25461."
cluster_licence_required = "La licencia no lo permite (CLUSTER_LICENCE_REQUIRED)."
cluster_refused = "xcvm_core rechazó la operación."
cluster_unknown_action = "Acción desconocida."
cluster_telemetry_flow = "Telemetría"
cluster_flow_on = "Activada"
cluster_flow_off = "Desactivada"
cluster_telemetry_help = "Flujo de telemetría: activado, MAIN toma las estadísticas de este nodo de su agente y el watchdog, las estadísticas de cron:servers y network.py del nodo se detienen."
cluster_telemetry_on_done = "Flujo de telemetría activado: el agente del nodo informa ahora sus estadísticas."
cluster_telemetry_off_done = "Flujo de telemetría desactivado: el watchdog del nodo vuelve a informar."
cluster_fleet_silence = "La mayoría de los nodos quedaron en silencio a la vez: MAIN sospecha de su propia red o del pool de la API y mantiene el estado de cada nodo, sin marcarlos offline, hasta que pase el silencio."
cluster_ctl_queue = "Las peticiones a la pool cluster_ctl de MAIN han esperado más de 5 s por un worker: MAIN sospecha de su propia pool de la API. Mientras dure la cola no se purga ninguna conexión huérfana y los nodos oídos poco antes de que empezara no se marcan como offline: hasta 4 veces el Offline After desde su inicio y, cuando la cola se vacía, un Offline After más."
cluster_commands_flow = "Comandos"
cluster_commands_help = "Flujo de comandos: activado, MAIN envía a este nodo comandos firmados (RPC como iniciar/detener streams, sondeos y escaneos, y expulsión de espectadores) por la API del clúster, en lugar de su /api y la tabla de señales."
cluster_commands_on_done = "Flujo de comandos activado: MAIN envía ahora comandos firmados a este nodo."
cluster_commands_off_done = "Flujo de comandos desactivado: MAIN vuelve a usar la /api y las señales del nodo."
cluster_logs_flow = "Troncos"
cluster_logs_help = "Flujo de logs: cuando está activo, los logs de peticiones, streams y errores del nodo llegan a MAIN como eventos redactados a través de su agente, en lugar de insertarse en la base de datos de MAIN."
cluster_logs_on_done = "Flujo de logs activado: los logs del nodo llegan ahora a través de su agente."
cluster_logs_off_done = "Flujo de logs desactivado: el nodo vuelve a escribir sus logs en la base de datos de MAIN."
cluster_streams_flow = "Corrientes"
cluster_streams_help = "Flujo de streams: cuando está activo, el nodo informa del estado de sus streams (pids, estado, códecs, fuente) como eventos a través de su agente; MAIN los fusiona en las filas del propio nodo."
cluster_streams_on_done = "Flujo de streams activado: el estado de los streams del nodo llega ahora a través de su agente."
cluster_streams_off_done = "Flujo de streams desactivado: el nodo vuelve a escribir el estado de sus streams en la base de datos de MAIN."
cluster_content_flow = "Contenido"
cluster_content_help = "Flujo de contenido: cuando está activo, las grabaciones del nodo (estado y el VOD en que se convierten) y los resultados de ffprobe de sus películas llegan a MAIN a través de su agente, en lugar de escribirse en la base de datos de MAIN."
cluster_content_on_done = "Flujo de contenido activado: las grabaciones y el análisis de películas del nodo pasan ahora por su agente."
cluster_content_off_done = "Flujo de contenido desactivado: el nodo vuelve a escribir sus grabaciones y el análisis de películas en la base de datos de MAIN."
cluster_mode_up_tip = "Mueva este nodo un modo hacia arriba: 0 heredado, 1 híbrido (arranca desde su propia copia, la base de datos PRINCIPAL aún está accesible), 2 solo API (sin MySQL ni Redis en MAIN). El modo 1 necesita el flujo de configuración. El modo 2 necesita cada flujo, el pin de root y un nodo que está activo, se escuchó hace un momento y dice que se ejecuta desde su propia copia."
cluster_mode_down_help = "Bajar este nodo un modo. Siempre permitido: es el camino de vuelta cuando un nodo se porta mal."
