verify_useragent_ip_restrictions_isp_tooltip = "Verifique el agente de usuario, las restricciones de IP, el ISP y las restricciones de país antes de permitir la descarga de listas de reproducción / EPG. Si está deshabilitada, la lista de reproducción se puede descargar desde cualquier IP, pero las restricciones aún se aplican a las transmisiones mismas."
view_all_servers = "Ver Todos los Servidores"
