dashboard_check_disk_nodata = "Sin datos"
dashboard_status_disk_text = "El disco del panel principal o su montaje tmp está casi lleno. Cuando tmp está lleno, la caché deja de escribirse y las líneas y transmisiones conservan sus entradas antiguas; cuando el disco del panel está lleno, se detienen las copias de seguridad y los registros. Libere espacio en el disco del panel, o aumente el tamaño de tmpfs en /etc/fstab y reinicie."
dashboard_check_backups = "Copias de Seguridad"
dashboard_check_backups_off = "Copias de seguridad automáticas desactivadas"
dashboard_check_backups_ok = "Última copia de seguridad {ago} hace"
dashboard_check_backups_none = "Sin respaldo todavía"
dashboard_check_backups_upload = "Falló una carga"
dashboard_check_backups_verify = "falló la prueba de restauración semanal: {error}"
dashboard_status_backups_text = "Abra <b>Copias de seguridad</b> para ver las copias de seguridad y el error de carga, y para crear una ahora. Una copia de seguridad programada que no llega suele ser un disco lleno."
dashboard_check_certs = "Certificados HTTPS"
dashboard_check_certs_ok = "Próxima caducidad en {days} días"
dashboard_check_certs_none = "Sin certificado registrado"
