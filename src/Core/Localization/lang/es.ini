dashboard_check_certs_expired = "caducado: {names}"
dashboard_status_certs_text = "Un certificado se renueva todos los días desde 7 días antes de que caduque; con menos de 5 días restantes, las renovaciones han fallado. Verifique que el dominio del servidor apunte a él y que el puerto 80 lo alcance."
dashboard_check_cache = "Caché"
dashboard_check_cache_off = "Discapacitados"
dashboard_check_cache_building = "Primera construcción no terminada"
dashboard_check_cache_ok = "Última ejecución completa {ago} hace"
dashboard_status_cache_text = "Una ejecución de caché falló o se interrumpió, por lo que las líneas y transmisiones cambiaron ya que pueden mantener sus entradas antiguas. <b>Registros del panel</b> nombra la causa; <b>Caché</b> muestra la última ejecución completa."
dashboard_status_cluster_text = "Abre <b>Nodos del clúster</b> para ver los flujos, el modo y la auditoría de cada nodo; un nodo en silencio sigue sirviendo espectadores desde una réplica que nadie está actualizando."
dashboard_check_clock = "Relojes de servidor"
dashboard_check_clock_ok = "Dentro de {sec} segundos del reloj PRINCIPAL"
dashboard_check_clock_off = "el reloj difiere del PRINCIPAL: {names}"
dashboard_status_clock_text = "El reloj de un servidor está a más de 5 segundos del PRINCIPAL. Cuando NTP lo corrige, los espectadores en ese servidor pueden rechazarse durante aproximadamente dos minutos, hasta que se mida el nuevo desplazamiento. Ejecute <b>timedatectl status</b> en ese servidor para ver si NTP mantiene su reloj sincronizado."
cluster_rotate_now = "Rotar token"
cluster_rotate_now_help = "Emitir de nuevo el token de este nodo en su próximo poll: la respuesta del operador a un token en el que ya no confía, sin detener el nodo."
cluster_rotate_done = "El nodo rotará su token en su próximo poll."
cluster_rotate_failed = "No se pudo encolar la rotación; el nodo conserva su token."
cluster_rotate_no_commands = "Este nodo todavía no recibe comandos: activa primero su flujo COMMANDS."
cluster_fence = "Valla"
cluster_fence_help = "Detenga a los nuevos espectadores en este nodo ahora y suelte a los que aún estén viendo después del drenaje de la cerca (lb_fence_drain_min). El nodo permanece inscrito; Unfence lo vuelve a poner en el aire."
cluster_fence_confirm = "¿Cercar este nodo? Los nuevos espectadores son rechazados de inmediato, y los que están en ejecución se descartan después del drenaje."
cluster_fence_done = "El nodo se cerrará en su próxima encuesta."
cluster_unfence = "Infence"
cluster_unfence_help = "Levante una valla este conjunto de páginas: el nodo vuelve a servir a los espectadores. Necesita una licencia, como lo hace cada comando de concesión."
cluster_unfence_done = "El nodo levantará su valla en su próxima encuesta."
cluster_quarantine = "Cuarentena"
cluster_quarantine_help = "Congele este nodo: sigue sirviendo, pero no acepta comandos de concesión ni réplicas hasta que vuelva a confiar en él."
cluster_quarantine_confirm = "¿Poner en cuarentena este nodo? No se necesita ningún comando de concesión ni réplica hasta que vuelva a confiar en él."
cluster_quarantine_done = "El nodo está en cuarentena."
cluster_quarantine_ended = "El nodo está en cuarentena. {ENDED} comando(s) en cola para que la concesión finalice y se nombre en el registro de auditoría: después de confiar nuevamente, envíe nuevamente lo que aún se desea."
cluster_trust = "Confía de nuevo"
cluster_trust_help = "Finalice la cuarentena y rote el token del nodo, de modo que lo que contenga el token en cuarentena lo pierda."
cluster_trust_done = "El nodo vuelve a ser de confianza; su token rotará en su próxima encuesta."
cluster_trust_not_quarantined = "Ese nodo no está en cuarentena."
cluster_resync = "Resincronización"
cluster_resync_help = "Haga que el nodo recupere su réplica nuevamente desde cero y envíe todo su conjunto de conexiones."
cluster_resync_done = "El nodo volverá a sincronizarse en su próxima encuesta."
cluster_command_failed = "El comando no se pudo poner en cola (consulte el registro del clúster del panel)."
cluster_mode_done = "Modo del nodo cambiado. Su agente adopta el nuevo modo en su próximo heartbeat."
cluster_mode_unknown = "Un nodo solo tiene los modos 0, 1 y 2."
cluster_mode_needs_config = "Activa primero el flujo Config: un nodo por encima del modo 0 arranca de la réplica."
cluster_mode_needs_flows = "El modo 2 necesita todos los flujos activados salvo el plano de datos: el nodo no puede alcanzar la base de datos de MAIN."
cluster_flow_mode_two = "Un nodo en modo 2 necesita todos los flujos activados. Muévalo un modo hacia abajo primero, luego apague el flujo."
cluster_mode_needs_root = "El modo 2 necesita el pin de root en su lugar( la insignia de root): sin él, ninguna acción de root (reiniciar, actualizar, reiniciar) llega a un nodo que ya no lee la base de datos PRINCIPAL."
cluster_mode_needs_streams = "Este nodo no ha dicho que lea sus flujos por sí mismo (su copia de flujo construida, su propio registro de su estado completo). En el modo 1, con el flujo de transmisiones activado, eso lleva uno o dos minutos; primero se debe actualizar un nodo en una versión anterior. Inténtelo de nuevo en breve."
cluster_mode_needs_active = "Solo un nodo activo pasa al modo 2. Levante su cuarentena primero."
cluster_mode_not_heard = "MAIN no ha escuchado este nodo en los últimos diez segundos. El modo 2 necesita un nodo que esté respondiendo ahora: verifique su agente y vuelva a intentarlo."
cluster_mode_two_warning = "¿Mover este nodo al modo 2? Comenzando con su siguiente latido, el nodo no abre ninguna conexión con MySQL o Redis de MAIN, y los servicios en segundo plano del nodo se reinician en un minuto. Cualquier característica del nodo que aún necesite la base de datos de MAIN deja de funcionar a partir de ese momento; cada intento se enumera en el cuadro Conexiones de la base de datos PRINCIPAL. ADVERTENCIA: el botón Mode down deshace este movimiento solo mientras el nodo mantiene sus credenciales de base de datos. Después de usar el botón Eliminar credenciales de la base de datos, o después de reinstalar el nodo mientras está en modo 2, no hay vuelta atrás desde esta página. Una contraseña de DB o Redis que se cambia mientras el nodo está en modo 2 tampoco llega al nodo."
cluster_mode_moved = "El modo de este nodo no es el que mostraba esta página: la página se volvió a cargar o alguien más movió el nodo. Nada fue cambiado. Verifique el nodo y presione nuevamente."
cluster_mode_down_revoked_confirm = "ADVERTENCIA: se descartaron las credenciales de la base de datos de este nodo. Moverlo hacia abajo no le devuelve la base de datos principal: en el modo 1 no tendría ninguna base de datos. ¿Moverlo hacia abajo de todos modos?"
cluster_streams_not_local = "Transmisiones no locales"
cluster_streams_not_local_help = "Este nodo dice que no puede leer sus transmisiones en sí mismo, y en el modo 2 no puede reconstruirlo: sus transmisiones no se inician ni se supervisan. Muévalo un modo hacia abajo, espere uno o dos minutos y luego hacia arriba nuevamente."
cluster_config_flow = "Configuración"
cluster_connections_flow = "Conexiones"
cluster_config_help = "Flujo Config: activado, el nodo toma sus ajustes, servidores, crontab, listas de bloqueo y catálogo de streams de la réplica que busca su agente, en vez de leer la base de datos de MAIN. Necesario antes de que un nodo pueda funcionar en modo 2."
cluster_config_on_done = "Flujo Config activado: el nodo lee ahora su configuración de la réplica."
cluster_config_off_done = "Flujo Config desactivado: el nodo vuelve a leer su configuración de la base de datos de MAIN."
cluster_connections_help = "Flujo de conexiones: cuando está activo, el nodo registra sus espectadores en su agente (sin llamadas WAN por petición) y el agente los refleja en MAIN; los cierres decididos en MAIN llegan al nodo como comandos firmados. Necesita Comandos y Streams."
cluster_connections_on_done = "Flujo de conexiones activado: el agente del nodo guarda ahora sus espectadores."
cluster_connections_off_done = "Flujo de conexiones desactivado: el nodo vuelve a registrar sus espectadores en el almacén de MAIN."
cluster_dataplane_flow = "Plano de datos"
cluster_dataplane_help = "Flujo del plano de datos: cuando está activado, el nodo extrae transmisiones retransmitidas y archivos de otros servidores a través del proxy de bucle invertido de su agente con tickets firmados, nunca con el secreto de la transmisión en una URL, y los padres rechazan ese secreto de su dirección. Necesita Transmisiones y Contenido."
cluster_dataplane_on_done = "Flujo del plano de datos activado: los relés del nodo y las lecturas de archivos pasan por su agente, con tickets. Las transmisiones iniciadas antes conservan sus URL hasta que se reinician."
cluster_dataplane_off_done = "Flujo del plano de datos desactivado: el nodo vuelve a extraer retransmisiones y archivos con las URL heredadas."
cluster_dataplane_needs_relay = "El agente de este nodo no ejecuta el proxy de retransmisión de bucle invertido( su hola enumera la función sin retransmisión): actualice xc_agent en el nodo antes de activar el plano de datos."
cluster_relay_unbound = "puerto de relé abajo"
cluster_clock_off = "reloj {OFFSET}"
cluster_clock_degraded = "degradado (reloj) {OFFSET}"
cluster_clock_help = "El reloj del nodo está así de desviado del de MAIN (nodo − MAIN, según su heartbeat). Su agente corrige sus propias solicitudes, pero su PHP, sus crons y sus registros usan ese reloj. Pasados 30 s esto avisa y pasados 300 s el nodo queda degradado; ninguno de los dos lo cerca. Sincronice NTP en ambos."
cluster_conn_differ = "las conexiones difieren"
cluster_conn_resynced = "conexiones resincronizadas hace {AGO}"
cluster_conn_help = "Las conexiones abiertas del nodo y el registro que MAIN tiene de ellas no coinciden (el resumen de conexiones, comprobado cada 4 s). Dos discrepancias seguidas hacen que MAIN pida al nodo todas sus conexiones, como máximo cada 30 s. Si esto se repite, se están perdiendo eventos de conexión del nodo."
cluster_lane_lag = "{LANE} con retraso desde hace {AGE}"
cluster_lane_lag_help = "Desde hace {AGE}, los eventos {LANE} del nodo esperan más de 120 s para llegar a MAIN. P0 lleva el estado de los streams y las conexiones, P1 los registros. El nodo los guarda en disco y los envía en cuanto MAIN vuelve a aceptarlos: compruebe su enlace con MAIN y ejecute server:diagnose en el nodo."
cluster_url_unreachable = "URL de MAIN inalcanzable"
cluster_url_unreachable_help = "El nodo no alcanza estas URL de clúster de MAIN (conexión, TLS o tiempo de espera) y usa otra: {URLS}. Compruebe el cortafuegos, el certificado y el puerto entre ambos."
cluster_relay_unbound_help = "El agente del nodo no puede vincular el puerto de su proxy de retransmisión de bucle invertido (127.0.0.1: 31290), por lo que sus retransmisiones del plano de datos y lecturas de archivos fallan y se vuelven a intentar hasta que pueda. Otro proceso retiene el puerto: libérelo en el nodo. El último error del agente:"
cluster_flow_needs = "Ese flujo necesita otro activado antes: Conexiones necesita Comandos y Streams."
cluster_panel_fp = "Huella del panel"
cluster_panel_fp_help = "SHA-256 de la clave de firma del panel de MAIN. En un nodo inscrito con código, root la fija con: console.php cluster:pin-root <huella>"
cluster_root_pin = "Fijación root"
cluster_root_ready_help = "Comandos root: la clave del panel fijada por root en el nodo coincide con la del agente; reboot, update y otras acciones root van como comandos firmados."
cluster_root_missing_help = "Sin fijación root en este nodo: las acciones root siguen en la tabla de señales. Se fija en la instalación por SSH, o en el nodo con: console.php cluster:pin-root <huella del panel>"
cluster_core_pinned_help = "El xcvm_core del nodo contiene la clave de este panel (core.pin): juzga el arrendamiento del nodo en sí mismo, en un reloj que no se puede retroceder."
cluster_pin_core = "Núcleo de pin"
cluster_pin_core_help = "Ancle la clave de este panel en el xcvm_core del nodo ahora, de modo que juzgue el arrendamiento del nodo en sí. MAIN también hace esto por sí solo dentro de un minuto de que un nodo tome los comandos raíz."
cluster_pin_core_queued = "Enviado. La insignia principal aparece una vez que el nodo ha anclado la clave de este panel (primero puede informar su install_id, que registra MAIN)."
cluster_pin_core_no_root = "Este nodo aún no acepta comandos raíz: active su flujo de COMANDOS y coloque primero el pin de root."
cluster_pin_core_no_root_key = "MAIN no tiene grabada ninguna tecla del panel: ejecutar consola.clúster php:inicie primero."
cluster_pin_core_not_queued = "El pin no se pudo poner en cola; consulte el registro del clúster."
cluster_strip_credentials = "Suelte las credenciales de la base de datos"
cluster_strip_credentials_help = "Elimine la base de datos PRINCIPAL y las credenciales de Redis de la configuración de este nodo.enc, luego revoque su concesión de base de datos. Solo para un nodo activo en modo 2. No hay deshacer desde esta página: revertir necesita una nueva configuración y una nueva concesión."
cluster_strip_credentials_confirm = "¿Eliminar la base de datos PRINCIPAL y las credenciales de Redis de este nodo y revocar su concesión de base de datos? El nodo sigue trabajando en la API del clúster, pero ya no puede acceder a la base de datos PRINCIPAL. Revertir necesita una nueva configuración y una nueva concesión."
cluster_strip_too_soon = "Este nodo aún no ha estado en modo 2 durante siete días. Dejar caer sus credenciales de base de datos no se puede deshacer, por lo que espera: hasta entonces, el modo inactivo es el camino de regreso."
cluster_strip_not_local = "Este nodo no dice que lee sus flujos en sí mismo. El modo inactivo es cómo se cura, y necesita estas credenciales: arregle eso primero."
cluster_strip_not_heard = "MAIN no ha escuchado este nodo en los últimos diez segundos. Renuncia a las credenciales de MAIN solo mientras responde: verifique su agente y luego vuelva a intentarlo."
cluster_strip_queued = "Enviado. Cuando el nodo informa que su configuración no tiene credenciales, MAIN revoca su concesión de base de datos (registro de clúster: nodo.db_revocado)."
