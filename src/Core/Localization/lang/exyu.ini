cluster_pin_core_not_queued = "Pin nije mogao biti stavljen u red čekanja; pogledajte dnevnik klastera."
cluster_strip_credentials = "Odbacite DB akreditive"
cluster_strip_credentials_help = "Uklonite MAIN bazu podataka i Redis akreditive iz config.enc ovog čvora, a zatim opozovite njegovu dodjelu baze podataka. Samo za aktivni čvor u režimu 2. Nema poništavanja sa ove stranice: za vraćanje je potrebna nova konfiguracija i nova odobrenja."
cluster_strip_credentials_confirm = "Ukloniti MAIN bazu podataka i Redis vjerodajnice sa ovog čvora i opozvati njegovu dodjelu baze podataka? Čvor nastavlja raditi preko klastera API, ali više ne može doći do baze podataka MAIN. Za vraćanje je potrebna nova konfiguracija i novi grant."
cluster_strip_too_soon = "Ovaj čvor još nije bio u režimu 2 sedam dana. Odbacivanje njegovih DB akreditiva se ne može poništiti, tako da čeka: do tada Mode down je put nazad."
cluster_strip_not_local = "Ovaj čvor ne kaže da čita svoje tokove na sebi. Smanjenje načina rada je način na koji to liječi, a potrebne su mu ove vjerodajnice: prvo to popravite."
