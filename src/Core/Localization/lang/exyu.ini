cluster_fence = "Ograda"
cluster_fence_help = "Zaustavite nove gledaoce na ovom čvoru sada i ispustite one koji još gledaju nakon odvoda ograde (lb_fence_drain_min). Čvor ostaje upisan; Unfence ga vraća u zrak."
cluster_fence_confirm = "Ograditi ovaj čvor? Novi gledaoci se odmah odbijaju, a oni koji se prikazuju nakon odvoda."
cluster_fence_done = "Čvor će se ograditi na svom sljedećem glasanju."
cluster_unfence = "Uklanjanje ograde"
cluster_unfence_help = "Podignite ogradu na ovoj stranici: čvor ponovo služi gledaocima. Potrebna je licenca, kao i svaka komanda za dodjelu."
cluster_unfence_done = "Čvor će podići svoju ogradu prilikom sljedećeg glasanja."
cluster_quarantine = "Karantena"
cluster_quarantine_help = "Zamrznite ovaj čvor: nastavlja da služi, ali ne preuzima komandu za dodjelu niti repliku dok mu ponovo ne vjerujete."
cluster_quarantine_confirm = "Staviti ovaj čvor u karantin? Nije potrebna naredba za dodjelu niti replika dok joj ponovo ne vjerujete."
cluster_quarantine_done = "Čvor je u karantinu."
cluster_quarantine_ended = "Čvor je u karantinu. {ENDED} naredba(e) u redu čekanja da je odobrenje završeno i imenovano je u evidenciji revizije: nakon ponovnog povjerenja, pošaljite ponovo ono što se još traži."
cluster_trust = "Ponovo verujte"
cluster_trust_help = "Prekinite karantin i rotirajte token čvora, tako da ono što drži token u karantinu ga gubi."
cluster_trust_done = "Čvoru se ponovo veruje; njegov token će se rotirati na sljedećoj anketi."
cluster_trust_not_quarantined = "Taj čvor nije u karantinu."
cluster_resync = "Resinhronizacija"
cluster_resync_help = "Neka čvor ponovo dohvati svoju repliku od nule i pošalje ceo svoj set veza."
cluster_resync_done = "Čvor će se ponovo sinhronizovati na sledećoj anketi."
cluster_command_failed = "Naredba nije mogla biti stavljena u red čekanja (pogledajte evidenciju klastera panela)."
cluster_mode_done = "Režim čvora je promenjen. Njegov agent preuzima novi način rada pri sljedećem otkucaju srca."
cluster_mode_unknown = "Čvor ima samo modove 0, 1 i 2."
cluster_mode_needs_config = "Prvo uključite Config tok: čvor iznad moda 0 pokreće se iz replike."
cluster_mode_needs_flows = "Režim 2 treba uključiti svaki tok, uključujući ravan podataka: čvor možda uopće neće doseći MAIN bazu podataka, niti staviti tajnu toka u URL."
cluster_flow_mode_two = "Čvoru u modu 2 treba uključiti svaki tok. Prvo ga pomjerite za jedan način rada, a zatim isključite protok."
cluster_flow_mandatory = "Ovaj tok ostaje uključen: komande, telemetrija, evidencije, konfiguracije, veze i ravan podataka se ne mogu isključiti, tako da se čvor nikada nije djelimično odvojio od MAIN."
cluster_mode_needs_root = "Modu 2 je potreban root-ov pin na mjestu (root značka): bez njega nijedna root akcija (ponovno pokretanje, ažuriranje, ponovno pokretanje) ne stiže do čvora koji više ne čita MAIN bazu podataka."
cluster_mode_needs_streams = "Ovaj čvor nije rekao da sam čita svoje streamove (njegova kopija streama je izgrađena, njegov vlastiti zapis o njihovom stanju je završen). U načinu 1 s uključenim protokom streama traje minut ili dvije; čvor na starijem izdanju mora se prvo ažurirati. Pokušajte ponovo uskoro."
cluster_mode_needs_active = "Samo aktivni čvor prelazi u režim 2. Prvo skinite karantin."
cluster_mode_not_heard = "MAIN nije čuo ovaj čvor u posljednjih deset sekundi. Modu 2 potreban je čvor koji sada odgovara: provjerite njegovog agenta, a zatim pokušajte ponovo."
cluster_mode_two_warning = "Premjestiti ovaj čvor u mod 2? Počevši od svog sljedećeg otkucaja srca, čvor ne otvara vezu sa MySQL ili Redis od MAIN, a pozadinske usluge čvora se ponovo pokreću u roku od jedne minute. Bilo koja karakteristika čvora kojoj je i dalje potrebna baza podataka MAIN od tada prestaje raditi; svaki pokušaj je naveden u MAIN kutiji za povezivanje DB. UPOZORENJE: tipka Mode down poništava ovaj potez samo dok čvor zadržava svoje DB vjerodajnice. Nakon što se koristi dugme Ispusti DB akreditive, ili nakon što se čvor ponovo instalira dok je u režimu 2, nema povratka sa ove stranice. DB ili Redis lozinka koja je promijenjena dok je čvor u načinu 2 također ne stiže do čvora."
cluster_mode_moved = "Način rada ovog čvora nije onaj koji je ova stranica prikazala: stranica je ponovo učitana ili je neko drugi pomjerio čvor. Ništa nije promijenjeno. Provjerite čvor i pritisnite ponovo."
cluster_mode_down_revoked_confirm = "UPOZORENJE: DB akreditivi ovog čvora su odbačeni. Ako ga pomjerite prema dolje, to mu ne vraća bazu podataka MAIN: u načinu 1 uopće ne bi imala bazu podataka. Ipak ga pomeriti dole?"
cluster_streams_not_local = "streamovi nisu lokalni"
cluster_streams_not_local_help = "Ovaj čvor kaže da ne može čitati svoje streamove na sebi, au modu 2 ne može to ponovo izgraditi: njegovi streamovi nisu pokrenuti niti nadzirani. Pomjerite ga za jedan način naniže, pričekajte minut ili dva, a zatim ponovo gore."
cluster_config_flow = "Konfig"
cluster_connections_flow = "Veze"
cluster_config_help = "Tok konfiguracije: kada je uključen, čvor preuzima svoja podešavanja, servere, crontab, liste blokova i katalog toka iz replike koju dohvaća njegov agent, umjesto da čita MAIN bazu podataka. Potrebno prije nego što čvor može raditi u načinu 2."
cluster_config_on_done = "Tok konfiguracije uključen: čvor sada čita svoju konfiguraciju iz replike."
cluster_config_off_done = "Isključen tok konfiguracije: čvor ponovo čita svoju konfiguraciju iz baze podataka MAIN."
cluster_connections_help = "Tok veza: kada je uključen, čvor snima svoje gledaoce sa svojim agentom (nema WAN poziva na zahtjev) i agent ih preslikava na MAIN; zatvaranje odlučeno kada MAIN dostigne čvor kao potpisane komande. Potrebne su komande i tokovi."
cluster_connections_on_done = "Veze se nastavljaju: agent čvora sada drži svoje posmatrače."
cluster_connections_off_done = "Veze se prekidaju: čvor ponovo snima svoje gledaoce u MAIN prodavnici."
cluster_dataplane_flow = "Ravan podataka"
cluster_dataplane_help = "Protok u ravni podataka: kada je uključen, čvor povlači prenesene tokove i fajlove drugih servera kroz proxy povratne petlje svog agenta sa potpisanim tiketima, nikada sa tajnom toka u URL, a roditelji odbijaju tu tajnu sa svoje adrese. Potrebni su tokovi i sadržaj."
cluster_dataplane_on_done = "Protok u ravni podataka uključen: releji čvora i čitanja fajlova prolaze kroz njegovog agenta, sa tiketima. Streamovi su započeti prije zadržati svoje URL-ove dok se ponovo ne pokrenu."
cluster_dataplane_off_done = "Isključen protok ravni podataka: čvor ponovo povlači releje i datoteke sa zastarjelim URL-ovima."
cluster_dataplane_needs_relay = "Agent ovog čvora ne pokreće loopback relay proxy (njegova hello lista ne sadrži funkciju releja): ažurirajte xc_agent na čvoru prije nego što uključite ravan podataka."
cluster_relay_unbound = "relejni port dolje"
cluster_clock_off = "sat {OFFSET}"
cluster_clock_degraded = "degradiran (sat) {OFFSET}"
cluster_clock_help = "Sat čvora je ovoliko udaljen od MAIN (čvor − MAIN, od njegovog otkucaja srca). Njegov agent ispravlja svoje zahtjeve, ali njegov PHP, njegovi crons i njegovi zapisi koriste taj sat. Proteklih 30 s ovo upozorava, a nakon 300 s čvor je degradiran; niti ga ogradi. Sinhronizirajte NTP na oba."
cluster_conn_differ = "veze se razlikuju"
cluster_conn_resynced = "veze ponovo sinhronizirane prije {AGO}"
cluster_conn_help = "Otvorene veze čvora i MAIN zapis o njima se ne slažu (sažetak veze, provjerava se svake 4 s). Dva neslaganja zaredom čine da MAIN traži od čvora sve svoje veze, najviše svakih 30 s. Ako se ovo stalno vraća, događaji veze iz čvora se gube."
cluster_lane_lag = "{LANE} zaostaje {AGE}"
cluster_lane_lag_help = "{LANE} događaji čvora čekaju više od 120 s da dostignu MAIN za {AGE}. P0 nosi tok i stanje veze, P1 zapise. Čvor ih čuva na disku i šalje ih kada ih MAIN ponovo uzme: provjerite njegovu vezu do MAIN i pokrenite server:diagnose na čvoru."
cluster_url_unreachable = "MAIN URL nedostupan"
cluster_url_unreachable_help = "Čvor ne može doći do ovih MAIN URL-ova klastera (povezivanje, TLS ili vremensko ograničenje) i koristi drugi: {URLS}. Provjerite zaštitni zid, certifikat i port između njih."
cluster_relay_unbound_help = "Agent čvora ne može da poveže svoj port proxy releja povratne petlje (127.0.0.1:31290), tako da njegovi releji u ravni podataka i čitanje fajlova ne uspevaju i pokušavaju se ponovo dok ne mogu. Drugi proces drži port: oslobodi ga na čvoru. Poslednja greška agenta:"
cluster_flow_needs = "Taj tok prvo treba još jedan: za veze su potrebne komande i tokovi; podatkovnoj ravni su potrebni tokovi i sadržaj."
cluster_panel_fp = "Otisak prsta panela"
cluster_panel_fp_help = "SHA-256 od MAIN ključa za potpisivanje panela. Na čvoru koji je upisan kodom, root ga zakači sa: console.php cluster:pin-root <fingerprint>"
cluster_root_pin = "Root pin"
cluster_root_ready_help = "Root komande: pin ključa panela u vlasništvu čvora odgovara njegovom agentu; ponovno pokretanje, ažuriranje i druge root akcije idu kao potpisane komande."
cluster_root_missing_help = "Nema root pin na ovom čvoru: root akcije zadržavaju tabelu signala. Zakačeno na SSH instalaciji, ili na čvoru: console.php cluster:pin-root <panel fingerprint>"
cluster_core_pinned_help = "xcvm_core čvora drži ključ ovog panela (core.pin): on sudi o samom zakupu čvora, na satu koji se ne može pomeriti unazad."
cluster_pin_core = "Pin jezgro"
cluster_pin_core_help = "Zakačite ključ ovog panela u xcvm_core čvora sada, tako da sam procijeni zakup čvora. MAIN to također radi sam u roku od jedne minute nakon što čvor preuzme root komande."
cluster_pin_core_queued = "Poslano. Osnovna značka se pojavljuje kada čvor zakači ključ ovog panela (prvo može prijaviti svoj install_id, koji MAIN bilježi)."
