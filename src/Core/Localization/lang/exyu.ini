xcvm_was_the_first_to_tooltip = "XC_VM je bio prvi koji je dodao više kategorija, što znači da ga većina aplikacija ne podržava. Zadano ponašanje API je da prikaže stavku jednom kada se traži SVE, međutim aplikacije imaju tendenciju da traže sve tokove, a zatim ih same filtriraju u kategorije. Ova opcija će promijeniti zadano ponašanje kako bi prikazala tok dupliran za svaku dodatnu kategoriju, stoga se tok ispravno prikazuje u svakoj kategoriji. Loša strana je u tome što će se pri pretraživanju ili prikazivanju svih kategorija stream pojaviti više puta."
