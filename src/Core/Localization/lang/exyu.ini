which_version_of_ffmpeg_to_tooltip = "Koju verziju FFMPEG-a koristiti za filmove, kreirane kanale i normalne prijenose.<br/><br/>v4.0 (XUI) - XUI-jeva naslijeđena verzija iz 2018., zadržana na panelima prebačenim sa XUI-a.<br/>v4.4 - Verzija kompatibilna sa naslijeđem.<br/>v7.1 i v8.1 potpuna verzija koda sa podrškom za moderni kod NVENC.<br/>(auto) - Sačuvana verzija koju ovaj server nema: koristi se najbliža verzija koju ima."
