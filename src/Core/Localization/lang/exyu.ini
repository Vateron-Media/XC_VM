profile_name = "Ime profila"
profile_success = "Profil je dodat/izmijenjen."
profile_tooltip_1 = "Preset je skup opcija koje će obezbediti određenu brzinu kodiranja u odnosu na kompresiju. Sporije unapred podešeno će obezbediti bolju kompresiju (kompresija je kvalitet po veličini datoteke). To znači da, na primjer, ako ciljate određenu veličinu datoteke ili konstantnu brzinu prijenosa, postići ćete bolji kvalitet sa sporijim unaprijed postavljenim. Slično tome, za konstantno kvalitetno kodiranje, jednostavno ćete uštedjeti bitrate odabirom sporije unaprijed postavljene postavke."
profile_tooltip_10 = "Promenite ciljni video aspekt. (npr. 16:9)"
profile_tooltip_11 = "Podesite brzinu kadrova."
profile_tooltip_12 = "Podesite brzinu uzorkovanja zvuka u Hz."
profile_tooltip_13 = "Podesite audio kanale."
profile_tooltip_14 = "Odredite broj niti koje želite da koristite za proces transkodiranja. Ako unesete 0 kao vrijednost, FFmpeg će odabrati najoptimalnije postavke."
profile_tooltip_15 = "Sa ovim filterom možete ukloniti osjetljive dijelove iz vašeg videa. Samo ćete odrediti x i y piksele gdje postoji osjetljivo područje i širinu i visinu koje će biti uklonjene. Primjer upotrebe: x=0:y=0:w=100:h=77:band=10"
profile_tooltip_16 = "Dodajte svoj logotip u stream. Logo će biti postavljen u gornjem levom uglu. Budite sigurni da ste odabrali H.264 kao kodek inače ova opcija neće raditi. Imajte na umu da će dodavanje vlastitog logotipa potrošiti MNOGO CPU snage."
profile_tooltip_2 = "Podesite video profil, Glavni, Osnovni ili Visoki."
profile_tooltip_3 = "Ovim možete promijeniti bitrate ciljnog videa. Veoma je korisno u slučaju da želite da se vaš video može reproducirati na sporim internet vezama."
profile_tooltip_4 = "Promijenite brzinu prijenosa zvuka."
profile_tooltip_5 = "-argument minrate FFmpeg. Ovdje navedite minimalnu toleranciju brzine prijenosa u kbps. Unesite samo broj."
profile_tooltip_6 = "-maxrate FFmpeg argument. Ovdje navedite maksimalnu toleranciju brzine prijenosa u kbps. Unesite samo broj."
profile_tooltip_7 = "-bufsize je bafer za kontrolu brzine. U osnovi se pretpostavlja da će prijemnik/krajnji igrač baferovati toliko podataka tako da je u redu da fluktuira unutar toliko. Navedite u kbps."
profile_tooltip_8 = "Opseg skale kvantizatora je 0-51: gde je 0 bez gubitaka, 23 je podrazumevano, a 51 je najgore moguće. Niža vrijednost je veći kvalitet, a subjektivno razuman raspon je 18-28. Smatrajte da je 18 vizualno bez gubitaka ili gotovo: trebao bi izgledati isto ili skoro isto kao ulaz, ali nije tehnički bez gubitaka. Opseg je eksponencijalan, tako da je povećanje CRF vrijednosti +6 otprilike polovina brzine prijenosa, dok je -6 otprilike dvostruko veća brzina prijenosa. Opšta upotreba je odabrati najvišu vrijednost CRF-a koja i dalje pruža prihvatljiv kvalitet. Ako rezultat izgleda dobro, pokušajte s većom vrijednošću, a ako izgleda loše, odaberite nižu vrijednost."
profile_tooltip_9 = "Promijenite širinu i visinu ciljnog videa. (Npr. 320:240). Ako želimo zadržati omjer širine i visine, moramo navesti samo jednu komponentu, bilo širinu ili visinu, a drugu komponentu postaviti na -1. (npr. 320:-1)"
