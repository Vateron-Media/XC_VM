when_number_of_clients_as_tooltip = "Quando o número de clientes como uma percentagem do máximo de clientes do servidor estiver acima desta percentagem, será apresentado como um aviso na caixa estado do serviço."
when_the_request_limit_is_tooltip = "Quando o limite de Pedidos for atingido, os pedidos excedentes serão eliminados por predefinição. Você pode enviar essas solicitações para uma fila que será atendida em ordem e não simultaneamente. Isso ajudará a facilitar o fluxo de tráfego e a garantir que o serviço não seja interrompido pela limitação da taxa."
when_using_direct_source_hide_tooltip = "Ao usar o código-fonte direto, oculte o URL original fazendo proxy do filme por meio de seus servidores. Isso consumirá largura de banda, mas não exigirá que o filme seja salvo em seus servidores permanentemente. Certifique-se de definir o recipiente de destino correto."
when_using_direct_source_hide_tooltip_title = "Ao usar a fonte direta, oculte o URL original fazendo proxy da transmissão ao vivo por meio de seus servidores via UDP. MPEG-TS e HLS são suportados como um formato de entrada, no entanto, apenas MPEG-TS é suportado como um formato de saída para os clientes.<br/><br/>Experimental! Isso pode não funcionar para todos os fluxos."
when_you_request_a_stream_tooltip = "Quando você solicita um stream on-demand, peça ao provedor para enviar um prebuffer para que o stream comece mais rápido. Isso só funcionará se o seu provedor estiver usando XC_VM. O prebuffer significará que sua fonte pode estar 10 segundos ou mais atrasada, mas carregará significativamente mais rápido.<br/><br/>na URL significa anexar automaticamente ?prebuffer = 1 para o URL, on - Header envia a solicitação prebuffer como um cabeçalho. As solicitações de cabeçalho só são aceitas ao solicitar de XC_VM v1. 4. 4+"
whether_to_use_guessit_or_tooltip = "Se deve usar GuessIt ou PTN para analisar nomes de arquivos para a pasta de observação, etc. Acho que é muito melhor, mas utiliza mais recursos."
whether_to_use_modern_or_tooltip = "Se deve usar o tema moderno ou legado por padrão para dispositivos recém-adicionados."
whether_to_use_progress_info_tooltip = "Se deve usar informações de progresso após o atraso de início para determinar o FPS real ou sondar o segmento para retornar avg_frame_rate."
which_network_interface_to_use_for_statistics = "Que interface de rede utilizar para as estatísticas."
which_version_of_ffmpeg_to_tooltip = "Qual versão do FFMPEG usar para filmes, canais criados e fluxos normais.<br/><br/>v4.0-versão legada de 2018, fornecida originalmente com XC_VM.<br/>v7.1 e V8.0 - versões modernas com suporte total a codecs, DASH e NVENC."
write_a_custom_sysctlconf_to_tooltip = "Escreva um sysctl personalizado.conf ao servidor. Você pode quebrar seu servidor inserindo valores incorretos aqui, isso é apenas para uso avançado. O modelo predefinido é fornecido para fins de restauração e de informação."
xcvm_was_the_first_to_tooltip = "XC_VM foi o primeiro a adicionar várias categorias, o que significa que a maioria dos aplicativos não o suporta. O comportamento padrão da API é mostrar o item uma vez quando tudo é solicitado, no entanto, os aplicativos tendem a solicitar todos os fluxos e filtrá-los em categorias. Esta opção irá alterar o comportamento predefinido para mostrar o fluxo duplicado para cada categoria adicional, pelo que o fluxo é apresentado correctamente em cada categoria. A desvantagem é que, ao pesquisar ou exibir todas as Categorias, o fluxo será exibido várias vezes."
