cluster_telemetry_off_done = "Fluxo de telemetria desligado: o watchdog do nó volta a reportar."
cluster_fleet_silence = "A maioria dos nós ficou em silêncio ao mesmo tempo: o MAIN suspeita da sua própria rede ou do pool da API e mantém o estado de cada nó, sem os marcar como offline, até o silêncio passar."
cluster_ctl_queue = "Os pedidos à pool cluster_ctl do MAIN esperaram mais de 5 s por um worker: o MAIN suspeita da sua própria pool da API. Enquanto a fila durar, nenhuma conexão órfã é purgada e os nós ouvidos pouco antes do início não são marcados como offline: até 4 vezes o Offline After desde o início e, depois de a fila escoar, mais um Offline After."
cluster_commands_flow = "Comandos"
cluster_commands_help = "Fluxo de comandos: ligado, o MAIN envia a este nó comandos assinados (RPCs como iniciar/parar streams, probes e scans, e kills de espetadores) pela API do cluster, em vez da /api e da tabela de sinais."
cluster_commands_on_done = "Fluxo de comandos ligado: o MAIN passa a enviar comandos assinados a este nó."
cluster_commands_off_done = "Fluxo de comandos desligado: o MAIN volta a usar a /api e os sinais do nó."
cluster_logs_flow = "Toras"
cluster_logs_help = "Fluxo de logs: quando ligado, os logs de pedidos, streams e erros do nó chegam ao MAIN como eventos redigidos pelo agente, em vez de serem inseridos na base de dados do MAIN."
cluster_logs_on_done = "Fluxo de logs ligado: os logs do nó chegam agora pelo agente."
cluster_logs_off_done = "Fluxo de logs desligado: o nó volta a escrever os logs na base de dados do MAIN."
cluster_streams_flow = "Riachos"
cluster_streams_help = "Fluxo de streams: quando ligado, o nó comunica o estado dos seus streams (pids, estado, codecs, fonte) como eventos pelo agente; o MAIN junta-os às linhas do próprio nó."
cluster_streams_on_done = "Fluxo de streams ligado: o estado dos streams do nó chega agora pelo agente."
cluster_streams_off_done = "Fluxo de streams desligado: o nó volta a escrever o estado dos streams na base de dados do MAIN."
cluster_content_flow = "Conteúdo"
cluster_content_help = "Fluxo de conteúdo: quando ligado, as gravações do nó (estado e o VOD em que se tornam) e os resultados ffprobe dos seus filmes chegam ao MAIN pelo agente, em vez de serem escritos na base de dados do MAIN."
cluster_content_on_done = "Fluxo de conteúdo ligado: as gravações e a análise de filmes do nó passam agora pelo agente."
cluster_content_off_done = "Fluxo de conteúdo desligado: o nó volta a escrever as gravações e a análise de filmes na base de dados do MAIN."
cluster_mode_up_tip = "Mova este nó um modo para cima: 0 legado, 1 híbrido (inicializa a partir de sua própria cópia, o banco de dados do MAIN ainda está acessível), 2 apenas API (sem MySQL ou Redis no MAIN). O modo 1 precisa do fluxo de configuração. O modo 2 precisa de cada fluxo, pin da raiz e um nó que está ativo, foi ouvido agora e diz que é executado a partir de sua própria cópia."
cluster_mode_down_help = "Descer este nó um modo. Sempre permitido: é o caminho de volta quando um nó se porta mal."
dashboard_check_cluster = "API de cluster"
dashboard_check_cluster_off = "Desligada"
dashboard_check_cluster_none = "Ligada, nenhum nó inscrito"
dashboard_check_cluster_ok = "{answering}/{total} nós a responder"
dashboard_check_cluster_waiting = "à espera de decisão: {names}"
dashboard_check_cluster_stopped = "parados pelo MAIN: {names}"
dashboard_status_cluster_text = "Abra <b>Nós do Cluster</b> para ver os fluxos, o modo e a auditoria de cada nó; um nó em silêncio continua a servir espectadores a partir de uma réplica que ninguém está a actualizar."
cluster_rotate_now = "Rodar token"
cluster_rotate_now_help = "Emitir de novo o token deste nó no próximo poll: a resposta do operador a um token em que já não confia, sem parar o nó."
cluster_rotate_done = "O nó vai rodar o token no próximo poll."
cluster_rotate_failed = "Não foi possível pôr a rotação em fila; o nó mantém o token."
cluster_rotate_no_commands = "Este nó ainda não recebe comandos: ligue primeiro o fluxo COMMANDS."
cluster_fence = "Cerca"
cluster_fence_help = "Pare novos visualizadores neste nó agora e solte os que ainda estão assistindo após o dreno da cerca (lb_fence_drain_min). O nó permanece inscrito; Unfence o coloca de volta no ar."
cluster_fence_confirm = "Cercar este nó? Novos espectadores são recusados de uma só vez, e os que correm são descartados após o dreno."
cluster_fence_done = "O nó irá cercar-se na sua próxima sondagem."
cluster_unfence = "Unfence"
cluster_unfence_help = "Levante uma cerca Este conjunto de páginas: o nó serve os espectadores novamente. Precisa de uma licença,como todo comando que concede."
cluster_unfence_done = "O nó levantará sua cerca na próxima votação."
cluster_quarantine = "Quarentena"
cluster_quarantine_help = "Congele este nó: ele continua servindo, mas não aceita nenhum comando de concessão e nenhuma réplica até que você confie nele novamente."
cluster_quarantine_confirm = "Colocar este nó em quarentena? Não é preciso nenhum comando de concessão e nenhuma réplica até que você confie nele novamente."
cluster_quarantine_done = "O nó está em quarentena."
cluster_trust = "Confiança novamente"
cluster_trust_help = "Termine a quarentena e gire o token do nó, para que o que quer que tenha o token em quarentena o perca."
cluster_trust_done = "O nó é confiável novamente; seu token girará em sua próxima pesquisa."
cluster_trust_not_quarantined = "Esse nó não está em quarentena."
cluster_resync = "Ressincronização"
cluster_resync_help = "Faça com que o nó Busque sua réplica novamente do zero e envie todo o seu conjunto de conexões."
cluster_resync_done = "O nó irá ressincronizar na sua próxima sondagem."
cluster_command_failed = "O comando não pôde ser enfileirado (consulte o log de cluster do painel)."
cluster_mode_done = "Modo do nó alterado. O agente adopta o novo modo no próximo heartbeat."
cluster_mode_unknown = "Um nó só tem os modos 0, 1 e 2."
cluster_mode_needs_config = "Ligue primeiro o fluxo Config: um nó acima do modo 0 arranca da réplica."
cluster_mode_needs_flows = "O modo 2 exige todos os fluxos ligados excepto o plano de dados: o nó não pode alcançar a base de dados do MAIN."
cluster_mode_needs_root = "O modo 2 precisa do pin do root no lugar (o emblema do root): sem ele, nenhuma ação do root (reiniciar, atualizar, reiniciar) atinge um nó que não lê mais o banco de dados do MAIN."
cluster_mode_needs_streams = "Este nó não disse que lê seus próprios fluxos (sua cópia de fluxo construída, seu próprio registro de seu estado completo). No modo 1, com o fluxo de fluxos em que leva um minuto ou dois; um nó em uma versão mais antiga deve ser atualizado primeiro. Tente novamente em breve."
cluster_mode_needs_active = "Apenas um nó ativo se move para o modo 2. Levante sua quarentena primeiro."
cluster_mode_not_heard = "MAIN não ouviu este nó nos últimos dez segundos. O modo 2 precisa de um nó que esteja respondendo agora: verifique seu agente e tente novamente."
cluster_mode_redis_handler = "O modo 2 não está disponível enquanto o manipulador de conexão Redis estiver ativado: um nó no modo 2 pode não abrir o Redis principal e todos os visualizadores nele serão rejeitados. Desligue o manipulador Redis primeiro nas Configurações."
cluster_mode_two_warning = "Mover este nó para o modo 2? Começando com sua próxima pulsação, o nó não abre nenhuma conexão com o MySQL ou Redis de MAIN, e os Serviços em segundo plano do nó são reiniciados em um minuto. Qualquer recurso do nó que ainda precise do banco de dados de MAIN para de funcionar a partir de então; cada tentativa é listada na caixa main DB connects. Aviso: o botão Mode down desfaz esse movimento apenas enquanto o nó mantém suas credenciais de banco de dados. Depois que o botão Drop DB credentials é usado, ou depois que o nó é reinstalado enquanto está no modo 2, não há como voltar a partir desta página. Uma senha DB ou Redis que é alterada enquanto o nó está no modo 2 também não atinge o nó."
cluster_mode_moved = "O modo deste nó não é o que esta página mostrou: a página foi recarregada ou outra pessoa moveu o nó. Nada foi alterado. Verifique o nó e pressione novamente."
cluster_redis_handler_mode2 = "O manipulador Redis não pode ser ligado enquanto um balanceador de carga estiver no modo de cluster 2: esse nó pode não abrir o Redis de MAIN e todos os visualizadores nele seriam rejeitados. Mova esses nós para o modo 1 Primeiro."
cluster_mode_down_revoked_confirm = "Aviso: as credenciais de banco de dados deste nó foram descartadas. A sua descida não devolve a base de dados do MAIN: no modo 1, não teria nenhuma base de dados. De qualquer maneira?"
cluster_streams_not_local = "Fluxos não locais"
cluster_streams_not_local_help = "Este nó diz que não pode ler seus fluxos em si mesmo e, no modo 2, não pode reconstruí-los: seus fluxos não são iniciados ou supervisionados. Mova-o um modo para baixo, espere um minuto ou dois e depois para cima novamente."
cluster_config_flow = "Config"
cluster_connections_flow = "Ligações"
cluster_config_help = "Fluxo Config: ligado, o nó tira as definições, os servidores, a crontab, as blocklists e o catálogo de streams da réplica que o agente busca, em vez de ler a base de dados do MAIN. Necessário antes de um nó poder correr em modo 2."
cluster_config_on_done = "Fluxo Config ligado: o nó lê agora a configuração da réplica."
cluster_config_off_done = "Fluxo Config desligado: o nó volta a ler a configuração da base de dados do MAIN."
cluster_connections_help = "Fluxo de ligações: quando ligado, o nó regista os espetadores no agente (sem chamadas WAN por pedido) e o agente espelha-os no MAIN; os fechos decididos no MAIN chegam ao nó como comandos assinados. Precisa de Comandos e Streams."
cluster_connections_on_done = "Fluxo de ligações ligado: o agente do nó guarda agora os espetadores."
cluster_connections_off_done = "Fluxo de ligações desligado: o nó volta a registar os espetadores no store do MAIN."
cluster_dataplane_flow = "Plano de dados"
cluster_dataplane_help = "Fluxo de plano de dados: quando ativado, o nó extrai fluxos retransmitidos e arquivos de outros servidores por meio do proxy de loopback de seu agente com tickets assinados, nunca com o segredo do fluxo em uma URL, e os pais recusam esse segredo de seu endereço. Precisa de fluxos e conteúdo."
cluster_dataplane_on_done = "Fluxo do plano de dados: os relés do nó e as leituras do arquivo passam por seu agente, com tickets. Os Streams começaram antes de manter seus URLs até reiniciarem."
cluster_dataplane_off_done = "Fluxo do plano de dados: o nó extrai relés e arquivos com os URLs legados novamente."
cluster_dataplane_needs_relay = "O agente deste nó não executa o proxy de retransmissão de loopback (seu hello Não Lista nenhum recurso de retransmissão): atualize xc_agent no nó antes de ativar o plano de dados."
cluster_relay_unbound = "porto do relé para baixo"
cluster_clock_off = "relógio {OFFSET}"
cluster_clock_degraded = "degradado (relógio) {OFFSET}"
cluster_clock_help = "O relógio do nó está desviado assim do de MAIN (nó − MAIN, pelo seu heartbeat). O agente dele corrige as próprias solicitações, mas o PHP, os crons e os logs do nó usam esse relógio. Passados 30 s isto avisa e passados 300 s o nó fica degradado; nenhum dos dois o cerca. Sincronize o NTP em ambos."
cluster_conn_differ = "as conexões diferem"
cluster_conn_resynced = "conexões ressincronizadas há {AGO}"
cluster_conn_help = "As conexões abertas do nó e o registro que o MAIN tem delas não coincidem (o resumo das conexões, verificado a cada 4 s). Duas divergências seguidas fazem o MAIN pedir ao nó todas as suas conexões, no máximo a cada 30 s. Se isso continuar voltando, eventos de conexão do nó estão sendo perdidos."
cluster_lane_lag = "{LANE} atrasado há {AGE}"
cluster_lane_lag_help = "Há {AGE}, os eventos {LANE} do nó esperam mais de 120 s para chegar ao MAIN. P0 leva o estado dos streams e das conexões, P1 os logs. O nó os guarda em disco e os envia assim que o MAIN volta a aceitá-los: verifique a ligação dele com o MAIN e execute server:diagnose no nó."
cluster_url_unreachable = "URL do MAIN inacessível"
cluster_url_unreachable_help = "O nó não alcança estas URLs de cluster do MAIN (conexão, TLS ou tempo esgotado) e usa outra: {URLS}. Verifique o firewall, o certificado e a porta entre eles."
cluster_relay_unbound_help = "O agente do nó não pode vincular a porta do proxy de relé de loopback (127.0.0.1:31290), portanto, seus relés de plano de dados e leituras de arquivo falham e são repetidos até que possam. Outro processo mantém a porta: liberte-a no nó. O último erro do agente:"
cluster_flow_needs = "Esse fluxo precisa de outro ligado primeiro: Ligações precisa de Comandos e Streams."
cluster_panel_fp = "Impressão digital do painel"
cluster_panel_fp_help = "SHA-256 da chave de assinatura do painel do MAIN. Num nó inscrito por código, o root fixa-a com: console.php cluster:pin-root <impressão digital>"
cluster_root_pin = "Fixação root"
cluster_root_ready_help = "Comandos root: a chave do painel fixada pelo root no nó corresponde à do agente; reboot, update e outras ações root vão como comandos assinados."
cluster_root_missing_help = "Sem fixação root neste nó: as ações root continuam na tabela de sinais. É fixada na instalação por SSH, ou no nó com: console.php cluster:pin-root <impressão digital do painel>"
cluster_core_pinned_help = "O xcvm_core do nó contém a chave deste painel (core.pin): julga a locação do nó em si, em um relógio que não pode ser movido para trás."
cluster_pin_core = "Núcleo Pin"
cluster_pin_core_help = "Fixe a chave deste painel no xcvm_core do nó agora, para que ele julgue o próprio lease do nó. MAIN também faz isso por conta própria dentro de um minuto de um nó recebendo comandos root."
cluster_pin_core_queued = "Enviado. O emblema principal aparece assim que o nó fixa a chave deste painel (primeiro, ele pode relatar seu install_id, quais registros principais)."
cluster_pin_core_no_root = "Este nó ainda não recebe comandos root: ative o fluxo de comandos e coloque o pin do root no lugar primeiro."
cluster_pin_core_no_root_key = "MAIN não tem nenhuma tecla de painel registada: executar consola.cluster php: init primeiro."
cluster_pin_core_not_queued = "O pin não pôde ser colocado na fila; consulte o log do cluster."
