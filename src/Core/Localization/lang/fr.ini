cluster_mode_two_warning = "Déplacer ce nœud en mode 2? À partir de son prochain battement de cœur, le nœud n'ouvre aucune connexion à MySQL ou Redis de MAIN, et les services d'arrière-plan du nœud redémarrent dans la minute qui suit. Toute fonctionnalité du nœud qui a encore besoin de la base de données PRINCIPALE cesse de fonctionner à partir de là; chaque tentative est répertoriée dans la zone Connexions de la base de données PRINCIPALE. AVERTISSEMENT: le bouton Mode bas annule ce déplacement uniquement pendant que le nœud conserve ses informations d'identification de base de données. Une fois que le bouton Supprimer les informations d'identification de la base de données est utilisé ou que le nœud est réinstallé alors qu'il est en mode 2, il n'y a aucun moyen de revenir en arrière à partir de cette page. Un mot de passe DB ou Redis qui est modifié pendant que le nœud est en mode 2 n'atteint pas non plus le nœud."
cluster_mode_moved = "Le mode de ce nœud n'est pas celui que cette page a montré: la page a été rechargée ou quelqu'un d'autre a déplacé le nœud. Rien n'a été changé. Vérifiez le nœud et appuyez à nouveau."
cluster_redis_handler_mode2 = "Le gestionnaire Redis ne peut pas être activé lorsqu'un équilibreur de charge est en mode cluster 2: un tel nœud peut ne pas ouvrir le Redis de MAIN, et chaque visualiseur dessus serait détourné. Déplacez d'abord ces nœuds vers le mode 1."
cluster_mode_down_revoked_confirm = "AVERTISSEMENT: les informations d'identification de la base de données de ce nœud ont été supprimées. Le déplacer vers le bas ne lui redonne pas la base de données PRINCIPALE: en mode 1, il n'aurait aucune base de données. Le déplacer vers le bas de toute façon?"
cluster_streams_not_local = "Flux non locaux"
cluster_streams_not_local_help = "Ce nœud dit qu'il ne peut pas lire ses flux sur lui-même, et en mode 2, il ne peut pas le reconstruire: ses flux ne sont ni démarrés ni supervisés. Déplacez-le d'un mode vers le bas, attendez une minute ou deux, puis remontez à nouveau."
cluster_config_flow = "Configuration"
cluster_connections_flow = "Connexions"
cluster_config_help = "Flux Config : activé, le nœud prend ses paramètres, ses serveurs, sa crontab, ses listes de blocage et son catalogue de flux dans la réplique que son agent récupère, au lieu de lire la base de données de MAIN. Nécessaire avant qu'un nœud puisse tourner en mode 2."
cluster_config_on_done = "Flux Config activé : le nœud lit désormais sa configuration dans la réplique."
cluster_config_off_done = "Flux Config désactivé : le nœud relit sa configuration dans la base de données de MAIN."
cluster_connections_help = "Flux des connexions : activé, le nœud enregistre ses spectateurs auprès de son agent (aucun appel WAN par requête) et l'agent les reflète sur MAIN ; les fermetures décidées sur MAIN arrivent au nœud en commandes signées. Nécessite Commandes et Streams."
cluster_connections_on_done = "Flux des connexions activé : l'agent du nœud détient désormais ses spectateurs."
cluster_connections_off_done = "Flux des connexions désactivé : le nœud enregistre de nouveau ses spectateurs dans le stockage de MAIN."
cluster_dataplane_flow = "Plan de données"
cluster_dataplane_help = "Flux du plan de données: lorsqu'il est activé, le nœud extrait les flux relayés et les fichiers des autres serveurs via le proxy de bouclage de son agent avec des tickets signés, jamais avec le secret du flux dans une URL, et les parents refusent ce secret de son adresse. A besoin de flux et de contenu."
cluster_dataplane_on_done = "Flux du plan de données activé: les relais et les lectures de fichiers du nœud passent par son agent, avec des tickets. Les flux démarrés avant conservent leurs URL jusqu'à leur redémarrage."
cluster_dataplane_off_done = "Écoulement du plan de données: le nœud extrait à nouveau les relais et les fichiers avec les URL héritées."
cluster_dataplane_needs_relay = "L'agent de ce nœud n'exécute pas le proxy de relais de bouclage (sa fonctionnalité hello ne répertorie aucun relais): mettez à jour xc_agent sur le nœud avant d'activer le plan de données."
cluster_relay_unbound = "port de relais vers le bas"
cluster_clock_off = "horloge {OFFSET}"
cluster_clock_degraded = "dégradé (horloge) {OFFSET}"
cluster_clock_help = "L'horloge du nœud s'écarte d'autant de celle de MAIN (nœud − MAIN, d'après son heartbeat). Son agent corrige ses propres requêtes, mais son PHP, ses crons et ses logs utilisent cette horloge. Au-delà de 30 s un avertissement s'affiche, et au-delà de 300 s le nœud est dégradé ; ni l'un ni l'autre ne le clôture. Synchronisez NTP sur les deux."
cluster_conn_differ = "les connexions diffèrent"
cluster_conn_resynced = "connexions resynchronisées il y a {AGO}"
cluster_conn_help = "Les connexions ouvertes du nœud et l'enregistrement qu'en a MAIN ne concordent pas (le résumé des connexions, vérifié toutes les 4 s). Deux écarts de suite font que MAIN demande au nœud toutes ses connexions, au plus toutes les 30 s. Si cela revient sans cesse, des événements de connexion du nœud sont perdus."
cluster_lane_lag = "{LANE} en retard depuis {AGE}"
cluster_lane_lag_help = "Depuis {AGE}, les événements {LANE} du nœud attendent plus de 120 s pour atteindre MAIN. P0 porte l'état des flux et des connexions, P1 les journaux. Le nœud les garde sur disque et les envoie dès que MAIN les accepte de nouveau : vérifiez son lien avec MAIN, et lancez server:diagnose sur le nœud."
cluster_url_unreachable = "URL de MAIN injoignable"
cluster_url_unreachable_help = "Le nœud n'atteint pas ces URL de cluster de MAIN (connexion, TLS ou délai dépassé) et en utilise une autre : {URLS}. Vérifiez le pare-feu, le certificat et le port entre les deux."
cluster_relay_unbound_help = "L'agent du nœud ne peut pas lier le port de son proxy de relais de bouclage (127.0.0.1: 31290), de sorte que ses relais de plan de données et ses lectures de fichiers échouent et sont réessayés jusqu'à ce qu'il le puisse. Un autre processus retient le port: libérez-le sur le nœud. La dernière erreur de l'agent:"
cluster_flow_needs = "Ce flux en nécessite un autre activé d'abord : Connexions nécessite Commandes et Streams."
cluster_panel_fp = "Empreinte du panel"
cluster_panel_fp_help = "SHA-256 de la clé de signature du panel de MAIN. Sur un nœud inscrit par code, root l'épingle avec : console.php cluster:pin-root <empreinte>"
cluster_root_pin = "Épinglage root"
cluster_root_ready_help = "Commandes root : la clé du panel épinglée par root sur le nœud correspond à celle de l'agent ; reboot, update et autres actions root passent en commandes signées."
cluster_root_missing_help = "Pas d'épinglage root sur ce nœud : les actions root restent dans la table des signaux. Épinglé à l'installation SSH, ou sur le nœud : console.php cluster:pin-root <empreinte du panel>"
cluster_core_pinned_help = "Le xcvm_core du nœud contient la clé de ce panneau (core.pin): il juge le bail du nœud lui-même, sur une horloge qui ne peut pas être reculée."
cluster_pin_core = "Noyau de broche"
cluster_pin_core_help = "Épinglez maintenant la clé de ce panneau dans le xcvm_core du nœud, afin qu'il juge le bail du nœud lui-même. MAIN le fait également tout seul dans la minute qui suit la prise de commandes root par un nœud."
cluster_pin_core_queued = "Envoyé. Le badge principal apparaît une fois que le nœud a épinglé la clé de ce panneau (il peut d'abord signaler son install_id, qui enregistre PRINCIPAL)."
cluster_pin_core_no_root = "Ce nœud ne prend pas encore les commandes root: activez son flux de COMMANDES et mettez d'abord le code PIN de root en place."
cluster_pin_core_no_root_key = "MAIN n'a pas de clé de panneau enregistrée: exécutez la console.cluster php: initialisez d'abord."
cluster_pin_core_not_queued = "Le code PIN n'a pas pu être mis en file d'attente; voir le journal du cluster."
cluster_strip_credentials = "Supprimer les informations d'identification de base de données"
cluster_strip_credentials_help = "Supprimez la base de données PRINCIPALE et les informations d'identification Redis de la configuration de ce nœud.enc, puis révoque sa subvention de base de données. Uniquement pour un nœud actif en mode 2. Il n'y a pas d'annulation à partir de cette page: le retour en arrière nécessite une nouvelle configuration et une nouvelle subvention."
cluster_strip_credentials_confirm = "Supprimer la base de données PRINCIPALE et les informations d'identification Redis de ce nœud et révoquer son octroi de base de données? Le nœud continue de fonctionner via l'API du cluster, mais ne peut plus accéder à la base de données PRINCIPALE. La restauration nécessite une nouvelle configuration et une nouvelle subvention."
cluster_strip_too_soon = "Ce nœud n'est pas encore en mode 2 depuis sept jours. La suppression de ses informations d'identification de base de données ne peut pas être annulée, il attend donc: jusque-là, le mode down est le chemin du retour."
cluster_strip_not_local = "Ce nœud dit qu'il ne peut pas lire ses flux sur lui-même. Le mode down est la façon dont cela guérit, et il a besoin de ces informations d'identification: corrigez cela en premier."
cluster_strip_queued = "Envoyé. Lorsque le nœud signale que sa configuration ne contient aucune information d'identification, MAIN révoque son octroi de base de données (journal du cluster: nœud.db_revoked)."
cluster_strip_needs_mode2 = "Seul un nœud en mode 2 abandonne les informations d'identification de MAIN: il doit déjà fonctionner sans la base de données de MAIN."
cluster_strip_not_active = "Le nœud n'est pas actif; il abandonne les informations d'identification de MAIN uniquement lorsqu'il l'est."
cluster_strip_not_queued = "La commande n'a pas pu être mise en file d'attente; consultez le journal du cluster."
cluster_db_revoked = "DB révoqué"
cluster_db_revoked_help = "Le nœud a abandonné la base de données de MAIN et les informations d'identification Redis, et MAIN a révoqué son octroi de base de données à ce moment-là."
cluster_config_needs_install_id = "MAIN ne connaît pas encore l'install_id de ce nœud: épinglez d'abord son noyau (Pin core), qui l'enregistre."
cluster_config_no_extension = "xcvm_core de MAIN ne peut pas emballer les configurations de nœud: mettez à jour xcvm_core."
cluster_config_not_queued = "La configuration du nœud n'a pas pu être compressée ou mise en file d'attente; voir le journal du cluster."
cluster_settings_misses = "Paramètres manquants"
cluster_settings_misses_help = "Paramètres que le nœud a lus ces 7 derniers jours et que sa réplique ne porte pas (hors de la liste autorisée des paramètres de LB), tels que son agent les signale en modes 1 et 2. Une fois la réplique propriétaire des paramètres du nœud, une telle lecture ne trouve rien."
cluster_main_connects = "Connexions à la BD de MAIN"
cluster_main_connects_tip = "Connexions le nœud s'est ouvert à MySQL et Redis de MAIN au cours des 7 derniers jours, avec le code qui les a ouverts, car son agent les signale en mode 1 et 2. Un nœud en mode 1 se connecte tout le temps, de par sa conception. Lorsqu'il entre en mode 2, le décompte recommence, et chacun affiché à partir de là a été refusé: il nomme quelque chose sur le nœud qui a encore besoin de la base de données PRINCIPALE."
cluster_connects_since = "Comptées depuis"
cluster_fence_window = "Sert sans PLAT PRINCIPAL jusqu'à"
cluster_fence_window_help = "Combien de temps ce nœud peut continuer à servir une fois qu'il ne peut plus atteindre MAIN: l'expiration de son jeton plus la tolérance de partition (le bail PRINCIPAL signe avec chaque jeton, au plus 26 h après son émission), puis le drain de clôture. Il ne s'arrête là qu'avec la clôture du bail allumée."
cluster_fence_drain = "égoutter à {TIME}"
cluster_fence_on = "clôture sur"
cluster_fence_off = "clôturez"
cluster_queue = "File d'Attente"
cluster_queue_help = "Commandes mises en file d'attente pour ce nœud qu'il n'a pas encore acquitté."
cluster_rotate_all = "Faites pivoter tous les jetons maintenant"
cluster_rotate_all_help = "Frappez à nouveau le jeton de chaque nœud actif lors de son prochain sondage, comme le fait le jeton de rotation pour un nœud. Un deuxième clic remplace une rotation toujours en attente plutôt que d'en ajouter une."
cluster_rotate_all_done = "La rotation des jetons a été mise en file d'attente pour {QUEUED} nœud(s); {SKIPPED} sans le flux de commandes a été ignoré; {FAILED} n'a pas pu être mis en file d'attente."
cluster_banner_licence = "La licence est suspendue: MAIN ne signe aucun nouveau jeton ou bail pour les nœuds."
cluster_banner_licence_stop = "La licence est suspendue: signes PRINCIPAUX pas de nouveaux baux, et nœuds qui ne peuvent pas obtenir un arrêt de service au plus tard à {TIME} (clôture du bail activée). Re-licence PRINCIPALE pour les garder à l'antenne."
cluster_banner_licence_no_fence = "La licence est suspendue: MAIN ne signe aucun nouveau bail. La clôture du bail est désactivée, de sorte que les nœuds continuent à servir seuls; re-licence PRINCIPALE."
cluster_banner_cert_expiring = "Le certificat HTTPS de MAIN expire le {DATE} ({DAYS} jours) alors que le transport du cluster est {TRANSPORT}: renouvelez-le avant que les nœuds ne perdent HTTPS vers MAIN."
cluster_banner_cert_expired = "Le certificat HTTPS de MAIN a expiré le {DATE} alors que le transport du cluster est {TRANSPORT}: les nœuds ne peuvent pas vérifier MAIN via HTTPS. Renouvelez-le."
