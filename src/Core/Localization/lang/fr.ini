if_you_have_a_fast_tooltip = "Si vous avez un SSD NVMe rapide, vous pouvez désactiver le disque virtuel pour permettre l'exécution et la sortie de flux à partir de votre disque. Plus vite que vous ne le pensez, mais vous pourriez rencontrer un goulot d'étranglement IO en fonction de vos connexions. La mise à jour de ce paramètre prendra environ une minute car il nécessite un accès root."
