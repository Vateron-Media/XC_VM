profile_success = "Le profil a été ajouté / modifié."
profile_tooltip_1 = "Un préréglage est un ensemble d'options qui fourniront une certaine vitesse d'encodage au rapport de compression. Un préréglage plus lent fournira une meilleure compression (la compression est la qualité par taille de fichier). Cela signifie que, par exemple, si vous ciblez une certaine taille de fichier ou un débit binaire constant, vous obtiendrez une meilleure qualité avec un préréglage plus lent. De même, pour un encodage de qualité constante, vous économiserez simplement le débit binaire en choisissant un préréglage plus lent."
profile_tooltip_10 = "Modifiez l'aspect de la vidéo cible. (eg 16: 9)"
profile_tooltip_11 = "Réglez le framerate."
profile_tooltip_12 = "Réglez la fréquence d'échantillonnage audio en Hz."
profile_tooltip_13 = "Réglez les canaux audio."
profile_tooltip_14 = "Spécifiez le nombre de threads que vous souhaitez utiliser pour le processus de transcodage. Entrer 0 comme valeur obligera FFmpeg à choisir les paramètres les plus optimaux."
profile_tooltip_15 = "Avec ce filtre, vous pouvez supprimer les parties sensibles de votre vidéo. Vous allez simplement spécifier les pixels x et y où il y a une zone sensible et la largeur et la hauteur qui seront supprimées. Exemple d'utilisation: x=0: y = 0: l = 100: h = 77: bande=10"
profile_tooltip_16 = "Ajoutez votre propre logo au flux. Le logo sera placé en haut à gauche. Assurez-vous d'avoir sélectionné H. 264 comme codec sinon cette option ne fonctionnera pas. Notez que l'ajout de votre propre logo consommera BEAUCOUP de puissance cpu."
profile_tooltip_2 = "Définissez le profil vidéo, Principal, de base ou Élevé."
profile_tooltip_3 = "Avec cela, vous pouvez modifier le débit binaire de la vidéo cible. C'est très utile si vous souhaitez que votre vidéo soit lisible sur des connexions Internet lentes."
profile_tooltip_4 = "Changer le débit audio."
profile_tooltip_5 = "- minrate l'argument FFmpeg. Spécifiez ici la tolérance minimale de débit binaire en kbps. Entrez uniquement le numéro."
profile_tooltip_6 = "- paramètre FFmpeg maxrate. Spécifiez ici la tolérance de débit binaire maximale en kbps. Entrez uniquement le numéro."
profile_tooltip_7 = "- bufsize est le tampon de contrôle de débit. Fondamentalement, il est supposé que le récepteur / lecteur final mettra en mémoire tampon autant de données, il est donc normal de fluctuer autant. Spécifiez en kbit / s."
profile_tooltip_8 = "La plage de l'échelle du quantificateur est comprise entre 0 et 51: où 0 est sans perte, 23 est la valeur par défaut et 51 est la pire possible. Une valeur inférieure est une qualité supérieure et une plage subjectivement saine est de 18 à 28. Considérez que 18 est visuellement sans perte ou presque: il devrait avoir la même apparence ou presque que l'entrée, mais il n'est pas techniquement sans perte. La plage est exponentielle, donc l'augmentation de la valeur CRF +6 correspond à peu près à la moitié du débit binaire tandis que -6 correspond à peu près au double du débit binaire. L'usage général est de choisir la valeur CRF la plus élevée qui fournit toujours une qualité acceptable. Si la sortie semble bonne, essayez une valeur plus élevée et si elle semble mauvaise, choisissez une valeur inférieure."
profile_tooltip_9 = "Modifiez la largeur et la hauteur de la vidéo cible. (Par Ex. 320:240 ).  Si nous souhaitons conserver le rapport hauteur / largeur, nous devons spécifier un seul composant, largeur ou hauteur, et définir l'autre composant sur -1. (eg 320: -1)"
