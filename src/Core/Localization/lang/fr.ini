when_enabled_ffmpeg_pids_will_tooltip = "Lorsqu'il est activé, les PID ffmpeg seront analysés toutes les minutes à la recherche de flux qui ne devraient pas être en direct et supprimés en conséquence. Cela s'exécutera également lors du démarrage d'un flux pour s'assurer que toutes les instances en cours d'exécution sont suffisamment supprimées."
when_memory_usage_is_above_tooltip = "Lorsque l'utilisation de la mémoire est supérieure à ce pourcentage, un avertissement s'affiche dans la zone d'état du service."
when_network_usage_is_above_tooltip = "Lorsque l'utilisation du réseau est supérieure à ce pourcentage, un avertissement s'affiche dans la zone d'état du service."
when_number_of_clients_as_tooltip = "Lorsque le nombre de clients en pourcentage du nombre maximum de clients serveur est supérieur à ce pourcentage, il s'affichera comme un avertissement dans la zone État du service."
when_the_request_limit_is_tooltip = "Lorsque la limite de demandes est atteinte, les demandes excédentaires sont supprimées par défaut. Vous pouvez pousser ces demandes dans une file d'attente qui sera traitée dans l'ordre plutôt que simultanément. Cela aidera à faciliter la circulation du trafic et à s'assurer que le service n'est pas perturbé par la limitation du débit."
when_using_direct_source_hide_tooltip = "Lorsque vous utilisez la source directe, masquez l'URL d'origine en mandatant le film via vos serveurs. Cela consommera de la bande passante mais ne nécessitera pas l'enregistrement permanent du film sur vos serveurs. Assurez-vous de définir le conteneur cible correct."
when_using_direct_source_hide_tooltip_title = "Lorsque vous utilisez la source directe, masquez l'URL d'origine en mandatant le flux en direct via vos serveurs via UDP. MPEG-TS et HLS sont pris en charge comme format d'entrée, mais seul MPEG-TS est pris en charge comme format de sortie pour les clients.<br/> <br/>Expérimental! Cela peut ne pas fonctionner pour tous les flux."
when_you_request_a_stream_tooltip = "Lorsque vous demandez un flux à la demande, demandez au fournisseur d'envoyer un pré-tampon afin que le flux démarre plus rapidement. Cela ne fonctionnera que si votre fournisseur utilise XC_VM. Le pré-tampon signifiera que votre source pourrait avoir environ 10 secondes de retard, mais elle se chargera beaucoup plus rapidement.<br/> <br/>Sur-URL signifie ajouter automatiquement ?prebuffer = 1 à l'URL, On-Header envoie la demande de pré-tampon en tant qu'en-tête à la place. Les demandes d'en-tête ne sont acceptées que lors de la demande à partir de XC_VM v1.4. 4+"
whether_to_use_guessit_or_tooltip = "Indique s'il faut utiliser GuessIt ou PTN pour analyser les noms de fichiers pour le dossier de surveillance, etc. Deviner est bien meilleur mais utilise plus de ressources."
whether_to_use_modern_or_tooltip = "Indique s'il faut utiliser un thème moderne ou hérité par défaut pour les appareils nouvellement ajoutés."
whether_to_use_progress_info_tooltip = "Indique s'il faut utiliser les informations de progression après le délai de démarrage pour déterminer le FPS réel ou sonder le segment pour renvoyer avg_frame_rate."
which_network_interface_to_use_for_statistics = "Quelle interface réseau utiliser pour les statistiques."
which_version_of_ffmpeg_to_tooltip = "Quelle version de FFMPEG utiliser pour les films, les chaînes créées et les flux normaux.<br/> <br/>v4. 0 - Version héritée de 2018, livrée avec XC_VM à l'origine.<br/>v7. 1 et v8. 0-Versions modernes avec prise en charge complète des codecs, DASH et NVENC."
write_a_custom_sysctlconf_to_tooltip = "Écrivez un sysctl personnalisé.conf au serveur. Vous pouvez casser votre serveur en saisissant des valeurs incorrectes ici, ceci est uniquement pour une utilisation avancée. Le modèle par défaut est fourni à des fins de restauration et d'information."
xcvm_was_the_first_to_tooltip = "XC_VM a été le premier à ajouter plusieurs catégories, ce qui signifie que la plupart des applications ne le prennent pas en charge. Le comportement par défaut de l'API est d'afficher l'élément une fois lorsque TOUT est demandé, mais les applications ont tendance à demander tous les flux, puis à les filtrer elles-mêmes en catégories. Cette option modifiera le comportement par défaut pour afficher le flux dupliqué pour chaque catégorie supplémentaire, de sorte que le flux s'affiche correctement dans chaque catégorie. L'inconvénient est que lors de la recherche ou de l'affichage de toutes les catégories, le flux apparaîtra plusieurs fois."
year = "Année"
