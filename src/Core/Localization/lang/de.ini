how_long_should_the_client_tooltip = "Wie lange sollte der Client auf den Start eines On-Demand-Streams warten. Nach Ablauf dieser Zeit wird die Verbindung geschlossen. Dies gilt auch für normale Streams, während sie starten oder noch nicht verfügbar sind."
how_long_to_allow_mysql_tooltip = "Wie lange MySQL-Verbindungen im Ruhezustand bleiben sollen, bevor sie beendet werden. Zum Deaktivieren auf 0 setzen."
how_long_to_analyse_a_tooltip = "Wie lange ein Stream analysiert werden soll, eine längere Dauer erhöht die Probengenauigkeit. 5.000.000 Mikrosekunden = 5 Sekunden."
how_long_to_sleep_for_tooltip = "Wie lange man wann schläft, wenn das Limit erreicht ist. Die Anfrage wird nach diesem Schlaf fortgesetzt."
how_long_to_track_stream_tooltip = "Wie lange Stream-Fehler auf der Streams-Ansichtsseite verfolgt werden sollen. Schlägt pro X Sekunden fehl."
how_long_to_wait_after_tooltip = "Wie lange nach der Analysedauer gewartet werden muss, bevor die Stream-Probe abgebrochen wird."
how_long_to_wait_between_tooltip = "Wie lange zwischen Warteschlangenprüfungen gewartet werden muss. Wenn Sie Inhalte symbolisieren, sollten Sie dies auf 1 Sekunde einstellen."
how_long_to_wait_in_tooltip = "Wie lange in Sekunden nach einem Stream-Startfehler gewartet werden soll, bevor erneut gestartet wird."
how_many_failures_before_exiting_tooltip = "Wie viele Fehler vor dem Beenden von Stream Monitor. Wenn beispielsweise 3 eingestellt ist, lässt der Stream-Monitor 3 Fehler zu, bricht ab und der Monitor wird beim nächsten Minutenmarker vom Stream-Cron neu gestartet. Wenn auf 0 gesetzt, werden die Streams für immer neu gestartet."
how_many_login_attempts_are_tooltip = "Wie viele Anmeldeversuche sind zulässig, bevor die IP-Adresse gesperrt wird. Verwenden Sie 0 für unbegrenzt, oder wenn Sie andere Maßnahmen wie reCAPTCHA oder Zugangscode haben."
how_many_old_segments_to_tooltip = "Wie viele alte Segmente beim Generieren einer HLS-Wiedergabeliste beibehalten werden sollen. Wenn Sie dies verringern, wird die RAM-Auslastung verringert, aber es ist gut, einen Puffer für die Verbindung von Clients vorzuhalten. Ein 30-Sekunden-Vorpuffer würde beispielsweise 3 x 10-Sekunden-Segmente benötigen, um zu funktionieren."
how_many_phpfpm_daemons_to_tooltip = "Wie viele PHP-FPM-Daemons auf diesem Server ausgeführt werden sollen. Sie können maximal einen pro Kern verwenden."
how_many_search_results_to_display_maximum_of_100 = "Wie viele Suchergebnisse angezeigt werden sollen. Maximal 100."
how_many_seconds_to_keep_tooltip = "Wie viele Sekunden lang Protokolle aufbewahrt werden sollen. Dies wirkt sich auf Ihre Aufwärts- und Abwärtsstatistiken auf der Protokollseite aus. Standard ist 604800, 1 Woche."
how_many_seconds_to_probe_the_stream_for_before_cancelling = "Wie viele Sekunden soll der Stream geprüft werden, bevor er abgebrochen wird."
how_much_data_in_seconds_tooltip = "Wie viele Daten in Sekunden an den Client gesendet werden, wenn eine Verbindung zu einem Stream hergestellt wird. Größere Werte erzeugen größere Vorpuffer."
how_often_to_scan_a_stream_in_seconds = "Wie oft ein Stream in Sekunden gescannt werden soll."
if_an_identical_stream_name_tooltip = "Wenn ein identischer Stream-Name gefunden wird oder die XMLTV-ID mit einem vorhandenen Stream übereinstimmt, wird die Quelle als Backup hinzugefügt. Die bestehenden Stream-Optionen werden beibehalten."
if_an_ondemand_stream_fails_tooltip = "Wenn ein On-Demand-Stream nicht gestartet werden kann, versuchen Sie es nicht erneut, brechen Sie den Stream ab und trennen Sie die Verbindung zum Client. Es wird bei der nächsten Verbindung erneut versucht, stellt jedoch sicher, dass es nicht ewig sitzt und versucht, beispielsweise Quellverbindungen zu starten und zu verwenden."
if_selected_this_user_will_tooltip = "Wenn ausgewählt, wird dieser Benutzer nicht für das erneute Streamen von Kanälen blockiert."
if_the_source_exists_overwrite_tooltip = "Wenn die Quelle vorhanden ist, überschreiben Sie sie mit den neuen Titel- und Stream-Optionen."
if_this_option_is_set_tooltip = "Wenn diese Option gesetzt ist, werden Bilder beispielsweise von TMDb auf den Hauptserver heruntergeladen."
if_this_value_is_more_tooltip = "Wenn dieser Wert größer als 0 ist, werden von Clients heruntergeladene Wiedergabelisten für so viele Sekunden in einer Datei zwischengespeichert. Dies kann viel Speicherplatz beanspruchen, wenn Sie viele Clients haben, spart jedoch viele Ressourcen in der Ausführungszeit."
if_you_have_a_fast_tooltip = "Wenn Sie eine schnelle NVMe-SSD haben, können Sie Ramdisk deaktivieren, damit Streams von Ihrer Festplatte ausgeführt und ausgegeben werden können. Schneller als Sie denken, aber abhängig von Ihren Verbindungen könnten Sie auf einen E / A-Engpass stoßen. Die Aktualisierung dieser Einstellung dauert ungefähr eine Minute, da Root-Zugriff erforderlich ist."
in_this_field_you_can_tooltip = "In dieses Feld können Sie Ihren eigenen benutzerdefinierten FFmpeg-Befehl schreiben. Bitte beachten Sie, dass dieser Befehl nach der Eingabe und vor der Ausgabe platziert wird. Wenn der Befehl, den Sie hier angeben, Änderungen am Ausgabevideo oder -audio vornimmt, muss der Stream möglicherweise transkodiert werden. In diesem Fall müssen Sie mindestens die Video- / Audio-Codecs mit den folgenden Transkodierungsattributen verwenden und ändern. Der benutzerdefinierte Befehl FFmpeg wird nur von den Servern verwendet, die den Stream von der Quelle übernehmen."
installation_failed = "Installation fehlgeschlagen!"
installing = "Installieren..."
