limit_vod_after_x_has_tooltip = "Begrenzen Sie VOD, nachdem x% gestreamt wurde. Verwenden Sie 0, um sofort zu begrenzen, und 100, um vollständig auszuschalten."
link_multiple_streams_together_when_tooltip = "Verknüpfen Sie mehrere Streams miteinander Wenn HLS angefordert wird, wählt der Player basierend auf der verfügbaren Bandbreite einen geeigneten Stream aus. Die ausgewählten Streams müssen nicht im Bouquet der Linie oder überhaupt in einem Bouquet enthalten sein. MPEG-TS spielt diesen Stream normal ab."
load_all_channel_listings_on_tooltip = "Laden Sie alle Senderlisten beim Start, anstatt bei der Auswahl einer Kategorie. Dies kann für einige ältere Geräte nützlich sein, die nicht den Ministra-Standards entsprechen."
