number_of_attempts_before_connections_tooltip = "Anzahl der Versuche, bevor Verbindungen verlangsamt werden. Geben Sie 0 ein, um die autorisierte Hochwassererkennung zu deaktivieren.<br/><br/>Dies ist vom normalen Flood-Limit getrennt, da es nur legitime Clients mit gültigen Anmeldeinformationen betrifft. Als Beispiel können Sie dies so einrichten, dass nach 30 Verbindungen in 10 Sekunden die Anforderungen für die nächsten 10 Sekunden zuerst 1 Sekunde lang in den Ruhezustand versetzt werden, um sie zu verlangsamen."
