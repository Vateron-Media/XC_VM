profile_tooltip_1 = "Eine Voreinstellung ist eine Sammlung von Optionen, die ein bestimmtes Verhältnis von Kodierungsgeschwindigkeit zu Komprimierung bereitstellen. Eine langsamere Voreinstellung bietet eine bessere Komprimierung (Komprimierung ist Qualität pro Dateigröße). Dies bedeutet, dass Sie beispielsweise, wenn Sie eine bestimmte Dateigröße oder eine konstante Bitrate anstreben, mit einer langsameren Voreinstellung eine bessere Qualität erzielen. Ebenso sparen Sie für eine Kodierung mit konstanter Qualität einfach die Bitrate, indem Sie eine langsamere Voreinstellung auswählen."
profile_tooltip_10 = "Ändern Sie den Aspekt des Zielvideos. (z. B. 16:9)"
profile_tooltip_11 = "Stellen Sie die Framerate ein."
profile_tooltip_12 = "Stellen Sie die Audio-Abtastrate in Hz ein."
profile_tooltip_13 = "Stellen Sie die Audiokanäle ein."
profile_tooltip_14 = "Geben Sie die Anzahl der Threads an, die Sie für den Transcodierungsprozess verwenden möchten. Wenn Sie 0 als Wert eingeben, wird FFmpeg die optimalen Einstellungen auswählen."
profile_tooltip_15 = "Mit diesem Filter können Sie empfindliche Teile in Ihrem Video entfernen. Sie geben nur die x- und y-Pixel an, in denen sich ein empfindlicher Bereich befindet, sowie die Breite und Höhe, die entfernt werden sollen. Anwendungsbeispiel: x=0: y=0: b=100: h=77: Band=10"
profile_tooltip_16 = "Fügen Sie dem Stream Ihr eigenes Logo hinzu. Das Logo wird oben links platziert. Bitte stellen Sie sicher, dass Sie H.264 als Codec ausgewählt haben, da diese Option sonst nicht funktioniert. Beachten Sie, dass das Hinzufügen Ihres eigenen Logos SEHR viel CPU-Leistung verbraucht."
profile_tooltip_2 = "Stellen Sie das Videoprofil, Main, Baseline oder High ein."
profile_tooltip_3 = "Damit können Sie die Bitrate des Zielvideos ändern. Dies ist sehr nützlich, wenn Sie möchten, dass Ihr Video auf langsamen Internetverbindungen abgespielt werden kann."
profile_tooltip_4 = "Audio-Bitrate ändern."
profile_tooltip_5 = "-minrate FFmpeg Argument. Geben Sie hier die minimale Bitratentoleranz in kbit/ s an. Geben Sie nur die Nummer ein."
profile_tooltip_6 = "-maxrate FFmpeg Argument. Geben Sie hier die maximale Bitratenabweichung in kbit/s an. Geben Sie nur die Nummer ein."
profile_tooltip_7 = "-bufsize ist der Ratensteuerungspuffer. Grundsätzlich wird davon ausgegangen, dass der Empfänger / Endspieler so viele Daten puffert, dass es in Ordnung ist, innerhalb dieser Daten zu schwanken. Geben Sie in kbit / s an."
profile_tooltip_8 = "Der Bereich der Quantisierungsskala ist 0-51: wobei 0 verlustfrei ist, 23 die Standardeinstellung ist und 51 das schlechteste ist. Ein niedrigerer Wert ist eine höhere Qualität und ein subjektiv vernünftiger Bereich ist 18-28. Betrachten Sie 18 als visuell verlustfrei oder fast verlustfrei: Es sollte genauso oder fast so aussehen wie die Eingabe, aber es ist technisch nicht verlustfrei. Der Bereich ist exponentiell, sodass eine Erhöhung des CRF-Werts +6 ungefähr der halben Bitrate entspricht, während -6 ungefähr der doppelten Bitrate entspricht. Im Allgemeinen wird der höchste CRF-Wert gewählt, der noch eine akzeptable Qualität bietet. Wenn die Ausgabe gut aussieht, versuchen Sie einen höheren Wert und wenn sie schlecht aussieht, wählen Sie einen niedrigeren Wert."
profile_tooltip_9 = "Ändern Sie die Breite und Höhe des Zielvideos. (Z. 320:240 ).  Wenn wir das Seitenverhältnis beibehalten möchten, müssen wir nur eine Komponente angeben, entweder Breite oder Höhe, und die andere Komponente auf -1 setzen. (z. B. 320:-1)"
