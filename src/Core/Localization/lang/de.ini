here_you_can_specify_the_tooltip = "Hier können Sie die SID des Kanals angeben, um mit dem EPG auf den enigma2-Geräten zu arbeiten. Sie müssen den Code mit dem ':' angeben, jedoch ohne die erste Zahl, 1 oder 4097. Beispiel: Wenn wir diesen Code haben: '1:0:1:13f: 157c:13e:820000:0:0:0:2097' dann müssen Sie dieses Feld hinzufügen: ':0:1:13f: 157c: 13e:820000:0:0:0:'"
hide_streams_that_arent_compatible_tooltip = "Streams ausblenden, die mit den meisten Browsern nicht kompatibel sind.Dadurch werden Streams hauptsächlich auf H264 und AV1 beschränkt. Diese Option blendet auch Streams und Filme aus, die nicht verfügbar sind."
how_long_in_seconds_before_tooltip = "Wie lange in Sekunden, bevor eine Umleitung vom Hauptserver zu einem Load Balancer abläuft. Wenn Sie viele TOKEN_EXPIRED Fehler in Ihren Protokollen erhalten, erhöhen Sie diese."
