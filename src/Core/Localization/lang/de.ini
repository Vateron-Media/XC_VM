maximum_number_of_movies_to_tooltip = "Maximale Anzahl von Filmen, die gleichzeitig pro Server codiert werden sollen. Wenn Ihr gesamter Inhalt symbolisch verlinkt ist, können Sie dies auf eine höhere Zahl setzen, andernfalls legen Sie fest, wie viele Codierungen Ihre Server realistisch gleichzeitig ausführen können, ohne sie zu überlasten."
