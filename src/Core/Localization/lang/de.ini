max_number_of_simultaneous_epg_tooltip = "Maximale Anzahl gleichzeitiger EPG- und Playlist-Downloads pro Benutzer (Restreamer sind nicht betroffen). Alle zusätzlichen Anfragen werden mit einem Fehler 429 Too Many Requests bearbeitet. Setzen Sie dies zum Deaktivieren auf 0."
maximum_amount_of_connections_a_tooltip = "Maximale Anzahl von Verbindungen, die eine Leitung haben kann, bevor Disallow 2nd IP deaktiviert wird. Wenn Sie dies auf 3 setzen, wird jede Leitung mit 3 oder weniger Verbindungen getrennt, wenn sie von einer anderen IP-Adresse aus verbunden wird."
