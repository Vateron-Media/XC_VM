message_to_display_when_a_tooltip = "Nachricht, die angezeigt wird, wenn ein Benutzer Informationen auf der Registerkarte Mein Konto auswählt. Der eingegebene Text sollte im HTML-Format vorliegen, obwohl Zeilenumbrüche in <br/> konvertiert werden."
