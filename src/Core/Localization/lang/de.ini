verify_useragent_ip_restrictions_isp_tooltip = "Überprüfen Sie den Benutzeragenten, die IP-Beschränkungen, den Internetanbieter und die Länderbeschränkungen, bevor Sie den Download von Wiedergabelisten / EPGs zulassen. Wenn deaktiviert, kann die Wiedergabeliste von jeder IP heruntergeladen werden, aber für Streams selbst gelten weiterhin Einschränkungen."
view_all_servers = "Alle Server anzeigen"
view_movie = "Film ansehen"
when_a_client_disconnects_from_tooltip = "Wenn ein Client die Verbindung zu einem On-Demand-Stream trennt, überprüfen Sie die aktuelle Gesamtzahl der Verbindungen für diesen Stream und deaktivieren Sie ihn, wenn niemand zusieht."
when_enabled_ffmpeg_pids_will_tooltip = "Wenn aktiviert, werden ffmpeg-PIDs jede Minute nach Streams gescannt, die nicht live sein sollten, und entsprechend beendet. Dies wird auch beim Starten eines Streams ausgeführt, um sicherzustellen, dass alle laufenden Instanzen ausreichend entfernt werden."
when_the_request_limit_is_tooltip = "Wenn das Anforderungslimit erreicht ist, werden überschüssige Anforderungen standardmäßig gelöscht. Sie können diese Anforderungen in eine Warteschlange stellen, die der Reihe nach und nicht gleichzeitig erfüllt wird. Dies wird dazu beitragen, den Verkehrsfluss zu erleichtern und sicherzustellen, dass der Dienst nicht durch die Ratenbegrenzung gestört wird."
when_using_direct_source_hide_tooltip = "Wenn Sie die direkte Quelle verwenden, blenden Sie die ursprüngliche URL aus, indem Sie den Film über Ihre Server weiterleiten. Dies verbraucht Bandbreite, erfordert jedoch nicht, dass der Film dauerhaft auf Ihren Servern gespeichert wird. Stellen Sie sicher, dass Sie den richtigen Zielcontainer eingestellt haben."
when_using_direct_source_hide_tooltip_title = "Wenn Sie die direkte Quelle verwenden, blenden Sie die ursprüngliche URL aus, indem Sie den Live-Stream über UDP über Ihre Server übertragen. MPEG-TS und HLS werden als Eingabeformat unterstützt, jedoch wird nur MPEG-TS als Ausgabeformat für Clients unterstützt.<br/><br/>Experimentell! Dies funktioniert möglicherweise nicht für alle Streams."
when_you_request_a_stream_tooltip = "Wenn Sie bei Bedarf einen Stream anfordern, bitten Sie den Provider, einen Vorpuffer zu senden, damit der Stream schneller startet. Dies funktioniert nur, wenn Ihr Provider XC_VM verwendet. Der Vorpuffer bedeutet, dass Ihre Quelle etwa 10 Sekunden zurückliegen könnte, aber sie wird wesentlich schneller geladen.<br/><br/>On - URL bedeutet automatisch anhängen?prebuffer=1 an die URL, On - Header sendet stattdessen die Prebuffer-Anforderung als Header. Header-Anfragen werden nur akzeptiert, wenn sie von XC_VM v1.4.4+ angefordert werden"
whether_to_use_guessit_or_tooltip = "Ob GuessIt oder PTN verwendet werden soll, um Dateinamen für Überwachungsordner usw. zu analysieren. GuessIt ist viel besser, verbraucht aber mehr Ressourcen."
whether_to_use_modern_or_tooltip = "Gibt an, ob für neu hinzugefügte Geräte standardmäßig ein modernes oder ein älteres Design verwendet werden soll."
whether_to_use_progress_info_tooltip = "Gibt an, ob Fortschrittsinformationen nach der Startverzögerung verwendet werden sollen, um echte FPS zu bestimmen oder das Segment zu untersuchen, um avg_frame_rate zurückzugeben."
which_network_interface_to_use_for_statistics = "Welche Netzwerkschnittstelle für Statistiken verwendet werden soll."
which_version_of_ffmpeg_to_tooltip = "Welche Version von FFMPEG für Filme, erstellte Kanäle und normale Streams verwendet werden soll.<br/><br/>v4.0 - Legacy-Version von 2018, ursprünglich mit XC_VM ausgeliefert.<br/>v7.1 & v8.0 - Moderne Versionen mit voller Codec-Unterstützung, DASH und NVENC."
write_a_custom_sysctlconf_to_tooltip = "Schreiben Sie eine benutzerdefinierte sysctl.conf an den Server. Sie können Ihren Server beschädigen, indem Sie hier falsche Werte eingeben.Dies ist nur für den erweiterten Gebrauch gedacht. Die Standardvorlage wird zu restaurativen und informativen Zwecken bereitgestellt."
xcvm_was_the_first_to_tooltip = "XC_VM war die erste, die mehrere Kategorien hinzufügte, was bedeutet, dass die meisten Apps dies nicht unterstützen. Das Standardverhalten der API besteht darin, das Element einmal anzuzeigen, wenn ALLES angefordert wird.Apps neigen jedoch dazu, alle Streams anzufordern und sie dann selbst in Kategorien zu filtern. Diese Option ändert das Standardverhalten, um den Stream für jede zusätzliche Kategorie dupliziert anzuzeigen, daher wird der Stream in jeder Kategorie korrekt angezeigt. Der Nachteil ist, dass beim Suchen oder Anzeigen aller Kategorien der Stream mehrmals angezeigt wird."
year = "Jahr"
