dashboard_status_disk_text = "MAIN's Panel Disk oder seine tmp-Halterung ist fast voll. Wenn tmp voll ist, wird der Cache nicht mehr geschrieben und Zeilen und Streams behalten ihre alten Einträge bei. Geben Sie Speicherplatz auf der Panel-Festplatte frei oder erhöhen Sie die tmpfs-Größe in / etc / fstab und starten Sie sie neu."
dashboard_check_backups = "Sicherung"
dashboard_check_backups_off = "Automatische Backups aus"
dashboard_check_backups_ok = "Letztes Backup vor {ago}"
dashboard_check_backups_none = "Noch kein Backup"
dashboard_check_backups_upload = "Dropbox-Upload fehlgeschlagen"
dashboard_status_backups_text = "Öffnen Sie <b>Backups</b>, um die Backups und den Upload-Fehler anzuzeigen und jetzt eine zu erstellen. Ein geplantes Backup, das nicht kommt, ist oft eine volle Festplatte."
dashboard_check_certs = "HTTPS-Zertifikate"
dashboard_check_certs_ok = "Nächster Ablauf in {days} Tagen"
dashboard_check_certs_none = "Kein Zertifikat vorhanden"
dashboard_check_certs_expiring = "läuft ab: {names}"
dashboard_check_certs_expired = "abgelaufen: {names}"
dashboard_status_certs_text = "Ein Zertifikat wird jeden Tag ab 7 Tagen vor Ablauf erneuert; Bei weniger als 5 verbleibenden Tagen sind Verlängerungen fehlgeschlagen. Stellen Sie sicher, dass die Domäne des Servers darauf verweist und dass Port 80 sie erreicht."
dashboard_check_cache = "Cache"
dashboard_check_cache_off = "Behinderte"
dashboard_check_cache_building = "Erster Build noch nicht fertig"
dashboard_check_cache_ok = "Letzter vollständiger Lauf vor {ago}"
dashboard_status_cache_text = "Ein Cache-Lauf ist fehlgeschlagen oder wurde abgebrochen, sodass seitdem geänderte Zeilen und Streams möglicherweise ihre alten Einträge behalten. <b>Panel-Protokolle</b> nennt die Ursache; <b>Cache</b> zeigt den letzten vollständigen Lauf an."
dashboard_status_cluster_text = "Öffne <b>Cluster-Knoten</b>, um Flows, Modus und Audit jedes Knotens zu sehen; ein stiller Knoten bedient Zuschauer weiter aus einer Replik, die niemand aktualisiert."
dashboard_check_clock = "Serveruhren"
dashboard_check_clock_ok = "Innerhalb von {sec} s von MAIN's Uhr"
dashboard_check_clock_off = "uhr weicht von der Hauptuhr ab: {names}"
dashboard_status_clock_text = "Die Uhr eines Servers ist mehr als 5 Sekunden von der Hauptuhr entfernt. Wenn NTP es dann korrigiert, können Zuschauer auf diesem Server für etwa zwei Minuten abgelehnt werden, bis der neue Offset gemessen wird. Führen Sie <b>timedatectl status </b> auf diesem Server aus, um zu sehen, ob NTP seine Uhr synchronisiert hält."
cluster_rotate_now = "Token rotieren"
cluster_rotate_now_help = "Das Token dieses Knotens beim nächsten Poll neu ausstellen: die Antwort des Betreibers auf ein Token, dem er nicht mehr traut, ohne den Knoten zu stoppen."
cluster_rotate_done = "Der Knoten rotiert sein Token beim nächsten Poll."
cluster_rotate_failed = "Die Rotation konnte nicht eingereiht werden; der Knoten behält sein Token."
cluster_rotate_no_commands = "Dieser Knoten nimmt noch keine Kommandos an: schalte zuerst seinen COMMANDS-Flow ein."
cluster_fence = "Zaun"
cluster_fence_help = "Stoppen Sie jetzt neue Zuschauer auf diesem Knoten und lassen Sie diejenigen fallen, die noch nach dem Zaunabfluss zuschauen (lb_fence_drain_min ). Der Knoten bleibt eingeschrieben; Unfence bringt es wieder auf Sendung."
cluster_fence_confirm = "Zäunen Sie diesen Knoten ein? Neue Zuschauer werden sofort abgelehnt, und die laufenden werden nach dem Abfluss fallen gelassen."
cluster_fence_done = "Der Knoten wird sich bei seiner nächsten Abfrage selbst einzäunen."
cluster_unfence = "Unfence"
cluster_unfence_help = "Heben Sie einen Zaun dieses Seitensets an: Der Knoten dient wieder den Zuschauern. Benötigt eine Lizenz, wie jeder erteilende Befehl."
cluster_unfence_done = "Der Knoten hebt seinen Zaun bei seiner nächsten Umfrage an."
cluster_quarantine = "Quarantäne"
cluster_quarantine_help = "Frieren Sie diesen Knoten ein: Er wird weiterhin bereitgestellt, nimmt jedoch keinen Gewährungsbefehl und kein Replikat entgegen, bis Sie ihm wieder vertrauen."
cluster_quarantine_confirm = "Diesen Knoten unter Quarantäne stellen? Es braucht keinen Gewährungsbefehl und kein Replikat, bis Sie ihm wieder vertrauen."
cluster_quarantine_done = "Der Knoten wird unter Quarantäne gestellt."
cluster_quarantine_ended = "Der Knoten wird unter Quarantäne gestellt. {ENDED} Befehl (e) in der Warteschlange dafür, dass die Gewährung beendet wurde und im Überwachungsprotokoll benannt ist: Senden Sie nach erneutem Vertrauen erneut, was noch gewünscht wird."
cluster_trust = "Vertraue wieder"
cluster_trust_help = "Beenden Sie die Quarantäne und drehen Sie das Token des Knotens, sodass das unter Quarantäne gestellte Token verloren geht."
cluster_trust_done = "Der Knoten ist wieder vertrauenswürdig; Sein Token wird bei der nächsten Abfrage rotiert."
cluster_trust_not_quarantined = "Dieser Knoten ist nicht unter Quarantäne gestellt."
cluster_resync = "Neusynchronisierung"
cluster_resync_help = "Lassen Sie den Knoten sein Replikat erneut von Grund auf neu abrufen und seinen gesamten Verbindungssatz senden."
cluster_resync_done = "Der Knoten wird bei seiner nächsten Abfrage erneut synchronisiert."
cluster_command_failed = "Der Befehl konnte nicht in die Warteschlange gestellt werden (siehe Clusterprotokoll des Panels)."
cluster_mode_done = "Knotenmodus geändert. Sein Agent übernimmt den neuen Modus beim nächsten Heartbeat."
cluster_mode_unknown = "Ein Knoten hat nur die Modi 0, 1 und 2."
cluster_mode_needs_config = "Schalte zuerst den Config-Flow ein: ein Knoten über Modus 0 startet aus der Replik."
cluster_mode_needs_flows = "Modus 2 braucht alle Flows außer der Datenebene: der Knoten darf die Datenbank von MAIN überhaupt nicht erreichen."
cluster_flow_mode_two = "Ein Knoten im Modus 2 benötigt jeden Fluss eingeschaltet. Bewegen Sie es zuerst einen Modus nach unten und schalten Sie dann den Fluss aus."
cluster_mode_needs_root = "Modus 2 benötigt die PIN von root (das Root-Abzeichen): Ohne sie erreicht keine Root-Aktion (Neustart, Aktualisierung, Neustart) einen Knoten, der die MAIN-Datenbank nicht mehr liest."
cluster_mode_needs_streams = "Dieser Knoten hat nicht gesagt, dass er seine Streams selbst liest (seine Stream-Kopie wurde erstellt, seine eigene Aufzeichnung ihres Status ist vollständig). In Modus 1 mit eingeschaltetem Stream dauert das ein oder zwei Minuten; Ein Knoten in einer älteren Version muss zuerst aktualisiert werden. Versuchen Sie es in Kürze erneut."
cluster_mode_needs_active = "Nur ein aktiver Knoten wechselt in den Modus 2. Heben Sie zuerst die Quarantäne auf."
cluster_mode_not_heard = "MAIN hat diesen Knoten in den letzten zehn Sekunden nicht gehört. Modus 2 benötigt einen Knoten, der jetzt antwortet: Überprüfen Sie seinen Agenten und versuchen Sie es erneut."
cluster_mode_redis_handler = "Modus 2 ist nicht verfügbar, solange der Redis-Verbindungshandler aktiviert ist: Ein Knoten im Modus 2 öffnet möglicherweise nicht das Redis von MAIN, und jeder Betrachter darauf wird abgewiesen. Schalten Sie zuerst den Redis-Handler in den Einstellungen aus."
cluster_mode_two_warning = "Diesen Knoten in Modus 2 verschieben? Ab dem nächsten Herzschlag stellt der Knoten keine Verbindung mehr zu MySQL oder Redis von MAIN her und die Hintergrunddienste des Knotens werden innerhalb einer Minute neu gestartet. Jede Funktion des Knotens, die noch die Datenbank von MAIN benötigt, funktioniert von da an nicht mehr. Jeder Versuch wird im Feld HAUPT-DB-Verbindungen aufgelistet. WARNUNG: Die Schaltfläche Modus abwärts macht diese Verschiebung nur rückgängig, solange der Knoten seine DB-Anmeldeinformationen beibehält. Nachdem die Schaltfläche DB-Anmeldeinformationen löschen verwendet wurde oder nachdem der Knoten im Modus 2 neu installiert wurde, gibt es von dieser Seite keinen Weg zurück. Ein DB- oder Redis-Kennwort, das geändert wird, während sich der Knoten im Modus 2 befindet, erreicht den Knoten ebenfalls nicht."
cluster_mode_moved = "Der Modus dieses Knotens ist nicht der auf dieser Seite angezeigte: Die Seite wurde neu geladen oder jemand anderes hat den Knoten verschoben. Nichts wurde geändert. Überprüfen Sie den Knoten und drücken Sie erneut."
cluster_redis_handler_mode2 = "Der Redis-Handler kann nicht eingeschaltet werden, während sich ein Load Balancer im Cluster-Modus 2 befindet: Ein solcher Knoten öffnet möglicherweise nicht das Redis von MAIN, und jeder Betrachter darauf würde abgewiesen. Bewegen Sie diese Knoten zuerst nach unten in Modus 1."
cluster_mode_down_revoked_confirm = "WARNUNG: Die DB-Anmeldeinformationen dieses Knotens wurden gelöscht. Wenn Sie es nach unten verschieben, wird die Hauptdatenbank nicht zurückgegeben: Im Modus 1 hätte es überhaupt keine Datenbank. Verschieben Sie es trotzdem nach unten?"
cluster_streams_not_local = "Streams nicht lokal"
cluster_streams_not_local_help = "Dieser Knoten sagt, dass er seine Streams nicht selbst lesen kann, und in Modus 2 kann er das nicht neu erstellen: Seine Streams werden nicht gestartet oder überwacht. Bewegen Sie es einen Modus nach unten, warten Sie ein oder zwei Minuten und dann wieder nach oben."
cluster_config_flow = "Konfiguration"
cluster_connections_flow = "Verbindungen"
cluster_config_help = "Config-Flow: an, der Knoten nimmt Einstellungen, Server, Crontab, Sperrlisten und Stream-Katalog aus der Replik, die sein Agent holt, statt die Datenbank von MAIN zu lesen. Nötig, bevor ein Knoten in Modus 2 laufen kann."
cluster_config_on_done = "Config-Flow an: der Knoten liest seine Konfiguration nun aus der Replik."
cluster_config_off_done = "Config-Flow aus: der Knoten liest seine Konfiguration wieder aus der Datenbank von MAIN."
cluster_connections_help = "Verbindungs-Fluss: Wenn aktiv, erfasst der Knoten seine Zuschauer bei seinem Agenten (kein WAN-Aufruf pro Anfrage) und der Agent spiegelt sie zu MAIN; auf MAIN beschlossene Schließungen erreichen den Knoten als signierte Befehle. Benötigt Befehle und Streams."
cluster_connections_on_done = "Verbindungs-Fluss an: Der Agent des Knotens hält jetzt seine Zuschauer."
cluster_connections_off_done = "Verbindungs-Fluss aus: Der Knoten erfasst seine Zuschauer wieder in MAINs Speicher."
cluster_dataplane_flow = "Datenebene"
cluster_dataplane_help = "Datenebenenfluss: Wenn aktiviert, ruft der Knoten weitergeleitete Streams und Dateien anderer Server mit signierten Tickets über den Loopback-Proxy seines Agenten ab, niemals mit dem Stream-Geheimnis in einer URL, und die Eltern lehnen dieses Geheimnis von seiner Adresse ab. Benötigt Streams und Inhalte."
cluster_dataplane_on_done = "Datenebenenfluss eingeschaltet: Die Relais und Dateilesevorgänge des Knotens durchlaufen seinen Agenten mit Tickets. Zuvor gestartete Streams behalten ihre URLs bis zum Neustart bei."
cluster_dataplane_off_done = "Datenebenenfluss ausgeschaltet: Der Knoten ruft Relays und Dateien mit den Legacy-URLs erneut ab."
cluster_dataplane_needs_relay = "Der Agent dieses Knotens führt den Loopback-Relay-Proxy nicht aus (sein Hallo listet keine Relay-Funktion auf): Aktualisieren Sie xc_agent auf dem Knoten, bevor Sie die Datenebene einschalten."
cluster_relay_unbound = "relaisanschluss nach unten"
cluster_clock_off = "Uhr {OFFSET}"
cluster_clock_degraded = "degradiert (Uhr) {OFFSET}"
cluster_clock_help = "Die Uhr des Knotens weicht so weit von der Uhr von MAIN ab (Knoten − MAIN, aus seinem Heartbeat). Sein Agent korrigiert seine eigenen Anfragen, aber sein PHP, seine Crons und seine Protokolle verwenden diese Uhr. Ab 30 s wird gewarnt und ab 300 s ist der Knoten degradiert; keines von beiden zäunt ihn ein. Synchronisieren Sie NTP auf beiden."
cluster_conn_differ = "Verbindungen weichen ab"
cluster_conn_resynced = "Verbindungen vor {AGO} neu abgeglichen"
cluster_conn_help = "Die offenen Verbindungen des Knotens und MAINs Aufzeichnung davon stimmen nicht überein (der Verbindungs-Digest, alle 4 s geprüft). Nach zwei Abweichungen in Folge fordert MAIN vom Knoten alle seine Verbindungen an, höchstens alle 30 s. Kommt das immer wieder, gehen Verbindungsereignisse des Knotens verloren."
cluster_lane_lag = "{LANE} hängt seit {AGE} hinterher"
cluster_lane_lag_help = "Seit {AGE} warten die {LANE}-Ereignisse des Knotens über 120 s darauf, MAIN zu erreichen. P0 trägt den Zustand der Streams und Verbindungen, P1 die Logs. Der Knoten hält sie auf der Festplatte und sendet sie, sobald MAIN sie wieder annimmt: Prüfen Sie seine Verbindung zu MAIN und führen Sie server:diagnose auf dem Knoten aus."
cluster_url_unreachable = "MAIN-URL nicht erreichbar"
cluster_url_unreachable_help = "Der Knoten erreicht diese Cluster-URLs von MAIN nicht (Verbindung, TLS oder Zeitüberschreitung) und nutzt eine andere: {URLS}. Prüfen Sie Firewall, Zertifikat und Port dazwischen."
cluster_relay_unbound_help = "Der Agent des Knotens kann den Port seines Loopback-Relay-Proxys (127.0.0.1: 31290) nicht binden, sodass seine Relays auf Datenebene und Dateilesevorgänge fehlschlagen und wiederholt werden, bis dies möglich ist. Ein anderer Prozess hält den Port: Geben Sie ihn auf dem Knoten frei. Der letzte Fehler des Agenten:"
cluster_flow_needs = "Dieser Fluss braucht zuerst einen anderen: Verbindungen benötigt Befehle und Streams."
cluster_panel_fp = "Panel-Fingerabdruck"
cluster_panel_fp_help = "SHA-256 des Panel-Signaturschlüssels von MAIN. Auf einem per Code angemeldeten Knoten pinnt root ihn mit: console.php cluster:pin-root <Fingerabdruck>"
cluster_root_pin = "Root-Pin"
cluster_root_ready_help = "Root-Befehle: Der von root gepinnte Panel-Schlüssel des Knotens stimmt mit dem des Agenten überein; Reboot, Update und andere Root-Aktionen laufen als signierte Befehle."
cluster_root_missing_help = "Kein Root-Pin auf diesem Knoten: Root-Aktionen bleiben bei der Signaltabelle. Gepinnt bei der SSH-Installation oder auf dem Knoten: console.php cluster:pin-root <Panel-Fingerabdruck>"
cluster_core_pinned_help = "Der xcvm_core des Knotens enthält den Schlüssel dieses Panels (core.pin): Es beurteilt die Lease des Knotens selbst anhand einer Uhr, die nicht zurückgeschoben werden kann."
cluster_pin_core = "Pin-Kern"
cluster_pin_core_help = "Stecken Sie den Schlüssel dieses Panels jetzt in den xcvm_core des Knotens ein, damit er die Lease des Knotens selbst beurteilt. MAIN tut dies auch innerhalb einer Minute, nachdem ein Knoten Root-Befehle übernommen hat."
cluster_pin_core_queued = "Gesendete. Das Core-Abzeichen wird angezeigt, sobald der Knoten den Schlüssel dieses Panels angeheftet hat (zuerst kann er seine install_id melden, welche Hauptdatensätze)."
cluster_pin_core_no_root = "Dieser Knoten nimmt noch keine Root-Befehle entgegen: Schalten Sie seinen Befehlsfluss ein und setzen Sie zuerst den Pin von root ein."
cluster_pin_core_no_root_key = "MAIN hat keine Bedienfeldtaste aufgezeichnet: Konsole ausführen.php-Cluster: initialisieren Sie zuerst."
cluster_pin_core_not_queued = "Die PIN konnte nicht in die Warteschlange gestellt werden. siehe Clusterprotokoll."
cluster_strip_credentials = "DB-Anmeldeinformationen löschen"
cluster_strip_credentials_help = "Entfernen Sie die Datenbank- und Redis-Anmeldeinformationen von MAIN aus der Konfiguration dieses Knotens.enc, widerrufen Sie dann die Datenbankgewährung. Nur für einen aktiven Knoten im Modus 2. Es gibt kein Rückgängigmachen von dieser Seite: Das Zurücksetzen erfordert eine neue Konfiguration und einen neuen Zuschuss."
cluster_strip_credentials_confirm = "Entfernen Sie die Datenbank- und Redis-Anmeldeinformationen von MAIN von diesem Knoten und widerrufen Sie die Datenbankgewährung? Der Knoten arbeitet weiterhin über die Cluster-API, kann jedoch die MAIN-Datenbank nicht mehr erreichen. Für das Rollback sind eine neue Konfiguration und ein neuer Grant erforderlich."
cluster_strip_too_soon = "Dieser Knoten befindet sich seit sieben Tagen noch nicht im Modus 2. Das Löschen seiner DB-Anmeldeinformationen kann nicht rückgängig gemacht werden, also wartet es: Bis dahin ist der Modus down der Weg zurück."
cluster_strip_not_local = "Dieser Knoten sagt nicht, dass er seine Streams auf sich selbst liest. Modus runter ist, wie das heilt, und es benötigt diese Anmeldeinformationen: Repariere das zuerst."
cluster_strip_not_heard = "MAIN hat diesen Knoten in den letzten zehn Sekunden nicht gehört. Es gibt die Anmeldeinformationen von MAIN nur auf, während es antwortet: Überprüfen Sie seinen Agenten und versuchen Sie es erneut."
cluster_strip_queued = "Gesendete. Wenn der Knoten meldet, dass seine Konfiguration keine Anmeldeinformationen enthält, widerruft MAIN seine Datenbankgewährung (Clusterprotokoll: Knoten.db_revoked)."
cluster_strip_needs_mode2 = "Nur ein Knoten im Modus 2 gibt die Anmeldeinformationen von MAIN auf: Er muss bereits ohne die Datenbank von MAIN ausgeführt werden."
cluster_strip_not_active = "Der Knoten ist nicht aktiv; es gibt die Anmeldeinformationen von MAIN nur solange es ist."
cluster_strip_not_queued = "Der Befehl konnte nicht in die Warteschlange gestellt werden. siehe Clusterprotokoll."
cluster_db_revoked = "DB widerrufen"
cluster_db_revoked_help = "Der Knoten hat die Datenbank- und Redis-Anmeldeinformationen von MAIN aufgegeben, und MAIN hat zu diesem Zeitpunkt seine Datenbankgewährung widerrufen."
cluster_config_needs_install_id = "MAIN kennt die install_id dieses Knotens noch nicht: Pin zuerst seinen Kern (Pin core), der ihn aufzeichnet."
cluster_config_no_extension = "xcvm_core von MAIN kann keine Knotenkonfigurationen packen: Aktualisieren Sie xcvm_core."
cluster_config_not_queued = "Die Knotenkonfiguration konnte nicht gepackt oder in die Warteschlange gestellt werden. siehe Clusterprotokoll."
cluster_settings_misses = "Fehlende Einstellungen"
cluster_settings_misses_help = "Einstellungen, die der Knoten in den letzten 7 Tagen gelesen hat und die seine Replik nicht mitführt (außerhalb der erlaubten LB-Einstellungen), so wie sein Agent sie in Modus 1 und 2 meldet. Sobald die Replik die Einstellungen des Knotens besitzt, findet ein solcher Lesevorgang nichts."
cluster_main_connects = "MAIN-DB-Verbindungen"
cluster_main_connects_tip = "Verbindungen, die der Knoten in den letzten 7 Tagen mit MySQL und Redis von MAIN geöffnet hat, mit dem Code, der sie geöffnet hat, da sein Agent sie in Modus 1 und 2 meldet. Ein Knoten im Modus 1 verbindet sich konstruktionsbedingt ständig. Wenn es in Modus 2 eintritt, beginnt die Zählung erneut und jeder von da an angezeigte wurde abgelehnt: Er benennt etwas auf dem Knoten, der noch die Hauptdatenbank benötigt."
cluster_connects_since = "Gezählt seit"
cluster_fence_window = "Serviert ohne Hauptgericht bis"
cluster_fence_window_help = "Wie lange dieser Knoten weiter dienen darf, wenn er MAIN nicht mehr erreichen kann: Ablauf seines Tokens plus die Partitionstoleranz (das Leasing-Hauptzeichen mit jedem Token, höchstens 26 Stunden nach Ausgabe), dann der Zaunablauf. Es hält dort nur mit eingeschaltetem Mietzaun an."
cluster_fence_drain = "auf {TIME} abtropfen lassen"
cluster_fence_on = "zaun an"
cluster_fence_off = "zaun ab"
cluster_queue = "Warteschlange"
cluster_queue_help = "Befehle für diesen Knoten in der Warteschlange, die er noch nicht bestätigt hat."
cluster_rotate_all = "Drehe jetzt alle Token"
cluster_rotate_all_help = "Prägen Sie das Token jedes aktiven Knotens bei der nächsten Abfrage erneut, wie es das Rotationstoken für einen Knoten tut. Ein zweiter Klick ersetzt eine noch wartende Drehung, anstatt eine hinzuzufügen."
cluster_rotate_all_done = "Token-Rotation für {QUEUED} Knoten in die Warteschlange gestellt; {SKIPPED} ohne den Befehlsfluss wurden übersprungen; {FAILED} konnte nicht in die Warteschlange gestellt werden."
cluster_banner_licence = "Die Lizenz ist ausgesetzt: MAIN unterzeichnet keine neuen Token oder Leases für die Knoten."
cluster_banner_licence_stop = "Die Lizenz ist ausgesetzt: MAIN signiert keine neuen Leasingverträge und Knoten, die spätestens bis {TIME} keinen One-Stop-Serving erhalten können (Leasing-Zaun aktiviert). Lizenzieren Sie MAIN erneut, um sie auf Sendung zu halten."
cluster_banner_licence_no_fence = "Die Lizenz ist ausgesetzt: Hauptschilder keine neuen Mietverträge. Der Mietzaun ist ausgeschaltet, sodass die Knoten weiterhin selbstständig arbeiten. MAIN neu lizenzieren."
cluster_banner_cert_expiring = "Das HTTPS-Zertifikat von MAIN läuft am {DATE} ({DAYS} Tage) ab, während der Clustertransport {TRANSPORT} ist: Erneuern Sie es, bevor die Knoten HTTPS an MAIN verlieren."
cluster_banner_cert_expired = "Das HTTPS-Zertifikat von MAIN ist am {DATE} abgelaufen, während der Clustertransport {TRANSPORT} ist: Knoten können MAIN nicht über HTTPS verifizieren. Erneuern Sie es."
cluster_metrics = "Cluster-Figuren"
cluster_metric_queue = "Befehle in der Warteschlange"
cluster_metric_oldest = "älteste {AGE}"
cluster_metric_delivery = "Befehlsübermittlung (letzte Stunde)"
cluster_metric_ack = "Ack"
cluster_metric_latency_help = "Von der Warteschlange bis zur Zustellung und von der Warteschlange bis zur Bestätigung des Knotens über die Befehle, die in der letzten Stunde bestätigt wurden (ganze Sekunden, wenn die Warteschlange sie aufzeichnet)."
cluster_metric_ingest = "Ingest-Genehmigungen im Einsatz"
cluster_metric_ingest_help = "Die Haupteingabeanforderungen werden jetzt pro Spur auf das angewendet, was die Spur enthalten darf (cluster_ingest_concurrency). Eine Spur an ihrer Grenze lässt Knoten warten (503 RATE_LIMITED)."
cluster_metric_no_bus = "Der Clusterbus läuft nicht: Nichts ist begrenzt."
cluster_metric_ctl = "Pool-Warteschlange steuern"
cluster_metric_ctl_help = "Wie lange Anfragen an den cluster_ctl-Pool von MAIN auf einen Worker gewartet haben, wie die Lebhaftigkeitsschleife es zuletzt gesehen hat."
cluster_metric_ctl_none = "kein"
cluster_metric_digest_n1 = "Chunkverdaut ohne Nonce (24 h)"
cluster_metric_digest_n1_help = "Die Besitzer, deren Datei-Chunk-Digest keine Anfrage genannt hat, wie die Agenten der Knoten sie melden: Besitzer von vor der Nonce. Wenn keine benannt ist, kann lb_digest_nonce_required solche Digests ablehnen."
cluster_metric_digest_n1_none = "kein"
cluster_metric_digest_n1_silent = "{COUNT} aktive Knoten melden sich nicht"
