verify_domain_names_and_ips_tooltip = "Проверете имената на домейни и IP адреси спрямо разрешените хостове в базата данни. Това ще включва IP адреси на сървъри, домейни и DNS на дистрибутори."
verify_useragent_ip_restrictions_isp_tooltip = "Потвърдете ограниченията на потребителския агент, IP, интернет доставчика и държавата, преди да разрешите изтеглянето на плейлисти / EPG. Ако е деактивиран, плейлистът може да бъде изтеглен от всеки IP адрес, но все още важат ограничения за самите потоци."
view_all_servers = "Преглед на всички сървъри"
view_movie = "Преглед на филма"
when_a_client_disconnects_from_tooltip = "Когато клиент прекъсне връзката с поток при поискване, проверете текущия общ брой връзки за този поток и го изключете, ако никой не гледа."
when_enabled_ffmpeg_pids_will_tooltip = "Когато е активирано, ffmpeg PID ще бъдат сканирани всяка минута за потоци, които не трябва да бъдат на живо и съответно убити. Това ще се изпълни и при стартиране на поток, за да се гарантира, че всички работещи екземпляри са достатъчно премахнати."
when_the_request_limit_is_tooltip = "Когато ограничението за заявки бъде достигнато, излишните заявки ще бъдат оттеглени по подразбиране. Можете да поставите тези заявки на опашка, която ще бъде изпълнена по ред, а не едновременно. Това ще ви помогне да облекчите потока на трафика и да се уверите, че услугата не е нарушена от ограничаването на тарифите."
when_using_direct_source_hide_tooltip = "Когато използвате директен източник, скрийте оригиналния url адрес, като проксирате филма през сървърите си. Това ще изразходва честотната лента, но няма да изисква филмът да бъде запазен на сървърите Ви за постоянно. Уверете се, че сте задали правилния целеви контейнер."
when_using_direct_source_hide_tooltip_title = "Когато използвате директен източник, скрийте оригиналния url адрес, като проксирате потока на живо през сървърите си чрез UDP. MPEG - TS и HLS се поддържат като входен формат, но само MPEG - TS се поддържа като изходен формат за клиенти.<br/><br/>Експериментално! Това може да не работи за всички потоци."
when_you_request_a_stream_tooltip = "When you request a stream on-demand, ask the provider to send a prebuffer so the stream starts quicker. This will only work if your provider is using XC_VM. The prebuffer will mean your source could be 10 seconds or so behind, but it will load significantly quicker.<br/><br/>On - URL means automatically append ?prebuffer=1 to the URL, On - Header sends the prebuffer request as a header instead. Header requests are only accepted when requesting from XC_VM v1.4.4+"
whether_to_use_guessit_or_tooltip = "Дали да използвате GuessIt или PTN, за да анализирате имената на файловете за папката за наблюдение и т.н. GuessIt е далеч по - добър, но използва повече ресурси."
whether_to_use_modern_or_tooltip = "Дали да се използва Modern или Legacy тема по подразбиране за новодобавени устройства."
whether_to_use_progress_info_tooltip = "Дали да се използва информация за напредъка след закъснението при стартиране, за да се определи реалната FPS или да се провери сегментът, за да се върне avg_fame_rate."
which_network_interface_to_use_for_statistics = "Кой мрежов интерфейс да се използва за статистика."
which_version_of_ffmpeg_to_tooltip = "Which version of FFMPEG to use for movies, created channels and normal streams.<br/><br/>v4.0 - Legacy version from 2018, shipped with XC_VM originally.<br/>v7.1 & v8.0 - Modern versions with full codec support, DASH and NVENC."
write_a_custom_sysctlconf_to_tooltip = "Напишете персонализиран sysctl.conf на сървъра. Можете да разбиете сървъра си, като въведете неправилни стойности тук, това е само за разширена употреба. Шаблонът по подразбиране е предоставен за възстановителни и информационни цели."
xcvm_was_the_first_to_tooltip = "XC_VM беше първият, който добави няколко категории, което означава, че повечето приложения не го поддържат. Поведението по подразбиране на API е да покаже елемента веднъж, когато ВСИЧКО е поискано, но приложенията са склонни да поискат всички потоци, след което сами да ги филтрират в категории. Тази опция ще промени поведението по подразбиране, за да покаже потока, дублиран за всяка допълнителна категория, следователно потокът се показва правилно във всяка категория. Недостатъкът е, че при търсене или показване на категорията „Всички“ потокът ще се покаже няколко пъти."
year = "Година"
you_can_create_a_channel_tooltip = "Можете да създадете канал, като го синхронизирате със съществуваща серия, изберете VOD, която вече имате на сървърите си, или като индивидуално изберете файлове."
you_should_always_read_live_tooltip = "Винаги трябва да четете потоците на живо като неместни рамки. Ако обаче стриймвате статични видео файлове, задайте това на true, в противен случай процесът на кодиране ще се провали."
