              - 1
              - 2
              - 3
              - 4
              - 5
              - 6
              - 7
              - 8
          description: 'Status filter: 1 active (admin_enabled=1, enabled=1, not expired), 2 disabled (enabled=0), 3 banned (admin_enabled=0), 4 expired, 5 trial, 6 restreamer, 7 stalker, 8 expiring within 14 days.'
