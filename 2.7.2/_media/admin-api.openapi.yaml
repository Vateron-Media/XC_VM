openapi: 3.1.0
info:
  title: XC_VM Admin API
  version: 2.7.2
  summary: Admin API of the Xtream Codes compatible HTTP surface, as implemented by XC_VM.
  description: |
    A source-level reference for the **Xtream Codes (XC) API**: the de facto standard HTTP interface
    between IPTV panels and player apps. The reference implementation is
    [XC_VM](https://github.com/Vateron-Media/XC_VM) 2.7.2, an open-source continuation of Xtream UI / XC.
    Each operation cites the XC_VM source file and line it was traced from (`src/...:line`).

    ## Authentication models

    The panel has several independent auth schemes. Each endpoint states which one it uses.

    | Who | How |
    |---|---|
    | Line (subscriber) | `username` + `password` query parameters, or `token` (32-char line access token). Also in path form: `/player_api/{u}/{p}`, `/live/{u}/{p}/...` |
    | Activation code | The code typed as `username` (or `token`) is activated on first use and becomes a line |
    | MAG / Stalker box | MAC address cookie + bearer token from `handshake` (`/c/portal.php`, `/stalker_portal/...`) |
    | Enigma2 box | MAC/device registration (`enigma2.php`) |
    | Admin / reseller REST | `api_key` query parameter (named `xct_` token or legacy per-user key) on `/{access_code}/?action=...`; the access code's IP whitelist is enforced by nginx |
    | Load-balancer nodes | Shared cluster secret (`/cluster/v1`); signed `node.rpc` (legacy `api.php` on nodes older than 2.7.0) |

    ## Notation

    OpenAPI cannot express query-string multiplexing, so action-based endpoints are written as separate
    literal paths such as `/player_api.php?action=get_live_streams`. The request is still a single
    `GET /player_api.php` with `action` as an ordinary query parameter.

    The admin and reseller REST APIs share one URL shape, `/{access_code}/?action=...`. Each access code has a type
    (3 = Admin API, 4 = Reseller API) and nginx routes it to that API, so `/{access_code}/...` and `/{reseller_access_code}/...` are the
    same URL and differ only in which kind of code is used.
  contact:
    name: XC_VM project
    url: https://github.com/Vateron-Media/XC_VM
  license:
    name: AGPL-3.0 (XC_VM source); this document describes its public interface
    identifier: AGPL-3.0-only
servers:
  - url: '{protocol}://{host}:{port}'
    description: Any XC compatible panel or load-balancer node
    variables:
      protocol:
        default: http
        enum:
          - http
          - https
      host:
        default: tv.example.com
      port:
        default: '80'
        description: HTTP broadcast port (often 80, 8080, 8000, 25461); HTTPS often 443 or 25463.
externalDocs:
  description: XC_VM source
  url: https://github.com/Vateron-Media/XC_VM
security:
  - Admin_ApiKey: []
components:
  securitySchemes:
    Admin_ApiKey:
      type: apiKey
      in: query
      name: api_key
      description: A named API token (`xct_...`, stored as a SHA-256 hash in `api_tokens`) or, while the `api_legacy_keys` setting is not '0', the user's legacy `users.api_key`. The key's user must have `status=1` and be in a group with `is_admin=1`. Tokens may also carry an IP allow-list and an expiry (src/Core/Auth/ApiTokens.php:47-93). Missing or rejected keys give `{"status":"STATUS_FAILURE","error":"Invalid API key."}`.
  parameters:
    Admin_AccessCode:
      name: access_code
      in: path
      required: true
      schema:
        type: string
        example: adminapi
      description: An access code of type 3 (Admin API) (Access Codes page). nginx routes `/<code>/...` to src/Public/index.php with XC_SCOPE=includes/api/admin (src/Core/Auth/AuthRepository.php:119-120, src/bin/nginx/conf/codes/template). Anything after the code in the path is ignored; only the parameters matter. The code's whitelist, when set, becomes nginx `allow`/`deny all` rules.
    Admin_Start:
      name: start
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Row offset (intval).
    Admin_Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
      description: Page size (intval; 0 or absent = 50). Passed to the table handler as `length`. Not capped in API mode.
    Admin_ShowColumns:
      name: show_columns
      in: query
      schema:
        type: string
        example: id,username,exp_date
      description: Comma-separated whitelist of row keys to keep (applied to `data`). Takes precedence over hide_columns.
    Admin_HideColumns:
      name: hide_columns
      in: query
      schema:
        type: string
        example: password
      description: Comma-separated row keys to drop (ignored when show_columns is set).
    Admin_SearchValue:
      name: search[value]
      in: query
      schema:
        type: string
      description: DataTables global search; LIKE %value% across the columns listed in the operation.
    Admin_OrderColumn:
      name: order[0][column]
      in: query
      schema:
        type: integer
        default: 0
      description: DataTables sort column index (see the per-operation index map; an index mapped to none, including the default 0 on most tables, means no ORDER BY).
    Admin_OrderDir:
      name: order[0][dir]
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
      description: Sort direction; anything but `desc` is ascending.
    Admin_Id:
      name: id
      in: query
      required: true
      schema:
        type: integer
        example: 12
      description: Record id.
  examples:
    Admin_InvalidKey:
      summary: Missing or rejected api_key
      value:
        status: STATUS_FAILURE
        error: Invalid API key.
    Admin_NoPermissions:
      summary: Token scope or group permission refused
      value:
        status: STATUS_NO_PERMISSIONS
    Admin_Failure:
      summary: Record not found / operation failed
      value:
        status: STATUS_FAILURE
  schemas:
    Admin_Status:
      type: string
      description: Status name. Numeric service codes (src/Core/Config/ConstantsInitializer.php:200-252) are converted to their constant names by parseError(); an empty service result becomes STATUS_NO_PERMISSIONS.
      enum:
        - STATUS_FAILURE
        - STATUS_SUCCESS
        - STATUS_SUCCESS_MULTI
        - STATUS_CODE_LENGTH
        - STATUS_NO_SOURCES
        - STATUS_DISABLED
        - STATUS_NOT_ADMIN
        - STATUS_INVALID_EMAIL
        - STATUS_INVALID_PASSWORD
        - STATUS_INVALID_IP
        - STATUS_INVALID_PLAYLIST
        - STATUS_INVALID_NAME
        - STATUS_INVALID_CAPTCHA
        - STATUS_INVALID_CODE
        - STATUS_INVALID_DATE
        - STATUS_INVALID_FILE
        - STATUS_INVALID_GROUP
        - STATUS_INVALID_DATA
        - STATUS_INVALID_DIR
        - STATUS_INVALID_MAC
        - STATUS_EXISTS_CODE
        - STATUS_EXISTS_NAME
        - STATUS_EXISTS_USERNAME
        - STATUS_EXISTS_MAC
        - STATUS_EXISTS_SOURCE
        - STATUS_EXISTS_IP
        - STATUS_EXISTS_DIR
        - STATUS_SUCCESS_REPLACE
        - STATUS_FLUSH
        - STATUS_TOO_MANY_RESULTS
        - STATUS_SPACE_ISSUE
        - STATUS_INVALID_USER
        - STATUS_CERTBOT
        - STATUS_CERTBOT_INVALID
        - STATUS_INVALID_INPUT
        - STATUS_NOT_RESELLER
        - STATUS_NO_TRIALS
        - STATUS_INSUFFICIENT_CREDITS
        - STATUS_INVALID_PACKAGE
        - STATUS_INVALID_TYPE
        - STATUS_INVALID_USERNAME
        - STATUS_INVALID_SUBRESELLER
        - STATUS_NO_DESCRIPTION
        - STATUS_NO_KEY
        - STATUS_EXISTS_HMAC
        - STATUS_CERTBOT_RUNNING
        - STATUS_RESERVED_CODE
        - STATUS_NO_TITLE
        - STATUS_NO_SOURCE
        - STATUS_PORT_IN_USE
        - STATUS_2FA_REQUIRED
        - STATUS_2FA_INVALID
        - STATUS_2FA_LOCKED
        - STATUS_NO_PERMISSIONS
    Admin_Envelope:
      type: object
      required:
        - status
      description: Standard reply envelope. Always HTTP 200 (except the reseller maintenance 503).
      properties:
        status:
          $ref: '#/components/schemas/Admin_Status'
        data:
          description: Payload; shape depends on the action. On create/edit, the full stored record. On a validation error, often the (filtered) input echoed back.
        error:
          type: string
          description: Human-readable error (only some errors carry one).
      additionalProperties: true
    Admin_Error:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/Admin_Status'
        error:
          type: string
    Admin_TableResponse:
      type: object
      description: 'API-mode DataTables reply: no `draw` key. `recordsFiltered` is min(recordsTotal, limit) - a page cap, not a filtered count. A handler permission failure yields an empty body.'
      properties:
        status:
          type: string
          enum:
            - STATUS_SUCCESS
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        recordsTotal:
          oneOf:
            - type: integer
            - type: string
              pattern: ^[0-9]+$
          description: Total rows after filters (numeric string for raw-row handlers, integer for typed log handlers).
        recordsFiltered:
          oneOf:
            - type: integer
            - type: string
    Admin_ActiveCodeRow:
      type: object
      description: Row of ActiveCodeService::listCodes() (src/Domain/Line/ActiveCodeService.php:1314-1341). Typed values.
      properties:
        id:
          type: integer
        activation_code:
          type: string
        batch_name:
          type: string
          description: '''None'' when empty'
        status:
          type: integer
          enum:
            - 0
            - 1
            - 2
          description: 0 disabled, 1 stock (not redeemed), 2 redeemed
        status_key:
          type: string
          enum:
            - disabled
            - stock
            - expired
            - active
        status_label:
          type: string
          enum:
            - Disabled
            - Ready (Stock)
            - Expired
            - Active
        package_id:
          type: integer
        package_name:
          type: string
        subscriber_id:
          type:
            - integer
            - 'null'
        line_username:
          type:
            - string
            - 'null'
        line_password:
          type:
            - string
            - 'null'
        exp_date:
          type:
            - integer
            - 'null'
        exp_date_formatted:
          type:
            - string
            - 'null'
        remaining_days:
          type: integer
        mac:
          type:
            - string
            - 'null'
        device_id:
          type:
            - string
            - 'null'
        max_connections:
          type: integer
        is_trial:
          type: integer
        is_adult:
          type: integer
        purchase_cost:
          type: number
        created_by:
          type: integer
        creator_username:
          type: string
        created_at:
          type: integer
        created_at_formatted:
          type: string
        activated_at:
          type:
            - integer
            - 'null'
        activated_at_formatted:
          type:
            - string
            - 'null'
    Admin_ActiveCodeGenerate:
      type: object
      required:
        - package_id
      description: Inputs of ActiveCodeService::generateCodes() (src/Domain/Line/ActiveCodeService.php:69-371). Each code creates a disabled line with no expiry until the code is redeemed.
      properties:
        package_id:
          type: integer
          description: Package id (required; error 'Invalid package selected.').
        num_codes:
          type: integer
          minimum: 1
          maximum: 500
          default: 1
          description: Number of codes (not `qty`).
        code_length:
          type: integer
          minimum: 6
          maximum: 24
          default: 10
        code_format:
          type: string
          enum:
            - alphanumeric
            - numeric
          default: alphanumeric
          description: Alphanumeric alphabet is 23456789ABCDEFGHJKLMNPQRSTUVWXYZ.
        is_trial:
          type: boolean
          description: Trial codes (cost = package trial_credits).
        batch_name:
          type: string
          description: Default `BATCH-YYYYMMDD-XXXXX`.
        bouquets_selected[]:
          type: array
          items:
            type: integer
          description: 'Default: the package''s bouquets.'
        dns_base:
          type: string
          description: Host used in playlist links.
        is_adult:
          type: boolean
        category_template_id:
          type: integer
        streaming_username:
          type: string
          description: Only when num_codes=1 (alias `username`); min 3 chars, [A-Za-z0-9._-]. Default `ac_` + 9 hex.
        streaming_password:
          type: string
          description: Only when num_codes=1 (alias `password`); no `/`. Default 10 hex chars.
        created_by:
          type: integer
          description: 'Owner of the codes (default: the key user).'
        forced_country:
          type: string
          description: 'Default: the package value; empty clears.'
        max_connections:
          type: integer
          description: 'Default: package value or 1.'
        custom_data:
          type: string
          description: JSON object or array.
    Admin_LineInput:
      type: object
      additionalProperties: true
      description: 'Line fields for create_line/edit_line (LineService::process, src/Domain/Line/LineService.php:177-332). On create, checkbox fields are switched ON whenever the key is present (PHP isset), whatever its value: send them only to turn them on. Any other request key that matches a column of the target table is written as-is (QueryHelper::verifyPostTable, src/Core/Database/QueryHelper.php:65-110); PHP arrays (`x[]=`) are JSON-encoded and the string "null" becomes NULL. On edit the API wrapper fills every field the request leaves out from the stored row (AdminAPIWrapper::keepFields / keepLineFields, src/Public/Controllers/Api/AdminAPIWrapper.php:186-292), so a partial update is safe; checkbox switches are on for any non-empty value other than 0 and off for `0` or `""`.'
      properties:
        username:
          type: string
          description: Empty/absent = random 10 characters. Must not contain `/` (STATUS_INVALID_USERNAME, 40). Duplicate = STATUS_EXISTS_USERNAME (22).
        password:
          type: string
          description: Plain text (stored unhashed). Empty/absent = random 10 characters. `/` = STATUS_INVALID_PASSWORD (8).
        bouquets_selected:
          type: string
          description: 'JSON string, e.g. `[1,2,3]`. Bouquet ids. **Required** (a missing/invalid value raises a PHP TypeError: HTTP 500, empty body). Re-sorted into the global bouquet order and stored in `bouquet`. If the owner (`member_id`) has `allowed_bouquets`, silently intersected with it.'
          example: '[1,2,3]'
        bouquet_order:
          type: string
          description: Custom bouquet order (JSON string or array of ids); sets `bouquet_order_custom=1`, remaining bouquets appended.
        exp_date:
          type: string
          description: Expiry; any PHP DateTime string (`2026-12-31`, `2026-12-31 23:59`, `@1798761600`). Absent = never expires (NULL) on create; unparsable = STATUS_INVALID_DATE (14); `""` or `1970-01-01` leaves it unchanged.
          example: '2026-12-31'
        no_expire:
          type:
            - integer
            - string
          description: Checkbox. Present = `exp_date` NULL (never expires). On edit only a truthy value counts.
        member_id:
          type: integer
          description: Owner (registered user id). Falsy = the API key's user.
        isp_clear:
          type: string
          description: 'ISP lock handling: empty/absent clears `isp_desc` and `as_number`. The edit wrapper keeps the lock unless the request sends `isp_clear` (any value), which clears it.'
        is_isplock:
          type:
            - integer
            - string
          description: Checkbox. Lock the line to the first ISP seen.
        is_trial:
          type:
            - integer
            - string
          description: Checkbox.
        allowed_ips[]:
          type: array
          items:
            type: string
          description: IP allow-list (a scalar is wrapped). Stored JSON. Empty on edit = cleared.
        category_template_id:
          type:
            - integer
            - string
          description: '`0`/`none` clears `custom_data`; a positive id builds `custom_data` from that category template.'
        custom_data:
          type: string
          description: Raw custom data (JSON) when no template is used.
        max_connections:
          type: integer
          description: Default 1.
          default: 1
        enabled:
          type: integer
          description: 1/0. Default 1.
          enum:
            - 0
            - 1
        admin_enabled:
          type: integer
          description: 1/0 (0 = banned). Default 1.
          enum:
            - 0
            - 1
        is_stalker:
          type:
            - integer
            - string
          description: Checkbox.
        is_restreamer:
          type:
            - integer
            - string
          description: Checkbox.
        bypass_ua:
          type:
            - integer
            - string
          description: Checkbox. Bypass the user-agent blocklist.
        allowed_ua[]:
          type: array
          items:
            type: string
          description: User-agent allow-list.
        access_output[]:
          type: array
          items:
            type: integer
            enum:
              - 1
              - 2
              - 3
          description: 'Allowed outputs: 1 HLS (m3u8), 2 MPEG-TS, 3 RTMP. Stored as `allowed_outputs`. Absent on create = none.'
        bouquet_order_revision:
          type: string
          description: 'Edit only: sha256 of the stored order; on mismatch with `bouquet_order` sent, STATUS_INVALID_DATA (17) with `data.bouquet_order_conflict=true`.'
        admin_notes:
          type: string
        reseller_notes:
          type: string
        forced_country:
          type: string
          description: ISO country code or empty.
        force_server_id:
          type: integer
        package_id:
          type: integer
        contact:
          type: string
        telegram:
          type: string
    Admin_MagInput:
      type: object
      additionalProperties: true
      description: 'MAG device + backing line (MagService::process, src/Domain/Device/MagService.php:218-405). The backing line is forced to max_connections=1, is_restreamer=0, allowed_outputs=[1,2], is_mag=1. Any `mag_devices` or `lines` column is also accepted. On create, checkbox fields are switched ON whenever the key is present (PHP isset), whatever its value: send them only to turn them on. Any other request key that matches a column of the target table is written as-is (QueryHelper::verifyPostTable, src/Core/Database/QueryHelper.php:65-110); PHP arrays (`x[]=`) are JSON-encoded and the string "null" becomes NULL. On edit the API wrapper fills every field the request leaves out from the stored row (AdminAPIWrapper::keepFields / keepLineFields, src/Public/Controllers/Api/AdminAPIWrapper.php:186-292), so a partial update is safe; checkbox switches are on for any non-empty value other than 0 and off for `0` or `""`.'
      properties:
        mac:
          type: string
          description: '**Required.** Empty = STATUS_INVALID_INPUT (34); invalid = STATUS_INVALID_MAC (19); used by another device = STATUS_EXISTS_MAC (23).'
          example: 00:1A:79:12:34:56
        username:
          type: string
          description: Backing line username; empty = random 32 characters.
        password:
          type: string
          description: Backing line password; empty = random 32 characters.
        bouquets_selected:
          type: string
          description: 'JSON string, e.g. `[1,2,3]`. Bouquet ids. **Required** (a missing/invalid value raises a PHP TypeError: HTTP 500, empty body). Re-sorted into the global bouquet order and stored in `bouquet`. If the owner (`member_id`) has `allowed_bouquets`, silently intersected with it.'
          example: '[1,2,3]'
        exp_date:
          type: string
          description: Expiry; any PHP DateTime string (`2026-12-31`, `2026-12-31 23:59`, `@1798761600`). Absent = never expires (NULL) on create; unparsable = STATUS_INVALID_DATE (14); `""` or `1970-01-01` leaves it unchanged.
          example: '2026-12-31'
        no_expire:
          type:
            - integer
            - string
          description: Checkbox. Present = `exp_date` NULL (never expires). On edit only a truthy value counts.
        member_id:
          type: integer
          description: Owner (registered user id). Falsy = the API key's user.
        isp_clear:
          type: string
          description: 'ISP lock handling: empty/absent clears `isp_desc` and `as_number`. The edit wrapper keeps the lock unless the request sends `isp_clear` (any value), which clears it.'
        is_isplock:
          type:
            - integer
            - string
          description: Checkbox. Lock the line to the first ISP seen.
        is_trial:
          type:
            - integer
            - string
          description: Checkbox.
        allowed_ips[]:
          type: array
          items:
            type: string
          description: IP allow-list (a scalar is wrapped). Stored JSON. Empty on edit = cleared.
        lock_device:
          type:
            - integer
            - string
          description: Checkbox. Lock to the first device identifiers seen.
        pair_id:
          type: integer
          description: Main line this device mirrors; must exist (else STATUS_INVALID_USER, 31).
        category_template_id:
          type:
            - integer
            - string
          description: '`0`/`none` clears `custom_data`; a positive id builds `custom_data` from that category template.'
        admin_notes:
          type: string
        reseller_notes:
          type: string
        forced_country:
          type: string
        parent_password:
          type: string
          description: STB parental password.
        stb_type:
          type: string
        sn:
          type: string
        mac_filter:
          type: string
    Admin_EnigmaInput:
      type: object
      additionalProperties: true
      description: 'Enigma2 device + backing line (EnigmaService::process, src/Domain/Device/EnigmaService.php:168-351). Backing line forced to max_connections=1, is_e2=1. Any `enigma2_devices` or `lines` column is also accepted. On create, checkbox fields are switched ON whenever the key is present (PHP isset), whatever its value: send them only to turn them on. Any other request key that matches a column of the target table is written as-is (QueryHelper::verifyPostTable, src/Core/Database/QueryHelper.php:65-110); PHP arrays (`x[]=`) are JSON-encoded and the string "null" becomes NULL. On edit the API wrapper fills every field the request leaves out from the stored row (AdminAPIWrapper::keepFields / keepLineFields, src/Public/Controllers/Api/AdminAPIWrapper.php:186-292), so a partial update is safe; checkbox switches are on for any non-empty value other than 0 and off for `0` or `""`.'
      properties:
        mac:
          type: string
          description: '**Required.** Empty = STATUS_INVALID_INPUT (34); invalid = STATUS_INVALID_MAC (19); used by another device = STATUS_EXISTS_MAC (23).'
          example: 00:1A:79:12:34:56
        username:
          type: string
          description: Backing line username; empty = random 32 characters.
        password:
          type: string
          description: Backing line password; empty = random 32 characters.
        bouquets_selected:
          type: string
          description: 'JSON string, e.g. `[1,2,3]`. Bouquet ids. **Required** (a missing/invalid value raises a PHP TypeError: HTTP 500, empty body). Re-sorted into the global bouquet order and stored in `bouquet`. If the owner (`member_id`) has `allowed_bouquets`, silently intersected with it.'
          example: '[1,2,3]'
        exp_date:
          type: string
          description: Expiry; any PHP DateTime string (`2026-12-31`, `2026-12-31 23:59`, `@1798761600`). Absent = never expires (NULL) on create; unparsable = STATUS_INVALID_DATE (14); `""` or `1970-01-01` leaves it unchanged.
          example: '2026-12-31'
        no_expire:
          type:
            - integer
            - string
          description: Checkbox. Present = `exp_date` NULL (never expires). On edit only a truthy value counts.
        member_id:
          type: integer
          description: Owner (registered user id). Falsy = the API key's user.
        isp_clear:
          type: string
          description: 'ISP lock handling: empty/absent clears `isp_desc` and `as_number`. The edit wrapper keeps the lock unless the request sends `isp_clear` (any value), which clears it.'
        is_isplock:
          type:
            - integer
            - string
          description: Checkbox. Lock the line to the first ISP seen.
        is_trial:
          type:
            - integer
            - string
          description: Checkbox.
        allowed_ips[]:
          type: array
          items:
            type: string
          description: IP allow-list (a scalar is wrapped). Stored JSON. Empty on edit = cleared.
        lock_device:
          type:
            - integer
            - string
          description: Checkbox. Lock to the first device identifiers seen.
        pair_id:
          type: integer
          description: Main line this device mirrors; must exist (else STATUS_INVALID_USER, 31).
        category_template_id:
          type:
            - integer
            - string
          description: '`0`/`none` clears `custom_data`; a positive id builds `custom_data` from that category template.'
        admin_notes:
          type: string
        reseller_notes:
          type: string
        forced_country:
          type: string
        modem_mac:
          type: string
        local_ip:
          type: string
        enigma_version:
          type: string
        cpu:
          type: string
        lversion:
          type: string
        token:
          type: string
    Admin_UserInput:
      type: object
      additionalProperties: true
      description: 'Registered user (admin or reseller account) for create_user/edit_user (UserService::process, src/Domain/User/UserService.php:162-307). On create, checkbox fields are switched ON whenever the key is present (PHP isset), whatever its value: send them only to turn them on. Any other request key that matches a column of the target table is written as-is (QueryHelper::verifyPostTable, src/Core/Database/QueryHelper.php:65-110); PHP arrays (`x[]=`) are JSON-encoded and the string "null" becomes NULL. On edit the API wrapper fills every field the request leaves out from the stored row (AdminAPIWrapper::keepFields / keepLineFields, src/Public/Controllers/Api/AdminAPIWrapper.php:186-292), so a partial update is safe; checkbox switches are on for any non-empty value other than 0 and off for `0` or `""`.'
      required:
        - member_group_id
      properties:
        member_group_id:
          type: integer
          description: '**Required.** Empty, or a reserved group (group 1 and every is_admin group, unless you are a full admin) = STATUS_INVALID_GROUP (16).'
        username:
          type: string
          description: Empty = random 10 characters. Duplicate = STATUS_EXISTS_USERNAME (22).
        password:
          type: string
          description: Plain text; hashed on save. Empty on edit keeps the stored hash.
        email:
          type: string
        notes:
          type: string
        reseller_dns:
          type: string
          description: Comma-separated DNS hosts for the reseller's playlists.
        owner_id:
          type: integer
          description: Parent reseller.
        status:
          type: integer
          description: 1 enabled / 0 disabled. Default 1.
          enum:
            - 0
            - 1
        credits:
          type: number
          description: 'Create: initial balance. Edit: new balance; the change (`credits - credits_shown`, or minus the stored balance) is logged to users_credits_logs with `credits_reason`.'
        credits_shown:
          type: number
        credits_reason:
          type: string
        api_key:
          type: string
          description: 'Legacy API key: exactly 32 hex characters, otherwise stored empty.'
          pattern: ^[0-9a-fA-F]{32}$
        override_{packageId}:
          type: number
          description: Per-package official_credits override, one field per package (e.g. `override_3=8`). Stored overrides are kept on edit.
        bouquet_limit_enabled:
          type: string
          description: '`1` = restrict the reseller to `allowed_bouquets`; any other value = unrestricted (NULL). Absent on edit keeps the stored value.'
        allowed_bouquets:
          type:
            - array
            - string
          items:
            type: integer
          description: Bouquet ids (array or JSON string) used when bouquet_limit_enabled=1.
        bouquet_limit_revision:
          type: string
          description: 'Edit only: sha256 guard; mismatch = STATUS_INVALID_INPUT (34).'
        reset_2fa:
          type:
            - integer
            - string
          description: 'Checkbox. Edit only: non-empty disables the user''s 2FA.'
        timezone:
          type: string
        lang:
          type: string
        theme:
          type: string
        hue:
          type: string
