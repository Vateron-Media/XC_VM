tags:
  - name: Admin API
    description: |-
      **Routing.** Create an access code of type 3 (Admin API) on the Access Codes page. nginx (src/bin/nginx/conf/codes/template) routes every request under `/<code>/` to src/Public/index.php with XC_SCOPE=includes/api/admin; index.php resolves the code (src/Public/index.php:117-135, src/Core/Auth/AuthRepository.php:115-135) and runs the controller. The rest of the path is ignored. Parameters may be sent as query string or form-encoded POST (merged; POST wins; src/Core/Init/LegacyInitializer.php:57-58). Every operation in this tag is `/{code}/?action=<name>`; the HTTP method shown is a suggestion, both work.

      **Authentication.** `api_key` is either a named API token (`xct_` + 40 hex, created per user in the panel; stored as a SHA-256 hash in `api_tokens` with scope full/read/lines, optional allow_sql, IP allow-list and expiry; last_used is updated) or, while setting `api_legacy_keys` is not '0', the user's legacy `users.api_key` (32 hex). The key's user must have status=1 and belong to a group with is_admin=1 (src/Core/Auth/ApiTokens.php:47-93). Token scopes: `full` = everything the group may do; `read` = every get_* action plus user_info, packages, the log tables, check_active_code and export_active_code_batch; `lines` = user_info, packages, get_packages, get_package, get_bouquets, get_bouquet, any *active_code* action, and any action named `<verb>_line(s)|mag(s)|enigma(s)`. A scope refusal is `{"status":"STATUS_NO_PERMISSIONS"}`. Legacy keys are not scope-limited. The access code's own whitelist (if set) is enforced by nginx (allow/deny), before PHP (src/Core/Auth/AuthRepository.php:157-166).

      **Envelope.** Every reply is JSON with HTTP 200 (exceptions: a PHP TypeError gives HTTP 500 with an empty body; noted per operation). `status` is a constant name; services return numeric codes that parseError() maps to names: 0 STATUS_FAILURE, 1 STATUS_SUCCESS, 2 STATUS_SUCCESS_MULTI, 3 STATUS_CODE_LENGTH, 4 STATUS_NO_SOURCES, 5 STATUS_DISABLED, 6 STATUS_NOT_ADMIN, 7 STATUS_INVALID_EMAIL, 8 STATUS_INVALID_PASSWORD, 9 STATUS_INVALID_IP, 10 STATUS_INVALID_PLAYLIST, 11 STATUS_INVALID_NAME, 12 STATUS_INVALID_CAPTCHA, 13 STATUS_INVALID_CODE, 14 STATUS_INVALID_DATE, 15 STATUS_INVALID_FILE, 16 STATUS_INVALID_GROUP, 17 STATUS_INVALID_DATA, 18 STATUS_INVALID_DIR, 19 STATUS_INVALID_MAC, 20 STATUS_EXISTS_CODE, 21 STATUS_EXISTS_NAME, 22 STATUS_EXISTS_USERNAME, 23 STATUS_EXISTS_MAC, 24 STATUS_EXISTS_SOURCE, 25 STATUS_EXISTS_IP, 26 STATUS_EXISTS_DIR, 27 STATUS_SUCCESS_REPLACE, 28 STATUS_FLUSH, 29 STATUS_TOO_MANY_RESULTS, 30 STATUS_SPACE_ISSUE, 31 STATUS_INVALID_USER, 32 STATUS_CERTBOT, 33 STATUS_CERTBOT_INVALID, 34 STATUS_INVALID_INPUT, 35 STATUS_NOT_RESELLER, 36 STATUS_NO_TRIALS, 37 STATUS_INSUFFICIENT_CREDITS, 38 STATUS_INVALID_PACKAGE, 39 STATUS_INVALID_TYPE, 40 STATUS_INVALID_USERNAME, 41 STATUS_INVALID_SUBRESELLER, 42 STATUS_NO_DESCRIPTION, 43 STATUS_NO_KEY, 44 STATUS_EXISTS_HMAC, 45 STATUS_CERTBOT_RUNNING, 46 STATUS_RESERVED_CODE, 47 STATUS_NO_TITLE, 48 STATUS_NO_SOURCE, 49 STATUS_PORT_IN_USE, 50 STATUS_2FA_REQUIRED, 51 STATUS_2FA_INVALID, 52 STATUS_2FA_LOCKED. A service returning nothing (false/empty) becomes STATUS_NO_PERMISSIONS. Missing/rejected key: `{"status":"STATUS_FAILURE","error":"Invalid API key."}`; unknown action: `{"status":"STATUS_FAILURE","error":"Invalid action."}`.

      **Paging and columns.** `start` (intval, default 0) and `limit` (intval, 0/absent = 50) apply to table and active-code lists. `show_columns` / `hide_columns` (comma-separated) filter the keys of `data` (single records) or of every row (lists). Table actions accept DataTables parameters (`search[value]`, `order[0][column]`, `order[0][dir]`) and answer `{status, data, recordsTotal, recordsFiltered}` without `draw`.

      **Values.** Records are raw DB rows: non-zero numbers arrive as strings, zeros/empty/null keep their PHP type; JSON columns are JSON-encoded strings; timestamps are unix seconds.

      **Admin specifics** (src/Public/Controllers/Api/AdminApiController.php). Each action maps to advanced permissions (ACTION_PERMISSIONS, line 32); the key owner's group must hold any one of them, or be a full admin (empty allowed_pages / Administrators group); otherwise `{"status":"STATUS_NO_PERMISSIONS"}`. Every non-read action is recorded in the admin audit trail (AdminAudit) before that check. Unknown actions fall through to module actions (AdminApiRegistry) and module tables (TableRegistry); those bypass ACTION_PERMISSIONS and are not documented here. **Quirk:** several list actions (get_bouquets, get_access_codes, get_hmacs, get_epgs, get_providers, get_groups, get_packages, get_transcode_profiles, get_rtmp_ips, get_categories, get_blocked_uas, get_blocked_ips, get_servers) return a bare JSON array with no status. Table handlers that fail their own permission check print an empty body.
paths:
  /{access_code}/?action=mysql_query:
    post:
      operationId: Admin_mysql_query
      tags:
        - Admin API
      summary: Run a raw SQL statement
      description: |-
        Runs the `query` parameter verbatim against the panel database and returns every row the statement produced plus the last insert id. Any statement type is accepted (SELECT, UPDATE, DELETE, DDL); there is no parameter binding, no read-only mode and no row cap. **Extremely dangerous**: equivalent to full DB access; restrict with a token that does not have allow_sql. Rows are raw DB values (numbers as strings).

        **Permission:** the key's group needs any one of the advanced permissions `database` (src/Public/Controllers/Api/AdminApiController.php ACTION_PERMISSIONS); otherwise `{"status":"STATUS_NO_PERMISSIONS"}`.

        **Token scope:** only a `full` token with `allow_sql` set (or a legacy key) (src/Core/Auth/ApiTokens.php:111-113).

        **Source:** `src/Public/Controllers/Api/AdminApiController.php:290`, `src/Public/Controllers/Api/AdminAPIWrapper.php:1942`
      parameters:
        - $ref: '#/components/parameters/Admin_AccessCode'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - mysql_query
          description: Action name. May also be sent in a form-encoded POST body (POST overrides GET).
      requestBody:
        required: true
        description: Form-encoded; the same fields are also accepted in the query string. PHP array syntax (`name[]=a&name[]=b`) is used for list fields unless a field says it is a JSON string.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  example: SELECT id, username FROM users LIMIT 2
      responses:
        '200':
          description: JSON reply. Errors are also returned with HTTP 200; check `status`.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - status
                    properties:
                      status:
                        $ref: '#/components/schemas/Admin_Status'
                      data:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      insert_id:
                        type:
                          - integer
                          - string
                  - $ref: '#/components/schemas/Admin_Error'
              examples:
                success:
                  summary: Success
                  value:
                    status: STATUS_SUCCESS
                    data:
                      - id: '1'
                        username: admin
                      - id: '5'
                        username: reseller1
                    insert_id: 0
                sql_error:
                  summary: Statement failed
                  value:
                    status: STATUS_FAILURE
                invalid_key:
                  $ref: '#/components/examples/Admin_InvalidKey'
                no_permissions:
                  $ref: '#/components/examples/Admin_NoPermissions'
