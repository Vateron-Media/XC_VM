      description: |-
        Returns the `lines` table through the panel's DataTables handler, run in-process (src/Public/Controllers/Admin/TableController.php `handleLines` :414). See the tag description for paging, search, ordering and the response shape.

        Excludes MAG/Enigma lines and activation-code lines not yet redeemed (ActiveCodeService::LISTED_LINES). With Redis enabled `active_connections` is an integer.

        Search (`search[value]`, LIKE %v%): username, password, FROM_UNIXTIME(exp_date), max_connections, reseller_notes, admin_notes.

        **order[0][column]** index map: 0=(none), 1=(none), 2=`lines.id`, 3=`username`, 4=`password`, 5=`member_id`, 6=`enabled-admin_enabled`, 7=`online`, 8=`is_trial`, 9=`is_restreamer`, 10=`active_connections`, 11=`max_connections`, 12=`exp_date`, 13=`active_connections,last_activity`, 14=(none).

        Rows are raw DB rows: non-zero numbers are strings, falsy values (0, null, "") pass through as-is, and text is HTML-escaped (`<`/`>` to `&lt;`/`&gt;`). `recordsTotal` is a numeric string.

        **Permission:** the key's group needs any one of the advanced permissions `users`, `mass_edit_lines` (src/Public/Controllers/Api/AdminApiController.php ACTION_PERMISSIONS); otherwise `{"status":"STATUS_NO_PERMISSIONS"}`.

        **Token scope:** the table is re-checked as `get_lines` (ApiTokens::allows), so a `lines`-scope token can only read lines/mags/enigmas tables.

        **Source:** `src/Public/Controllers/Api/AdminApiController.php:296`, `src/Public/Controllers/Api/AdminAPIWrapper.php:89`, `src/Public/Controllers/Admin/TableController.php:414`
