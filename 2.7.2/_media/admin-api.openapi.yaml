  /{access_code}/?action=check_active_code:
    get:
      operationId: Admin_check_active_code
      tags:
        - Admin API
      summary: Check an activation code
      description: |-
        Looks up any code (not limited to yours). **Always** `status: STATUS_SUCCESS`; the outcome is in `data.status` (SUCCESS, INVALID_CODE, DISABLED, EXPIRED) and `data.valid`. The wrapper's "Invalid or inactive code." branch is unreachable because checkCode never returns an empty array.

        **Permission:** the key's group needs any one of the advanced permissions `users` (src/Public/Controllers/Api/AdminApiController.php ACTION_PERMISSIONS); otherwise `{"status":"STATUS_NO_PERMISSIONS"}`.

        **Token scope:** token scopes `full`, `read`, `lines` (src/Core/Auth/ApiTokens.php:106-128); legacy keys are not scope-limited.

        **Source:** `src/Public/Controllers/Api/AdminApiController.php:884`, `src/Public/Controllers/Api/AdminAPIWrapper.php:2108`, `src/Domain/Line/ActiveCodeService.php:1501`
      parameters:
        - $ref: '#/components/parameters/Admin_AccessCode'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - check_active_code
          description: Action name. May also be sent in a form-encoded POST body (POST overrides GET).
        - name: code
          in: query
          required: true
          schema:
            type: string
            example: K7M3Q9TZ2H
          description: Code (trimmed, upper-cased).
      responses:
        '200':
          description: JSON reply. Errors are also returned with HTTP 200; check `status`.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - status
                    properties:
                      status:
                        $ref: '#/components/schemas/Admin_Status'
                      data:
                        type: object
                        additionalProperties: true
                  - $ref: '#/components/schemas/Admin_Error'
              examples:
                success:
                  summary: Success
                  value:
                    status: STATUS_SUCCESS
                    data:
                      status: SUCCESS
                      valid: true
                      code: K7M3Q9TZ2H
                      code_status: 1
                      status_label: Ready (Stock)
                      package_name: 1 Month
                      is_trial: false
                      max_connections: 1
                      is_activated: false
                      activated_at: null
                      exp_date: null
                      exp_date_formatted: null
                      is_device_locked: false
                invalid:
                  summary: Unknown code
                  value:
                    status: STATUS_SUCCESS
                    data:
                      status: INVALID_CODE
                      valid: false
                      message: Invalid or unknown activation code.
                expired:
                  summary: Expired
                  value:
                    status: STATUS_SUCCESS
                    data:
                      status: EXPIRED
                      valid: false
                      code_status: 3
                      exp_date: 1757000000
                      exp_date_formatted: '2025-09-04 15:33:20'
                      message: This activation code has expired.
                invalid_key:
                  $ref: '#/components/examples/Admin_InvalidKey'
                no_permissions:
                  $ref: '#/components/examples/Admin_NoPermissions'
