  /{access_code}/?action=mass_active_codes:
    post:
      operationId: Admin_mass_active_codes
      tags:
        - Admin API
      summary: Bulk action on activation codes
      description: |-
        Applies `sub_action` (alias `action_type`; the `action` parameter is taken by the dispatcher) to `ids`. Sub-actions (with or without a `mass_` prefix): enable, disable, extend (`days`, default 30; only lines that already expire), reset_device, change_package (`package_id`), delete (`refund_credits`/`refund`, refunds go to resellers only).

        **Permission:** the key's group needs any one of the advanced permissions `edit_user`, `mass_edit_lines` (src/Public/Controllers/Api/AdminApiController.php ACTION_PERMISSIONS); otherwise `{"status":"STATUS_NO_PERMISSIONS"}`.

        **Token scope:** token scopes `full`, `lines` (src/Core/Auth/ApiTokens.php:106-128); legacy keys are not scope-limited. Not a read action, so the call is written to the admin audit trail (AdminAudit::start) before the permission check.

        **Source:** `src/Public/Controllers/Api/AdminApiController.php:875`, `src/Public/Controllers/Api/AdminAPIWrapper.php:2064`, `src/Domain/Line/ActiveCodeService.php:727`
      parameters:
        - $ref: '#/components/parameters/Admin_AccessCode'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - mass_active_codes
          description: Action name. May also be sent in a form-encoded POST body (POST overrides GET).
      requestBody:
        required: true
        description: Form-encoded; the same fields are also accepted in the query string. PHP array syntax (`name[]=a&name[]=b`) is used for list fields unless a field says it is a JSON string.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - sub_action
                - ids
              properties:
                sub_action:
                  type: string
                  enum:
                    - enable
                    - disable
                    - extend
                    - reset_device
                    - change_package
                    - delete
                    - mass_enable
                    - mass_disable
                    - mass_extend
                    - mass_reset_device
                    - mass_change_package
                    - mass_delete
                action_type:
                  type: string
                  description: Alias of sub_action.
                ids:
                  type:
                    - string
                    - array
                  items:
                    type: integer
                  description: Comma-separated string or `ids[]` array.
                  example: 4,5,6
                days:
                  type: integer
                package_id:
                  type: integer
                refund_credits:
                  type: boolean
      responses:
        '200':
          description: JSON reply. Errors are also returned with HTTP 200; check `status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin_Envelope'
              examples:
                success:
                  summary: Success
                  value:
                    status: STATUS_SUCCESS
                    message: Extended expiration of selected active codes by 30 days.
                no_ids:
                  summary: No active code IDs provided.
                  value:
                    status: STATUS_FAILURE
                    error: No active code IDs provided.
                none_accessible:
                  summary: No accessible codes found for mass action.
                  value:
                    status: STATUS_FAILURE
                    error: No accessible codes found for mass action.
                invalid_key:
                  $ref: '#/components/examples/Admin_InvalidKey'
                no_permissions:
                  $ref: '#/components/examples/Admin_NoPermissions'
