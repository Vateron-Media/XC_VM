        - $ref: '#/components/parameters/Admin_HideColumns'
        - $ref: '#/components/parameters/Admin_SearchValue'
        - $ref: '#/components/parameters/Admin_OrderColumn'
        - $ref: '#/components/parameters/Admin_OrderDir'
        - name: reseller
          in: query
