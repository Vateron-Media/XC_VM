        Values are DB strings. Same auth as server list.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - stream
          description: Action.
        - name: sub
          in: query
          required: true
          schema:
            type: string
            enum:
              - list
          description: Sub-action.
        - $ref: '#/components/parameters/LegacyAdmin_ApiPass'
      responses:
        '200':
          description: Streams.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
