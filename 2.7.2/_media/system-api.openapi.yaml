                  username: admin
                  credits: 0
                  group_id: '1'
                  group_name: Administrators
                  last_login: '1760600000'
                  date_registered: '1700000000'
                  email: ''
                  ip: 10.0.0.5
                  status: '1'
        '404':
          $ref: '#/components/responses/LegacyAdmin_NotFound'
  /admin/live:
    get:
      operationId: LegacyAdmin_live
      tags:
        - Legacy Admin Stream Endpoints
      summary: Server-to-server / admin-preview live stream
      description: |
        src/Public/admin/live.php. Sends `Access-Control-Allow-Origin: *`.

        Auth (live.php:37-62):
        - A `uitoken` forces `stream` (from the token) and `extension=m3u8`, with prebuffer `seg_time`.
        - Otherwise `RelayGuard::admit(stream, password)`. A relay-ticket caller asking for `m3u8` gets 404.
        - `prebuffer` or the header `X-XC_VM-Prebuffer` prebuffers `seg_time` seconds.

        The stream must be assigned to this server, else 404. If it is not running and not on-demand, 404.
        An on-demand stream is started and waited for up to 20 s.

        Output:
        - `odstart` returns the text `1` or `0` (:164-178). Quirk: the wait loop counts to 2000 polls but the timeout check
          compares against 200, so `0` almost never appears and `1` can come after a timeout.
        - `extension=m3u8` returns a playlist rewritten by `StreamUtils::generateAdminHLS`, with segment URLs
          `/admin/live?password=<pass>&extension=m3u8&segment=<n>.ts&stream=<id>` or `...&uitoken=<t>` (:185-195).
          `segment=` returns that `.ts` file (:196-206).
        - Otherwise a continuous MPEG-TS feed (:212-341). It is RelaySeal-framed when a relay passes `rk` (:66-72).
      parameters:
        - name: stream
          in: query
          required: false
          schema:
            type: integer
          description: Stream id (required unless uitoken).
        - name: extension
          in: query
          required: false
          schema:
            type: string
            enum:
              - ts
              - m3u8
          description: Output; anything but m3u8 is TS.
        - name: segment
          in: query
          required: false
          schema:
            type: string
          description: 'With m3u8: segment file name.'
        - name: prebuffer
          in: query
          required: false
          schema:
            type: string
          description: Presence enables prebuffer.
        - name: odstart
          in: query
          required: false
          schema:
            type: string
          description: Presence returns 1/0 after starting.
        - $ref: '#/components/parameters/LegacyAdmin_LivePassword'
        - $ref: '#/components/parameters/LegacyAdmin_UIToken'
        - $ref: '#/components/parameters/LegacyAdmin_RelayKey'
        - $ref: '#/components/parameters/LegacyAdmin_RelayTicket'
        - $ref: '#/components/parameters/LegacyAdmin_RelayAuth'
        - name: X-XC_VM-Prebuffer
          in: header
          required: false
          schema:
            type: string
          description: Any value enables prebuffer.
      responses:
        '200':
          description: TS stream, HLS playlist, segment, or `1`/`0` for odstart.
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
            application/vnd.apple.mpegurl:
              schema:
                type: string
              example: |
                #EXTM3U
                #EXT-X-VERSION:3
                #EXT-X-TARGETDURATION:10
                #EXT-X-MEDIA-SEQUENCE:120
                #EXTINF:10.000000,
                /admin/live?password=PASS&extension=m3u8&segment=12_120.ts&stream=12
            text/html:
              schema:
                type: string
                enum:
                  - '0'
                  - '1'
        '404':
          $ref: '#/components/responses/LegacyAdmin_NotFound'
  /admin/vod:
    get:
      operationId: LegacyAdmin_vod
      tags:
        - Legacy Admin Stream Endpoints
      summary: Movie file with Range support
      description: |
        src/Public/admin/vod.php. Sends `Access-Control-Allow-Origin: *`.
        Auth: a `uitoken` rewrites `stream` to `<id>.<container>`. Otherwise `RelayGuard::admit(<id from stream>, password)` (:27-38).

        Serves `VOD_PATH/<id>.<ext>` with the container mime type. It always sends `Accept-Ranges: 0-<size>` (non-standard)
        and `Content-Range`. A single range gives 206; a bad or multi-range request gives 416 with `Content-Range` (:56-110).

        Quirks:
        - Suffix ranges (`bytes=-N`) are mis-parsed: the `$range == '-'` test never matches them, so they become start=''.
        - An unknown movie or missing file falls through to an **empty 200**.
      parameters:
        - name: stream
          in: query
          required: false
          schema:
            type: string
          description: '`<id>.<ext>`, e.g. `345.mkv` (required unless uitoken).'
        - $ref: '#/components/parameters/LegacyAdmin_LivePassword'
        - $ref: '#/components/parameters/LegacyAdmin_UIToken'
        - $ref: '#/components/parameters/LegacyAdmin_RelayTicket'
        - $ref: '#/components/parameters/LegacyAdmin_RelayAuth'
        - name: Range
          in: header
          required: false
          schema:
            type: string
          description: Single `bytes=a-b` range.
      responses:
        '200':
          description: Whole file (or empty body when not found).
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/x-matroska:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/LegacyAdmin_NotFound'
        '416':
          description: Range not satisfiable; `Content-Range` set.
  /admin/timeshift:
    get:
      operationId: LegacyAdmin_timeshift
      tags:
        - Legacy Admin Stream Endpoints
      summary: TV-archive playback (HLS or concatenated TS)
      description: |
        src/Public/admin/timeshift.php. Sends `Access-Control-Allow-Origin: *`.
        Auth: `uitoken`, or `RelayGuard::admit(stream, password)`. A relay asking for m3u8 gets 404 (:33-56).

        Without `segment`, the first minute file `ARCHIVE_PATH/<id>/<Y-m-d:H-i>.ts` must exist, else 404. Up to `duration`
        one-minute files are queued (missing ones skipped); none found gives 404 (:85-113).

        Output:
        - `extension=m3u8` returns a VOD playlist with `#EXTINF:60.0,` per minute. Segment URLs are
          `/admin/timeshift?extension=m3u8&stream=<id>&segment=<file>&password=<live_streaming_pass>` or
          `...&segment=<file>&uitoken=<t>` (:116-139). With `segment`, the file is served as video/mp2t, or 404.
        - `extension=ts` returns the minutes concatenated, with single-range support (206/416) (:155-240).

        Quirks:
        - The uitoken branch updates RequestManager *after* `$rRequestData` was copied (:26 vs :40-49). The token's
          stream, extension, start and duration are therefore ignored, and the caller must pass them explicitly.
        - The stream not on this server gives 404.
      parameters:
        - name: stream
          in: query
          required: true
          schema:
            type: integer
          description: Stream id.
        - name: extension
          in: query
          required: true
          schema:
            type: string
            enum:
              - m3u8
              - ts
          description: Output format.
        - name: start
          in: query
          required: false
          schema:
            type: string
          description: Unix time, `YYYYMMDD-HH`, or `YYYY-MM-DD:HH-MM` (StreamUtils::timeshiftStartTimestamp, src/Core/Util/StreamUtils.php:566-581). Required without segment.
        - name: duration
          in: query
          required: false
          schema:
            type: integer
          description: Minutes. Required without segment.
        - name: segment
          in: query
          required: false
          schema:
            type: string
          description: Archive file name, e.g. `2026-10-17:08-00.ts`.
        - $ref: '#/components/parameters/LegacyAdmin_LivePassword'
        - $ref: '#/components/parameters/LegacyAdmin_UIToken'
        - $ref: '#/components/parameters/LegacyAdmin_RelayTicket'
        - $ref: '#/components/parameters/LegacyAdmin_RelayAuth'
      responses:
        '200':
          description: Playlist, segment or TS.
          content:
            application/x-mpegurl:
              schema:
                type: string
              example: |-
                #EXTM3U
                #EXT-X-VERSION:3
                #EXT-X-TARGETDURATION:60
                #EXT-X-MEDIA-SEQUENCE:0
                #EXT-X-PLAYLIST-TYPE:VOD
                #EXTINF:60.0,
                /admin/timeshift?extension=m3u8&stream=12&segment=2026-10-17:08-00.ts&password=PASS
                #EXT-X-ENDLIST
            video/mp2t:
              schema:
                type: string
                format: binary
        '206':
          description: Partial TS.
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/LegacyAdmin_NotFound'
        '416':
          description: Range not satisfiable.
  /admin/thumb:
    get:
      operationId: LegacyAdmin_thumb
      tags:
        - Legacy Admin Stream Endpoints
      summary: Live thumbnail
      description: |
        src/Public/admin/thumb.php. Auth: `uitoken`, or a relay ticket only. `password` is **not** accepted
        (`RelayGuard::admit(..., null, ..., false)`, :28-39).
        - On the stream's `vframes_server_id`: `STREAMS_PATH/<id>_.jpg` is returned if it is under 60 s old, with `Age`. Otherwise 404 (:52-61).
        - On any other server: 302 to `<vframes site_url>admin/thumb?stream=<id>&aid=<aid>&uitoken=<t>&expires=<e>` (:63-66).
      parameters:
        - name: stream
          in: query
          required: false
          schema:
            type: integer
          description: Stream id (from uitoken if given).
        - name: aid
          in: query
          required: false
          schema:
            type: integer
          description: Passed through on redirect.
        - name: expires
          in: query
          required: false
          schema:
            type: integer
          description: Passed through on redirect.
        - $ref: '#/components/parameters/LegacyAdmin_UIToken'
        - $ref: '#/components/parameters/LegacyAdmin_RelayTicket'
        - $ref: '#/components/parameters/LegacyAdmin_RelayAuth'
      responses:
        '200':
          description: JPEG (Content-Type `image/jpg` as sent).
          headers:
            Age:
              schema:
                type: integer
              description: Seconds since the frame was written.
          content:
            image/jpg:
              schema:
                type: string
                format: binary
        '302':
          description: Redirect to the vframes server.
        '404':
          $ref: '#/components/responses/LegacyAdmin_NotFound'
  /admin/proxy_api:
    post:
      operationId: LegacyAdmin_proxyApi
      tags:
        - Legacy Admin Stream Endpoints
      summary: Proxy server stats report; returns pending signals
      description: |
        MAIN. src/Public/admin/proxy_api.php.

        Signed form (:31-40):
        - `X-XCVM-Proxy-Auth: <ts_ms>.<32-hex nonce>.<64-hex mac>`.
        - mac = HMAC-SHA256(K, `xcvm proxy req v1|<server_id>|<ts>|<nonce>|<sha256(body)>`), within ±90 s, nonce single-use.
        - K = HMAC-SHA256(proxy_secret, `xcvm proxy key v1|<server_id>|<gen>`) (src/Domain/Server/ProxyKey.php).
        - After the first signed request the proxy is marked `proxy_signed` and unsigned requests are refused.

        Unsigned (legacy) form (:41-54): the source address must be a known proxy IP, and `server_id` must resolve to it
        (ProxyIdentity::resolve).

        Side effects: inserts `servers_stats` and updates `servers` (connections, users, ping, server_hardware, interfaces,
        watchdog_data). Then it returns and **deletes** the server's pending `signals` (excluding OPENSSL_EXTRA rows) (:103-118).
        - Unsigned reply: a JSON array of the signals' `custom_data` objects.
        - Signed reply: `{"payload":"<that array as a JSON string>","mac":"<hex>"}`, where mac = HMAC(K, `xcvm proxy resp v1|<server_id>|<nonce>|<payload>`).

        Quirk: if the signals query fails, the body is empty. Unauthorised requests get 404.
      parameters:
        - name: X-XCVM-Proxy-Auth
          in: header
          required: false
          schema:
            type: string
            pattern: ^\d+\.[0-9a-f]{32}\.[0-9a-f]{64}$
          description: Signed-mode header.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - server_id
                - stats
              properties:
                server_id:
                  type: integer
                stats:
                  type: object
                  description: 'Sent as `stats[cpu]=...`. Keys used: cpu, cpu_cores, cpu_avg, total_mem, total_mem_free, total_mem_used, total_mem_used_percent, total_disk_space, uptime, total_running_streams, bytes_sent_total, bytes_received_total, cpu_load_average, kernel, cpu_name, network_speed, interfaces.'
                  additionalProperties: true
                addresses:
                  description: Addresses the proxy sees itself on (telemetry, `ips_seen`).
      responses:
        '200':
          description: Pending signals.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: object
                      additionalProperties: true
                  - type: object
                    properties:
                      payload:
                        type: string
                      mac:
                        type: string
              examples:
                unsigned:
                  value:
                    - action: block_ip
                      ip: 203.0.113.9
                signed:
                  value:
                    payload: '[]'
                    mac: 9f2c...e1
        '404':
          $ref: '#/components/responses/LegacyAdmin_NotFound'
