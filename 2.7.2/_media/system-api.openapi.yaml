        src/Domain/User/UserRepository.php:596-610, getUserInfo :639). `user_info` is the `lines` row (DB strings, JSON fields decoded) plus:
        - `output_formats`
        - `channel_ids`, `live_ids`, `vod_ids`, `radio_ids`, `series_ids`
        - `active_cons`
        - `category_ids`

        Same auth as server list.
      parameters:
