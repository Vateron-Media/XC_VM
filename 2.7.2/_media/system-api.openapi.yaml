          description: Target servers.
        - name: server_id
          in: query
          required: false
          schema:
            type: integer
          description: Single server when servers is empty.
        - name: force
          in: query
          required: false
          schema:
            type: string
          description: 'start only: truthy runs at once instead of queueing.'
        - $ref: '#/components/parameters/LegacyAdmin_ApiPass'
      responses:
        '200':
          description: Always true once dispatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internal_Result'
              example:
