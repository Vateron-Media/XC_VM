    get:
      operationId: Internal_status
      tags:
        - Internal Server API
      summary: Local status probe (loopback only)
      description: |
        nginx `location ~ ^/status$` allows 127.0.0.1 only and gives everything else nginx's 403
        (src/bin/nginx/conf/nginx.conf:283-297). It passes `XC_STREAM=status` to src/Public/stream/index.php:24-27,
        which runs `StreamingRequestBootstrap::init('status')` and exits with an empty 200.
        `status` is exempt from the fail-closed settings gate (src/Infrastructure/Bootstrap/StreamingRequestBootstrap.php:93).
        The FPM pools also declare `pm.status_path = /status` (src/bin/php/etc/1.conf:17). Since nginx overrides
        `SCRIPT_NAME` to `/public/stream/index.php`, the FPM status page is probably not what answers.
        Read by the `fpm_status` action.
      responses:
        '200':
          description: Empty body (or FPM's plain-text pool status, see description).
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: nginx 403 for non-loopback clients.
  /xfile:
    get:
      operationId: Internal_xfile
      tags:
        - Internal Server API
      summary: Ticketed file chunk fetch between servers (replaces api getFile)
      description: |
        Route: nginx `location = /xfile` (`limit_req zone=xfile burst=100`, 429) sets `XC_ADMIN=xfile`
        (src/bin/nginx/conf/nginx.conf:330-346). It reaches src/Public/admin/xfile.php, then
        `FileTicketController::handle` (src/Public/Controllers/Api/FileTicketController.php:16-27), then
        `FileTicketServer::serve` (src/Core/Cluster/FileTicketServer.php:57-130).

        Auth:
        - Method must be GET.
        - `X-XCVM-File` carries a panel-signed `fil` ticket (fetcher_sid, fetcher_gen, owner_sid = this server, ref, file, tid).
        - `X-XCVM-File-Auth` is the fetcher's Ed25519 proof `<ts_ms>.<32-hex nonce>.<86-char b64url sig>` over ticket,
          method and request target. It must be within ±90 s, and the nonce is single-use (src/Core/Cluster/Crypto/RelayAuth.php:40).

        File checks: the file must have an allowed extension (FileTicketServer.php:44: log gz zip m3u8 mp4 mkv avi mpg flv 3gp
        m4v wmv mov ts srt sub sbv jpg png bmp jpeg gif tif) and lie under `lb_scan_roots` (or MAIN's own sealed paths).

        Any auth or path failure gives a bare 404.
      parameters:
        - name: o
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
          description: Byte offset.
        - name: 'n'
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 4194304
          description: Chunk length (≤ FileDigest::CHUNK).
        - name: rk
          in: query
          required: false
          schema:
            type: string
          description: RelaySeal sealed session key. When given, the chunk is framed and encrypted under it.
        - name: X-XCVM-File
          in: header
          required: true
          schema:
            type: string
          description: Panel-signed `fil` ticket.
        - name: X-XCVM-File-Auth
          in: header
          required: true
          schema:
            type: string
            pattern: ^\d+\.[0-9a-f]{32}\.[A-Za-z0-9_-]{86}$
          description: Fetcher proof.
      responses:
        '200':
          description: The chunk (shorter than `n` at EOF; empty when `o` equals the size).
          headers:
            X-XCVM-File-Digest:
              schema:
                type: string
              description: Server-signed digest over (tid, server, offset, total, bytes, time, nonce).
            X-XCVM-Relay-Seal:
              schema:
                type: string
                enum:
                  - v1
              description: Present when `rk` sealed the body.
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Bad `o` or `n` (empty body).
        '404':
          description: Ticket, proof, nonce, path or seal refused (empty body).
        '416':
          description: '`o` > file size. Header `Content-Range: bytes */<size>`.'
        '429':
          description: nginx rate limit.
        '503':
          description: Server cannot sign the digest (empty body).
