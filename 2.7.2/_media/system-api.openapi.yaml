openapi: 3.1.0
info:
  title: XC_VM System API
  version: 2.7.2
  summary: Internal Server API, Legacy Admin Stream Endpoints of the Xtream Codes compatible HTTP surface, as implemented by XC_VM.
  description: |
    A source-level reference for the **Xtream Codes (XC) API**: the de facto standard HTTP interface
    between IPTV panels and player apps. The reference implementation is
    [XC_VM](https://github.com/Vateron-Media/XC_VM) 2.7.2, an open-source continuation of Xtream UI / XC.
    Each operation cites the XC_VM source file and line it was traced from (`src/...:line`).

    ## Authentication models

    The panel has several independent auth schemes. Each endpoint states which one it uses.

    | Who | How |
    |---|---|
    | Line (subscriber) | `username` + `password` query parameters, or `token` (32-char line access token). Also in path form: `/player_api/{u}/{p}`, `/live/{u}/{p}/...` |
    | Activation code | The code typed as `username` (or `token`) is activated on first use and becomes a line |
    | MAG / Stalker box | MAC address cookie + bearer token from `handshake` (`/c/portal.php`, `/stalker_portal/...`) |
    | Enigma2 box | MAC/device registration (`enigma2.php`) |
    | Admin / reseller REST | `api_key` query parameter (named `xct_` token or legacy per-user key) on `/{access_code}/?action=...`; the access code's IP whitelist is enforced by nginx |
    | Load-balancer nodes | Shared cluster secret (`/cluster/v1`); signed `node.rpc` (legacy `api.php` on nodes older than 2.7.0) |

    ## Notation

    OpenAPI cannot express query-string multiplexing, so action-based endpoints are written as separate
    literal paths such as `/player_api.php?action=get_live_streams`. The request is still a single
    `GET /player_api.php` with `action` as an ordinary query parameter.

    The admin and reseller REST APIs share one URL shape, `/{access_code}/?action=...`. Each access code has a type
    (3 = Admin API, 4 = Reseller API) and nginx routes it to that API, so `/{access_code}/...` and `/{reseller_access_code}/...` are the
    same URL and differ only in which kind of code is used.
  contact:
    name: XC_VM project
    url: https://github.com/Vateron-Media/XC_VM
  license:
    name: AGPL-3.0 (XC_VM source); this document describes its public interface
    identifier: AGPL-3.0-only
servers:
  - url: '{protocol}://{host}:{port}'
    description: Any XC compatible panel or load-balancer node
    variables:
      protocol:
        default: http
        enum:
          - http
          - https
      host:
        default: tv.example.com
      port:
        default: '80'
        description: HTTP broadcast port (often 80, 8080, 8000, 25461); HTTPS often 443 or 25463.
externalDocs:
  description: XC_VM source
  url: https://github.com/Vateron-Media/XC_VM
components:
  parameters:
    Username:
      name: username
      in: query
      required: true
      description: Line username. Optional when `token` is sent instead.
      schema:
        type: string
        example: demo
    Password:
      name: password
      in: query
      required: true
      description: Line password. Optional when `token` is sent instead.
      schema:
        type: string
        format: password
        example: s3cret
    Internal_Password:
      name: password
      in: query
      required: true
      schema:
        type: string
      description: |
        Legacy (pre-2.7.0 nodes) only: the panel's `live_streaming_pass`. It is also sent as a form field by ApiClient::systemRequest.
        Not used on the `node.rpc` path.
    LegacyAdmin_ApiPass:
      name: api_pass
      in: query
      required: false
      schema:
        type: string
      description: Must equal the `api_pass` setting when that setting is non-empty (src/Public/admin/api.php:32-34).
    LegacyAdmin_LivePassword:
      name: password
      in: query
      required: false
      schema:
        type: string
      description: '`live_streaming_pass` (from an allowed server IP with DATAPLANE flow off) or a loopback `lb1-...` token (127.0.0.1/::1 only).'
    LegacyAdmin_UIToken:
      name: uitoken
      in: query
      required: false
      schema:
        type: string
      description: Panel-issued AdminStreamToken (encrypted with live_streaming_pass; bound to IP/subnet; carries stream id and expiry).
    LegacyAdmin_RelayKey:
      name: rk
      in: query
      required: false
      schema:
        type: string
      description: RelaySeal sealed session key (relay callers). Output is framed and encrypted under it. An invalid key gives 404.
    LegacyAdmin_RelayTicket:
      name: X-XCVM-Relay
      in: header
      required: false
      schema:
        type: string
      description: Panel-signed `rly` ticket (parent_sid, stream_id, child_sid, child_gen).
    LegacyAdmin_RelayAuth:
      name: X-XCVM-Relay-Auth
      in: header
      required: false
      schema:
        type: string
      description: Child's Ed25519 proof `<ts_ms>.<32-hex nonce>.<b64url sig>` over ticket, method and target (±90 s).
  responses:
    Internal_RouteRemoved:
      description: |
        This build: `/api` and `/api.php` have no controller, so the reply is 404 with an empty body (src/Public/index.php:185-187).
        On pre-2.7.0 nodes, a wrong password or IP gave a 404 nginx-style page (generateError, production mode).
    LegacyAdmin_NotFound:
      description: '`generate404()`: 404 with an nginx-mimicking HTML page (src/Core/Error/ErrorResponder.php:119-121,235).'
      content:
        text/html:
          schema:
            type: string
          example: "<html>\r\n<head><title>404 Not Found</title></head>\r\n<body>\r\n<center><h1>404 Not Found</h1></center>\r\n<hr><center>nginx</center>\r\n</body>\r\n</html>\r\n"
  schemas:
    Internal_Result:
      type: object
      properties:
        result:
          type: boolean
      required:
        - result
    Internal_Stats:
      type: object
      description: SystemInfo::getStats (src/Core/Util/SystemInfo.php:30-90).
      properties:
        cpu:
          type: number
        cpu_cores:
          type: integer
        cpu_avg:
          type: number
        cpu_name:
          type: string
        total_mem:
          type: integer
        total_mem_free:
          type: integer
        total_mem_used:
          type: integer
        total_mem_used_percent:
          type: number
        total_disk_space:
          type: integer
        free_disk_space:
          type: integer
        kernel:
          type: string
        uptime:
          type: string
        total_running_streams:
          type: integer
        bytes_sent:
          type: number
        bytes_sent_total:
          type: number
        bytes_received:
          type: number
        bytes_received_total:
          type: number
        network_speed:
          type:
            - integer
            - string
        interfaces:
          type: array
          items:
            type: string
        network_info:
          type: object
        audio_devices:
          type: array
        video_devices:
          type: array
        gpu_info:
          type:
            - object
            - array
        iostat_info:
          type:
            - object
            - array
        cpu_load_average:
          type: number
      example:
        cpu: 12.5
        cpu_cores: 8
        cpu_avg: 10.2
        cpu_name: Intel(R) Xeon(R) E-2288G
        total_mem: 32768000
        total_mem_free: 20480000
        total_mem_used: 12288000
        total_mem_used_percent: 37.5
        total_disk_space: 500107862016
        free_disk_space: 380107862016
        kernel: 6.8.0-45-generic
        uptime: 12d 4h 3m
        total_running_streams: 42
        bytes_sent: 1250000
        bytes_sent_total: 98765432100
        bytes_received: 900000
        bytes_received_total: 87654321000
        network_speed: 1000
        interfaces:
          - eth0
        network_info: {}
        audio_devices: []
        video_devices: []
        gpu_info: []
        iostat_info: []
        cpu_load_average: 0.85
tags:
  - name: Internal Server API
    description: |
      Server-to-server "system API" of a load balancer / node: `/api.php?action=<name>` (alias `/api`).
      Not part of the Xtream Codes client API.

      **Status in this tree (2.8.0):** Phase 10 removed `InternalApiController::index` (docs/adr/0004-cluster-api.md).
      nginx still routes `location = /api` and `location = /api.php` to `Public/index.php` with
      `XC_SCOPE=api`, `XC_API=internal` (src/bin/nginx/conf/nginx.conf:451-479), but `internal` is not in
      `$rApiEndpoints`, so every HTTP request to `/api` or `/api.php` gets **404 with an empty body**
      (src/Public/index.php:170-187).

      The actions survive as the payload of the signed `node.rpc` cluster command:
      `cluster:exec` (src/Cli/Commands/ClusterExecCommand.php:280-289) calls
      `InternalApiController::runCommand` (src/Public/Controllers/Api/InternalApiController.php:39-41).
      That path does no password or IP check: the panel's Ed25519 command signature replaces them.
      The node returns the action's raw output in `ack.result`, truncated at 4194304 bytes
      (CommandBus::MAX_RESULT, src/Domain/Cluster/CommandBus.php:59,355-359). `scandir_recursive` still pages `stat`
      listings at 60000 bytes, per a stale comment claiming a 65536 cap (InternalApiController.php:394-399).

      MAIN still sends the legacy HTTP form to nodes that are not on the cluster bus (pre-2.7.0 nodes):
      `ApiClient::systemRequest` POSTs `http://<server_ip>:<http_broadcast_port>/api` with the fields form-encoded
      and `password=<live_streaming_pass>` added (src/Core/Http/ApiClient.php:69-90).
      `ApiClient::asyncRequest` POSTs to `api_url` = `http://<host>:<port>/api?password=<live_streaming_pass>`
      (src/Core/Http/ApiClient.php:99-112, src/Domain/Server/ServerRepository.php:153-154).
      On such nodes access also required the source IP in `ServerRepository::getAllowedIPs()`
      (src/Domain/Server/ServerRepository.php:524). That list is 127.0.0.1, SERVER_ADDR, and every server's
      `server_ip`, `private_ip`, `whitelist_ips` and IP-valued `domain_name`, cached 60 s.
      Failures used the error codes `INVALID_API_PASSWORD` / `API_IP_NOT_ALLOWED` (src/Core/Error/ErrorResponder.php:35,57).
      In production those render as a 404 nginx-style page.

      Corrections to docs/_media/system-api.openapi.yaml:
      - These actions are gone from the dispatcher and answer `{"result":false}` via `default`:
        `view_log`, `pidsAreRunning`, `kill_watch`, `reload_epg`, `watch_force`, `plex_force`, `getFile`, `redirect_connection`.
        `getFile` is replaced by `/xfile`; MAIN still builds `action=getFile` URLs only for pre-2.7.0 nodes
        (src/Domain/Server/ServerRepository.php:357).
      - `activity_id` is a string connection reference, not an integer.
      - Callers send POST, not GET.
  - name: Legacy Admin Stream Endpoints
    description: |
      `/admin/(api|live|proxy_api|thumb|timeshift|vod)` on every server. nginx
      `location ~ ^/admin/(api|index|live|proxy_api|thumb|timeshift|vod)$` uses `limit_req zone=one burst=8`
      and sets `XC_ADMIN=$1` for src/Public/admin/index.php (src/bin/nginx/conf/nginx.conf:306-321).
      - The `.php` forms get a 302 to `/admin/$1?$args` (nginx.conf:323-325).
      - `/admin/index`, or an unknown or missing handler, gets 404 with an nginx-style HTML body
        (src/Public/admin/index.php:23-26,39-43).

      Stream endpoints are admitted by `RelayGuard::admit` (src/Core/Cluster/RelayGuard.php:59-70), in one of three ways:
      1. A relay presents `X-XCVM-Relay` (panel-signed `rly` ticket naming parent_sid, stream_id, child_sid, child_gen)
         plus `X-XCVM-Relay-Auth`, the child's Ed25519 proof. Once these headers are present they alone decide.
      2. A loopback `password=lb1-...` token, accepted only from 127.0.0.1 or ::1.
      3. The legacy `password=<live_streaming_pass>` from an IP in `getAllowedIPs()`, only when that server's DATAPLANE flow
         is off (RelayGuard.php:118-133).

      Alternatively a panel `uitoken` (AdminStreamToken, decoded with live_streaming_pass, IP- or subnet-bound)
      is accepted by live, vod, timeshift and thumb.
      Auth failures call `generate404()`: HTTP 404 with the nginx-style HTML page (src/Core/Error/ErrorResponder.php:119,235).
paths:
  /api.php?action=fpm_status:
    post:
      operationId: Internal_fpmStatus
      deprecated: true
      tags:
        - Internal Server API
      summary: Raw PHP-FPM / local status page
      description: |
        Echoes `file_get_contents('http://127.0.0.1:<http_broadcast_port>/status')`
        (src/Public/Controllers/Api/InternalApiController.php:45-48). See `/status`.
        HTTP route removed in this build: 404 (src/Public/index.php:185-187). It runs as a `node.rpc` command.
      parameters:
        - $ref: '#/components/parameters/Internal_Password'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - fpm_status
          description: Action name.
      responses:
        '200':
          description: Body of the local `/status` request, passed through unchanged.
          content:
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Internal_RouteRemoved'
  /api.php?action=restore_images:
    post:
      operationId: Internal_restoreImages
      deprecated: true
      tags:
        - Internal Server API
      summary: Re-download missing images in the background
      description: |
        Runs `console.php tools images` detached (src/Public/Controllers/Api/InternalApiController.php:50-53).
        It returns no body. HTTP route removed in this build: 404.
      parameters:
        - $ref: '#/components/parameters/Internal_Password'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - restore_images
          description: Action name.
      responses:
        '200':
          description: Empty body.
        '404':
          $ref: '#/components/responses/Internal_RouteRemoved'
  /api.php?action=reload_nginx:
    post:
      operationId: Internal_reloadNginx
      deprecated: true
      tags:
        - Internal Server API
      summary: Reload nginx and nginx_rtmp
      description: |
        Runs `nginx_rtmp -s reload` then `nginx -s reload` (src/Public/Controllers/Api/InternalApiController.php:55-59).
        It returns no body. HTTP route removed in this build: 404.
      parameters:
        - $ref: '#/components/parameters/Internal_Password'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - reload_nginx
          description: Action name.
      responses:
        '200':
          description: Empty body.
        '404':
          $ref: '#/components/responses/Internal_RouteRemoved'
  /api.php?action=streams_ramdisk:
    post:
      operationId: Internal_streamsRamdisk
      deprecated: true
      tags:
        - Internal Server API
      summary: Bytes on the streams ramdisk per stream id
      description: |
        Parses `ls -l STREAMS_PATH`, summing the size of files named `<id>_<x>` per stream id
        (src/Public/Controllers/Api/InternalApiController.php:61-92). `set_time_limit(30)`.
        Quirk: `streams` is an object keyed by stream id, but `[]` (an empty array) when nothing matches.
        HTTP route removed in this build: 404.
      parameters:
        - $ref: '#/components/parameters/Internal_Password'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - streams_ramdisk
          description: Action name.
      responses:
        '200':
          description: Totals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    const: true
                  streams:
                    description: Map of stream id to total bytes; `[]` when empty.
                    oneOf:
                      - type: object
                        additionalProperties:
                          type: integer
                      - type: array
                        maxItems: 0
              examples:
                some:
                  value:
                    result: true
                    streams:
                      '12': 4823104
                      '57': 1310720
                none:
                  value:
                    result: true
                    streams: []
        '404':
          $ref: '#/components/responses/Internal_RouteRemoved'
  /api.php?action=vod:
    post:
      operationId: Internal_vod
      deprecated: true
      tags:
        - Internal Server API
      summary: Start or stop movie (VOD) encodes
      description: |
        `function=start`: for each id, `StreamProcess::stopMovie(id, true)`. Then `startMovie` if `force` is truthy,
        else `queueMovie`. `function=stop`: `stopMovie(id)`.
        Source: src/Public/Controllers/Api/InternalApiController.php:94-124.
        Quirk: when `stream_ids` or `function` is empty, or `function` is neither start nor stop, it falls through to
        `rtmp_stats` and returns the RTMP stats JSON instead. HTTP route removed in this build: 404.
        MAIN sends it via `NodeRpc::broadcast` from `/admin/api?action=vod`.
      parameters:
        - $ref: '#/components/parameters/Internal_Password'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - vod
          description: Action name.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - stream_ids
                - function
              properties:
                stream_ids:
                  type: array
                  items:
                    type: integer
                  description: Movie stream ids (`stream_ids[]=`), intval'd.
                function:
                  type: string
                  enum:
                    - start
                    - stop
                force:
                  type: string
                  description: 'start only: truthy runs startMovie now instead of queueing.'
      responses:
        '200':
          description: '`{"result":true}`, or the rtmp_stats body on fall-through.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internal_Result'
              example:
                result: true
        '404':
          $ref: '#/components/responses/Internal_RouteRemoved'
  /api.php?action=rtmp_stats:
    post:
      operationId: Internal_rtmpStats
      deprecated: true
      tags:
        - Internal Server API
      summary: nginx-rtmp /stat as JSON
      description: |
        `json_encode(ServerRepository::getLocalRTMPStats())`: the RTMP module's `/stat` XML converted to an array
        (src/Public/Controllers/Api/InternalApiController.php:127-130; src/Domain/Server/ServerRepository.php:565-571).
        The value is `null` when the stat page cannot be read. HTTP route removed in this build: 404.
      parameters:
        - $ref: '#/components/parameters/Internal_Password'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - rtmp_stats
          description: Action name.
      responses:
        '200':
          description: The XML-to-JSON tree of nginx-rtmp `/stat` (element names as keys, text values as strings).
          content:
            application/json:
              schema:
                type:
                  - object
                  - 'null'
              example:
                nginx_version: 1.24.0
                uptime: '86400'
                server:
                  application:
                    name: live
                    live:
                      nclients: '1'
        '404':
          $ref: '#/components/responses/Internal_RouteRemoved'
  /api.php?action=kill_pid:
    post:
      operationId: Internal_killPid
      deprecated: true
      tags:
        - Internal Server API
      summary: SIGKILL a process
      description: |
        `posix_kill(intval(pid), 9)` (src/Public/Controllers/Api/InternalApiController.php:132-142).
        It returns `{"result":false}` when pid ≤ 0. The return value of `posix_kill` is ignored.
        HTTP route removed in this build: 404.
      parameters:
        - $ref: '#/components/parameters/Internal_Password'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - kill_pid
          description: Action name.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - pid
              properties:
                pid:
                  type: integer
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internal_Result'
              examples:
                ok:
                  value:
                    result: true
                badPid:
                  value:
                    result: false
        '404':
          $ref: '#/components/responses/Internal_RouteRemoved'
  /api.php?action=rtmp_kill:
    post:
      operationId: Internal_rtmpKill
      deprecated: true
      tags:
        - Internal Server API
      summary: Drop an RTMP publisher
      description: |
        Fires `wget <rtmp_mport_url>control/drop/publisher?app=live&name=<name>` in the background
        (src/Public/Controllers/Api/InternalApiController.php:144-149). It always returns `{"result":true}`.
        HTTP route removed in this build: 404.
      parameters:
        - $ref: '#/components/parameters/Internal_Password'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - rtmp_kill
          description: Action name.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: RTMP stream name (escapeshellcmd'd).
      responses:
        '200':
          description: Always true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internal_Result'
              example:
                result: true
        '404':
          $ref: '#/components/responses/Internal_RouteRemoved'
  /api.php?action=stream:
    post:
      operationId: Internal_stream
      deprecated: true
      tags:
        - Internal Server API
      summary: Start or stop live streams
      description: |
        `function=start`: `StreamProcess::startMonitor(id, 1)`, sleeping 50 ms after each PHP-monitor spawn.
        `function=stop`: `StreamProcess::stopStream(id, true)`.
        Source: src/Public/Controllers/Api/InternalApiController.php:151-183.
        Quirk: when `stream_ids` or `function` is empty, or `function` is unknown, it falls through to `stats` and
        returns the system stats object. HTTP route removed in this build: 404.
      parameters:
        - $ref: '#/components/parameters/Internal_Password'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - stream
          description: Action name.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - stream_ids
                - function
              properties:
                stream_ids:
                  type: array
                  items:
                    type: integer
                function:
                  type: string
                  enum:
                    - start
                    - stop
      responses:
        '200':
          description: '`{"result":true}`, or the `stats` object on fall-through.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internal_Result'
              example:
                result: true
        '404':
          $ref: '#/components/responses/Internal_RouteRemoved'
  /api.php?action=stats:
    post:
      operationId: Internal_stats
      deprecated: true
      tags:
        - Internal Server API
      summary: Server hardware and traffic statistics
      description: |
        `json_encode(SystemInfo::getStats())` (src/Public/Controllers/Api/InternalApiController.php:186-189;
        src/Core/Util/SystemInfo.php:30-90). HTTP route removed in this build: 404.
      parameters:
        - $ref: '#/components/parameters/Internal_Password'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - stats
          description: Action name.
      responses:
        '200':
          description: Stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internal_Stats'
        '404':
          $ref: '#/components/responses/Internal_RouteRemoved'
  /api.php?action=force_stream:
    post:
      operationId: Internal_forceStream
      deprecated: true
      tags:
        - Internal Server API
      summary: Force a stream onto a given source index
      description: |
        For `stream_id > 0`: `FanoutClient::forceSource(stream_id, force_id)`. When that fails, it writes
        `SIGNALS_TMP_PATH/<stream_id>.force` for the PHP monitor
        (src/Public/Controllers/Api/InternalApiController.php:191-204). It always returns `{"result":true}`.
        HTTP route removed in this build: 404.
      parameters:
        - $ref: '#/components/parameters/Internal_Password'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - force_stream
          description: Action name.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - stream_id
                - force_id
              properties:
                stream_id:
                  type: integer
                force_id:
                  type: integer
                  description: Source index to switch to.
      responses:
