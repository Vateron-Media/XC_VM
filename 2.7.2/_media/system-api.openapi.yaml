                  stream_name: News HD
        '404':
          $ref: '#/components/responses/LegacyAdmin_NotFound'
  /admin/api?action=stream&sub=online:
    get:
      operationId: LegacyAdmin_streamStatus
      tags:
        - Legacy Admin Stream Endpoints
      summary: Online or offline streams per server
      description: |
        `sub=online`: streams_servers rows with `pid > 0 AND stream_status = 0`. `sub=offline`: rows with `stream_status <> 0`.
        Movies (type 2) are excluded in both (src/Public/admin/api.php:120-142).
        The result is a map of stream id to the list of server ids. Quirk: `[]` (empty array) when there are no rows.
        Same auth as server list.
      parameters:
        - name: action
          in: query
