  /admin/api?action=reg_user&sub=list:
    get:
      operationId: LegacyAdmin_regUserList
      tags:
        - Legacy Admin Stream Endpoints
      summary: List panel users (admins/resellers)
      description: |
        `users ⋈ users_groups` columns id, username, credits, group_id, group_name, last_login, date_registered, email, ip, status
        (src/Public/admin/api.php:169-179). `credits` goes through `UserCredits::amounts`, so it is numeric (int, or a float
        rounded to 4 places). The other values are DB strings. Same auth as server list.
      parameters:
        - name: action
          in: query
          required: true
          schema:
