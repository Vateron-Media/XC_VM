            update_url:
              type: string
            test_download_url:
              type: string
            aspect:
              type: string
    Stalker_Category:
      type: object
      properties:
        id:
          type: string
          description: Category id as string, or `*` for All.
        title:
          type: string
        alias:
          type: string
        censored:
          type: integer
