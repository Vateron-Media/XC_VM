        - $ref: '#/components/parameters/Stalker_TokenQuery'
        - $ref: '#/components/parameters/Stalker_MacQuery'
        - $ref: '#/components/parameters/Stalker_MacCookie'
        - $ref: '#/components/parameters/Stalker_XUserAgent'
        - $ref: '#/components/parameters/Stalker_JsHttpRequest'
        - $ref: '#/components/parameters/Stalker_TimezoneCookie'
        - name: genre
          in: query
          required: false
          schema:
            type: string
            example: '12'
          description: Category id; `*` or non-numeric = all. `-1` = all channels only if `mag_load_all_channels`, else a hard-coded empty page.
        - $ref: '#/components/parameters/Stalker_Page'
        - name: sortby
          in: query
          required: false
          schema:
            type: string
            enum:
              - number
              - name
              - added
              - top
              - rating
          description: Sort order.
        - name: fav
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 0
