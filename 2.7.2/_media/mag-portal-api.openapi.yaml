        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - itv
          description: Portal module. Read from `$_REQUEST` (GET or POST).
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - get_ordered_list
