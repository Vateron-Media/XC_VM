  /portal.php?type=stb&action=get_profile:
    get:
      operationId: Stalker_stb_get_profile
      tags:
        - Stalker Portal (MAG)
      summary: Get (and verify) the STB profile
      description: |-
        Step 2 of login. With a Bearer token from handshake (or the device's current token) the device is loaded and verified (src/Ministra/portal.php:119-276):
        - `stb_type` (lower-cased) must be in `allowed_stb_types` when that list is set;
        - if the device has `lock_device`, stored `sn`, `device_id`, `device_id2`, `hw_version` must match;
        - `ver` must be in `stalker_lock_images` when that list is set;
        - `enable_debug_stalker` bypasses all checks.

        On success the handshake token becomes the device's token (`mag_devices.token` updated, previous token invalidated, line cache signal sent; one verification per device at a time via file lock) and the box identifiers are saved (src/Ministra/PortalHandler.php:1936, src/Ministra/portal.php:234-263). Response `js.status` is `0` when verified, `1` when not (`status = intval(!authenticated)`, src/Ministra/PortalHandler.php:179).

        Unverified requests still get HTTP 200 with a default profile and `status: 1`, but are counted by `BruteforceGuard` (keyed by sha256(MAC)) and flood check, and logged `INVALID_CREDENTIALS` (src/Ministra/PortalHandler.php:170-174).

        MAGSCAN protection (only when the token resolved to a device, and debug off): missing `sn`, or `sn` differing from the stored one, inserts the client IP into `blocked_ips`, writes a flood block file and returns **HTTP 404 empty** (src/Ministra/portal.php:162-195).

        Types: most profile values are strings (`"200"`, `"0"`), but several are numbers/booleans (`hdmi_event_reaction`, `last_itv_id`, `record_max_length`, `timeslot`, `watchdog_timeout`, `status`, `check_ssl_certificate`); `playback_limit` is `false` or an integer. `watchdog_timeout` is random 80-120. `aspect` is set to `"16"` only when the server protocol is https and unset. Extra firmware fields (`hd`, `num_banks`, `signature`, `metrics`, `auth_second_step`, `not_valid_token`, `hw_version_2`, `client_type`, `video_out`) are ignored.

        Source: `src/Ministra/PortalHandler.php:166`, `src/Ministra/portal.php:145`, `src/Ministra/portal.php:288`.

        Auth: none required (handled in handleStbPublic before the auth gate, src/Ministra/PortalHandler.php:162), but token/device state still influences the answer.
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - stb
          description: Portal module. Read from `$_REQUEST` (GET or POST).
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - get_profile
          description: Module action. Read from `$_REQUEST` (GET or POST).
        - $ref: '#/components/parameters/Stalker_Authorization'
        - $ref: '#/components/parameters/Stalker_TokenQuery'
        - $ref: '#/components/parameters/Stalker_MacQuery'
        - $ref: '#/components/parameters/Stalker_MacCookie'
        - $ref: '#/components/parameters/Stalker_XUserAgent'
        - $ref: '#/components/parameters/Stalker_JsHttpRequest'
        - $ref: '#/components/parameters/Stalker_TimezoneCookie'
        - $ref: '#/components/parameters/Stalker_LocaleCookie'
        - name: sn
          in: query
          required: false
          schema:
            type: string
          description: 'Serial number. REQUIRED in practice: absent/mismatched -> IP ban + 404 (unless debug).'
        - name: stb_type
          in: query
          required: false
          schema:
            type: string
            example: MAG250
          description: Box model; checked against `allowed_stb_types` (lower-case compare).
        - name: ver
          in: query
          required: false
          schema:
            type: string
          description: Firmware version string; checked against `stalker_lock_images` when set.
        - name: image_version
          in: query
          required: false
          schema:
            type: string
            example: '218'
          description: Stored on the device.
        - name: device_id
          in: query
          required: false
          schema:
            type: string
          description: Checked when `lock_device` is on.
        - name: device_id2
          in: query
          required: false
          schema:
            type: string
          description: Checked when `lock_device` is on.
        - name: hw_version
          in: query
          required: false
          schema:
            type: string
            example: 1.7-BD-00
          description: Checked when `lock_device` is on.
      responses:
        '200':
          description: 'Success. JSON body served with `Content-type: text/javascript` (src/Ministra/portal.php:18).'
          content:
