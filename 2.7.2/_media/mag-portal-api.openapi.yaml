      summary: Poll for pending device events (keep-alive)
      description: |-
        Every watchdog call first updates `mag_devices.last_watchdog` (src/Ministra/PortalHandler.php:709-715). Returns the oldest unread `mag_events` row. Events `reboot`, `reload_portal`, `play_channel`, `cut_off` are auto-marked read; others wait for `confirm_event`. With no event: `{"js":{"data":{"msgs":0,"additional_services_on":1}}}` (ints). With an event, DB values are strings and `send_time` is `d-m-Y H:i:s`.

        Source: `src/Ministra/PortalHandler.php:718`.

        Auth: requires a device verified by `stb/get_profile` under the presented Bearer token (header `Authorization: Bearer <token>` or `token` query/POST field). Unverified/missing/stale token -> HTTP 200 with plain body `Authorization failed.` (src/Ministra/PortalHandler.php:1867).
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - watchdog
          description: Portal module. Read from `$_REQUEST` (GET or POST).
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - get_events
          description: Module action. Read from `$_REQUEST` (GET or POST).
        - $ref: '#/components/parameters/Stalker_Authorization'
        - $ref: '#/components/parameters/Stalker_TokenQuery'
        - $ref: '#/components/parameters/Stalker_MacQuery'
        - $ref: '#/components/parameters/Stalker_MacCookie'
        - $ref: '#/components/parameters/Stalker_XUserAgent'
        - $ref: '#/components/parameters/Stalker_JsHttpRequest'
        - name: init
          in: query
          required: false
          schema:
            type: integer
          description: Sent by firmware; ignored.
        - name: cur_play_type
          in: query
          required: false
          schema:
            type: integer
          description: Ignored.
        - name: event_active_id
          in: query
          required: false
          schema:
            type: integer
          description: Ignored here.
      responses:
        '200':
          description: 'Success. JSON body served with `Content-type: text/javascript` (src/Ministra/portal.php:18).'
          content:
            text/javascript:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Stalker_WatchdogEvents'
                  - $ref: '#/components/schemas/Stalker_AuthFailedText'
              examples:
                none:
                  value:
                    js:
                      data:
                        msgs: 0
                        additional_services_on: 1
                message:
                  value:
                    js:
                      data:
                        msgs: '1'
                        id: '88'
                        event: send_msg
                        need_confirm: '1'
                        msg: Your subscription expires tomorrow.
                        reboot_after_ok: '0'
                        auto_hide_timeout: '0'
                        send_time: 17-10-2026 18:00:00
                        additional_services_on: '1'
                        updated:
