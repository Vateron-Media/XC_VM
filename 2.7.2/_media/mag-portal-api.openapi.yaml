openapi: 3.1.0
info:
  title: XC_VM Stalker Portal (MAG) API
  version: 2.7.2
  summary: Stalker Portal (MAG) of the Xtream Codes compatible HTTP surface, as implemented by XC_VM.
  description: |
    A source-level reference for the **Xtream Codes (XC) API**: the de facto standard HTTP interface
    between IPTV panels and player apps. The reference implementation is
    [XC_VM](https://github.com/Vateron-Media/XC_VM) 2.7.2, an open-source continuation of Xtream UI / XC.
    Each operation cites the XC_VM source file and line it was traced from (`src/...:line`).

    ## Authentication models

    The panel has several independent auth schemes. Each endpoint states which one it uses.

    | Who | How |
    |---|---|
    | Line (subscriber) | `username` + `password` query parameters, or `token` (32-char line access token). Also in path form: `/player_api/{u}/{p}`, `/live/{u}/{p}/...` |
    | Activation code | The code typed as `username` (or `token`) is activated on first use and becomes a line |
    | MAG / Stalker box | MAC address cookie + bearer token from `handshake` (`/c/portal.php`, `/stalker_portal/...`) |
    | Enigma2 box | MAC/device registration (`enigma2.php`) |
    | Admin / reseller REST | `api_key` query parameter (named `xct_` token or legacy per-user key) on `/{access_code}/?action=...`; the access code's IP whitelist is enforced by nginx |
    | Load-balancer nodes | Shared cluster secret (`/cluster/v1`); signed `node.rpc` (legacy `api.php` on nodes older than 2.7.0) |

    ## Notation

    OpenAPI cannot express query-string multiplexing, so action-based endpoints are written as separate
    literal paths such as `/player_api.php?action=get_live_streams`. The request is still a single
    `GET /player_api.php` with `action` as an ordinary query parameter.

    The admin and reseller REST APIs share one URL shape, `/{access_code}/?action=...`. Each access code has a type
    (3 = Admin API, 4 = Reseller API) and nginx routes it to that API, so `/{access_code}/...` and `/{reseller_access_code}/...` are the
    same URL and differ only in which kind of code is used.
  contact:
    name: XC_VM project
    url: https://github.com/Vateron-Media/XC_VM
  license:
    name: AGPL-3.0 (XC_VM source); this document describes its public interface
    identifier: AGPL-3.0-only
servers:
  - url: '{protocol}://{host}:{port}'
    description: Any XC compatible panel or load-balancer node
    variables:
      protocol:
        default: http
        enum:
          - http
          - https
      host:
        default: tv.example.com
      port:
        default: '80'
        description: HTTP broadcast port (often 80, 8080, 8000, 25461); HTTPS often 443 or 25463.
externalDocs:
  description: XC_VM source
  url: https://github.com/Vateron-Media/XC_VM
components:
  parameters:
    Stalker_Authorization:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
        example: Bearer kO3vXb1u9Qm2Zc7Ld0Wn4Rt6Yp8Ef5Ha-Gs_Jq1Mx3Vb7Nc9Ke2Lr0Ty4Ui6Op8As
      description: '`Bearer <token>` from stb/handshake (matched case-insensitively, also `REDIRECT_HTTP_AUTHORIZATION`) (src/Ministra/portal.php:96-115). NOTE: OpenAPI tooling ignores header params named Authorization; master file may map this to an http bearer securityScheme.'
    Stalker_TokenQuery:
      name: token
      in: query
      required: false
      schema:
        type: string
      description: Fallback for the Bearer token when no Authorization header is sent (used by browser emulation `?auth_via_query=1`).
    Stalker_MacQuery:
      name: mac
      in: query
      required: false
      schema:
        type: string
        example: 00:1A:79:12:34:56
      description: Device MAC; takes precedence over the `mac` cookie. Used by handshake to find the device and echoed by account_info.
    Stalker_MacCookie:
      name: mac
      in: cookie
      required: false
      schema:
        type: string
        example: 00:1A:79:12:34:56
      description: Device MAC (URL-encoded by firmware). The firmware also sends `stb_lang`, `timezone`, `adid` cookies; `stb_lang` and `adid` are ignored by the server.
    Stalker_TimezoneCookie:
      name: timezone
      in: cookie
      required: false
      schema:
        type: string
        example: Europe/London
      description: IANA zone for EPG/now-playing times. Missing, `undefined` or invalid -> `default_timezone` setting (src/Ministra/portal.php:478-486).
    Stalker_LocaleCookie:
      name: locale
      in: cookie
      required: false
      schema:
        type: string
        example: en_GB.utf8
      description: Used only when the device has no stored locale.
    Stalker_XUserAgent:
      name: X-User-Agent
      in: header
      required: false
      schema:
        type: string
        example: 'Model: MAG250; Link: Ethernet'
      description: Sent by MAG firmware/JsHttpRequest. Read into `$rUserAgent` but not used for any decision (src/Ministra/portal.php:81).
    Stalker_JsHttpRequest:
      name: JsHttpRequest
      in: query
      required: false
      schema:
        type: string
        example: 1-xml
      description: Cache-buster/transport marker added by the JsHttpRequest client. Ignored.
    Stalker_Page:
      name: p
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: 1-based page. 0/absent = "default page" (server chooses; `cur_page` then reports the chosen page). With an explicit page, `cur_page` is reported as 0 in most lists.
  responses:
    Stalker_FloodBlocked:
      description: 'Client IP has a flood/ban block file (e.g. after MAGSCAN or bruteforce): empty body (`src/Infrastructure/Bootstrap/StreamingRequestBootstrap.php:40-45`).'
    Stalker_LegacyDisabled:
      description: 'Request path is `/c/portal.php` or `/portal.php` and `mag_legacy_redirect` is off: empty body (src/Ministra/portal.php:43-49; nginx also 404s `/c/` and `/portal.php` in that case, `src/bin/nginx/conf/nginx.conf:482-526`).'
    Stalker_Maintenance:
      description: 'Maintenance mode: plain-text message, optional `Retry-After` header (`src/Core/Config/Maintenance.php:44`, src/Ministra/portal.php:52).'
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        text/plain:
          schema:
            type: string
          example: Service temporarily unavailable for maintenance.
  schemas:
    Stalker_AuthFailedText:
      type: string
      const: Authorization failed.
      description: 'Plain body (still `Content-type: text/javascript`) for any non-public action without a verified device. Stalker clients treat it as a cue to handshake again.'
    Stalker_JsTrue:
      type: object
      required:
        - js
      properties:
        js:
          type: boolean
          const: true
    Stalker_DataTrue:
      type: object
      required:
        - data
      properties:
        data:
          type: boolean
          const: true
      description: Non-standard envelope used by set_volume/set_modern/set_legacy.
    Stalker_JsEmptyArray:
      type: object
      required:
        - js
      properties:
        js:
          type: array
          maxItems: 0
          items: {}
    Stalker_JsObject:
      type: object
      required:
        - js
      properties:
        js: {}
      description: 'Standard Stalker envelope `{"js": ...}`.'
    Stalker_JsAny:
      type: object
      properties:
        js:
          type:
            - string
            - boolean
    Stalker_JsArray:
      type: object
      required:
        - js
      properties:
        js:
          type: array
          items:
            type: object
            additionalProperties: true
    Stalker_JsStringArray:
      type: object
      required:
        - js
      properties:
        js:
          type: array
          items:
            type: string
    Stalker_HandshakeResponse:
      type: object
      required:
        - js
      properties:
        js:
          type: object
          required:
            - token
          properties:
            token:
              type: string
              description: 'Opaque base64url token (AES/sealed igbinary payload). Use as `Authorization: Bearer <token>`.'
    Stalker_ProfileResponse:
      type: object
      required:
        - js
      properties:
        js:
          type: object
          additionalProperties: true
          description: Default profile (src/Ministra/portal.php:288-439) overlaid with the device `get_profile_vars` when verified (src/Ministra/portal.php:1442-1521), plus server settings (src/Ministra/PortalHandler.php:176-214).
          properties:
            id:
              type:
                - string
                - integer
              description: '`mag_id`; int 0 when unverified.'
            name:
              type:
                - string
                - integer
            mac:
              type: string
            ip:
              type: string
            locale:
              type: string
            stb_type:
              type: string
            image_version:
              type: string
            hw_version:
              type: string
            parent_password:
              type: string
            volume:
              type: string
            screensaver_delay:
              type: string
            status:
              type: integer
