tags:
  - name: Stalker Portal (MAG)
    description: |-
      Stalker/Ministra middleware emulation for MAG and other Stalker-compatible set-top boxes (`src/Ministra/portal.php`, `src/Ministra/PortalHandler.php`).

      **Endpoints / routing.** Real entry points (all run the same script):
      - `/<code>/portal.php` and `/<code>/server/load.php` for an access code of type `ministra` (2) or `ministra/new` (5); load.php is served directly, no redirect (`src/bin/nginx/conf/codes/template_ministra`, `src/Core/Auth/AuthRepository.php:115`). Static portal JS/HTML is served from the same prefix.
      - `/c/portal.php` (legacy) and `/portal.php` (302 -> `/c/portal.php`) only when setting `mag_legacy_redirect` is on; otherwise 404 (`src/bin/nginx/conf/nginx.conf:481-526`, `src/Ministra/portal.php:43-49`).
      - `/server/load.php` -> 302 `/c/portal.php?$args` (`src/bin/nginx/conf/nginx.conf:163`).
      Paths below are written as `/portal.php?type=..&action=..`; substitute the real prefix. `type`/`action` may be sent by GET or POST (form or JSON body; POST overrides GET).

      **Auth flow.** 1) `stb/handshake` with `mac` -> `js.token`. 2) `stb/get_profile` with `Authorization: Bearer <token>` + device identifiers (`sn`, `stb_type`, ...) -> `js.status` 0 when verified; the token becomes the device token. 3) Every other call sends the same Bearer token (or `token` param). The device is resolved from the token, not from the `mac` cookie. A newer handshake+get_profile for the same MAC invalidates the previous token. Unverified callers get `Authorization failed.` (plain text, HTTP 200) for non-public actions.

      **Request phases** (`src/Ministra/portal.php`): (1) pre-init stubs answered without DB or auth (`src/Ministra/PortalHandler.php:46`); (2) bootstrap: flood-blocked IP -> 403; (3) legacy-path gate -> 404; (4) maintenance -> 503; (5) `disable_ministra` on -> HTTP 200 empty body for everything not stubbed; (6) token/device resolution; (7) public stb actions; (8) authenticated dispatch; unknown/unhandled type/action pairs for a verified device (e.g. `tv_archive/update_played_end_time`, `series/create_link`) -> HTTP 200 empty body.

      **Responses.** JSON with header `Content-type: text/javascript`, plus `Cache-Control: no-store, no-cache, must-revalidate` and `Pragma: no-cache`. Envelope is `{"js": ...}` (exceptions: `{"data":true}` for set_volume/set_modern/set_legacy; itv/create_link adds top-level keys; get_tv_aspects is raw). Lists use `js.{total_items,max_page_items,selected_item,cur_page,data}`; `max_page_items` is 10 for the `xc_vm` theme, 14 for the legacy theme (7/10 for EPG tables).

      **Playback.** `cmd` values are `<player> <url>` where player is the device `mag_player` or `ffmpeg`, and url is `<site_url>play/<token>` (nginx rewrites `/play/<token>` to `/stream/auth?token=..&extension=ts`). Tokens embed the line username/password, stream id, container and the device token, so links die when the device re-authenticates.
paths:
  /server/load.php:
    get:
      operationId: Stalker_server_load_redirect
      tags:
        - Stalker Portal (MAG)
      summary: Legacy Stalker loader alias (redirect)
      description: |-
        Root-level `/server/load.php` is answered by nginx with `302 /c/portal.php?$args` (`src/bin/nginx/conf/nginx.conf:163`). The target is then subject to the `mag_legacy_redirect` gate (`src/Ministra/portal.php:43-49`). Under an access code (`/<code>/server/load.php`) nginx runs portal.php directly with no redirect (`src/bin/nginx/conf/codes/template_ministra:17`). All query args are forwarded unchanged; see the `/portal.php?type=...&action=...` operations for semantics.

        Auth: none at this hop.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: Forwarded.
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: Forwarded.
      responses:
        '302':
          description: Redirect to `/c/portal.php` with the original query string.
          headers:
            Location:
              schema:
                type: string
              example: /c/portal.php?type=stb&action=handshake&token=&JsHttpRequest=1-xml
  /portal.php?type=stb&action=handshake:
    get:
      operationId: Stalker_stb_handshake
      tags:
        - Stalker Portal (MAG)
      summary: 'Handshake: obtain a portal Bearer token for a MAC'
      description: |-
        Step 1 of login. MAC is taken from the `mac` request field, else the `mac` cookie (src/Ministra/portal.php:76-80). For a registered MAC the token wraps `igbinary({id: mag_id, token: <32 hex: 16 random + 16 HMAC>})`, sealed/encrypted with `live_streaming_pass` and base64url-encoded (src/Ministra/PortalHandler.php:1962-2015, :1887). This handshake token is accepted ONLY by `stb/get_profile`, only for that device, and only within the current or previous 600 s period (10-20 min) (src/Ministra/PortalHandler.php:1876, :1904). Nothing is written for a known device (it keeps its current token until get_profile verifies the box).

        Unknown MAC: answered with a same-shaped decoy token (id starts with `0`, random inner token) so registration cannot be probed; the attempt is counted by `BruteforceGuard` (may block the IP) and logged as `INVALID_CREDENTIALS` (src/Ministra/PortalHandler.php:1986-2012).

        Quirks: unlike stock Stalker there is no `random` field in the reply; `prehash`, `token` and `JsHttpRequest` request fields are ignored. Any `Authorization` header sent with handshake is ignored (the token block is skipped for stb/handshake, src/Ministra/portal.php:89).

        Source: `src/Ministra/PortalHandler.php:1962`, `src/Ministra/portal.php:89`, `src/Ministra/portal.php:981`.

