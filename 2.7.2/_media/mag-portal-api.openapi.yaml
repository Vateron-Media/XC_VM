  /portal.php?type=vod&action=create_link:
    get:
      operationId: Stalker_vod_create_link
      tags:
        - Stalker Portal (MAG)
      summary: Resolve a movie or episode to a playable URL
      description: |-
        Used for BOTH movies and series episodes (the client always sends `type=vod`). `cmd` is either base64 JSON (`{"type":"movie","stream_id","target_container"}` from vod lists, or `{"series_id","season_num","type":"series"}` from series season items) or a path containing `/media/` (`/media/<series_id>:<season_num>.mpg`) which is treated as series. A non-zero `series` forces series mode and selects the N-th episode (1-based, ordered by `episode_num`) of that season. URL = `<player> <site_url|http_url>play/<token>[?ext=.<container>]` minted from `ministra::<movie|series>/<username>/<password>/<stream_id>/<container>/<device token>`.

        Quirks: the entitlement result (`$rValid`) is computed but never used (src/Ministra/PortalHandler.php:1197-1232) - a link is minted for any id; access is enforced later by `/play/` auth. Episode not found (incl. series mode with `series` = 0 -> `LIMIT -1`) sets `js.error = "player_file_missing"` but a (useless) `cmd` is still returned. `js.load` is `""` here (int 0 in itv).

        Source: `src/Ministra/PortalHandler.php:1182`.

        Auth: requires a device verified by `stb/get_profile` under the presented Bearer token (header `Authorization: Bearer <token>` or `token` query/POST field). Unverified/missing/stale token -> HTTP 200 with plain body `Authorization failed.` (src/Ministra/PortalHandler.php:1867).
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - vod
          description: Portal module. Read from `$_REQUEST` (GET or POST).
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - create_link
          description: Module action. Read from `$_REQUEST` (GET or POST).
        - $ref: '#/components/parameters/Stalker_Authorization'
        - $ref: '#/components/parameters/Stalker_TokenQuery'
        - $ref: '#/components/parameters/Stalker_MacQuery'
        - $ref: '#/components/parameters/Stalker_MacCookie'
        - $ref: '#/components/parameters/Stalker_XUserAgent'
        - $ref: '#/components/parameters/Stalker_JsHttpRequest'
        - name: cmd
          in: query
          required: true
          schema:
            type: string
            example: eyJ0eXBlIjoibW92aWUiLCJzdHJlYW1faWQiOiIyMzAxIiwidGFyZ2V0X2NvbnRhaW5lciI6Im1rdiJ9
          description: Item cmd (base64 JSON) or `/media/<series_id>:<season>.mpg`.
        - name: series
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Episode number within the season (series mode).
        - name: forced_storage
          in: query
          required: false
          schema:
            type: string
          description: Ignored.
        - name: disable_ad
          in: query
          required: false
          schema:
            type: string
          description: Ignored.
        - name: download
          in: query
          required: false
          schema:
            type: string
          description: Ignored.
      responses:
        '200':
          description: 'Success. JSON body served with `Content-type: text/javascript` (src/Ministra/portal.php:18).'
          content:
            text/javascript:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Stalker_VodCreateLink'
                  - $ref: '#/components/schemas/Stalker_AuthFailedText'
              examples:
                movie:
                  value:
                    js:
                      id: '2301'
                      cmd: ffmpeg http://line.example.com:80/play/kO3vXb1u9Qm2Zc7Ld0Wn4Rt6Yp8Ef5Ha-Gs_Jq1Mx3Vb7Nc9Ke2Lr0Ty4Ui6Op8As?ext=.mkv
                      load: ''
                      subtitles: []
                      error: ''
                missing_episode:
                  value:
                    js:
                      id: null
                      cmd: ffmpeg http://line.example.com:80/play/kO3vXb1u9Qm2Zc7Ld0Wn4Rt6Yp8Ef5Ha-Gs_Jq1Mx3Vb7Nc9Ke2Lr0Ty4Ui6Op8As
                      load: ''
                      subtitles: []
                      error: player_file_missing
                unauthenticated:
                  summary: Token missing/stale or device not verified
                  value: Authorization failed.
        '403':
          $ref: '#/components/responses/Stalker_FloodBlocked'
        '404':
          $ref: '#/components/responses/Stalker_LegacyDisabled'
        '503':
          $ref: '#/components/responses/Stalker_Maintenance'
