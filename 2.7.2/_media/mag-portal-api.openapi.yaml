        js:
          type: array
          items:
            $ref: '#/components/schemas/Stalker_Category'
      description: 'Quirk: if there are no categories and "All" is off, itv/get_genres emits `[]` (no `js` key at all).'
    Stalker_PageMeta:
      type: object
