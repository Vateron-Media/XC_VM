      description: |-
        Paged with `max_page_items` = 10 (xc_vm theme) or 14 (legacy theme). When `p` is 0/absent the page containing `last_itv_id` is chosen and `selected_item` is its 1-based position on that page (src/Ministra/portal.php:2141-2170). Channel ints are stringified for C firmware (ids, numbers, `status`, `use_http_tmp_link`, `tv_archive_duration`...) while 0/1 flags (`censored`, `lock`, `locked`, `fav`, `archive`, `pvr`, `hd`, `open`, `enable_tv_archive`, `allow_*pvr`, `use_load_balancing`) stay integers (src/Ministra/portal.php:2348-2371). `cmd` is `<player> <url>`: player = device `mag_player` or `ffmpeg`. With `mag_security` = 0 the URL is a ready signed link `<site_url>play/<token>[?ext=.<mag_container>]`; otherwise `http://localhost/ch/<id>_` and the box must call `itv/create_link`. `tv_archive_duration` is in hours (days*24). `cur_playing` is "HH:MM - HH:MM: title" in the `timezone` cookie zone or "No channel information is available...". `sortby`: `name`, `number` (default: bouquet/manual order), `top`/`rating`, `added`. `fav=1` restricts to favourites; `search` matches `stream_display_name` LIKE.

        Source: `src/Ministra/PortalHandler.php:915`, `src/Ministra/portal.php:2122`.

        Auth: requires a device verified by `stb/get_profile` under the presented Bearer token (header `Authorization: Bearer <token>` or `token` query/POST field). Unverified/missing/stale token -> HTTP 200 with plain body `Authorization failed.` (src/Ministra/PortalHandler.php:1867).
