    get:
      operationId: Stalker_itv_create_link
      tags:
        - Stalker Portal (MAG)
      summary: Resolve a channel cmd to a playable URL
      description: |-
        Parses `cmd` after `http://localhost/ch/` as `<stream_id>_<value>`. Empty `<value>` -> a signed link is minted from `ministra::live/<username>/<password>/<stream_id>/<mag_container>/<device token>` (`live_streaming_pass`, sealed when `secure_stream_tokens`) as `<site_url|http_url>play/<token>[?ext=.<mag_container>]` (http_url when `mag_disable_ssl`). Non-empty `<value>` is returned verbatim prefixed with the player (no validation). No bouquet check here: entitlement is enforced when `/play/<token>` is fetched.

        Quirk: `streamer_id`, `link_id`, `load`, `error` sit at the TOP level beside `js`, not inside it. `js.id` is the parsed id as a string.

        Source: `src/Ministra/PortalHandler.php:822`.

        Auth: requires a device verified by `stb/get_profile` under the presented Bearer token (header `Authorization: Bearer <token>` or `token` query/POST field). Unverified/missing/stale token -> HTTP 200 with plain body `Authorization failed.` (src/Ministra/PortalHandler.php:1867).
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - itv
          description: Portal module. Read from `$_REQUEST` (GET or POST).
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - create_link
          description: Module action. Read from `$_REQUEST` (GET or POST).
        - $ref: '#/components/parameters/Stalker_Authorization'
        - $ref: '#/components/parameters/Stalker_TokenQuery'
        - $ref: '#/components/parameters/Stalker_MacQuery'
        - $ref: '#/components/parameters/Stalker_MacCookie'
        - $ref: '#/components/parameters/Stalker_XUserAgent'
        - $ref: '#/components/parameters/Stalker_JsHttpRequest'
        - name: cmd
          in: query
          required: true
          schema:
            type: string
            example: ffmpeg http://localhost/ch/1452_
          description: Channel `cmd` from the list.
        - name: series
          in: query
          required: false
          schema:
            type: string
          description: Ignored.
        - name: forced_storage
          in: query
          required: false
          schema:
            type: string
          description: Ignored.
        - name: disable_ad
          in: query
          required: false
          schema:
            type: string
          description: Ignored.
        - name: download
          in: query
          required: false
          schema:
            type: string
          description: Ignored.
        - name: force_ch_link_check
          in: query
          required: false
          schema:
            type: string
          description: Ignored.
      responses:
        '200':
          description: 'Success. JSON body served with `Content-type: text/javascript` (src/Ministra/portal.php:18).'
          content:
            text/javascript:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Stalker_ItvCreateLink'
                  - $ref: '#/components/schemas/Stalker_AuthFailedText'
              examples:
                ok:
                  value:
                    js:
                      id: '1452'
                      cmd: ffmpeg http://line.example.com:80/play/kO3vXb1u9Qm2Zc7Ld0Wn4Rt6Yp8Ef5Ha-Gs_Jq1Mx3Vb7Nc9Ke2Lr0Ty4Ui6Op8As
                    streamer_id: 0
                    link_id: 0
                    load: 0
                    error: ''
                unauthenticated:
                  summary: Token missing/stale or device not verified
                  value: Authorization failed.
        '403':
          $ref: '#/components/responses/Stalker_FloodBlocked'
        '404':
          $ref: '#/components/responses/Stalker_LegacyDisabled'
        '503':
          $ref: '#/components/responses/Stalker_Maintenance'
