            enable_playback_limit:
              type: boolean
            show_tv_channel_logo:
              type: boolean
            show_channel_logo_in_preview:
              type: boolean
            enable_connection_problem_indication:
              type: boolean
            hls_fast_start:
              type: string
            check_ssl_certificate:
