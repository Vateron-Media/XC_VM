  /portal.php?type=series&action=get_ordered_list:
    get:
      operationId: Stalker_series_get_ordered_list
      tags:
        - Stalker Portal (MAG)
      summary: Series list, or seasons of one series
      description: |-
        Without `movie_id`: series in the bouquets (sorted by `sortby`, default newest episode), items have `is_series: 1`, `has_files: 1`, `cmd: ""`, `series: []`. With `movie_id` (a series id): one item per season (`name` = `Season N` or `Specials` for 0), `series` = `[1..episode_count]`, `cmd` = base64 `{"series_id":<id>,"season_num":<n>,"type":"series"}` and `has_files: 0`; play an episode via `vod/create_link` with that `cmd` and `series=<episode>` (src/Ministra/portal.php:1796-2007).

        Quirks: `getSeries()` reads `$rRequest` without `global`, so `p` is IGNORED - always page 1 (`cur_page` 1, `selected_item` 0) (src/Ministra/portal.php:1808). `total_items` is the unfiltered count minus non-favourites on the current page only when `fav=1`. `time` is the string `"N/a"`; `year` is `release_date`; `is_movie` is 1 even for series.

        Source: `src/Ministra/PortalHandler.php:1394`, `src/Ministra/portal.php:1796`.

        Auth: requires a device verified by `stb/get_profile` under the presented Bearer token (header `Authorization: Bearer <token>` or `token` query/POST field). Unverified/missing/stale token -> HTTP 200 with plain body `Authorization failed.` (src/Ministra/PortalHandler.php:1867).
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - series
          description: Portal module. Read from `$_REQUEST` (GET or POST).
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - get_ordered_list
          description: Module action. Read from `$_REQUEST` (GET or POST).
        - $ref: '#/components/parameters/Stalker_Authorization'
        - $ref: '#/components/parameters/Stalker_TokenQuery'
        - $ref: '#/components/parameters/Stalker_MacQuery'
